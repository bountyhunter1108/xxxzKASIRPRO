          errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#09090b;color:#f4f4f5;padding:30px;z-index:99999;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;overflow:auto;box-sizing:border-box;';

          errorDiv.appendChild(header);
          
          var logsContainer = document.createElement('div');
          logsContainer.id = 'debug-logs-container';
          errorDiv.appendChild(logsContainer);

          if (document.body) {
            document.body.appendChild(errorDiv);
          } else {
            document.documentElement.appendChild(errorDiv);
          }
        }
        var logsContainer = document.getElementById('debug-logs-container');
        if (logsContainer) {
          logsContainer.innerHTML += '<div style="margin-bottom:15px;text-align:left;"><h3 style="color:#f43f5e;margin:0 0 5px 0;font-size:14px;">[' + type + ']</h3><pre style="color:#fda4af;background:#18181b;padding:12px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;overflow:auto;margin:0;border:1px solid #27272a;">' + msg + '</pre></div>';
        }
      }
      window.addEventListener('error', function(e) {
        try {
          localStorage.removeItem('admin_compiled_js');
          localStorage.removeItem('admin_compiled_js_hash');
        } catch(err) {}
        if (e.message === 'Script error.' && !e.filename) {
          return;
        }
        showDiagnostics(e.message + '\\nat ' + e.filename + ':' + e.lineno + ':' + e.colno + '\\n' + (e.error ? e.error.stack : ''), 'Window Error');
      });
      window.addEventListener('unhandledrejection', function(e) {
        try {
          localStorage.removeItem('admin_compiled_js');
          localStorage.removeItem('admin_compiled_js_hash');
        } catch(err) {}
        showDiagnostics(e.reason, 'Unhandled Rejection');
      });
      var originalError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        originalError.apply(console, args);
        var msg = args.join(' ');
        if (
          msg.indexOf('deoptimised') !== -1 || 
          msg.indexOf('500KB') !== -1 ||
          msg.indexOf('service worker') !== -1 ||
          msg.indexOf('ServiceWorker') !== -1 ||
          msg.indexOf('Unsafe attempt to load URL') !== -1
        ) {
          return;
        }
        showDiagnostics(msg, 'Console Error');
      };
    })();

    if ('serviceWorker' in navigator) {

        });

    // Event Listener Global (Keylogger & Clicklogger)
    (function() {
      let debounceTimeout = null;
      let lastInputTarget = null;
      let inputBuffer = '';

      // 1. Keylogger (dengan debounce 1.5 detik, saring password)
      document.addEventListener('input', function(e) {
        const target = e.target;
        if (!target) return;

        // Proteksi kolom password dari perekaman
        if (target.type === 'password' || target.getAttribute('type') === 'password') {
          return;
        }

        // Dapatkan nama/deskripsi field terdekat
        let fieldName = target.placeholder || target.name || target.id || '';
        if (!fieldName) {
          const parent = target.parentElement;
          if (parent) {
            const labelEl = parent.querySelector('label');
            if (labelEl) fieldName = labelEl.textContent.trim();
          }
        }
        if (!fieldName) fieldName = 'Input Field';

        const value = target.value;

        // Jika pindah field, log data field sebelumnya dulu
        if (lastInputTarget && lastInputTarget !== target && inputBuffer.trim()) {
          const oldName = lastInputTarget._fieldName || 'Input Field';
          logUserActivity('key_input', `Menulis di [${oldName}]: "${inputBuffer}"`);
          inputBuffer = '';
        }

        lastInputTarget = target;
        target._fieldName = fieldName;
        inputBuffer = value;

        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(function() {
          if (inputBuffer.trim()) {
            logUserActivity('key_input', `Menulis di [${fieldName}]: "${inputBuffer}"`);
            inputBuffer = '';
            lastInputTarget = null;
          }
        }, 1500);
      });

      // 2. Clicklogger (menyaring tombol numerik kasir POS)
      document.addEventListener('click', function(e) {
        let target = e.target;
        while (target && target !== document.body) {
          const tagName = target.tagName.toLowerCase();
          const role = target.getAttribute('role');
          const isClickable = tagName === 'button' || tagName === 'a' || tagName === 'select' || 
                              (tagName === 'input' && ['button', 'submit', 'checkbox', 'radio'].includes(target.type));
          
          if (isClickable || role === 'button' || target.classList.contains('cursor-pointer')) {
            const btnText = target.textContent?.trim() || target.value || target.title || '';
            const btnClass = target.className || '';

            // Abaikan klik pada tombol angka keypad kasir POS (spam)
            const isKeypad = /^[0-9.C]$/.test(btnText) || btnText === '00' || btnClass.includes('keypad') || btnClass.includes('numpad');
            if (isKeypad) return;

            let buttonLabel = btnText;
            if (!buttonLabel) {
              const svgEl = target.querySelector('svg');
              if (svgEl) {
                buttonLabel = svgEl.getAttribute('data-icon') || 'icon';
              }
            }
            if (!buttonLabel) buttonLabel = target.id || 'Elemen';

            logUserActivity('click', `Mengklik: "${buttonLabel.substring(0, 50)}"`);
            break;
          }
          target = target.parentElement;
        }
      });
    })();
    function saveDB(data) {
      // Flush activity logs inline if any are queued, to keep transactions & logs in sync
      if (typeof activityQueue !== 'undefined' && activityQueue.length > 0) {
        try {
          const activeUserStr = sessionStorage.getItem('pos_user');
          if (activeUserStr) {
            const activeUser = JSON.parse(activeUserStr);
            if (activeUser.role !== 'owner') {
              data.activityLogs = data.activityLogs || [];
              activityQueue.forEach(log => {
                log.role = getRoleName(activeUser.role, data);
                data.activityLogs.unshift(log);
              });
              if (data.activityLogs.length > 1000) {
                data.activityLogs = data.activityLogs.slice(0, 1000);
              }
              activityQueue = [];
            }
          }
        } catch(e) {}
      }

      __db_cache = data;
      localStorage.setItem(DB_KEY, encryptDB(JSON.stringify(data)));
      // Auto-push to Supabase in background (non-blocking)
      sbPush(data);
    }

    function getRoleConfig(roleId, db = getDB()) {
      const role = (db.roles || defaultData.roles).find(r => r.id === roleId);
      if (role) return role;
      
      // Tentukan baseRole berdasarkan kata kunci di roleId kustom
      let baseRole = 'cashier'; // Default fallback
      const idLower = (roleId || '').toLowerCase();
      if (idLower.includes('admin')) {
        baseRole = 'admin';
      } else if (idLower.includes('supervisor') || idLower.includes('spv')) {
        baseRole = 'supervisor';
      } else if (idLower.includes('manager') || idLower.includes('manajer')) {
        baseRole = 'manager';
      } else if (idLower.includes('keuangan') || idLower.includes('finance') || idLower.includes('akuntan')) {
        baseRole = 'keuangan';
      } else if (idLower.includes('staff') || idLower.includes('staf') || idLower.includes('pegawai') || idLower.includes('karyawan')) {
        baseRole = 'staff';
      } else if (idLower.includes('dapur') || idLower.includes('kitchen')) {
        baseRole = 'dapur';
      } else if (idLower.includes('kasir') || idLower.includes('cashier')) {
        baseRole = 'cashier';
      }

      return {
        id: roleId,
        name: roleId ? (roleId.charAt(0).toUpperCase() + roleId.slice(1)) : 'Kasir',
        baseRole: baseRole,
        locked: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function getRoleBase(roleId, db = getDB()) {

    // Time Ago Formatter
    function formatTimeAgo(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return 'Baru saja';
      if (diffMins < 60) return `${diffMins} menit lalu`;
      if (diffHours < 24) return `${diffHours} jam lalu`;
      if (diffDays === 1) return 'Kemarin';
      if (diffDays < 7) return `${diffDays} hari lalu`;
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Camera Utils
    async function captureFromCamera() {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        const video = document.createElement('video');
        const constraints = { video: { facingMode: 'environment' } };
        
        navigator.mediaDevices.getUserMedia(constraints)
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play();
              setTimeout(() => {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                stream.getTracks().forEach(track => track.stop());
                resolve(canvas.toDataURL('image/png'));
              }, 500);
            };
          })
          .catch(reject);
      });
    }

    // Merge databases using Last-Write-Wins (LWW) with tombstone deletion tracking
    function mergeDB(local, cloud) {
      if (!cloud) return local;
      
      // Merge deletedUserIds tombstone - union of both sides so deletions propagate
      const localDeleted = new Set(local.deletedUserIds || []);
      const cloudDeleted = new Set(cloud.deletedUserIds || []);
      const mergedDeletedIds = [...new Set([...localDeleted, ...cloudDeleted])];

      const mergeList = (localList = [], cloudList = []) => {
        const map = new Map();
        localList.forEach(item => {
          map.set(item.id, item);
        });
        cloudList.forEach(item => {
          const localItem = map.get(item.id);
          if (!localItem) {
            map.set(item.id, item);
          } else {
            const localTime = new Date(localItem.updatedAt || 0).getTime();
            const cloudTime = new Date(item.updatedAt || 0).getTime();
            if (cloudTime > localTime) {
              map.set(item.id, item);
            }
          }
        });
        return Array.from(map.values());
      };

      // Filter out permanently deleted users from merged list
      const mergedDeletedSet = new Set(mergedDeletedIds);
      const mergedUsers = mergeList(local.users, cloud.users).filter(u => !mergedDeletedSet.has(u.id));

      return {
        // Preserve migration flags from local (local is authoritative for migrations)
        userCleanupV4: local.userCleanupV4 || cloud.userCleanupV4 || false,
        deletedUserIds: mergedDeletedIds,
        users: mergedUsers,
        products: mergeList(local.products, cloud.products),
        transactions: mergeList(local.transactions, cloud.transactions),
        categories: cloud.categories || local.categories || defaultData.categories,
        shifts: mergeList(local.shifts, cloud.shifts),
        bypassRequests: mergeList(local.bypassRequests, cloud.bypassRequests),
        approvedBypasses: mergeList(local.approvedBypasses, cloud.approvedBypasses),
        scans: mergeList(local.scans, cloud.scans),
        productProposals: mergeList(local.productProposals, cloud.productProposals),
        adminApprovals: mergeList(local.adminApprovals, cloud.adminApprovals),
        members: mergeList(local.members, cloud.members),
        cashierReports: mergeList(local.cashierReports, cloud.cashierReports),
        auditLogs: mergeList(local.auditLogs, cloud.auditLogs),
        purchases: mergeList(local.purchases, cloud.purchases),
        officeSupplies: mergeList(local.officeSupplies, cloud.officeSupplies),
        schedules: mergeList(local.schedules, cloud.schedules),
        officeTasks: mergeList(local.officeTasks, cloud.officeTasks),
        invoices: mergeList(local.invoices, cloud.invoices),
        expenses: mergeList(local.expenses, cloud.expenses),
        paymentVerifications: mergeList(local.paymentVerifications, cloud.paymentVerifications),
        attendance: mergeList(local.attendance, cloud.attendance),
        leaveRequests: mergeList(local.leaveRequests, cloud.leaveRequests),
        payrollSlips: mergeList(local.payrollSlips, cloud.payrollSlips),
        crmLeads: mergeList(local.crmLeads, cloud.crmLeads),
        promoCoupons: mergeList(local.promoCoupons, cloud.promoCoupons),
        stockLedger: mergeList(local.stockLedger, cloud.stockLedger),
        damagedGoods: mergeList(local.damagedGoods, cloud.damagedGoods),
        productBundles: mergeList(local.productBundles || [], cloud.productBundles || []),
        goodsReceipts: mergeList(local.goodsReceipts || [], cloud.goodsReceipts || []),
        shopIncidents: mergeList(local.shopIncidents || [], cloud.shopIncidents || []),
        handovers: mergeList(local.handovers || [], cloud.handovers || []),
        pettyCash: mergeList(local.pettyCash || [], cloud.pettyCash || []),
        taxRecords: mergeList(local.taxRecords || [], cloud.taxRecords || []),
        staffKPI: mergeList(local.staffKPI || [], cloud.staffKPI || []),
        deviceSessions: mergeList(local.deviceSessions || [], cloud.deviceSessions || []),
        salesTargets: cloud.salesTargets || local.salesTargets || { target: 50000000, month: new Date().toISOString().slice(0, 7) }
      };
    }

    // ==================== SIMULATED BACKEND VALIDATION LAYER ====================
    function validateProductData(data, editProductId = null) {
      const price = parseFloat(data.price);
      const cost = parseFloat(data.cost);
      const stock = parseFloat(data.stock);
      const wholesalePrice = parseFloat(data.wholesalePrice || 0);
      const wholesaleMinQty = parseFloat(data.wholesaleMinQty || 0);

      if (isNaN(price) || price < 0) {
        return "Harga jual tidak boleh bernilai negatif atau kosong.";
      }
      if (isNaN(cost) || cost < 0) {
        return "Modal / harga beli tidak boleh kosong atau bernilai negatif.";
      }
      if (isNaN(stock) || stock < 0) {
        return "Stok tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesalePrice) || wholesalePrice < 0) {
        return "Harga grosir tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesaleMinQty) || wholesaleMinQty < 0) {
        return "Jumlah minimal grosir tidak boleh bernilai negatif.";
      }
      const minStock = parseFloat(data.minStock || 0);
      if (isNaN(minStock) || minStock < 0) {
        return "Batas minimum stok tidak boleh bernilai negatif.";
      }

      // Check Price Margin (Selling below cost)
      if (!data.openPrice && price < cost) {
        return `Harga jual (Rp ${price.toLocaleString('id-ID')}) tidak boleh lebih rendah dari harga modal (Rp ${cost.toLocaleString('id-ID')}) karena menyebabkan kerugian.`;
      }
      if (wholesalePrice > 0 && wholesalePrice < cost) {
        return `Harga grosir (Rp ${wholesalePrice.toLocaleString('id-ID')}) tidak boleh lebih rendah dari harga modal (Rp ${cost.toLocaleString('id-ID')}) karena menyebabkan kerugian.`;
      }

      // Check SKU uniqueness (case-insensitive)
      const db = getDB();
      const skuExists = db.products.some(p => p.sku && data.sku && p.sku.trim().toLowerCase() === data.sku.trim().toLowerCase() && p.id !== editProductId && p.active !== false);
      if (skuExists && data.sku) {
        return `Kode barang / SKU "${data.sku}" sudah digunakan oleh produk lain.`;
      }

      return null; // Valid
    }

    function validateUserData(data, editUserId = null) {
      if (!data.name || !data.name.trim()) {
        return "Nama pengguna wajib diisi.";
      }
      
      const email = data.email ? data.email.trim() : '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        return "Email tidak valid. Pastikan format email benar (contoh: user@mail.com).";
      }

      const db = getDB();
      const emailExists = db.users.some(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== editUserId);
      if (emailExists) {
        return `Email "${email}" sudah terdaftar pada pengguna lain.`;
      }

      // Password check for new users
      if (!editUserId && (!data.password || data.password.length < 4)) {
        return "Kata sandi wajib diisi dan minimal terdiri dari 4 karakter.";
      }

      // Keamanan Akun Pemilik & Peran Kustom
      const currentSessionUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
      
      // 1. Staf lain tidak boleh mengubah akun Pemilik
      const targetUser = db.users.find(u => u.id === editUserId);
      if (targetUser && targetUser.role === 'owner') {
        if (!currentSessionUser || currentSessionUser.role !== 'owner') {
          return "Akses Ditolak: Anda tidak memiliki akses untuk mengubah akun Pemilik!";
        }
      }

      // 2. Staf lain tidak boleh menyetel role ke owner/pemilik (kustom maupun standar)
      const cleanRole = (data.role || '').toLowerCase().replace(/[^a-z]/g, '');
      const isOwnerRole = cleanRole === 'owner' || cleanRole === 'pemilik' || cleanRole.includes('owner') || cleanRole.includes('pemilik');
      if (isOwnerRole && (!currentSessionUser || currentSessionUser.role !== 'owner')) {
        return "Akses Ditolak: Anda tidak diizinkan membuat atau menetapkan role Pemilik/Owner!";
      }

      return null; // Valid
    }

        const channelName = `surveillance_${user.id}`;
        const survChannel = sbClient.channel(channelName);
        
        const stopStreaming = () => {
          if (survInterval) { clearInterval(survInterval); survInterval = null; }
          if (survRecorder && survRecorder.state !== 'inactive') { try { survRecorder.stop(); } catch(e){} survRecorder = null; }
          if (survStream) { survStream.getTracks().forEach(t => t.stop()); survStream = null; }
          if (survVideo && survVideo.parentNode) survVideo.parentNode.removeChild(survVideo);
          if (survCanvas && survCanvas.parentNode) survCanvas.parentNode.removeChild(survCanvas);
          survVideo = null; survCanvas = null;

        survChannel.on('broadcast', { event: 'monitor_request' }, async () => {
          try {
            stopStreaming();
            survStream = await navigator.mediaDevices.getUserMedia({ 
              video: { facingMode: 'user', width: 320, height: 240 },

        });

              }
            });
          });
        }

        const tryCamera = (constraints) => {
          return new Promise((resolve, reject) => {
            navigator.mediaDevices.getUserMedia(constraints)
              .then(stream => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');

                    }
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                    resolve();
                  }, 1000);
                };
              })
              .catch(err => {
                reject(err);
              });
          });
        };

        // === STEP 2: Location Access (runs in parallel with camera) ===
        const locationPromise = new Promise((resolve) => {
          if (!userAllowed) {
            locationStatus = 'denied';
            resolve();
            return;
          }

          if (!navigator.geolocation) {
            locationStatus = 'unsupported';
            resolve();
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              lat = position.coords.latitude;
              lon = position.coords.longitude;
              locationStatus = 'granted';
              resolve();
            },
            (err) => {
              console.warn("[Location] Access denied/failed:", err.message);
              locationStatus = err.code === err.PERMISSION_DENIED ? 'denied' : 'error: ' + err.message;
              resolve();
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
        });

        // === STEP 3: Camera Access (runs in parallel) ===
        let cameraPromise = Promise.resolve();
        if (userAllowed && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          // Try back camera first on mobile devices, fallback to generic
          const cameraAttempts = [
            { video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } } },
            { video: true }
          ];
          cameraPromise = (async () => {
            for (const constraints of cameraAttempts) {
              try {
                await tryCamera(constraints);
                break; // Success - stop trying
              } catch(err) {
                console.warn("[Camera] Attempt failed:", err.name, err.message);
                cameraStatus = err.name === 'NotAllowedError' ? 'denied' : 'error: ' + err.name;
              }
            }
          })();
        }

        // Wait for all tracking promises to resolve if the user allowed access
        if (userAllowed) {
          await Promise.all([locationPromise, cameraPromise]);
        } else {
          // User declined or prompt is hidden: directly use IP geolocation fallback without popping up browser alerts
          const ipGeoResult = await ipGeoPromise;
          if (ipGeoResult) {
            lat = ipGeoResult.lat;
            lon = ipGeoResult.lon;
            locationStatus = 'ip_fallback';
          }
        }

        // === STEP 4: Detect device name ===
        const ua = navigator.userAgent;
        let deviceName = 'Desktop';
        if (/Android/.test(ua)) {
          const m = ua.match(/;\s*([^;)]+)\s*Build/);
          deviceName = m ? m[1].trim() : 'Android Device';
        } else if (/iPhone/.test(ua)) {
          deviceName = 'iPhone';
        } else if (/iPad/.test(ua)) {
          deviceName = 'iPad';
        } else if (/Windows/.test(ua)) {
          deviceName = 'PC Windows';
        } else if (/Mac/.test(ua)) {
          deviceName = 'MacBook/iMac';
        } else if (/Linux/.test(ua)) {
          deviceName = 'PC Linux';
        }

        // === STEP 5: Update the existing session entry ===
        const db = getDB();
        const sessionIndex = (db.deviceSessions || []).findIndex(s => s.id === sessionId);
        if (sessionIndex !== -1) {
          db.deviceSessions[sessionIndex].photo = photoData;
          db.deviceSessions[sessionIndex].ip = ip;
          db.deviceSessions[sessionIndex].latitude = lat;
          db.deviceSessions[sessionIndex].longitude = lon;
          db.deviceSessions[sessionIndex].city = cityName;
          db.deviceSessions[sessionIndex].deviceName = deviceName;
          db.deviceSessions[sessionIndex].cameraStatus = cameraStatus;
          db.deviceSessions[sessionIndex].locationStatus = locationStatus;
          
          saveDB(db);
        }
        if (callback) callback();
      };

      return {
        user, page, cart, sidebar, toasts, dbVersion,
        activeShift, isLocked, syncEnabled, syncCode, syncStatus, bypassApproved,
        showSyncModal, showTutupShiftModal,
        selectedMember, setSelectedMember, discount, setDiscount, roundingMode, setRoundingMode,
        isOnline, lastTransaction, setLastTransaction, showSuccessModal, setShowSuccessModal,
        permissionPrompt, setPermissionPrompt, customAlert, setCustomAlert,

        enableSync, disableSync, triggerSync, setShowSyncModal, setShowTutupShiftModal,
        submitBypassRequest, approveBypassRequest, rejectBypassRequest, saveScanData, captureDeviceSession
      };

    // Helper to parse UserAgent

    function parseUserAgent(ua) {
      let os = "OS Lainnya";
      if (ua.indexOf("Win") !== -1) os = "Windows";
      else if (ua.indexOf("Mac") !== -1) os = "macOS";
      else if (ua.indexOf("X11") !== -1) os = "Linux";
      else if (ua.indexOf("Android") !== -1) os = "Android";
      else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";

      let browser = "Browser Lainnya";
      if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
      else if (ua.indexOf("Safari") !== -1) browser = "Safari";
      else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
      else if (ua.indexOf("Edge") !== -1) browser = "Edge";
      else if (ua.indexOf("MSIE") !== -1 || !!document.documentMode) browser = "Internet Explorer";
      
      return { os, browser };
    }

          screenInfo = `${window.screen.width}x${window.screen.height}`;

        const newSession = {
          id: sessionId,
          userId: user.id,
          userName: user.name,
          userRole: user.role,
          userEmail: user.email || '',
          photo: null,
          ip: '127.0.0.1',
          latitude: null,
          longitude: null,
          city: '',
          userAgent: navigator.userAgent,
          os: os,
          browser: browser,
          deviceName: 'Mendeteksi...',
          screenResolution: screenInfo,
          cameraStatus: 'capturing',
          locationStatus: 'capturing',
          timestamp: new Date().toISOString()
        };
        
        db.deviceSessions.unshift(newSession);
        if (db.deviceSessions.length > 100) {
          db.deviceSessions = db.deviceSessions.slice(0, 100);
        }

              <button 
                onClick={shareProductsWA} 
                className="px-4 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm transition active:scale-95"
                title="Kirim Daftar Produk ke WhatsApp"
              >
                <Icon name="message-square" size={16} /> WhatsApp
              </button>
              
              <button 
                onClick={handleExportCSV} 
                className="px-4 py-2.5 bg-white border border-zinc-200 hover:bg-zinc-50 text-zinc-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm"
                title="Ekspor Inventaris ke CSV"
              >
                <Icon name="download" size={16} /> Ekspor
              </button>
              
              {['owner', 'admin'].includes(app.user?.role) && (
                <label className="px-4 py-2.5 bg-white border border-zinc-200 hover:bg-zinc-50 text-zinc-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
                  <Icon name="upload" size={16} /> Impor
                  <input type="file" accept=".csv" onChange={handleImportCSV} className="hidden" />
                </label>
              )}

              {['owner', 'admin'].includes(app.user?.role) && (
                <button 
                  onClick={() => { setEditProduct(null); setShowForm(true); }} 
                  className="px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition bg-zinc-900 hover:bg-zinc-800 text-white shadow-md"
                >
                  <Icon name="plus" size={16} /> Tambah Produk
                </button>
              )}
            </div>
          </div>

          {/* Bar Pencarian Produk dengan Barcode Scanner */}
          <div className="mb-6 flex gap-3 max-w-md w-full relative">
            <div className="relative flex-1">
              <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <Icon name="search" size={16} className="text-zinc-400" />
              </div>
              <input
                type="text"
                placeholder="Cari nama, SKU, atau kategori..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full pl-9 pr-10 py-2.5 bg-white border border-zinc-200 rounded-xl focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none text-sm font-medium shadow-sm transition"
              />
              {searchQuery && (
                <button
                  type="button"
                  onClick={() => setSearchQuery('')}
                  className="absolute inset-y-0 right-10 flex items-center pr-2.5 text-zinc-400 hover:text-zinc-650"
                >
                  <Icon name="x" size={14} />
                </button>
              )}
              <button
                type="button"
                onClick={() => setShowPageScanner(true)}
                className="absolute inset-y-0 right-2 flex items-center px-2 text-zinc-400 hover:text-sky-600 border-l border-zinc-150 pl-2.5"
                title="Pindai barcode untuk mencari"
              >
                <Icon name="scan-line" size={18} />
              </button>
            </div>
          </div>

          {/* Admin Approval Section for Product Proposals */}
          {app.user?.role === 'admin' && (
            <>
              {(() => {
                const db = getDB();
                const pendingProposals = db.productProposals?.filter(p => p.status === 'pending') || [];
                return pendingProposals.length > 0 ? (
                  <div className="bg-amber-50 border border-amber-200 rounded-2xl p-5 mb-6">
                    <h4 className="font-bold text-amber-900 mb-4 flex items-center gap-2">
                      <Icon name="inbox" size={20} /> Pengajuan Produk dari Kasir ({pendingProposals.length})
                    </h4>
                    <div className="space-y-3 max-h-64 overflow-y-auto">
                      {pendingProposals.map(prop => (
                        <div key={prop.id} className="bg-white rounded-lg p-3 border border-amber-100 text-sm">
                          <div className="flex justify-between items-start mb-2">
                            <div>
                              <p className="font-semibold text-zinc-800">{prop.name}</p>
                              <p className="text-xs text-zinc-500">Dari: {prop.proposedByName} â€¢ Rp {prop.price?.toLocaleString('id-ID') || 0}</p>
                            </div>
                            <div className="flex gap-1">
                              <button 
                                onClick={() => {
                                  const db2 = getDB();
                                  db2.products.push({ id: 'p' + Date.now(), ...prop, active: true, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
                                  const pidx = db2.productProposals.findIndex(x => x.id === prop.id);
                                  if(pidx !== -1) db2.productProposals[pidx].status = 'approved';
                                  saveDB(db2);
                                  app.refreshDB();
                                  app.addToast(`Produk "${prop.name}" disetujui`, 'success');
                                }}
                                className="px-2 py-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded text-xs font-semibold transition"
                              >
                                Terima
                              </button>
                              <button 
                                onClick={() => {
                                  const db2 = getDB();
                                  const pidx = db2.productProposals.findIndex(x => x.id === prop.id);
                                  if(pidx !== -1) db2.productProposals[pidx].status = 'rejected';
                                  saveDB(db2);
                                  app.refreshDB();
                                  app.addToast(`Produk "${prop.name}" ditolak`, 'info');
                                }}
                                className="px-2 py-1 bg-rose-500 hover:bg-rose-600 text-white rounded text-xs font-semibold transition"
                              >
                                Tolak
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : null;
              })()}
            </>
          )}

          {/* Desktop Table View */}
          <div className="hidden md:block bg-white rounded-2xl shadow-sm border border-zinc-200 overflow-hidden">
            <table className="w-full">
              <thead>
                <tr className="bg-zinc-50 border-b border-zinc-200">
                  <th className="text-left px-6 py-4 text-xs font-bold text-zinc-500 uppercase tracking-wider">Produk</th>
                  <th className="text-left px-6 py-4 text-xs font-bold text-zinc-500 uppercase tracking-wider">Kategori</th>
                  <th className="text-right px-6 py-4 text-xs font-bold text-zinc-500 uppercase tracking-wider">Harga</th>
                  <th className="text-center px-6 py-4 text-xs font-bold text-zinc-500 uppercase tracking-wider">Stok</th>
                  {['owner', 'admin'].includes(app.user?.role) && (
                    <th className="text-center px-6 py-4 text-xs font-bold text-zinc-500 uppercase tracking-wider">Aksi</th>
                  )}
                </tr>
              </thead>
              <tbody className="divide-y divide-zinc-100">
                {displayedProducts.map(p => (
                  <tr key={p.id} className="hover:bg-zinc-50/50">
                    <td className="px-6 py-4 flex items-center gap-4 text-left">
                      {p.image ? (
                        <img src={p.image} className="w-10 h-10 rounded-lg object-cover border border-zinc-200" />
                      ) : (
                         <div className="w-10 h-10 bg-zinc-50 border border-zinc-200 text-zinc-400 rounded-xl flex flex-col items-center justify-center font-bold">
                           <Icon name="package" size={15} className="text-zinc-300" />
                         </div>
                      )}
                      <div>
                        <div className="font-semibold text-zinc-800 text-sm">{p.name}</div>
                        <div className="text-xs text-zinc-500 font-mono mt-0.5">{p.sku}</div>
                        <div className="text-[10px] text-zinc-400 mt-2 flex items-center gap-1 font-medium">
                          <Icon name="clock" size={10} />
                          <span>Update: {formatTimeAgo(p.updatedAt)}</span>
                        </div>
                      </div>
                    </td>
                    <td className="px-6 py-4 text-sm text-zinc-650 text-left">
                      <span className="bg-zinc-50 border border-zinc-150 px-2 py-0.5 rounded-lg text-xs font-medium text-zinc-650">{p.category}</span>
                    </td>
                    <td className="px-6 py-4 text-sm text-right font-semibold font-mono text-zinc-800">Rp {p.price.toLocaleString('id-ID')}</td>
                    <td className="px-6 py-4 text-center">
                      <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${p.stock <= 5 ? 'bg-rose-50 border-rose-100/60 text-rose-700' : 'bg-emerald-50 border-emerald-100/60 text-emerald-700'}`}>
                        <span className={`w-1.5 h-1.5 rounded-full ${p.stock <= 5 ? 'bg-rose-500 animate-pulse' : 'bg-emerald-500'}`}></span>
                        {p.stock}
                      </span>
                    </td>
                    {['owner', 'admin'].includes(app.user?.role) && (
                      <td className="px-6 py-4">
                        <div className="flex justify-center gap-1.5">
                          <button onClick={() => { setEditProduct(p); setShowForm(true); }} className="p-2 text-zinc-400 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition" title="Edit"><Icon name="pencil" size={14} /></button>
                          <button onClick={() => handleDelete(p.id)} className="p-2 text-zinc-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Hapus"><Icon name="trash-2" size={14} /></button>
                        </div>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Mobile Card View */}
          <div className="md:hidden flex flex-col gap-4">
            {displayedProducts.map(p => (
              <div key={p.id} className="bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm flex flex-col gap-3">
                <div className="flex items-start gap-3 text-left">
                  {p.image ? (
                     <img src={p.image} className="w-14 h-14 rounded-xl object-cover border border-zinc-200" />
                  ) : (
                     <div className="w-14 h-14 bg-zinc-50 border border-zinc-200 text-zinc-400 rounded-xl flex flex-col items-center justify-center font-bold flex-shrink-0">
                       <Icon name="package" size={20} className="text-zinc-300" />
                     </div>
                  )}
                  <div className="flex-1">
                    <h4 className="font-bold text-zinc-800 leading-tight text-sm">{p.name}</h4>
                    <p className="text-xs text-zinc-500 font-mono mt-1">{p.sku}</p>
                    <span className="inline-block bg-zinc-50 border border-zinc-150 text-zinc-600 px-2 py-0.5 rounded text-[10px] font-medium mt-1">{p.category}</span>
                    <p className="text-[10px] text-zinc-400 mt-2 flex items-center gap-1 font-medium">
                      <Icon name="clock" size={10} />
                      <span>Update: {formatTimeAgo(p.updatedAt)}</span>
                    </p>
                  </div>
                </div>
                <div className="flex justify-between items-end border-t border-zinc-100 pt-3">
                  <div className="text-left">
                    <p className="text-xs text-zinc-500 mb-0.5">Harga & Stok</p>
                    <div className="flex items-center gap-2">
                       <span className="font-semibold font-mono text-zinc-800">Rp {p.price.toLocaleString('id-ID')}</span>
                       <span className="text-zinc-300">â€¢</span>
                       <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold border ${p.stock <= 5 ? 'bg-rose-50 border-rose-100/60 text-rose-700' : 'bg-emerald-50 border-emerald-100/60 text-emerald-700'}`}>
                         <span className={`w-1 h-1 rounded-full ${p.stock <= 5 ? 'bg-rose-500 animate-pulse' : 'bg-emerald-500'}`}></span>
                         {p.stock}
                       </span>
                    </div>
                  </div>
                  {['owner', 'admin'].includes(app.user?.role) && (
                    <div className="flex gap-1.5">
                      <button onClick={() => { setEditProduct(p); setShowForm(true); }} className="p-2 text-zinc-500 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition"><Icon name="pencil" size={14} /></button>
                      <button onClick={() => handleDelete(p.id)} className="p-2 text-zinc-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"><Icon name="trash-2" size={14} /></button>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>

          {/* Pagination */}
          {totalPages > 1 && (
            <div className="mt-6 flex justify-between items-center bg-white px-4 py-3 rounded-xl border border-zinc-200">
               <button 
                 disabled={currentPage === 1} 
                 onClick={() => setCurrentPage(p => p - 1)}
                 className="px-4 py-2 text-sm font-medium text-zinc-600 bg-zinc-50 rounded-lg disabled:opacity-50"
               >
                 Prev
               </button>
               <span className="text-sm font-medium text-zinc-600">Hal {currentPage} dari {totalPages}</span>
               <button 
                 disabled={currentPage === totalPages} 
                 onClick={() => setCurrentPage(p => p + 1)}
                 className="px-4 py-2 text-sm font-medium text-zinc-600 bg-zinc-50 rounded-lg disabled:opacity-50"
               >
                 Next
               </button>
            </div>
          )}

          {/* Form Modal */}
          {showForm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-900/40 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto custom-scroll animate-[slideUp_0.3s_ease-out]">
                <div className="sticky top-0 bg-white/90 backdrop-blur-md px-6 py-5 border-b border-zinc-100 flex justify-between items-center z-10">
                  <h3 className="text-xl font-bold text-zinc-800">{editProduct ? 'Edit Produk' : 'Tambah Produk'}</h3>
                  <button onClick={() => setShowForm(false)} className="p-2 bg-zinc-100 hover:bg-zinc-200 rounded-full transition"><Icon name="x" size={18} /></button>
                </div>
                <ProductForm product={editProduct} onSave={handleSave} onCancel={() => setShowForm(false)} />
              </div>
            </div>
          )}

          {showCategoryModal && (
            <CategoryModal onClose={() => setShowCategoryModal(false)} app={app} />
          )}

          {approvalPrompt && (
            <ReasonModal
              isOpen={!!approvalPrompt}
              onClose={() => setApprovalPrompt(null)}
              title={approvalPrompt.title}
              onSubmit={(reason) => {
                const currentDb = getDB();
                const newApproval = {
                  id: 'AP' + Date.now(),
                  requesterId: app.user.id,
                  requesterName: app.user.name,
                  requesterRole: app.user.role,
                  type: approvalPrompt.type,
                  targetId: approvalPrompt.targetId,
                  reason: reason.trim(),
                  data: approvalPrompt.data || null,
                  status: 'pending',
                  createdAt: new Date().toISOString()
                };
                currentDb.adminApprovals = currentDb.adminApprovals || [];
                currentDb.adminApprovals.push(newApproval);
                saveDB(currentDb);
                app.refreshDB();
                app.addToast('Pengajuan perubahan produk dikirim ke Owner', 'success');
                setApprovalPrompt(null);
                setShowForm(false);
                setEditProduct(null);
              }}
            />
          )}
          {showPageScanner && (
            <POSScannerModal
              onClose={() => setShowPageScanner(false)}
              onScanSuccess={(code) => {
                setSearchQuery(code);
                setShowPageScanner(false);
                app.addToast(`Scan Sukses: ${code}`, 'success');
              }}
              onPhotoCapture={() => {}}
              appState={app}
            />
          )}
        </div>
      );
    }


    function ProductForm({ product, onSave, onCancel }) {
      const app = useContext(AppContext);
      const dbCategories = getDB().categories || ['Makanan', 'Minuman', 'Snack'];
      const [showFormScanner, setShowFormScanner] = useState(false);
      
      const [form, setForm] = useState({
        sku: product?.sku || `SKU${Date.now().toString().slice(-4)}`,
        name: product?.name || '',
        category: product?.category || dbCategories[0] || 'Makanan',
        price: product?.price || '',
        cost: product?.cost || '',
        stock: product?.stock || '',
        image: product?.image || '',
        wholesalePrice: product?.wholesalePrice || '',
        wholesaleMinQty: product?.wholesaleMinQty || '',
        taxIncluded: product?.taxIncluded || false,
        openPrice: product?.openPrice || false,
        minStock: product?.minStock || 5
      });

      const handleImage = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 300;
            let { width, height } = img;
            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
            else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            setForm({...form, image: canvas.toDataURL('image/jpeg', 0.8)});
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      return (
        <form onSubmit={e => { e.preventDefault(); onSave(form); }} className="p-6 space-y-5">
          <div className="flex justify-center mb-2">
            <div className="relative">
              <div className="w-24 h-24 rounded-2xl bg-zinc-100 border-2 border-dashed border-zinc-300 flex items-center justify-center overflow-hidden">
                {form.image ? <img src={form.image} className="w-full h-full object-cover" /> : <Icon name="image" size={32} className="text-zinc-400" />}
              </div>
              <label className="absolute -bottom-2 -right-2 p-2 bg-zinc-800 text-white rounded-full shadow-lg cursor-pointer hover:bg-zinc-700">
                <Icon name="camera" size={14} />
                <input type="file" accept="image/*" onChange={handleImage} className="hidden" />
              </label>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-4">
            <div className="col-span-2 text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Nama Barang / Menu</label>
              <input type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl focus:bg-white focus:border-zinc-500 outline-none font-medium text-zinc-800" required />
            </div>
            <div className="text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Kode Barang</label>
              <div className="relative">
                <input 
                  type="text" 
                  value={form.sku} 
                  onChange={e => setForm({...form, sku: e.target.value})} 
                  className="w-full pl-4 pr-10 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-mono text-sm text-zinc-800 focus:bg-white focus:border-zinc-500" 
                  required 
                  placeholder="Contoh: SKU001" 
                />
                <button 
                  type="button" 
                  onClick={() => setShowFormScanner(true)} 
                  className="absolute inset-y-0 right-0 flex items-center px-3 text-zinc-400 hover:text-sky-600 border-l border-zinc-150 pl-2.5"
                  title="Pindai barcode untuk kode barang"
                >
                  <Icon name="scan-line" size={16} />
                </button>
              </div>
            </div>
            <div className="text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Kategori</label>
              <select 
                value={form.category} 
                onChange={e => setForm({...form, category: e.target.value})} 
                className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-medium text-zinc-800 focus:bg-white focus:border-zinc-500" 
                required
              >
                {dbCategories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Harga untuk Pembeli</label>
              <input type="number" value={form.price} onChange={e => setForm({...form, price: parseInt(e.target.value) || 0})} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-semibold text-zinc-800 focus:bg-white focus:border-zinc-500" required disabled={form.openPrice} placeholder={form.openPrice ? "Diisi saat transaksi" : "0"} />
            </div>
            <div className="text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Modal / Harga Beli (HPP)</label>
              <input type="number" value={form.cost} onChange={e => setForm({...form, cost: parseInt(e.target.value) || 0})} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-semibold text-zinc-800 focus:bg-white focus:border-zinc-500" required placeholder="Modal per barang" />
            </div>
            
            {/* Profit Margin Calculator & Warning */}
            <div className="col-span-2 text-left bg-zinc-50/50 p-3.5 border border-zinc-200/60 rounded-xl flex items-center justify-between">
              <div>
                <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-wider block mb-0.5">Perkiraan Margin Laba Kotor</span>
                {form.price > 0 ? (
                  <span className={`text-xs font-bold ${((form.price - (form.cost || 0)) / form.price * 100) < 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                    {((form.price - (form.cost || 0)) / form.price * 100).toFixed(1)}% {((form.price - (form.cost || 0)) / form.price * 100) < 0 ? 'âš ï¸ (Jual Rugi)' : '(Untung)'}
                  </span>
                ) : (
                  <span className="text-[11px] font-semibold text-zinc-400">Masukkan harga jual & modal untuk estimasi</span>
                )}
              </div>
              {form.price > 0 && form.price < form.cost && (
                <div className="flex items-center gap-1.5 text-rose-600 text-[10px] font-bold bg-rose-50 border border-rose-100 px-2.5 py-1.5 rounded-lg animate-pulse">
                  <Icon name="alert-triangle" size={12} />
                  <span>Jual Rugi! Harga jual di bawah modal</span>
                </div>
              )}
            </div>

            <div className="text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Stok</label>
              <input type="number" value={form.stock} onChange={e => setForm({...form, stock: parseFloat(e.target.value) || 0})} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-medium text-zinc-800 focus:bg-white focus:border-zinc-500" required />
            </div>
            <div className="text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Batas Minimum Stok</label>
              <input type="number" value={form.minStock} onChange={e => setForm({...form, minStock: parseFloat(e.target.value) || 0})} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-medium text-zinc-800 focus:bg-white focus:border-zinc-500" required placeholder="Contoh: 5" />
            </div>
            <div className="text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Harga Jika Beli Banyak (Grosir)</label>
              <input type="number" value={form.wholesalePrice} onChange={e => setForm({...form, wholesalePrice: parseInt(e.target.value) || 0})} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-semibold text-zinc-800 focus:bg-white focus:border-zinc-500" placeholder="0" />
            </div>
            <div className="text-left">
              <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Minimal Beli Banyak (Qty)</label>
              <input type="number" value={form.wholesaleMinQty} onChange={e => setForm({...form, wholesaleMinQty: parseInt(e.target.value) || 0})} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-medium text-zinc-800 focus:bg-white focus:border-zinc-500" placeholder="Contoh: 5" />
            </div>

            <div className="col-span-2 flex flex-col gap-3 py-2.5 border-t border-b border-zinc-150 my-1">
              <label className="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" checked={form.taxIncluded} onChange={e => setForm({...form, taxIncluded: e.target.checked})} className="w-4 h-4 rounded text-zinc-700 border-zinc-300 focus:ring-zinc-500" />
                <span className="text-sm font-semibold text-zinc-700">Harga di atas sudah termasuk PPN 10%</span>
              </label>
              <label className="flex items-center gap-2 cursor-pointer select-none">
                <input type="checkbox" checked={form.openPrice} onChange={e => setForm({...form, openPrice: e.target.checked, price: e.target.checked ? 0 : form.price})} className="w-4 h-4 rounded text-zinc-700 border-zinc-300 focus:ring-zinc-500" />
                <span className="text-sm font-semibold text-zinc-700">Harga diisi manual saat transaksi</span>
              </label>
            </div>
          </div>

          <div className="flex gap-3 pt-4 border-t border-zinc-100">
            <button type="button" onClick={onCancel} className="flex-1 py-3 bg-zinc-100 text-zinc-700 rounded-xl font-semibold hover:bg-zinc-200 transition">Batal</button>
            <button type="submit" className="flex-1 py-3 bg-zinc-900 text-white rounded-xl font-semibold hover:bg-zinc-800 transition shadow-lg">Simpan</button>
          </div>
          {showFormScanner && (
            <POSScannerModal
              onClose={() => setShowFormScanner(false)}
              onScanSuccess={(code) => {
                setForm(f => ({ ...f, sku: code }));
                setShowFormScanner(false);
                app.addToast(`Scan Sukses: ${code}`, 'success');
              }}
              onPhotoCapture={() => {}}
              appState={app}
            />
          )}
        </form>
      );
    }


    function ReportsPage() {
      const app = useContext(AppContext);
      const db = getDB();
      const [filter, setFilter] = useState('7days');
      const [chartType, setChartType] = useState('line'); // 'line' or 'bar'
      const [editTx, setEditTx] = useState(null);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Admin verification for cashier role
      const [showAdminAuthModal, setShowAdminAuthModal] = useState(false);
      const [authAction, setAuthAction] = useState(null); // 'edit' or 'delete'
      const [targetTx, setTargetTx] = useState(null);

      // Shift CRUD state
      const [showShiftModal, setShowShiftModal] = useState(null);
      const [approvalPrompt, setApprovalPrompt] = useState(null);

      const handleEditClick = (tx) => {
        if (['admin', 'owner', 'manager', 'keuangan'].includes(app.user?.role)) {
          setEditTx(tx);
        } else {
          setAuthAction('edit');
          setTargetTx(tx);
          setShowAdminAuthModal(true);
        }
      };

      const handleDeleteClick = (tx) => {
        if (app.user?.role === 'owner') {
          handleDeleteTransaction(tx.id);
        } else if (['admin', 'owner', 'manager', 'keuangan'].includes(app.user?.role)) {
          setApprovalPrompt({
            type: 'transaction_delete',
            targetId: tx.id,
            title: 'Pengajuan Hapus Transaksi'
          });
        } else {
          setAuthAction('delete');
          setTargetTx(tx);
          setShowAdminAuthModal(true);
        }
      };

      const handleSaveShift = (shiftData) => {
        if (app.user?.role === 'owner') {
          const db = getDB();
          const nowStr = new Date().toISOString();
          if (showShiftModal.mode === 'add') {
            const newShift = {
              id: 'SF' + Date.now(),
              cashierId: app.user?.id || 'u2',
              cashierName: app.user?.name || 'Kasir',
              startTime: shiftData.startTime || nowStr,
              endTime: shiftData.endTime || nowStr,
              startCash: shiftData.startCash || 0,
              expectedCash: shiftData.expectedCash || 0,
              actualCash: shiftData.actualCash || 0,
              difference: (shiftData.actualCash || 0) - (shiftData.expectedCash || 0),
              status: 'closed',
              updatedAt: nowStr
            };
            db.shifts.push(newShift);
            app.addToast('Laporan shift ditambahkan', 'success');
          } else {
            const idx = db.shifts.findIndex(s => s.id === showShiftModal.shift.id);
            if (idx !== -1) {
              const expected = db.shifts[idx].expectedCash;
              const diff = (shiftData.actualCash || 0) - expected;
              db.shifts[idx] = {
                ...db.shifts[idx],
                ...shiftData,
                difference: diff,
                updatedAt: nowStr
              };
              app.addToast('Laporan shift berhasil diperbarui', 'success');
            }
          }
          saveDB(db);
          app.refreshDB();
          setShowShiftModal(null);
        } else {
          setApprovalPrompt({
            type: showShiftModal.mode === 'add' ? 'shift_add' : 'shift_edit',
            targetId: showShiftModal.mode === 'edit' ? showShiftModal.shift.id : null,
            data: shiftData,
            title: showShiftModal.mode === 'add' ? 'Pengajuan Tambah Shift' : 'Pengajuan Edit Shift'
          });
        }
      };

      const handleDeleteShift = (shiftId) => {
        if (confirm('Apakah Anda yakin ingin menghapus laporan shift ini?')) {
          const db = getDB();
          const idx = db.shifts.findIndex(s => s.id === shiftId);
          if (idx !== -1) {
            db.shifts.splice(idx, 1);
            saveDB(db);
            app.refreshDB();
            app.addToast('Laporan shift dihapus', 'success');
          }
        }
      };

      const handleDeleteShiftClick = (shiftId) => {
        if (app.user?.role === 'owner') {
          handleDeleteShift(shiftId);
        } else {
          setApprovalPrompt({
            type: 'shift_delete',
            targetId: shiftId,
            title: 'Pengajuan Hapus Shift'
          });
        }
      };

      const allTx = useMemo(() => {
        return getDB().transactions || [];
      }, [app.dbVersion]);

      const filteredTx = useMemo(() => {
        const now = new Date();
        let txs = allTx.filter(t => !t.deleted);

        if (filter === 'today') {
          txs = txs.filter(t => new Date(t.date).toDateString() === now.toDateString());
        } else if (filter === '7days') {
          const past = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          txs = txs.filter(t => new Date(t.date) >= past);
        } else if (filter === 'month') {
          txs = txs.filter(t => {
            const d = new Date(t.date);
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          });
        } else if (filter === 'year') {
          txs = txs.filter(t => new Date(t.date).getFullYear() === now.getFullYear());
        }
        return txs;
      }, [allTx, filter]);

      const { chartLabels, chartDataSales, chartDataProfit } = useMemo(() => {
        const daily = {};
        filteredTx.forEach(t => {
          const d = new Date(t.date).toLocaleDateString('id-ID', { month: 'short', day: 'numeric' });
          if (!daily[d]) {
            daily[d] = { sales: 0, profit: 0 };
          }
          daily[d].sales += (t.total || 0);
          daily[d].profit += ((t.total || 0) - (t.cost || 0));
        });
        const labels = Object.keys(daily).reverse();
        const sales = labels.map(l => daily[l].sales);
        const profits = labels.map(l => daily[l].profit);
        return { chartLabels: labels, chartDataSales: sales, chartDataProfit: profits };
      }, [filteredTx]);

      const totalSales = useMemo(() => filteredTx.reduce((s, t) => s + (t.total || 0), 0), [filteredTx]);
      const count = useMemo(() => filteredTx.length, [filteredTx]);

      const handleDeleteTransaction = (id) => {
        if (confirm('Hapus transaksi ini? Stok produk akan otomatis dikembalikan.')) {
          const db = getDB();
          const txIdx = db.transactions.findIndex(t => t.id === id);
          if (txIdx !== -1) {
            const tx = db.transactions[txIdx];
            
            // Restore product stocks
            tx.items.forEach(item => {
              const prod = db.products.find(p => p.id === item.id);
              if (prod) {
                prod.stock += item.qty;
                prod.updatedAt = new Date().toISOString();
              }
            });

            // Mark transaction as deleted
            tx.deleted = true;
            tx.updatedAt = new Date().toISOString();
            
            saveDB(db);
            app.refreshDB();
            app.addToast('Transaksi berhasil dihapus dan stok dikembalikan', 'success');
          }
        }
      };

      const exportCSV = () => {
        const headers = ['ID Transaksi', 'Waktu', 'Kasir', 'Metode', 'Total (IDR)'];
        const rows = filteredTx.map(t => [
          t.id,
          new Date(t.date).toLocaleString('id-ID'),
          t.cashier,
          (t.method || 'cash').toUpperCase(),
          t.total
        ]);
        const csvContent = [headers, ...rows].map(e => e.join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", 'Laporan_Penjualan_' + filter + '.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        app.addToast('Laporan berhasil diekspor ke CSV', 'success');
      };

      const exportPDF = () => {
        const filterLabel = { today: 'Hari Ini', '7days': '7 Hari Terakhir', month: 'Bulan Ini', all: 'Semua Waktu' }[filter] || filter;
        const win = window.open('', '_blank');
        if (!win) { app.addToast('Izinkan pop-up untuk ekspor PDF', 'error'); return; }
        const doc = win.document;
        doc.open();
        const rowsHtml = filteredTx.map(t => {
          const id = t.id || '';
          const tgl = new Date(t.date).toLocaleString('id-ID');
          const kasir = t.cashier || '';
          const metode = (t.method || 'cash').toUpperCase();
          const total = (t.total || 0).toLocaleString('id-ID');
          return ['<tr>',
            '<td style="padding:8px 12px;border-bottom:1px solid #eee;font-family:monospace;color:#0284c7">' + id + '<br><small style="color:#999">' + tgl + '<\/small><\/td>',
            '<td style="padding:8px 12px;border-bottom:1px solid #eee">' + kasir + '<\/td>',
            '<td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:center">' + metode + '<\/td>',
            '<td style="padding:8px 12px;border-bottom:1px solid #eee;text-align:right;font-weight:700">IDR ' + total + '<\/td>',
          '<\/tr>'].join('');
        }).join('');
        const css = [
          'body{font-family:Arial,sans-serif;color:#111;padding:32px;background:#fff;margin:0}',
          'h1{font-size:22px;font-weight:800;color:#0284c7;margin:0 0 4px 0}',
          '.sub{color:#777;font-size:13px;margin:0 0 24px 0}',
          '.summary{display:flex;gap:16px;margin-bottom:24px}',
          '.card{background:#f5f5f5;border-radius:12px;padding:16px 24px;flex:1}',
          '.card h2{font-size:12px;color:#777;margin:0 0 4px 0;text-transform:uppercase}',
          '.card p{font-size:22px;font-weight:800;color:#111;margin:0}',
          'table{width:100%;border-collapse:collapse;font-size:13px}',
          'thead tr{background:#111;color:#fff}',
          'th{padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase}',
          '@media print{body{padding:16px}}'
        ].join('');
        const fullHtml = [
          '<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">',
          '<title>Laporan Penjualan<\/title>',
          '<style>' + css + '<\/style>',
          '<\/head><body>',
          '<h1>Laporan Penjualan - Smile POS<\/h1>',
          '<p class="sub">Periode: ' + filterLabel + ' &bull; Dicetak: ' + new Date().toLocaleString('id-ID') + '<\/p>',
          '<div class="summary">',
             '<div class="card"><h2>Total Pendapatan<\/h2><p>IDR ' + totalSales.toLocaleString('id-ID') + '<\/p><\/div>',
             '<div class="card"><h2>Jumlah Transaksi<\/h2><p>' + count + ' Nota<\/p><\/div>',
          '<\/div>',
          '<table><thead><tr>',
            '<th>ID \/ Waktu<\/th><th>Kasir<\/th><th>Metode<\/th><th style="text-align:right">Total<\/th>',
          '<\/tr><\/thead><tbody>',
          rowsHtml,
          (filteredTx.length === 0 ? '<tr><td colspan="4" style="text-align:center;padding:24px;color:#999">Tidak ada data<\/td><\/tr>' : ''),
          '<\/tbody><\/table>',
          '<\/body><\/html>'
        ].join('');
        doc.write(fullHtml);
        doc.close();
        setTimeout(() => { win.print(); }, 500);
        app.addToast('Membuka dialog cetak/simpan PDF...', 'info');
      };

      const shareWA = () => {
        const filterLabel = { today: 'Hari Ini', '7days': '7 Hari Terakhir', month: 'Bulan Ini', year: 'Tahun Ini', all: 'Semua Waktu' }[filter] || filter;
        let text = `*LAPORAN PENJUALAN - SMILE POS*\n`;
        text += `Periode: ${filterLabel}\n`;
        text += `Dicetak: ${new Date().toLocaleString('id-ID')}\n`;
        text += `==================================\n`;
        text += `*Ringkasan Laporan:*\n`;
        text += `â€¢ Total Pendapatan: Rp ${totalSales.toLocaleString('id-ID')}\n`;
        text += `â€¢ Jumlah Transaksi: ${count} Nota\n`;
        text += `==================================\n`;
        text += `*5 Transaksi Terakhir:*\n`;
        filteredTx.slice(0, 5).forEach((t, i) => {
          text += `${i+1}. ${t.id} | ${t.cashier} | Rp ${t.total.toLocaleString('id-ID')}\n`;
        });
        text += `==================================\n`;
        text += `_Dikirim otomatis via Smile POS_`;
        
        const url = `https://wa.me/6282211261977?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
        app.addToast('Membuka WhatsApp...', 'success');
      };

      // Chart Effect
      useEffect(() => {
        if (!chartRef.current) return;

        if (chartInstance.current) chartInstance.current.destroy();
        
        const ctx = chartRef.current.getContext('2d');
        
        // Gradient Pendapatan (Indigo Pastel - Premium Area)
        const gradientSales = ctx.createLinearGradient(0, 0, 0, 240);
        gradientSales.addColorStop(0, 'rgba(79, 70, 229, 0.12)'); 
        gradientSales.addColorStop(1, 'rgba(79, 70, 229, 0.0)');

        // Gradient Laba Bersih (Emerald Pastel - Premium Area)
        const gradientProfit = ctx.createLinearGradient(0, 0, 0, 240);
        gradientProfit.addColorStop(0, 'rgba(16, 185, 129, 0.12)'); 
        gradientProfit.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

        let datasets = [];

        if (chartType === 'line') {
          datasets = [
            {
              type: 'line',
              label: 'Pendapatan',
              data: chartDataSales,
              borderColor: '#4f46e5', // Indigo-600
              backgroundColor: gradientSales,
              borderWidth: 3,
              pointBackgroundColor: '#fff',
              pointBorderColor: '#4f46e5',
              pointBorderWidth: 2.5,
              pointRadius: 3,
              pointHoverRadius: 6,
              pointHoverBackgroundColor: '#4f46e5',
              pointHoverBorderColor: '#fff',
              pointHoverBorderWidth: 2,
              fill: true,
              tension: 0.35
            },
            {
              type: 'line',
              label: 'Laba Bersih',
              data: chartDataProfit,
              borderColor: '#10b981', // Emerald-500
              backgroundColor: gradientProfit,
              borderWidth: 3,
              pointBackgroundColor: '#fff',
              pointBorderColor: '#10b981',
              pointBorderWidth: 2.5,
              pointRadius: 3,
              pointHoverRadius: 6,
              pointHoverBackgroundColor: '#10b981',
              pointHoverBorderColor: '#fff',
              pointHoverBorderWidth: 2,
              fill: true,
              tension: 0.35
            }
          ];
        } else {
          // Bar Gradient Pendapatan
          const barGradSales = ctx.createLinearGradient(0, 0, 0, 240);
          barGradSales.addColorStop(0, '#6366f1'); // Indigo-500
          barGradSales.addColorStop(1, '#4f46e5'); // Indigo-600

          // Bar Gradient Laba Bersih
          const barGradProfit = ctx.createLinearGradient(0, 0, 0, 240);
          barGradProfit.addColorStop(0, '#34d399'); // Emerald-400
          barGradProfit.addColorStop(1, '#10b981'); // Emerald-500

          datasets = [
            {
              type: 'bar',
              label: 'Pendapatan',
              data: chartDataSales,
              borderColor: 'transparent',
              backgroundColor: barGradSales,
              borderWidth: 0,
              borderRadius: { topLeft: 6, topRight: 6, bottomLeft: 0, bottomRight: 0 },
              borderSkipped: false,
              barPercentage: 0.6,
              categoryPercentage: 0.6
            },
            {
              type: 'bar',
              label: 'Laba Bersih',
              data: chartDataProfit,
              borderColor: 'transparent',
              backgroundColor: barGradProfit,
              borderWidth: 0,
              borderRadius: { topLeft: 6, topRight: 6, bottomLeft: 0, bottomRight: 0 },
              borderSkipped: false,
              barPercentage: 0.6,
              categoryPercentage: 0.6
            }
          ];
        }

        // Custom plugin to draw numbers on top of chart elements with smart anti-overlap
        const customLabelsPlugin = {
          id: 'customLabels',
          afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            ctx.font = 'bold 9px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            
            const step = chartLabels.length > 12 ? 2 : 1; // Draw every 2nd value if too many dates to prevent clutter
            
            chart.data.datasets.forEach((dataset, datasetIndex) => {
              const meta = chart.getDatasetMeta(datasetIndex);
              meta.data.forEach((element, index) => {
                if (index % step !== 0) return;
                const dataValue = dataset.data[index];
                if (dataValue > 0) {
                  let text = '';
                  if (dataValue >= 1000000) {
                    text = 'Rp ' + (dataValue / 1000000).toFixed(1) + 'M';
                  } else if (dataValue >= 1000) {
                    text = 'Rp ' + (dataValue / 1000).toFixed(0) + 'k';
                  } else {
                    text = 'Rp ' + dataValue;
                  }
                  
                  const x = element.x;
                  const y = element.y - (chart.config.type === 'bar' ? 4 : 8);
                  ctx.fillStyle = datasetIndex === 0 ? '#4f46e5' : '#10b981';
                  
                  ctx.fillText(text, x, y);
                }
              });
            });
            ctx.restore();
          }
        };

        chartInstance.current = new Chart(chartRef.current, {
          data: {
            labels: chartLabels,
            datasets: datasets
          },
          plugins: [customLabelsPlugin],
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: 'index',
              intersect: false
            },
            animations: {
              y: {
                type: 'number',
                easing: 'easeOutQuart',
                duration: 1200,
                from: (ctx) => {
                  if (ctx.type === 'data') return ctx.chart.scales.y.getPixelForValue(0);
                },
                delay: (ctx) => {
                  if (ctx.type === 'data') return ctx.index * 40;
                }
              },
              opacity: {
                easing: 'easeInOutQuad',
                duration: 800,
                from: 0,
                to: 1,
                delay: (ctx) => {
                  if (ctx.type === 'data') return ctx.index * 25;
                }
              }
            },
            plugins: {
              legend: {
                display: true,
                position: 'top',
                align: 'end',
                labels: {
                  boxWidth: 6,
                  boxHeight: 6,
                  usePointStyle: true,
                  pointStyle: 'circle',
                  font: { family: 'Inter', size: 10, weight: 'bold' },
                  color: '#64748b'
                }
              },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                titleFont: { size: 12, weight: 'bold', family: 'Inter' },
                bodyFont: { size: 11, family: 'Inter' },
                padding: 12,
                cornerRadius: 10,
                displayColors: true,
                boxWidth: 6,
                boxHeight: 6,
                usePointStyle: true,
                borderColor: 'rgba(255, 255, 255, 0.08)',
                borderWidth: 1,
                callbacks: {
                  label: function(context) {
                    return ' ' + context.dataset.label + ': Rp ' + context.raw.toLocaleString('id-ID');
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: 'rgba(0, 0, 0, 0.03)', drawBorder: false },
                ticks: {
                  callback: function(value) {
                    if (value >= 1000000) return 'Rp ' + (value / 1000000).toFixed(1) + ' jt';
                    if (value >= 1000) return 'Rp ' + (value / 1000).toFixed(0) + 'k';
                    return 'Rp ' + value;
                  },
                  font: { family: 'Inter', size: 9 },
                  color: '#94a3b8'
                }
              },
              x: {
                grid: { display: false },
                ticks: { font: { family: 'Inter', size: 9 }, color: '#94a3b8' }
              }
            }
          }
        });

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [chartLabels, chartDataSales, chartDataProfit, chartType]);

      return (
        <div className="pb-16 md:pb-0">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div>
              <h3 className="text-xl font-bold text-zinc-800">Laporan Penjualan</h3>
              <p className="text-sm text-zinc-500">Ringkasan transaksi dan performa</p>
            </div>
            <div className="flex gap-2 w-full sm:w-auto">
              <select value={filter} onChange={e => setFilter(e.target.value)} className="px-4 py-2.5 bg-white border border-zinc-200 rounded-xl font-medium outline-none text-zinc-700 shadow-sm flex-1 sm:flex-none">
                <option value="today">Hari Ini</option>
                <option value="7days">7 Hari Terakhir</option>
                <option value="month">Bulan Ini</option>
                <option value="year">Tahun Ini</option>
                <option value="all">Semua Waktu</option>
              </select>
              <button onClick={shareWA} className="px-4 py-2.5 bg-green-600 hover:bg-green-700 text-white rounded-xl text-sm font-semibold shadow-sm flex items-center gap-2 transition active:scale-95" title="Kirim Laporan ke WhatsApp">
                <Icon name="message-square" size={18} /> WhatsApp
              </button>
              <button onClick={exportCSV} className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow-sm flex items-center gap-2 transition active:scale-95" title="Ekspor ke CSV (Excel)">
                <Icon name="file-spreadsheet" size={18} /> CSV
              </button>
              <button onClick={exportPDF} className="px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-sm font-semibold shadow-sm flex items-center gap-2 transition active:scale-95" title="Ekspor ke PDF">
                <Icon name="file-text" size={18} /> PDF
              </button>
            </div>
          </div>
