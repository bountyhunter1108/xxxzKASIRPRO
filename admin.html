        return (
          <div className="space-y-6 text-left">
            {/* KEUANGAN MINI METRICS */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-2 animate-[fadeIn_0.2s_ease-out]">
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Tagihan Pemasok</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">Rp {totalInvoices.toLocaleString('id-ID')}</p>
                </div>
                <div className="p-2 bg-sky-50 text-sky-600 rounded-xl"><Icon name="file-text" size={18} /></div>
              </div>
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Pengeluaran Manual</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">Rp {totalExpenses.toLocaleString('id-ID')}</p>
                </div>
                <div className="p-2 bg-rose-50 text-rose-600 rounded-xl"><Icon name="trending-down" size={18} /></div>
              </div>
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Saldo Kas Kecil (Petty Cash)</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">Rp {pettyBalance.toLocaleString('id-ID')}</p>
                </div>
                <div className="p-2 bg-emerald-50 text-emerald-600 rounded-xl"><Icon name="wallet" size={18} /></div>
              </div>
            </div>

            <div className="flex border-b border-zinc-200 gap-4 mb-4 overflow-x-auto whitespace-nowrap scrollbar-none">
              <button onClick={() => setActiveTab('invoices')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'invoices' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Invoice Pemasok</button>
              <button onClick={() => setActiveTab('expenses')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'expenses' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Pengeluaran Manual</button>
              <button onClick={() => setActiveTab('posverify')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'posverify' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Verifikasi Pembayaran</button>
              <button onClick={() => setActiveTab('petty_cash')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'petty_cash' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Kas Kecil (Petty Cash)</button>
              <button onClick={() => setActiveTab('tax_ppn')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'tax_ppn' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Pajak PPN & Setoran</button>
              <button onClick={() => setActiveTab('pl_report')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'pl_report' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Laporan Laba Rugi</button>
              <button onClick={() => setActiveTab('bank_deposit')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'bank_deposit' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Setoran Bank</button>
            </div>

            {/* TAB: INVOICES */}
            {activeTab === 'invoices' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Catat Invoice Pemasok</h4>
                  <form onSubmit={handleAddInvoice} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nomor Invoice</label>
                      <input type="text" value={invNo} onChange={e => setInvNo(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="INV-2026-001" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nama Pemasok (Supplier)</label>
                      <input type="text" value={invSupplier} onChange={e => setInvSupplier(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="PT Sumber Rasa Abadi..." />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Total Tagihan (Rp)</label>
                        <input type="number" value={invAmount} onChange={e => setInvAmount(e.target.value)} required min="1" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="0" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Jatuh Tempo</label>
                        <input type="date" value={invDueDate} onChange={e => setInvDueDate(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Catat Tagihan</button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Invoice Pemasok Terdaftar</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">No Invoice</th>
                          <th className="p-3 text-left">Pemasok</th>
                          <th className="p-3 text-right">Nominal</th>
                          <th className="p-3 text-center">Jatuh Tempo</th>
                          <th className="p-3 text-center">Status</th>
                          <th className="p-3 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {invoicesList.map(item => (
                          <tr key={item.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 font-mono font-bold text-sky-750">{item.invNo}</td>
                            <td className="p-3 font-bold text-zinc-700">{item.supplier}</td>
                            <td className="p-3 text-right font-bold text-zinc-800 font-mono">Rp {item.amount.toLocaleString('id-ID')}</td>
                            <td className="p-3 text-center text-zinc-500">{item.dueDate}</td>
                            <td className="p-3 text-center">
                              <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                                item.status === 'Lunas' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'
                              }`}>{item.status}</span>
                            </td>
                            <td className="p-3 text-right space-x-1">
                              {item.status !== 'Lunas' && (
                                <button onClick={() => handlePayInvoice(item.id)} className="px-2 py-1 bg-emerald-50 text-emerald-700 font-bold rounded hover:bg-emerald-100 text-[10px]">Bayar</button>
                              )}
                              <button onClick={() => handleDeleteInvoice(item.id)} className="p-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100"><Icon name="trash-2" size={12} /></button>
                            </td>
                          </tr>
                        ))}
                        {invoicesList.length === 0 && (
                          <tr><td colSpan="6" className="text-center p-8 text-zinc-400">Belum ada invoice supplier tercatat.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: EXPENSES */}
            {activeTab === 'expenses' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Catat Pengeluaran Baru</h4>
                  <form onSubmit={handleAddExpense} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Kategori Biaya</label>
                      <select value={expCategory} onChange={e => setExpCategory(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:bg-white">
                        <option value="Listrik & Air">Listrik & Air</option>
                        <option value="Sewa Tempat">Sewa Tempat</option>
                        <option value="Gaji & Lembur Staf">Gaji & Lembur Staf</option>
                        <option value="Logistik & Perlengkapan">Logistik & Perlengkapan</option>
                        <option value="Pemasok / Supplier">Pemasok / Supplier</option>
                        <option value="Lain-Lain">Lain-Lain</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Jumlah Pengeluaran (Rp)</label>
                      <input type="number" value={expAmount} onChange={e => setExpAmount(e.target.value)} required min="1" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="0" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Keterangan Pengeluaran</label>
                      <textarea value={expDesc} onChange={e => setExpDesc(e.target.value)} required rows={3} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-xs" placeholder="Detail pengeluaran..."></textarea>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Catat Pengeluaran</button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Riwayat Pengeluaran Operasional</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">Tanggal</th>
                          <th className="p-3 text-left">Kategori</th>
                          <th className="p-3 text-left">Keterangan</th>
                          <th className="p-3 text-right">Nominal</th>
                          <th className="p-3 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {expensesList.map(item => (
                          <tr key={item.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 text-zinc-550">{item.date}</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded font-bold bg-amber-50 text-amber-700 text-[10px]">{item.category}</span></td>
                            <td className="p-3 text-zinc-650 italic truncate max-w-[200px]">{item.description}</td>
                            <td className="p-3 text-right font-bold text-zinc-800 font-mono">Rp {item.amount.toLocaleString('id-ID')}</td>
                            <td className="p-3 text-right">
                              <button onClick={() => handleDeleteExpense(item.id)} className="p-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100"><Icon name="trash-2" size={12} /></button>
                            </td>
                          </tr>
                        ))}
                        {expensesList.length === 0 && (
                          <tr><td colSpan="5" className="text-center p-8 text-zinc-400">Belum ada riwayat pengeluaran.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: VERIFY */}
            {activeTab === 'posverify' && (
              <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                <h4 className="font-bold text-zinc-800 text-sm mb-4">Verifikasi Transaksi Transfer & QRIS POS</h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                        <th className="p-3 text-left">ID Transaksi</th>
                        <th className="p-3 text-left">Metode</th>
                        <th className="p-3 text-left">Nama Pembeli</th>
                        <th className="p-3 text-right">Nominal</th>
                        <th className="p-3 text-center">Waktu Transaksi</th>
                        <th className="p-3 text-center">Status</th>
                        <th className="p-3 text-right">Aksi Verifikasi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-100">
                      {verificationsList.map(item => (
                        <tr key={item.id} className="hover:bg-zinc-50/50">
                          <td className="p-3 font-mono font-bold text-zinc-500">{item.txId || item.id}</td>
                          <td className="p-3"><span className="px-2 py-0.5 bg-sky-50 text-sky-700 font-bold rounded uppercase text-[10px]">{item.method}</span></td>
                          <td className="p-3 font-semibold text-zinc-700">{item.customer || 'Pelanggan Umum'}</td>
                          <td className="p-3 text-right font-bold text-zinc-800 font-mono">Rp {item.amount.toLocaleString('id-ID')}</td>
                          <td className="p-3 text-center text-zinc-400">{new Date(item.date).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</td>
                          <td className="p-3 text-center">
                            <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                              item.status === 'Terverifikasi' ? 'bg-emerald-50 text-emerald-700' :
                              item.status === 'Ditolak' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700 animate-pulse'
                            }`}>{item.status}</span>
                          </td>
                          <td className="p-3 text-right space-x-1">
                            {item.status === 'Menunggu' && (
                              <>
                                <button onClick={() => handleVerifyPayment(item.id, true)} className="px-2 py-1 bg-emerald-50 text-emerald-700 font-bold rounded hover:bg-emerald-100 text-[10px]" title="Verifikasi Lunas">Terima</button>
                                <button onClick={() => handleVerifyPayment(item.id, false)} className="px-2 py-1 bg-rose-50 text-rose-700 font-bold rounded hover:bg-rose-100 text-[10px]" title="Tolak">Tolak</button>
                              </>
                            )}
                            {item.status !== 'Menunggu' && (
                              <span className="text-[10px] text-zinc-400 font-mono">Verified by {item.verifiedBy}</span>
                            )}
                          </td>
                        </tr>
                      ))}
                      {verificationsList.length === 0 && (
                        <tr><td colSpan="7" className="text-center p-8 text-zinc-400">Tidak ada transaksi nontunai menunggu verifikasi.</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'petty_cash' && renderPettyCashView()}
            {activeTab === 'tax_ppn' && renderTaxPpnView()}

            {activeTab === 'pl_report' && (() => {
              const monthStr = plMonth; // YYYY-MM
              
              // Transactions revenue & hpp
              const monthTx = (db.transactions || []).filter(tx => {
                return tx.createdAt && tx.createdAt.startsWith(monthStr) && tx.paymentStatus === 'paid';
              });
              const totalRevenue = monthTx.reduce((acc, tx) => acc + (tx.total || 0), 0);
              const totalCostOfSales = monthTx.reduce((acc, tx) => {
                const itemsCost = (tx.items || []).reduce((sum, item) => {
                  const prodCost = item.cost || 0;
                  return sum + (prodCost * item.qty);
                }, 0);
                return acc + itemsCost;
              }, 0);
              const grossProfit = totalRevenue - totalCostOfSales;

              // Expenses & Invoices
              const monthExpenses = (db.expenses || []).filter(e => {
                return (e.date && e.date.startsWith(monthStr)) || (e.createdAt && e.createdAt.startsWith(monthStr));
              });
              const totalExpensesValue = monthExpenses.reduce((acc, e) => acc + (parseFloat(e.amount) || 0), 0);

              const monthInvoices = (db.invoices || []).filter(inv => {
                return (inv.date && inv.date.startsWith(monthStr)) || (inv.createdAt && inv.createdAt.startsWith(monthStr));
              });
              const totalInvoicesPaid = monthInvoices.filter(i => i.status === 'Lunas' || i.status === 'paid').reduce((acc, i) => acc + (parseFloat(i.amount) || 0), 0);

              const totalOpExpenses = totalExpensesValue + totalInvoicesPaid;
              const netProfit = grossProfit - totalOpExpenses;

              return (
                <div className="space-y-6 text-left animate-[fadeIn_0.2s_ease-out]">
                  {/* Select month */}
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <h4 className="font-bold text-zinc-800 text-sm">Filter Bulan Laporan Laba Rugi</h4>
                      <p className="text-xs text-zinc-400 mt-0.5">Pilih bulan pembukuan untuk menghitung laba rugi bersih secara real-time.</p>
                    </div>
                    <input
                      type="month"
                      value={plMonth}
                      onChange={e => setPlMonth(e.target.value)}
                      className="px-4 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm outline-none font-bold text-zinc-700"
                    />
                  </div>

                  {/* Summary Cards */}
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div className="bg-white border border-zinc-200 p-5 rounded-2xl shadow-sm">
                      <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Pendapatan (Revenue)</p>
                      <p className="text-xl font-extrabold text-zinc-850 mt-1 font-mono">Rp {totalRevenue.toLocaleString('id-ID')}</p>
                      <p className="text-[10px] text-zinc-400 mt-1">{monthTx.length} Transaksi POS Berhasil</p>
                    </div>
                    <div className="bg-white border border-zinc-200 p-5 rounded-2xl shadow-sm">
                      <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Harga Pokok Penjualan (HPP)</p>
                      <p className="text-xl font-extrabold text-zinc-850 mt-1 font-mono">Rp {totalCostOfSales.toLocaleString('id-ID')}</p>
                      <p className="text-[10px] text-zinc-400 mt-1">Estimasi Modal Stok Terjual</p>
                    </div>
                    <div className="bg-white border border-zinc-200 p-5 rounded-2xl shadow-sm">
                      <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Laba Kotor (Gross Profit)</p>
                      <p className="text-xl font-extrabold text-emerald-650 mt-1 font-mono">Rp {grossProfit.toLocaleString('id-ID')}</p>
                      <p className="text-[10px] text-zinc-400 mt-1">Profit margin: {totalRevenue > 0 ? Math.round((grossProfit / totalRevenue) * 100) : 0}%</p>
                    </div>
                    <div className="bg-white border border-zinc-200 p-5 rounded-2xl shadow-sm">
                      <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Laba Bersih (Net Profit)</p>
                      <p className={`text-xl font-extrabold mt-1 font-mono ${netProfit >= 0 ? 'text-emerald-750' : 'text-rose-600'}`}>
                        Rp {netProfit.toLocaleString('id-ID')}
                      </p>
                      <p className="text-[10px] text-zinc-400 mt-1">Setelah dikurangi biaya & tagihan paid</p>
                    </div>
                  </div>

                  {/* Operational Expenses breakdown */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                      <div className="flex justify-between items-center mb-4">
                        <h5 className="font-bold text-zinc-800 text-xs uppercase tracking-wider">Rincian Pengeluaran Kas (Rp {totalExpensesValue.toLocaleString('id-ID')})</h5>
                        <Icon name="trending-down" className="text-rose-500" size={16} />
                      </div>
                      <div className="overflow-y-auto max-h-60 custom-scroll text-xs">
                        <table className="w-full">
                          <thead>
                            <tr className="bg-zinc-50 text-zinc-500 font-bold border-b border-zinc-200">
                              <th className="p-2 text-left">Tanggal</th>
                              <th className="p-2 text-left">Kategori</th>
                              <th className="p-2 text-left">Keterangan</th>
                              <th className="p-2 text-right">Nominal</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-zinc-100">
                            {monthExpenses.map(e => (
                              <tr key={e.id} className="hover:bg-zinc-50/50">
                                <td className="p-2 text-zinc-500">{e.date || e.createdAt?.slice(0, 10)}</td>
                                <td className="p-2 font-bold text-zinc-700">{e.category}</td>
                                <td className="p-2 text-zinc-650">{e.desc || e.description}</td>
                                <td className="p-2 text-right font-mono font-bold text-rose-600">Rp {e.amount.toLocaleString('id-ID')}</td>
                              </tr>
                            ))}
                            {monthExpenses.length === 0 && (
                              <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Tidak ada pengeluaran kas dicatat pada bulan ini.</td></tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                      <div className="flex justify-between items-center mb-4">
                        <h5 className="font-bold text-zinc-800 text-xs uppercase tracking-wider">Tagihan Pemasok Lunas (Rp {totalInvoicesPaid.toLocaleString('id-ID')})</h5>
                        <Icon name="file-text" className="text-sky-500" size={16} />
                      </div>
                      <div className="overflow-y-auto max-h-60 custom-scroll text-xs">
                        <table className="w-full">
                          <thead>
                            <tr className="bg-zinc-50 text-zinc-500 font-bold border-b border-zinc-200">
                              <th className="p-2 text-left">Tanggal</th>
                              <th className="p-2 text-left">Supplier</th>
                              <th className="p-2 text-left">No Invoice</th>
                              <th className="p-2 text-right">Nominal</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-zinc-100">
                            {monthInvoices.filter(inv => inv.status === 'Lunas' || inv.status === 'paid').map(i => (
                              <tr key={i.id} className="hover:bg-zinc-50/50">
                                <td className="p-2 text-zinc-500">{i.dueDate || i.createdAt?.slice(0,10)}</td>
                                <td className="p-2 font-bold text-zinc-700">{i.supplier}</td>
                                <td className="p-2 text-zinc-600 font-mono">{i.invNo || i.invoiceNo}</td>
                                <td className="p-2 text-right font-mono font-bold text-rose-600">Rp {i.amount.toLocaleString('id-ID')}</td>
                              </tr>
                            ))}
                            {monthInvoices.filter(inv => inv.status === 'Lunas' || inv.status === 'paid').length === 0 && (
                              <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Tidak ada tagihan supplier yang dibayarkan lunas pada bulan ini.</td></tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}
            {activeTab === 'bank_deposit' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-[fadeIn_0.2s_ease-out]">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm text-left">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Input Setoran Kas ke Bank</h4>
                  <form onSubmit={handleAddDeposit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Pilih Bank Tujuan</label>
                      <select value={depBank} onChange={e => setDepBank(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-sm focus:bg-white font-semibold">
                        <option value="">-- Pilih Bank --</option>
                        <option value="BCA">Bank BCA</option>
                        <option value="Mandiri">Bank Mandiri</option>
                        <option value="BRI">Bank BRI</option>
                        <option value="BNI">Bank BNI</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nominal Setoran (Rp)</label>
                      <input type="number" value={depAmount} onChange={e => setDepAmount(e.target.value)} required min="1" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm font-mono font-bold" placeholder="0" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Tanggal Setoran</label>
                      <input type="date" value={depDate} onChange={e => setDepDate(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nama Penyetor (Staf)</label>
                      <input type="text" value={depStaff} onChange={e => setDepStaff(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="Nama staf pembawa uang..." />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Simpan Setoran</button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm text-left">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Daftar Riwayat Setoran Kas ke Bank</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-left">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3">Tanggal</th>
                          <th className="p-3">Bank</th>
                          <th className="p-3 text-right">Nominal</th>
                          <th className="p-3">Nama Penyetor</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100 font-medium">
                        {(db.bankDeposits || []).map(d => (
                          <tr key={d.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 text-zinc-500">{d.date}</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded font-black bg-blue-50 text-blue-700 text-[10px]">{d.bank}</span></td>
                            <td className="p-3 text-right font-mono font-bold text-zinc-800">Rp {d.amount?.toLocaleString('id-ID')}</td>
                            <td className="p-3 font-semibold text-zinc-650">{d.staff}</td>
                          </tr>
                        ))}
                        {(db.bankDeposits || []).length === 0 && (
                          <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Belum ada riwayat setoran kas ke bank.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderHR = () => {
        const totalStaff = (db.users || []).filter(u => u.role !== 'owner').length;
        const pendingLeaves = (db.leaveRequests || []).filter(l => l.status === 'pending').length;
        const totalAttendance = (db.attendance || []).length;

        return (
          <div className="space-y-6 text-left">
            {/* HR MINI METRICS */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-2 animate-[fadeIn_0.2s_ease-out]">
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Anggota Staf</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">{totalStaff} Orang</p>
                </div>
                <div className="p-2 bg-sky-50 text-sky-600 rounded-xl"><Icon name="users" size={18} /></div>
              </div>
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Cuti Menunggu Approval</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">{pendingLeaves} Pengajuan</p>
                </div>
                <div className="p-2 bg-amber-50 text-amber-600 rounded-xl"><Icon name="clock" size={18} /></div>
              </div>
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Catatan Kehadiran</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">{totalAttendance} Entri</p>
                </div>
                <div className="p-2 bg-emerald-50 text-emerald-600 rounded-xl"><Icon name="check-circle" size={18} /></div>
              </div>
            </div>

            <div className="flex border-b border-zinc-200 gap-4 mb-4 overflow-x-auto whitespace-nowrap scrollbar-none">
              <button onClick={() => setActiveTab('attendance')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'attendance' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Absensi Staf</button>
              <button onClick={() => setActiveTab('leaves')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'leaves' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Pengajuan Cuti</button>
              <button onClick={() => setActiveTab('payroll')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'payroll' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Kalkulator Gaji</button>
              <button onClick={() => setActiveTab('recruits')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'recruits' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Rekrutmen</button>
              <button onClick={() => setActiveTab('kpi')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'kpi' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>KPI & Kinerja</button>
              <button onClick={() => setActiveTab('swap_shift')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'swap_shift' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Tukar Shift</button>
            </div>

            {/* TAB: ATTENDANCE */}
            {activeTab === 'attendance' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Koreksi Absensi Manual</h4>
                  <form onSubmit={handleAddAttendance} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Pilih Karyawan</label>
                      <select value={attEmployee} onChange={e => setAttEmployee(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-sm focus:bg-white">
                        <option value="">-- Pilih Staf --</option>
                        {staffList.map(s => (
                          <option key={s.id} value={s.id}>{s.name} ({s.roleLabel || s.role})</option>
                        ))}
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Tanggal</label>
                        <input type="date" value={attDate} onChange={e => setAttDate(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Status Kehadiran</label>
                        <select value={attStatus} onChange={e => setAttStatus(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:bg-white">
                          <option value="Hadir">Hadir</option>
                          <option value="Sakit">Sakit</option>
                          <option value="Izin">Izin / Cuti</option>
                          <option value="Alfa">Alpa (Tanpa Keterangan)</option>
                        </select>
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Simpan Koreksi</button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Log Absensi Karyawan</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">Karyawan</th>
                          <th className="p-3 text-center">Tanggal</th>
                          <th className="p-3 text-center">Status Kehadiran</th>
                          <th className="p-3 text-right">Diperbarui</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {attendanceList.map(item => (
                          <tr key={item.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 font-bold text-zinc-700">{item.employeeName}</td>
                            <td className="p-3 text-center text-zinc-650">{item.date}</td>
                            <td className="p-3 text-center">
                              <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                                item.status === 'Hadir' ? 'bg-emerald-50 text-emerald-700' :
                                item.status === 'Sakit' ? 'bg-amber-50 text-amber-700' :
                                item.status === 'Izin' ? 'bg-sky-50 text-sky-700' : 'bg-rose-50 text-rose-700'
                              }`}>{item.status}</span>
                            </td>
                            <td className="p-3 text-right text-zinc-400 font-mono text-[10px]">{formatTimeAgo(item.updatedAt)}</td>
                          </tr>
                        ))}
                        {attendanceList.length === 0 && (
                          <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Belum ada data kehadiran staf.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: LEAVES */}
            {activeTab === 'leaves' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Buat Permohonan Cuti Staf</h4>
                  <form onSubmit={handleAddLeave} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nama Karyawan</label>
                      <select value={leaveEmployee} onChange={e => setLeaveEmployee(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-sm focus:bg-white">
                        <option value="">-- Pilih Staf --</option>
                        {staffList.map(s => (
                          <option key={s.id} value={s.id}>{s.name} ({s.roleLabel || s.role})</option>
                        ))}
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Tanggal Mulai</label>
                        <input type="date" value={leaveStart} onChange={e => setLeaveStart(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Tanggal Selesai</label>
                        <input type="date" value={leaveEnd} onChange={e => setLeaveEnd(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Alasan Cuti</label>
                      <input type="text" value={leaveReason} onChange={e => setLeaveReason(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-sm focus:bg-white" placeholder="Alasan mudik, sakit, dll..." />
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Ajukan Cuti</button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Pengajuan Cuti Karyawan</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">Karyawan</th>
                          <th className="p-3 text-left">Durasi Cuti</th>
                          <th className="p-3 text-left">Alasan</th>
                          <th className="p-3 text-center">Status</th>
                          <th className="p-3 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {leaveList.map(item => (
                          <tr key={item.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 font-bold text-zinc-700">{item.employeeName}</td>
                            <td className="p-3 text-zinc-650">{item.start} s/d {item.end}</td>
                            <td className="p-3 text-zinc-500 italic">{item.reason}</td>
                            <td className="p-3 text-center">
                              <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                                item.status === 'Disetujui' ? 'bg-emerald-50 text-emerald-700' :
                                item.status === 'Ditolak' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700'
                              }`}>{item.status}</span>
                            </td>
                            <td className="p-3 text-right space-x-1">
                              {item.status === 'Menunggu' && (
                                <>
                                  <button onClick={() => handleApproveLeave(item.id, true)} className="px-2 py-1 bg-emerald-50 text-emerald-700 font-bold rounded hover:bg-emerald-100 text-[10px]">Setujui</button>
                                  <button onClick={() => handleApproveLeave(item.id, false)} className="px-2 py-1 bg-rose-50 text-rose-700 font-bold rounded hover:bg-rose-100 text-[10px]">Tolak</button>
                                </>
                              )}
                            </td>
                          </tr>
                        ))}
                        {leaveList.length === 0 && (
                          <tr><td colSpan="5" className="text-center p-8 text-zinc-400">Tidak ada pengajuan cuti.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: PAYROLL */}
            {activeTab === 'payroll' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Kalkulator Gaji & BPJS</h4>
                  <div className="space-y-3.5">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nama Karyawan</label>
                      <select value={payEmployee} onChange={e => setPayEmployee(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-sm focus:bg-white">
                        <option value="">-- Pilih Staf --</option>
                        {staffList.map(s => (
                          <option key={s.id} value={s.id}>{s.name} ({s.roleLabel || s.role})</option>
                        ))}
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Bulan Gaji</label>
                        <input type="text" value={payMonth} onChange={e => setPayMonth(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm" placeholder="Mei 2026" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Gaji Pokok (Rp)</label>
                        <input type="number" value={payBase} onChange={e => setPayBase(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm" placeholder="4000000" />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Lembur (Jam)</label>
                        <input type="number" value={payOvertimeHours} onChange={e => setPayOvertimeHours(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm" placeholder="0" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Tarif Lembur/Jam</label>
                        <input type="number" value={payOvertimeRate} onChange={e => setPayOvertimeRate(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm" placeholder="20000" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Bonus & Insentif (Rp)</label>
                      <input type="number" value={payBonus} onChange={e => setPayBonus(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm" placeholder="0" />
                    </div>
                    
                    <div className="bg-zinc-50 border border-zinc-150 rounded-2xl p-4 text-[10px] text-zinc-500 space-y-1">
                      <p className="font-bold">Potongan BPJS Otomatis:</p>
                      <p>â€¢ BPJS Kesehatan: 1% Gaji Pokok</p>
                      <p>â€¢ BPJS Ketenagakerjaan: 2% Gaji Pokok</p>
                    </div>

                    <button onClick={handleCalculatePayroll} className="w-full py-2.5 bg-sky-600 text-white rounded-xl font-bold text-xs hover:bg-sky-700 transition shadow-sm">Kalkulasi Gaji</button>
                  </div>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  {slipResult ? (
                    <div className="border border-sky-100 bg-sky-50/20 rounded-2xl p-6 relative">
                      <h4 className="font-bold text-sky-900 text-sm border-b border-sky-100 pb-3 uppercase tracking-wide">Slip Gaji Bulanan - Smile POS</h4>
                      
                      <div className="grid grid-cols-2 gap-4 text-xs my-4 text-zinc-700">
                        <div>
                          <p><span className="font-bold">Karyawan:</span> {slipResult.employeeName}</p>
                          <p><span className="font-bold">Jabatan:</span> {slipResult.employeeRole}</p>
                        </div>
                        <div className="text-right">
                          <p><span className="font-bold">Periode:</span> {slipResult.month}</p>
                          <p><span className="font-bold">Tanggal Hitung:</span> {new Date().toLocaleDateString('id-ID')}</p>
                        </div>
                      </div>

                      <div className="border-t border-dashed border-zinc-250 py-3 space-y-2 text-xs">
                        <div className="flex justify-between"><span>Gaji Pokok</span><span className="font-semibold text-zinc-800 font-mono">Rp {slipResult.base.toLocaleString('id-ID')}</span></div>
                        <div className="flex justify-between"><span>Gaji Lembur</span><span className="font-semibold text-zinc-800 font-mono">Rp {slipResult.overtimePay.toLocaleString('id-ID')}</span></div>
                        <div className="flex justify-between"><span>Insentif / Bonus</span><span className="font-semibold text-zinc-800 font-mono">Rp {slipResult.bonus.toLocaleString('id-ID')}</span></div>
                        <div className="flex justify-between text-rose-600"><span>Potongan BPJS Kesehatan (1%)</span><span className="font-mono">- Rp {slipResult.bpjsKes.toLocaleString('id-ID')}</span></div>
                        <div className="flex justify-between text-rose-600"><span>Potongan BPJS Ketenagakerjaan (2%)</span><span className="font-mono">- Rp {slipResult.bpjsKet.toLocaleString('id-ID')}</span></div>
                      </div>

                      <div className="border-t border-sky-100 pt-3 flex justify-between font-bold text-sm text-sky-950 bg-sky-100/50 p-3 rounded-xl">
                        <span>GAJI BERSIH (NET)</span>
                        <span className="font-mono">Rp {slipResult.total.toLocaleString('id-ID')}</span>
                      </div>

                      <div className="flex gap-2.5 mt-5">
                        <button onClick={() => setSlipResult(null)} className="flex-1 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-bold rounded-xl text-xs transition">Batal</button>
                        <button onClick={handleSavePayroll} className="flex-1 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl text-xs transition flex items-center justify-center gap-1"><Icon name="file-check" size={13} />Simpan Slip</button>
                      </div>
                    </div>
                  ) : (
                    <div className="h-full flex flex-col justify-center items-center py-16 text-zinc-400">
                      <Icon name="file-text" size={48} className="text-zinc-300 mb-2" />
                      <p className="text-xs">Pilih karyawan & lakukan kalkulasi gaji untuk mencetak slip bulanan.</p>
                      
                      <div className="w-full mt-8 border-t border-zinc-150 pt-5 text-left">
                        <h5 className="font-bold text-zinc-700 text-xs mb-3">Daftar Slip Gaji Tersimpan</h5>
                        <div className="overflow-x-auto text-[10px]">
                          <table className="w-full">
                            <thead>
                              <tr className="bg-zinc-50 border-b border-zinc-200 text-zinc-500">
                                <th className="p-2 text-left">Karyawan</th>
                                <th className="p-2 text-center">Bulan</th>
                                <th className="p-2 text-right">Gaji Pokok</th>
                                <th className="p-2 text-right">Potongan BPJS</th>
                                <th className="p-2 text-right">Total Bersih</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-zinc-100">
                              {payrollList.map(p => (
                                <tr key={p.id}>
                                  <td className="p-2 font-semibold text-zinc-700">{p.employeeName}</td>
                                  <td className="p-2 text-center text-zinc-500">{p.month}</td>
                                  <td className="p-2 text-right font-mono">Rp {p.base.toLocaleString('id-ID')}</td>
                                  <td className="p-2 text-right text-rose-600 font-mono">-Rp {p.deductions.toLocaleString('id-ID')}</td>

            {activeTab === 'wa_broadcast' && (() => {

                ...(db.members || []).map(m => ({ id: m.id, name: m.name, phone: m.phone, type: 'Member' }))

      };

      const renderGudang = () => {
        const totalReceipts = (db.goodsReceipts || []).length;

        const totalLedger = (db.stockLedger || []).length;
        const ledgerList = (db.stockLedger || []).sort((a, b) => new Date(b.date) - new Date(a.date));
