                          required
                          min="1"
                          className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm"

                      </div>

                        type="submit"
                        className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition"

                    </form>
                  </div>

                    <div className="bg-zinc-50 p-6 rounded-2xl border border-zinc-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

                        <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Target Bulan Ini ({currentTargetObj.month})</p>
                        <h3 className="text-xl font-bold text-zinc-800 mt-1 font-mono">Rp {currentTargetObj.target.toLocaleString('id-ID')}</h3>
                      </div>
                      <div className="text-right">
                        <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Realisasi Penjualan</p>
                        <h3 className="text-xl font-bold text-emerald-600 mt-1 font-mono">Rp {currentMonthRevenue.toLocaleString('id-ID')}</h3>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <div className="flex justify-between items-center text-xs font-bold text-zinc-700">
                        <span>Progress Pencapaian</span>
                        <span>{percentage}%</span>
                      </div>
                      <div className="w-full bg-zinc-150 h-4 rounded-full overflow-hidden border border-zinc-200">
                        <div
                          style={{ width: `${percentage}%` }}
                          className={`h-full transition-all duration-500 ${
                            percentage >= 100 ? 'bg-emerald-500' : (percentage >= 50 ? 'bg-sky-500' : 'bg-amber-500')
                          }`}
                        />
                      </div>
                      <p className="text-[10px] text-zinc-450 italic mt-1">
                        {percentage >= 100 
                          ? 'ðŸŽ‰ Selamat! Target penjualan bulan ini telah tercapai.' 
                          : `Kurang Rp ${(Math.max(0, currentTargetObj.target - currentMonthRevenue)).toLocaleString('id-ID')} lagi untuk mencapai target.`}
                      </p>
                    </div>
                  </div>
                </div>
              );
            })()}

            {activeTab === 'bypass' && (
              <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">

                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                        <th className="p-3 text-left">Nama Pegawai</th>
                        <th className="p-3 text-left">Email</th>
                        <th className="p-3 text-center">Waktu Pengajuan</th>
                        <th className="p-3 text-left">Lokasi / IP</th>
                        <th className="p-3 text-left">Perangkat</th>
                        <th className="p-3 text-center">Status</th>
                        <th className="p-3 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-100">
                      {(db.bypassRequests || []).map(req => (
                        <tr key={req.id} className="hover:bg-zinc-50/50">
                          <td className="p-3 font-bold text-zinc-700">{req.name}</td>
                          <td className="p-3 font-mono text-zinc-500">{req.email}</td>
                          <td className="p-3 text-center text-zinc-450">{new Date(req.time || req.requestedAt).toLocaleTimeString('id-ID')}</td>
                          <td className="p-3 text-zinc-650">{req.location || 'Unknown'}</td>
                          <td className="p-3 text-zinc-650 truncate max-w-[150px]" title={req.device}>{req.device || 'Web Browser'}</td>
                          <td className="p-3 text-center">
                            <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                              req.status === 'approved' || req.status === 'Disetujui' ? 'bg-emerald-50 text-emerald-700' :
                              req.status === 'rejected' || req.status === 'Ditolak' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700 animate-pulse'
                            }`}>{req.status}</span>
                          </td>
                          <td className="p-3 text-right space-x-1 whitespace-nowrap">
                            {req.status === 'pending' && (
                              <>
                                <button onClick={() => app.approveBypassRequest(req.id)} className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold text-[10px]">Izinkan</button>
                                <button onClick={() => app.rejectBypassRequest(req.id)} className="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded font-bold text-[10px]">Tolak</button>
                              </>
                            )}
                          </td>
                        </tr>
                      ))}
                      {(db.bypassRequests || []).length === 0 && (
                        <tr><td colSpan="7" className="text-center p-8 text-zinc-400">Tidak ada pengajuan otorisasi.</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'audit' && (
              <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">

                  <table className="w-full text-xs">
                    <thead>
                      <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                        <th className="p-3 text-left">Waktu Log</th>
                        <th className="p-3 text-left">Pengguna</th>
                        <th className="p-3 text-left">Jabatan</th>
                        <th className="p-3 text-left">Aktivitas</th>
                        <th className="p-3 text-left">Detail Keterangan</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-100">
                      {auditLogs.map(log => (
                        <tr key={log.id} className="hover:bg-zinc-50/50">
                          <td className="p-3 font-mono text-[10px] text-zinc-400">{new Date(log.timestamp).toLocaleString('id-ID')}</td>
                          <td className="p-3 font-bold text-zinc-700">{log.user}</td>
                          <td className="p-3 text-zinc-500 uppercase text-[10px] font-bold">{log.role}</td>
                          <td className="p-3 font-bold text-sky-700">{log.action}</td>
                          <td className="p-3 text-zinc-650 italic">{log.details}</td>
                        </tr>
                      ))}
                      {auditLogs.length === 0 && (
                        <tr><td colSpan="5" className="text-center p-8 text-zinc-400">Belum ada catatan log audit.</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>
      );
      };

        const activeShifts = (db.shifts || []).filter(s => s.status === 'open');

        return (
          <div className="space-y-6 text-left">
            <div className="flex border-b border-zinc-200 gap-4 mb-4 overflow-x-auto whitespace-nowrap scrollbar-none">
              <button onClick={() => setActiveTab('control')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'control' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Kontrol Shift & Kas</button>
              <button onClick={() => setActiveTab('attendance')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'attendance' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Presensi Pegawai</button>
              <button onClick={() => setActiveTab('tasks')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'tasks' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Delegasi Tugas Harian</button>
              <button onClick={() => setActiveTab('incidents')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'incidents' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Laporan Insiden Toko</button>
              <button onClick={() => setActiveTab('cash_audit')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'cash_audit' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Audit Laci Kasir</button>
            </div>

            {activeTab === 'control' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Shift Kasir Aktif Saat Ini</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">Nama Kasir</th>
                          <th className="p-3 text-center">Waktu Mulai Shift</th>
                          <th className="p-3 text-right">Modal Awal Laci Kas</th>
                          <th className="p-3 text-right">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {activeShifts.map(s => (
                          <tr key={s.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 font-bold text-zinc-700">{s.cashierName}</td>
                            <td className="p-3 text-center text-zinc-550">{new Date(s.startTime).toLocaleString('id-ID')}</td>
                            <td className="p-3 text-right font-mono font-bold text-zinc-800">Rp {s.startCash.toLocaleString('id-ID')}</td>
                            <td className="p-3 text-right">
                              <span className="px-2 py-0.5 rounded font-bold text-[10px] bg-emerald-50 text-emerald-700 animate-pulse">Sedang Aktif</span>
                            </td>
                          </tr>
                        ))}
                        {activeShifts.length === 0 && (
                          <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Tidak ada kasir yang sedang membuka shift.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm h-fit space-y-4">
                  <h4 className="font-bold text-zinc-800 text-sm">Panduan Supervisor POS</h4>
                  <div className="space-y-3 text-xs text-zinc-650">
                    <div className="p-3 bg-zinc-50 border border-zinc-200 rounded-xl">
                      <p className="font-bold text-zinc-700 mb-1">Cek Fisik Laci Kas</p>
                      <p>Pastikan jumlah uang kertas & koin di laci kasir cocok dengan hitungan sistem saat kasir mengajukan tutup shift.</p>
                    </div>
                    <div className="p-3 bg-zinc-50 border border-zinc-200 rounded-xl">
                      <p className="font-bold text-zinc-700 mb-1">Otorisasi Selisih Kas</p>
                      <p>Apabila ada perbedaan nominal kas riil vs sistem, supervisor harus memeriksa struk transaksi manual sebelum memberikan bypass tutup shift.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'attendance' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Pilih Pegawai</label>

                        <option value="">-- Pilih Staf --</option>
                        {staffList.map(s => (
                          <option key={s.id} value={s.id}>{s.name} ({s.roleLabel || s.role})</option>

                      </select>
                    </div>

                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Tanggal</label>

            {/* TAB: AUDIT LACI KASIR */}
            {activeTab === 'cash_audit' && (() => {
              const shifts = db.shifts || [];
              const targetShift = shifts.find(s => s.id === auditShiftId);
              
              let systemCash = 0;
              let cashSales = 0;
              let cashierName = 'Tidak Ada';

              if (targetShift) {
                cashierName = targetShift.cashierName;
                const startTime = new Date(targetShift.startTime);
                const endTime = targetShift.endTime ? new Date(targetShift.endTime) : new Date();
                
                const shiftTxs = (db.transactions || []).filter(tx => {
                  if (tx.cashierId !== targetShift.cashierId) return false;
                  if (tx.paymentMethod !== 'cash') return false;
                  if (tx.paymentStatus !== 'paid') return false;
                  const txTime = new Date(tx.createdAt);
                  return txTime >= startTime && txTime <= endTime;
                });
                cashSales = shiftTxs.reduce((sum, tx) => sum + (tx.total || 0), 0);
                
                systemCash = targetShift.startCash + cashSales;
              }

              const discrepancy = parseFloat(auditPhysicalCash || 0) - systemCash;

              const handleSaveAudit = (e) => {
                e.preventDefault();
                if (!targetShift) {
                  alert('Pilih shift yang valid untuk diaudit');
                  return;
                }
                const currentDb = getDB();
                currentDb.cashAudits = currentDb.cashAudits || [];
                currentDb.cashAudits.push({
                  id: 'AUD' + Date.now(),
                  shiftId: targetShift.id,
                  cashierName: targetShift.cashierName,
                  auditorName: app.user?.name || 'Supervisor',
                  systemCash: systemCash,
                  physicalCash: parseFloat(auditPhysicalCash || 0),
                  discrepancy: discrepancy,
                  notes: auditNotes,
                  createdAt: new Date().toISOString()
                });
                saveDB(currentDb);

                setAuditNotes('');

              };

                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Pilih Sesi Shift Kasir</label>
                        <select value={auditShiftId} onChange={e => setAuditShiftId(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-sm focus:bg-white font-semibold">
                          <option value="">-- Pilih Sesi Shift --</option>
                          {shifts.map(s => (
                            <option key={s.id} value={s.id}>{s.cashierName} ({new Date(s.startTime).toLocaleDateString('id-ID')} - {s.status === 'open' ? 'Buka' : 'Tutup'})</option>
                          ))}
                        </select>
                      </div>
                      
                      {targetShift && (
                        <div className="bg-zinc-50 p-4 rounded-xl border border-zinc-200 text-xs space-y-2">
                          <div className="flex justify-between">
                            <span className="text-zinc-500">Kasir:</span>
                            <span className="font-bold text-zinc-800">{cashierName}</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-zinc-500">Modal Awal Laci:</span>
                            <span className="font-bold font-mono">Rp {targetShift.startCash.toLocaleString('id-ID')}</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-zinc-500">Penjualan Tunai:</span>
                            <span className="font-bold font-mono text-emerald-600">+ Rp {cashSales.toLocaleString('id-ID')}</span>
                          </div>
                          <div className="border-t border-zinc-200 pt-2 flex justify-between font-bold text-zinc-850">
                            <span>Total Kas Sistem:</span>
                            <span className="font-mono">Rp {systemCash.toLocaleString('id-ID')}</span>
                          </div>
                        </div>
                      )}

                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Jumlah Fisik Laci Kasir (Rp)</label>

                          value={auditPhysicalCash}

                          required
                          min="0"
                          className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm font-mono font-bold"
                          placeholder="0"
                        />
                      </div>

                      {targetShift && auditPhysicalCash !== '' && (
                        <div className={`p-3 rounded-xl text-xs font-bold flex justify-between ${
                          discrepancy === 0 ? 'bg-emerald-50 text-emerald-700' :
                          discrepancy > 0 ? 'bg-blue-50 text-blue-700' : 'bg-rose-50 text-rose-700'

      const playKitchenBeep = () => {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note
          gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
          oscillator.start();
          oscillator.stop(audioCtx.currentTime + 0.15);
        } catch(e) {
          console.warn("Web Audio API not supported or blocked by browser gesture", e);
        }
      };

      const renderDapurWorkspace = () => {
        const [dapurFilter, setDapurFilter] = useState('active'); // 'active', 'done', 'all'

        const kitchenOrders = useMemo(() => {
          return (db.transactions || [])
            .filter(t => !t.deleted && t.kitchenStatus && t.kitchenStatus !== 'none')
            .map(t => {
              const kitchenItems = (t.items || []).filter(item => 
                ['Makanan', 'Minuman'].includes(item.category)
              );
              return { ...t, kitchenItems };
            })
            .filter(t => t.kitchenItems.length > 0);
        }, [db.transactions, app.dbVersion]);

        const lastCountRef = useRef(kitchenOrders.length);
        useEffect(() => {
          if (kitchenOrders.length > lastCountRef.current) {
            playKitchenBeep();
          }
          lastCountRef.current = kitchenOrders.length;
        }, [kitchenOrders]);

        const filteredOrders = kitchenOrders.filter(t => {
          if (dapurFilter === 'active') return t.kitchenStatus === 'cooking';
          if (dapurFilter === 'done') return t.kitchenStatus === 'done';
          return true; // 'all'
        });

        const activeCount = kitchenOrders.filter(t => t.kitchenStatus === 'cooking').length;
        const doneCount = kitchenOrders.filter(t => t.kitchenStatus === 'done').length;

        const updateStatus = (txId, status) => {
          const currentDb = getDB();
          const idx = currentDb.transactions.findIndex(t => t.id === txId);
          if (idx !== -1) {
            currentDb.transactions[idx].kitchenStatus = status;
            currentDb.transactions[idx].updatedAt = new Date().toISOString();
            
            const userAct = app.user ? (app.user.name || app.user.email) : 'Dapur';
            currentDb.activityLogs = currentDb.activityLogs || [];
            currentDb.activityLogs.unshift({
              id: 'ACT' + Date.now(),
              user: userAct,
              role: 'dapur',
              type: 'data_mutasi',
              details: `Mengubah status pesanan dapur ${txId} ke ${status}`,
              timestamp: new Date().toISOString()
            });

            saveDB(currentDb);
            app.refreshDB();
            app.addToast(`Pesanan ${txId} diperbarui: ${status === 'done' ? 'SIAP SAJI' : 'DISAJIKAN'}`, 'success');
          }
        };

        return (
          <div className="space-y-6 text-left">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Antrean Sedang Memasak</p>
                  <p className="text-xl font-bold text-amber-600 mt-1">{activeCount} Pesanan</p>
                </div>
                <span className="p-2.5 bg-amber-50 text-amber-600 rounded-xl"><Icon name="chef-hat" size={18} /></span>
              </div>
              
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Siap Disajikan</p>
                  <p className="text-xl font-bold text-emerald-600 mt-1">{doneCount} Pesanan</p>
                </div>
                <span className="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl"><Icon name="bell" size={18} /></span>
              </div>

              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-450 uppercase tracking-wider">Estimasi Waktu Tunggu</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">~10 menit</p>
                </div>
                <span className="p-2.5 bg-zinc-50 text-zinc-650 rounded-xl"><Icon name="clock" size={18} /></span>
              </div>
            </div>

            <div className="flex border-b border-zinc-200 gap-4 mb-4">
              <button 
                onClick={() => setDapurFilter('active')} 
                className={`pb-2.5 font-bold text-sm transition ${dapurFilter === 'active' ? 'border-b-2 border-amber-500 text-amber-600' : 'text-zinc-400'}`}
              >
                Sedang Memasak ({activeCount})
              </button>
              <button 
                onClick={() => setDapurFilter('done')} 
                className={`pb-2.5 font-bold text-sm transition ${dapurFilter === 'done' ? 'border-b-2 border-emerald-500 text-emerald-600' : 'text-zinc-400'}`}
              >
                Siap Disajikan ({doneCount})
              </button>
              <button 
                onClick={() => setDapurFilter('all')} 
                className={`pb-2.5 font-bold text-sm transition ${dapurFilter === 'all' ? 'border-b-2 border-sky-500 text-sky-600' : 'text-zinc-400'}`}
              >
                Semua Riwayat ({kitchenOrders.length})
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {filteredOrders.map((ord) => {
                const ageMinutes = Math.floor((Date.now() - new Date(ord.date).getTime()) / 60000);
                const isOverdue = ageMinutes >= 15;
                return (
                  <div 
                    key={ord.id} 
                    className={`bg-white border rounded-2xl p-4 flex flex-col justify-between space-y-4 shadow-sm hover:shadow-md transition duration-150 ${
                      ord.kitchenStatus === 'cooking' && isOverdue ? 'border-rose-300 bg-rose-50/10' : 'border-zinc-200'
                    }`}
                  >
                    <div className="space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="font-mono text-xs font-bold text-zinc-800">{ord.id}</span>
                          <span className="block text-[9px] text-zinc-400 mt-0.5">Kasir: {ord.cashier}</span>
                        </div>
                        
                        <div className="flex flex-col items-end gap-1">
                          <span className={`px-2 py-0.5 rounded font-bold text-[9px] uppercase tracking-wide border ${
                            ord.kitchenStatus === 'cooking' ? 'bg-amber-50 text-amber-700 border-amber-100' :
                            ord.kitchenStatus === 'done' ? 'bg-emerald-50 text-emerald-700 border-emerald-100' :
                            'bg-zinc-100 text-zinc-500 border-zinc-200'
                          }`}>
                            {ord.kitchenStatus === 'cooking' ? 'Memasak' :
                             ord.kitchenStatus === 'done' ? 'Siap Saji' : 'Selesai'}
                          </span>
                          
                          <span className={`text-[9px] font-bold flex items-center gap-0.5 ${
                            ord.kitchenStatus === 'cooking' && isOverdue ? 'text-rose-650' : 'text-zinc-400'
                          }`}>
                            <Icon name="clock" size={9} />
                            {ageMinutes} menit lalu
                          </span>
                        </div>
                      </div>

                      <div className="border-t border-zinc-100 pt-2 space-y-1.5">
                        {ord.kitchenItems.map((item, idx) => (
                          <div key={idx} className="flex justify-between items-center text-xs font-semibold text-zinc-700">
                            <span>{item.name}</span>
                            <span className="font-mono font-bold bg-zinc-100 px-2 py-0.5 rounded text-zinc-750">
                              x{item.qty}
                            </span>
                          </div>
                        ))}
                      </div>

                      {ord.notes && (
                        <div className="bg-amber-50/50 border border-amber-100/50 p-2 rounded-xl text-[10px] text-amber-800 font-mono">
                          <strong>Keterangan:</strong> {ord.notes}
                        </div>
                      )}
                    </div>

                    <div className="pt-3 border-t border-zinc-100">
                      {ord.kitchenStatus === 'cooking' && (
                        <button 
                          onClick={() => updateStatus(ord.id, 'done')}
                          className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow"
                        >
                          <Icon name="check" size={12} />
                          Selesai Masak
                        </button>
                      )}
                      
                      {ord.kitchenStatus === 'done' && (
                        <button 
                          onClick={() => updateStatus(ord.id, 'served')}
                          className="w-full py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow"
                        >
                          <Icon name="send" size={12} />
                          Sajikan Pesanan
                        </button>
                      )}

                      {ord.kitchenStatus === 'served' && (
                        <button 
                          disabled
                          className="w-full py-2 bg-zinc-100 text-zinc-400 rounded-xl text-xs font-bold flex items-center justify-center gap-1"
                        >
                          <Icon name="check-circle" size={12} />
                          Sudah Disajikan
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}

              {filteredOrders.length === 0 && (
                <div className="col-span-full py-16 text-center text-zinc-400 border border-dashed border-zinc-200 rounded-3xl">
                  <Icon name="chef-hat" size={36} className="mx-auto mb-2.5 text-zinc-300" />
                  <p className="font-bold text-sm">Tidak ada pesanan antrean dapur</p>
                  <p className="text-xs mt-1 text-zinc-450">Pesanan makanan & minuman otomatis tampil di sini.</p>
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderStaffWorkspace = () => {
        const myTasks = tasksList.filter(t => t.assignedTo === app.user?.email && t.title);
        const mySchedules = schedulesList.filter(s => s.employeeId === app.user?.id || s.employeeName === app.user?.name);

        return (
          <div className="space-y-6 text-left">
            <div className="flex border-b border-zinc-200 gap-4 mb-4 overflow-x-auto whitespace-nowrap scrollbar-none">
              <button onClick={() => setActiveTab('tasks')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'tasks' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Tugas Pekerjaan Saya ({myTasks.filter(t => t.status !== 'Selesai').length})</button>
              <button onClick={() => setActiveTab('schedules')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'schedules' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Jadwal Shift Kerja</button>
              <button onClick={() => setActiveTab('handover')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'handover' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Buku Serah Terima</button>
              <button onClick={() => setActiveTab('sop')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'sop' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Panduan SOP Pegawai</button>
            </div>

            {activeTab === 'tasks' && (
              <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                <h4 className="font-bold text-zinc-800 text-sm mb-4">Daftar Tugas Harian Ditugaskan</h4>
                <div className="space-y-3">
                  {myTasks.map(task => (
                    <div key={task.id} className="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-zinc-50 hover:bg-zinc-100/50 rounded-2xl border border-zinc-200 transition gap-4">
                      <div className="space-y-1 text-left">
                        <div className="flex items-center gap-2">
                          <span className={`px-2 py-0.5 rounded font-bold text-[9px] ${
                            task.priority === 'Tinggi' ? 'bg-rose-50 text-rose-700' :
                            task.priority === 'Sedang' ? 'bg-amber-50 text-amber-700' : 'bg-zinc-150 text-zinc-650'
                          }`}>{task.priority}</span>
                          <span className="text-[10px] text-zinc-400 font-mono">Batas: {task.dueDate}</span>
                        </div>
                        <h4 className={`font-bold text-sm ${task.status === 'Selesai' ? 'line-through text-zinc-400' : 'text-zinc-800'}`}>{task.title}</h4>
                        <p className={`text-xs ${task.status === 'Selesai' ? 'text-zinc-350' : 'text-zinc-500'}`}>{task.description}</p>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${task.status === 'Selesai' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                          {task.status}
                        </span>
                        <button 
                          onClick={() => handleToggleStaffTask(task.id)}
                          className={`px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm ${
                            task.status === 'Selesai' 
                              ? 'bg-zinc-200 hover:bg-zinc-300 text-zinc-700' 
                              : 'bg-sky-600 hover:bg-sky-700 text-white shadow-sky-600/10'
                          }`}
                        >
                          {task.status === 'Selesai' ? 'Batalkan Selesai' : 'Tandai Selesai'}
                        </button>
                      </div>
                    </div>
                  ))}
                  {myTasks.length === 0 && (
                    <div className="text-center py-12 text-zinc-400 text-xs font-medium">
                      <Icon name="check-circle" size={40} className="mx-auto mb-2 text-zinc-300" />
                      Tidak ada tugas kerja untuk hari ini. Luar biasa!
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'schedules' && (
              <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                <h4 className="font-bold text-zinc-800 text-sm mb-4">Jadwal Shift Kerja Anda</h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                        <th className="p-3 text-left">Hari</th>
                        <th className="p-3 text-center">Shift Kerja</th>
                        <th className="p-3 text-left">Catatan Tugas / Standby</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-100">
                      {mySchedules.map(s => (
                        <tr key={s.id} className="hover:bg-zinc-50/50">
                          <td className="p-3 font-bold text-sky-750 text-sm">{s.day}</td>
                          <td className="p-3 text-center">
                            <span className={`px-3 py-1 rounded-full font-bold text-[10px] ${
                              s.shift === 'Pagi' ? 'bg-sky-50 text-sky-700' :
                              s.shift === 'Sore' ? 'bg-amber-50 text-amber-700' :
                              s.shift === 'Malam' ? 'bg-indigo-50 text-indigo-700' : 'bg-zinc-100 text-zinc-550'
                            }`}>{s.shift}</span>
                          </td>
                          <td className="p-3 text-zinc-650 italic">{s.notes || '-'}</td>
                        </tr>
                      ))}
                      {mySchedules.length === 0 && (
                        <tr><td colSpan="3" className="text-center p-8 text-zinc-400">Belum ada penjadwalan shift tercatat untuk Anda minggu ini.</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'handover' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm text-left">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Catat Serah Terima Shift</h4>
                  <form onSubmit={handleAddHandover} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Catatan / Pesan untuk Shift Berikutnya</label>
                      <textarea
                        value={handoverNotes}
                        onChange={e => setHandoverNotes(e.target.value)}
                        required
                        rows={4}
                        className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-xs"
                        placeholder="Tulis pesan serah terima (cth: uang laci pas Rp 350.000, stok teh pucuk habis di kulkas pendingin, titipan kunci gembok...)"
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition"
                    >
                      Simpan Catatan
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm text-left">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Buku Log Serah Terima Shift (Handover)</h4>
                  <div className="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                    {(db.handovers || []).slice().reverse().map(item => (
                      <div key={item.id} className="p-4 bg-zinc-50 hover:bg-zinc-100/50 rounded-2xl border border-zinc-150 text-left space-y-2 transition">
                        <div className="flex justify-between items-center text-[10px] text-zinc-400">
                          <span className="font-bold text-sky-700">Oleh: {item.senderName}</span>
                          <span className="font-mono">{new Date(item.date).toLocaleString('id-ID')}</span>
                        </div>
                        <p className="text-xs font-medium text-zinc-700 leading-relaxed font-mono whitespace-pre-line">{item.notes}</p>
                      </div>
                    ))}
                    {(db.handovers || []).length === 0 && (
                      <p className="text-center py-12 text-zinc-400 text-xs">Belum ada catatan serah terima shift.</p>
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'sop' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm space-y-3">
                  <div className="w-10 h-10 bg-sky-50 text-sky-600 rounded-xl flex items-center justify-center font-bold">01</div>
                  <h4 className="font-bold text-zinc-800 text-sm">SOP Pelayanan Pelanggan</h4>
                  <ul className="text-xs text-zinc-500 space-y-2 list-disc list-inside">
                    <li>Sapa pelanggan dengan senyum ramah ("Selamat datang di Smile POS").</li>
                    <li>Konfirmasi pembelian, tawarkan opsi member kartu Smile, input data barang dengan teliti.</li>
                    <li>Sebutkan total nominal belanja sebelum memproses alat bayar tunai/non-tunai.</li>
                  </ul>
                </div>
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm space-y-3">
                  <div className="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center font-bold">02</div>
                  <h4 className="font-bold text-zinc-800 text-sm">SOP Kebersihan & Display</h4>
                  <ul className="text-xs text-zinc-500 space-y-2 list-disc list-inside">
                    <li>Area etalase & laci kasir wajib dibersihkan di awal & akhir shift tugas.</li>
                    <li>Cek tanggal kedaluwarsa barang pajang ritel secara berkala.</li>
                    <li>Rapikan susunan display produk sesuai kategori barang masing-masing.</li>
                  </ul>
                </div>
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm space-y-3">
                  <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center font-bold">03</div>
                  <h4 className="font-bold text-zinc-800 text-sm">SOP Penutupan Kasir</h4>
                  <ul className="text-xs text-zinc-500 space-y-2 list-disc list-inside">
                    <li>Lakukan hitung uang fisik laci kasir dengan hati-hati.</li>
                    <li>Pastikan semua transaksi non-tunai (QRIS/Debit) terverifikasi sukses.</li>
                    <li>Ajukan Tutup Shift di sistem POS kasir dan catat nominal laci kasir.</li>
                  </ul>
                </div>
              </div>
            )}
          </div>
        );
      };

      const renderOperasional = () => {
        const totalSupplies = (db.supplies || []).length;
        const totalSchedules = (db.schedules || []).length;
        const totalTasks = (db.officeTasks || []).length;
        const completedTasks = (db.officeTasks || []).filter(t => t.status === 'Selesai').length;
        const taskPercent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

        return (
          <div className="space-y-6 text-left">
            {/* OPERASIONAL MINI METRICS */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-2 animate-[fadeIn_0.2s_ease-out]">
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Perlengkapan Terdaftar</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">{totalSupplies} Barang</p>
                </div>
                <div className="p-2 bg-sky-50 text-sky-600 rounded-xl"><Icon name="box" size={18} /></div>
              </div>
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Jadwal Shift</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">{totalSchedules} Shift</p>
                </div>
                <div className="p-2 bg-emerald-50 text-emerald-600 rounded-xl"><Icon name="calendar" size={18} /></div>
              </div>
              <div className="bg-white border border-zinc-200 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Penyelesaian Checklist</p>
                  <p className="text-xl font-bold text-zinc-800 mt-1">{taskPercent}% Selesai ({completedTasks}/{totalTasks})</p>
                </div>
                <div className="p-2 bg-amber-50 text-amber-600 rounded-xl"><Icon name="check-square" size={18} /></div>
              </div>
            </div>

            {/* TABS MENU */}
            <div className="flex border-b border-zinc-200 gap-4 mb-4 overflow-x-auto whitespace-nowrap scrollbar-none">
              <button onClick={() => setActiveTab('supplies')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'supplies' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Logistik & Perlengkapan</button>
              <button onClick={() => setActiveTab('scheduler')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'scheduler' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Shift & Jadwal Staf</button>
              <button onClick={() => setActiveTab('checklist')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'checklist' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Checklist Harian</button>
              <button onClick={() => setActiveTab('procure_auto')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'procure_auto' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Restok Otomatis</button>
              <button onClick={() => setActiveTab('maintenance')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'maintenance' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Pemeliharaan Alat</button>
              <button onClick={() => setActiveTab('incidents')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'incidents' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Laporan Insiden</button>
              <button onClick={() => setActiveTab('sanitation')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'sanitation' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Pembersihan & Sanitasi</button>
            </div>

            {/* TAB: SUPPLIES */}
            {activeTab === 'supplies' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Tambah Perlengkapan Kantor</h4>
                  <form onSubmit={handleAddSupply} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nama Barang</label>
                      <input type="text" value={supplyName} onChange={e => setSupplyName(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="Kertas thermal, sabun cuci..." />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Stok Awal</label>
                        <input type="number" value={supplyStock} onChange={e => setSupplyStock(e.target.value)} required min="0" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="0" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Satuan</label>
                        <input type="text" value={supplyUnit} onChange={e => setSupplyUnit(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="Roll, Pcs, Box..." />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Simpan Barang</button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Daftar Inventaris Operasional</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">Nama Barang</th>
                          <th className="p-3 text-center">Stok</th>
                          <th className="p-3 text-center">Status</th>
                          <th className="p-3 text-center">Update Stok</th>
                          <th className="p-3 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {(db.officeSupplies || []).map(item => (
                          <tr key={item.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 font-bold text-zinc-700">{item.name}</td>
                            <td className="p-3 text-center font-mono">{item.stock} {item.unit}</td>
                            <td className="p-3 text-center">
                              <span className={`px-2 py-0.5 rounded font-bold ${
