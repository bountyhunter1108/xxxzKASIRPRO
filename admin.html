    }


    function UserForm({ user, onSave, onCancel }) {
      const app = useContext(AppContext);
      const [name, setName] = useState(user?.name || '');
      const [email, setEmail] = useState(user?.email || '');
      const [password, setPassword] = useState('');
      const standardRoles = [
        'admin', 'cashier', 'dapur', 'owner', 'manager', 'supervisor', 'staff', 'keuangan',
        'admin_operasional', 'admin_keuangan', 'admin_hr', 'admin_marketing', 'admin_gudang'
      ];
      const [role, setRole] = useState(() => {
        if (!user?.role) return 'cashier';
        return standardRoles.includes(user.role) ? user.role : 'custom';
      });
      const [customRole, setCustomRole] = useState(() => {
        if (!user?.role) return '';
        return standardRoles.includes(user.role) ? '' : user.role;
      });
      
      const handleSubmit = (e) => {
        e.preventDefault();
        const selectedRole = role === 'custom' ? customRole.trim().toLowerCase() : role;
        if (!selectedRole) {
          app.setCustomAlert({ title: 'Input Tidak Valid', message: 'Role wajib diisi', type: 'warning' });
          return;
        }
        const isEditingSelfOwner = user && user.role === 'owner';
        const cleanRole = selectedRole.toLowerCase().replace(/[^a-z_]/g, '');
        const isTargetingOwner = cleanRole === 'owner' || cleanRole === 'pemilik' || cleanRole.includes('owner') || cleanRole.includes('pemilik');
        
        if (isTargetingOwner && app.user?.role !== 'owner') {
          logAuditAction('⚠️ PELANGGARAN KEAMANAN', `Percobaan pembuatan/perubahan akun (${email}) dengan role Owner oleh ${app.user?.name || 'Tidak Dikenal'} (${app.user?.role}). Aksi berhasil dicegah.`, app.user);
          
          const db = getDB();
          db.ownerNotifications = db.ownerNotifications || [];
          db.ownerNotifications.unshift({
            id: 'ON' + Date.now() + Math.random().toString().slice(-3),
            type: 'security_alert',
            title: '⚠️ PELANGGARAN KEAMANAN TERDETEKSI',
            message: `User '${app.user?.name || 'Tidak Dikenal'}' (${app.user?.email || ''}) mencoba mendaftarkan/mengubah akun menjadi role Owner (Email Target: '${email}'). Tindakan tersebut berhasil digagalkan secara otomatis.`,
            timestamp: new Date().toISOString(),
            unread: true
          });
          saveDB(db);
          app.refreshDB();

          app.setCustomAlert({ title: 'Akses Ditangguhkan!', message: 'Sistem memblokir mutlak penambahan akun dengan role Pemilik/Owner baru (hanya boleh ada 1 akun Owner utama di sistem). Percobaan pelanggaran keamanan ini telah dicatat secara permanen dan dilaporkan kepada Owner.', type: 'danger' });
          return;
        }
        onSave({ name, email, password, role: selectedRole });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 backdrop-blur-sm p-4 animate-[fadeIn_0.2s_ease-out]">
          <div className="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden animate-[scaleIn_0.2s_ease-out]">
            <div className="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
              <h3 className="text-lg font-bold text-zinc-800">{user ? 'Edit Pengguna' : 'Tambah Pengguna'}</h3>
              <button onClick={onCancel} type="button" className="p-2 bg-zinc-100 rounded-full text-zinc-500 hover:bg-zinc-200 transition"><Icon name="x" size={16} /></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 text-left">
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Nama Pengguna</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Email</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Password</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" placeholder={user ? 'Kosongkan jika tidak diubah' : ''} />
                </div>
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Role</label>
                  <select value={role} onChange={e => setRole(e.target.value)} className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800">
                    {role === 'owner' && <option value="owner">Pemilik (Owner)</option>}
                    <option value="admin">Admin (Utama)</option>
                    <option value="admin_operasional">Admin Operasional</option>
                    <option value="admin_keuangan">Admin Keuangan (Finance)</option>
                    <option value="admin_hr">Admin Personalia (HR)</option>
                    <option value="admin_marketing">Admin Sales & Marketing</option>
                    <option value="admin_gudang">Admin Gudang (Logistik)</option>
                    <option value="cashier">Kasir</option>
                    <option value="dapur">Dapur</option>
                    <option value="keuangan">Keuangan</option>
                    <option value="manager">Manajer</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="staff">Staf</option>
                    <option value="custom">Lainnya (Kustom)</option>
                  </select>
                </div>
                {role === 'custom' && (
                  <div className="animate-[fadeIn_0.2s_ease-out]">
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Nama Role Kustom</label>
                    <input type="text" value={customRole} onChange={e => setCustomRole(e.target.value)} placeholder="Contoh: owner, manager, dll" className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" required />
                  </div>
                )}
              </div>
              <div className="flex gap-3 pt-4">
                <button type="button" onClick={onCancel} className="flex-1 py-3 bg-zinc-100 text-zinc-700 rounded-xl font-semibold hover:bg-zinc-200 transition">Batal</button>
                <button type="submit" className="flex-1 py-3 bg-sky-600 text-white rounded-xl font-semibold hover:bg-sky-700 transition shadow-lg">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      );
    }


    function SyncModal({ appState }) {
      const [inputCode, setInputCode] = useState('');
      const [loading, setLoading] = useState(false);

      if (!appState.showSyncModal) return null;

      const handleEnable = async (e) => {
        e.preventDefault();
        setLoading(true);
        await appState.enableSync(inputCode);
        setLoading(false);
        setInputCode('');
        appState.setShowSyncModal(false);
      };

      const handleCopy = () => {
        navigator.clipboard.writeText(appState.syncCode);
        appState.addToast('Kode sinkronisasi disalin!', 'success');
      };

      return (
        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-zinc-900/40 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-[slideUp_0.3s_ease-out] border border-zinc-200">
            <div className="px-6 py-5 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
              <h3 className="text-xl font-bold text-zinc-800">Sinkronisasi Cloud</h3>
              <button onClick={() => appState.setShowSyncModal(false)} className="p-2 bg-white border border-zinc-200 rounded-full text-zinc-400 hover:text-zinc-650">
                <Icon name="x" size={20} />
              </button>
            </div>
            
            <div className="p-6 space-y-6">
              {appState.syncEnabled ? (
                <div className="space-y-5 text-center flex flex-col items-center animate-[scaleIn_0.2s_ease-out]">
                  <div className="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center border border-emerald-500/20">
                    <Icon name="cloud-lightning" size={32} className="text-emerald-600" />
                  </div>
                  <div>
                    <h4 className="font-bold text-zinc-800 text-lg">Sinkronisasi Cloud Aktif</h4>
                    <p className="text-sm text-zinc-500 mt-1">Data Anda tersinkronisasi antar perangkat.</p>
                  </div>
                  
                  <div className="w-full p-4 bg-zinc-50 border border-zinc-200 rounded-2xl flex items-center justify-between gap-3">
                    <div className="text-left">
                      <p className="text-[10px] text-zinc-400 font-bold uppercase tracking-wider">Kode Sinkronisasi</p>
                      <p className="font-mono font-bold text-zinc-700 text-sm select-all mt-0.5">{appState.syncCode}</p>
                    </div>
                    <button onClick={handleCopy} className="p-2.5 bg-white border border-zinc-200 hover:bg-zinc-50 text-zinc-500 hover:text-zinc-800 rounded-xl transition flex items-center gap-1.5 text-xs font-semibold shadow-sm">
                      <Icon name="copy" size={14} /> Salin
                    </button>
                  </div>

                  {/* QR Code generator for sharing sync code */}
                  <div className="bg-white p-3 border border-zinc-200 rounded-2xl inline-block mx-auto shadow-sm">
                    <DynamicQRCode text={"sync://" + appState.syncCode} width={140} />
                    <p className="text-[10px] text-zinc-400 mt-2 font-bold uppercase tracking-wider text-center flex items-center gap-1 justify-center"><Icon name="qr-code" size={12}/> Scan QR Perangkat Ini</p>
                  </div>

                  <div className="text-xs text-zinc-405 bg-zinc-50 p-3 rounded-xl border border-zinc-150 flex items-center gap-2">
                    <Icon name="info" size={16} className="text-sky-500 flex-shrink-0" />
                    <p className="text-left leading-normal">Pindai kode QR atau salin kode sinkronisasi di atas ke perangkat lain untuk terhubung dan berbagi data produk secara instan.</p>
                  </div>

                  <div className="w-full flex gap-3 pt-2">
                    <button 
                      onClick={() => appState.triggerSync()} 
                      className="flex-1 py-3 bg-zinc-900 hover:bg-zinc-850 text-white rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-md"
                    >
                      <Icon name="refresh-cw" size={16} className={appState.syncStatus === 'syncing' ? 'animate-spin' : ''} />
                      Sinkronkan
                    </button>
                    <button 
                      onClick={appState.disableSync} 
                      className="py-3 px-4 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl font-bold text-sm transition"
                    >
                      Matikan
                    </button>
                  </div>
                </div>
              ) : (
                <form onSubmit={handleEnable} className="space-y-5 text-left animate-[scaleIn_0.2s_ease-out]">
                  <div className="text-center">
                    <div className="w-16 h-16 bg-zinc-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                      <Icon name="cloud-off" size={32} className="text-zinc-400" />
                    </div>
                    <h4 className="font-bold text-zinc-800 text-lg">Hubungkan ke Cloud</h4>
                    <p className="text-sm text-zinc-500 mt-1">Menggabungkan data produk dan transaksi dengan perangkat kasir lainnya.</p>
                  </div>

                  <div className="space-y-3">
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider">Kode Sinkronisasi Perangkat (Opsional)</label>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={inputCode} 
                        onChange={e => setInputCode(e.target.value)}
                        placeholder="Masukkan kode atau kosongkan..."
                        className="flex-1 px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl font-mono text-sm outline-none focus:bg-white focus:border-sky-500 transition-colors text-zinc-800"
                      />
                      <button 
                        type="button"
                        onClick={() => {
                          const rand = 'smile_' + Math.random().toString(36).substring(2, 8).toUpperCase();
                          setInputCode(rand);
                          appState.addToast('Kode acak berhasil dibuat!', 'success');
                        }}
                        className="px-4 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 rounded-xl font-bold text-xs border border-zinc-200 transition"
                      >
                        Acak
                      </button>
                    </div>
                  </div>

                  <div className="space-y-2.5">
                    <button 
                      type="submit" 
                      className="w-full py-3.5 bg-zinc-900 hover:bg-zinc-850 text-white rounded-xl font-bold text-sm shadow-md transition flex items-center justify-center gap-2"
                    >
                      <Icon name="cloud" size={16} />
                      Hubungkan Cloud
                    </button>
                    
                    <button 
                      type="button"
                      onClick={() => {
                        appState.setShowSyncModal(false);
                        const scannerBtn = document.querySelector('[title*="Scanner"]');
                        if (scannerBtn) {
                          scannerBtn.click();
                        } else {
                          appState.addToast('Masuk ke halaman POS Kasir untuk memindai QR', 'info');
                        }
                      }}
                      className="w-full py-2.5 bg-sky-50 border border-sky-200 hover:bg-sky-100 text-sky-600 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <Icon name="scan" size={14} /> Pindai QR Perangkat Lain
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==================== COMPONENT: ADMIN WORKSPACE ====================

    function AdminWorkspace() {
      const app = useContext(AppContext);
      const db = getDB();
      const roleId = app.user?.roleId || app.user?.role || '';
      
      const [activeTab, setActiveTab] = useState('');
      const [selectedDivision, setSelectedDivision] = useState('operasional');

      // Memoized lists for sub-workspaces
      const staffList = useMemo(() => (db.users || []).filter(u => u.role !== 'owner' && u.roleId !== 'owner' && u.role !== 'admin' && u.roleId !== 'admin'), [db.users]);
      const schedulesList = useMemo(() => db.schedules || [], [db.schedules, app.dbVersion]);
      const tasksList = useMemo(() => db.officeTasks || [], [db.officeTasks, app.dbVersion]);
      const invoicesList = useMemo(() => db.invoices || [], [db.invoices, app.dbVersion]);
      const expensesList = useMemo(() => db.expenses || [], [db.expenses, app.dbVersion]);
      const verificationsList = useMemo(() => db.paymentVerifications || [], [db.paymentVerifications, app.dbVersion]);
      const attendanceList = useMemo(() => db.attendance || [], [db.attendance, app.dbVersion]);
      const leaveList = useMemo(() => db.leaveRequests || [], [db.leaveRequests, app.dbVersion]);
      const payrollList = useMemo(() => db.payrollSlips || [], [db.payrollSlips, app.dbVersion]);
      const recruitsList = useMemo(() => (db.crmLeads || []).filter(item => item.category === 'recruitment'), [db.crmLeads, app.dbVersion]);

        setReceiptSupplier('');
        setReceiptNotes('');
        setReceiptCustomName('');
        setReceiptCustomCost('');
        setReceiptCustomPrice('');
        setReceiptProductMode('select');
        app.addToast('Barang masuk diterima & stok produk bertambah', 'success');
      };

      const handleDeleteGoodsReceipt = (id) => {
        if (!confirm('Apakah Anda yakin ingin menghapus catatan penerimaan barang ini? Stok produk akan dikurangi kembali.')) return;
        const currentDb = getDB();
        const idx = currentDb.goodsReceipts.findIndex(r => r.id === id);
        if (idx !== -1) {
          const r = currentDb.goodsReceipts[idx];
          
          const prod = currentDb.products.find(p => p.id === r.productId || p.name.toLowerCase() === r.productName.toLowerCase());
          if (prod) {
            prod.stock = Math.max(0, parseFloat((prod.stock - r.qty).toFixed(3)));
            prod.updatedAt = new Date().toISOString();
          }

          currentDb.goodsReceipts.splice(idx, 1);
          logAuditAction('Hapus Penerimaan Barang', `Menghapus penerimaan barang "${r.productName}" (${r.id})`, app.user);
          saveDB(currentDb);
          app.refreshDB();
          app.addToast('Penerimaan barang berhasil dihapus', 'success');
        }
      };

      const handleSaveEditGoodsReceipt = (e) => {
        e.preventDefault();
        const currentDb = getDB();
        const idx = currentDb.goodsReceipts.findIndex(r => r.id === editingGoodsReceipt.id);
        if (idx !== -1) {
          const oldR = currentDb.goodsReceipts[idx];
          
          let pId = editingGoodsReceipt.productId;
          let pName = editingGoodsReceipt.productName;
          let pSku = editingGoodsReceipt.sku;

          if (editingGoodsReceipt.productMode === 'custom') {
            pId = 'p' + Date.now();
            pName = editingGoodsReceipt.customName;
            pSku = 'SKU' + Date.now().toString().slice(-6);
            const newCost = parseFloat(editingGoodsReceipt.customCost) || 0;
            const newPrice = parseFloat(editingGoodsReceipt.customPrice) || newCost * 1.5;

            const newProd = {
              id: pId,
              sku: pSku,
              name: pName,
              category: editingGoodsReceipt.customCategory,
              price: newPrice,
              cost: newCost,
              stock: parseFloat(editingGoodsReceipt.qty) || 0,
              active: true,
              minStock: 5,
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
              createdBy: app.user?.name,
              createdById: app.user?.id
            };
            currentDb.products.push(newProd);
          }

          const oldQty = oldR.qty;
          const newQty = parseFloat(editingGoodsReceipt.qty) || 0;

          const oldProd = currentDb.products.find(p => p.id === oldR.productId || p.name.toLowerCase() === oldR.productName.toLowerCase());
          if (oldProd) {
            oldProd.stock = Math.max(0, parseFloat((oldProd.stock - oldQty).toFixed(3)));
            oldProd.updatedAt = new Date().toISOString();
          }

          const newProd = currentDb.products.find(p => p.id === pId || p.name.toLowerCase() === pName.toLowerCase());
          if (newProd) {
            newProd.stock = parseFloat((newProd.stock + newQty).toFixed(3));
            newProd.updatedAt = new Date().toISOString();
          }

          oldR.productId = pId;
          oldR.productName = pName;
          oldR.sku = pSku;
          oldR.qty = newQty;
          oldR.supplier = editingGoodsReceipt.supplier;
          oldR.notes = editingGoodsReceipt.notes;
          oldR.updatedAt = new Date().toISOString();

          logAuditAction('Edit Penerimaan Barang', `Mengedit penerimaan barang "${pName}" (${editingGoodsReceipt.id})`, app.user);
          saveDB(currentDb);
          app.refreshDB();
          setEditingGoodsReceipt(null);
          app.addToast('Penerimaan barang berhasil diperbarui', 'success');
        }
      };

      // --- Manager Target Handlers ---
      const handleSaveSalesTarget = (e) => {
        e.preventDefault();
        const target = parseFloat(targetAmount) || 0;
        if (target <= 0) {
          alert('Target penjualan harus lebih dari 0');
          return;
        }
        const currentDb = getDB();
        currentDb.salesTargets = {
          target: target,
          month: new Date().toISOString().slice(0, 7)
        };
        saveDB(currentDb);
        app.refreshDB();
        setTargetAmount('');
        app.addToast('Target penjualan bulanan diperbarui', 'success');
      };

      // --- Supervisor Incident Handlers ---
      const handleAddIncident = (e) => {
        e.preventDefault();
        if (!incChronology) {
          alert('Tulis kronologi insiden');
          return;
        }
        const currentDb = getDB();
        currentDb.shopIncidents = currentDb.shopIncidents || [];
        const newIncident = {
          id: 'INC' + Date.now(),
          chronology: incChronology,
          severity: incSeverity,
          status: 'Menunggu',
          reporterName: app.user?.name,
          date: new Date().toISOString().slice(0, 10),
          createdAt: new Date().toISOString()
        };
        currentDb.shopIncidents.push(newIncident);
        logAuditAction('Lapor Insiden', `Supervisor melaporkan insiden: "${incChronology.slice(0, 50)}..." [${incSeverity}]`, app.user);
        saveDB(currentDb);
        app.refreshDB();
        setIncChronology('');
        setIncSeverity('Sedang');
        app.addToast('Laporan insiden berhasil dikirim', 'success');
      };

      const handleResolveIncident = (id) => {
        const currentDb = getDB();
        currentDb.shopIncidents = currentDb.shopIncidents || [];
        const inc = currentDb.shopIncidents.find(x => x.id === id);
        if (inc) {
          inc.status = 'Selesai';
          inc.resolvedAt = new Date().toISOString();
          inc.resolvedBy = app.user?.name;
          logAuditAction('Selesaikan Insiden', `Insiden resolved: ID ${id}`, app.user);
          saveDB(currentDb);
          app.refreshDB();
          app.addToast('Insiden ditandai selesai', 'success');
        }
      };

      // --- Staff Handover Handlers ---
      const handleAddHandover = (e) => {
        e.preventDefault();
        if (!handoverNotes) {
          alert('Tulis catatan serah terima');
          return;
        }
        const currentDb = getDB();
        currentDb.handovers = currentDb.handovers || [];
        const newHandover = {
          id: 'HND' + Date.now(),
          notes: handoverNotes,
          senderName: app.user?.name,
          date: new Date().toISOString(),
          createdAt: new Date().toISOString()
        };
        currentDb.handovers.push(newHandover);
        saveDB(currentDb);
        app.refreshDB();
        setHandoverNotes('');
        app.addToast('Catatan serah terima shift disimpan', 'success');
      };

      // --- Admin Operasional Maintenance Handlers ---
      const handleAddMaintenance = (e) => {
        e.preventDefault();
        const currentDb = getDB();
        currentDb.maintenanceLogs = currentDb.maintenanceLogs || [];
        currentDb.maintenanceLogs.push({
          id: 'MNT' + Date.now(),
          device: maintDevice,
          date: maintDate || new Date().toISOString().slice(0, 10),
          technician: maintTechnician,
          status: maintStatus,
          createdAt: new Date().toISOString()
        });
        saveDB(currentDb);
        app.refreshDB();
        setMaintDevice('');
        setMaintTechnician('');
        app.addToast('Jadwal pemeliharaan alat ditambahkan', 'success');
      };

      const handleToggleMaintenance = (id) => {
        const currentDb = getDB();
        const found = (currentDb.maintenanceLogs || []).find(m => m.id === id);
        if (found) {
          found.status = found.status === 'Selesai' ? 'Terjadwal' : 'Selesai';
          saveDB(currentDb);
          app.refreshDB();
          app.addToast('Status pemeliharaan diperbarui', 'success');
        }
      };

      const handleDeleteMaintenance = (id) => {
        if (!confirm('Hapus log pemeliharaan ini?')) return;
        const currentDb = getDB();
        currentDb.maintenanceLogs = (currentDb.maintenanceLogs || []).filter(m => m.id !== id);
        saveDB(currentDb);
        app.refreshDB();
        app.addToast('Log pemeliharaan dihapus', 'info');
      };

      // --- HR Shift Swap Handlers ---
      const handleProcessShiftSwap = (e) => {
        e.preventDefault();
        if (!swapFromEmployee || !swapToEmployee || !swapDate) {
          alert('Semua data wajib diisi!');
          return;
        }
        if (swapFromEmployee === swapToEmployee) {
          alert('Karyawan asal dan tujuan penukaran tidak boleh sama!');
          return;
        }
        const currentDb = getDB();
        currentDb.schedules = currentDb.schedules || [];
        currentDb.shiftSwaps = currentDb.shiftSwaps || [];

        // Find schedules on swapDate for both employees
        const schedFromIdx = currentDb.schedules.findIndex(s => s.employeeId === swapFromEmployee && s.day === swapDate);
        const schedToIdx = currentDb.schedules.findIndex(s => s.employeeId === swapToEmployee && s.day === swapDate);

        if (schedFromIdx === -1 && schedToIdx === -1) {
          alert(`Tidak ada jadwal kerja untuk kedua staf ini pada hari ${swapDate}!`);
          return;
        }

        // Swap their shifts
        let shiftFrom = schedFromIdx !== -1 ? currentDb.schedules[schedFromIdx].shift : 'Libur';
        let shiftTo = schedToIdx !== -1 ? currentDb.schedules[schedToIdx].shift : 'Libur';

        if (schedFromIdx !== -1) {
          currentDb.schedules[schedFromIdx].shift = shiftTo;
          currentDb.schedules[schedFromIdx].notes = `Ditukar dengan ${currentDb.schedules[schedFromIdx].employeeName}. Alasan: ${swapReason}`;
        } else {
          // Create new schedule for 'from' employee with swapped shift
          const emp = currentDb.users.find(u => u.id === swapFromEmployee);
          currentDb.schedules.push({
            id: 'SCH' + Date.now() + 'F',
            employeeId: swapFromEmployee,
            employeeName: emp ? emp.name : 'Staf',
            employeeRole: emp ? emp.roleLabel || emp.role : 'Kasir',
            day: swapDate,
            shift: shiftTo,
            notes: `Pertukaran shift. Alasan: ${swapReason}`
          });
        }

        if (schedToIdx !== -1) {
          currentDb.schedules[schedToIdx].shift = shiftFrom;
          currentDb.schedules[schedToIdx].notes = `Ditukar dengan ${currentDb.schedules[schedToIdx].employeeName}. Alasan: ${swapReason}`;
        } else {
          // Create new schedule for 'to' employee with swapped shift
          const emp = currentDb.users.find(u => u.id === swapToEmployee);
          currentDb.schedules.push({
            id: 'SCH' + Date.now() + 'T',
            employeeId: swapToEmployee,
            employeeName: emp ? emp.name : 'Staf',
            employeeRole: emp ? emp.roleLabel || emp.role : 'Kasir',
            day: swapDate,
            shift: shiftFrom,
            notes: `Pertukaran shift. Alasan: ${swapReason}`
          });
        }

        // Record swap log
        const empFrom = currentDb.users.find(u => u.id === swapFromEmployee);
        const empTo = currentDb.users.find(u => u.id === swapToEmployee);
        currentDb.shiftSwaps.push({
          id: 'SWP' + Date.now(),
          fromId: swapFromEmployee,
          fromName: empFrom ? empFrom.name : 'Staf 1',
          toId: swapToEmployee,
          toName: empTo ? empTo.name : 'Staf 2',
          date: swapDate,
          reason: swapReason,
          shiftFrom,
          shiftTo,
          createdAt: new Date().toISOString()
        });

        saveDB(currentDb);
        app.refreshDB();
        setSwapFromEmployee('');
        setSwapToEmployee('');
        setSwapReason('');
        app.addToast('Pertukaran shift berhasil dieksekusi', 'success');
      };

      // --- Gudang Supplier Handlers ---
      const handleAddSupplier = (e) => {
        e.preventDefault();
        if (!supName) return;
        const currentDb = getDB();
        currentDb.suppliers = currentDb.suppliers || [];
        currentDb.suppliers.push({
          id: 'SPL' + Date.now(),
          name: supName,
          phone: supPhone,
          category: supCategory,
          rating: parseInt(supRating) || 5,
          createdAt: new Date().toISOString()
        });
        saveDB(currentDb);
        app.refreshDB();
        setSupName('');
        setSupPhone('');
        setSupCategory('');
        app.addToast('Supplier / Pemasok baru berhasil ditambahkan', 'success');
      };

      const handleDeleteSupplier = (id) => {
        if (!confirm('Hapus supplier ini?')) return;
        const currentDb = getDB();
        currentDb.suppliers = (currentDb.suppliers || []).filter(s => s.id !== id);
        saveDB(currentDb);
        app.refreshDB();
        app.addToast('Supplier berhasil dihapus', 'info');
      };

      // --- Supervisor Cash Drawer Audit Handlers ---
      const handleAddCashAudit = (e) => {
        e.preventDefault();
        const sys = parseFloat(auditSystemCash) || 0;
        const phys = parseFloat(auditPhysicalCash) || 0;
        const selisih = phys - sys;

        const currentDb = getDB();
        currentDb.cashAudits = currentDb.cashAudits || [];
        currentDb.cashAudits.push({
          id: 'AUD' + Date.now(),
          cashier: auditCashier,
          systemCash: sys,
          physicalCash: phys,
          discrepancy: selisih,
          notes: auditNotes,
          auditedBy: app.user?.name,
          date: new Date().toISOString().slice(0, 10),
          createdAt: new Date().toISOString()
        });
        saveDB(currentDb);
        app.refreshDB();
        setAuditCashier('');
        setAuditSystemCash('');
        setAuditPhysicalCash('');
        setAuditNotes('');
        app.addToast('Hasil audit laci kasir disimpan', 'success');
      };

      const handleDeleteCashAudit = (id) => {
        if (!confirm('Hapus log audit kasir ini?')) return;
        const currentDb = getDB();
        currentDb.cashAudits = (currentDb.cashAudits || []).filter(x => x.id !== id);
        saveDB(currentDb);
        app.refreshDB();
        app.addToast('Log audit laci kasir dihapus', 'info');
      };

      // ==================== RENDERING SUB-WORKSPACES
      const renderPettyCashView = () => {
        const pettyList = db.pettyCash || [];
        const totalPettyIn = pettyList.filter(x => x.type === 'in').reduce((acc, x) => acc + x.amount, 0);
        const totalPettyOut = pettyList.filter(x => x.type === 'out').reduce((acc, x) => acc + x.amount, 0);
        const pettyBalance = 2000000 + totalPettyIn - totalPettyOut;

        return (
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm text-left">
              <h4 className="font-bold text-zinc-800 text-sm mb-4">Catat Arus Kas Kecil</h4>
              <form onSubmit={handleAddPettyCash} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Jenis Transaksi</label>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setPettyType('out')}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold transition border ${
                        pettyType === 'out'
                          ? 'bg-rose-50 border-rose-200 text-rose-700 font-bold'
                          : 'bg-zinc-50 border-zinc-200 text-zinc-500'
                      }`}
                    >
                      Kas Keluar
                    </button>
                    <button
                      type="button"
                      onClick={() => setPettyType('in')}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold transition border ${
                        pettyType === 'in'
                          ? 'bg-emerald-50 border-emerald-200 text-emerald-700 font-bold'
                          : 'bg-zinc-50 border-zinc-200 text-zinc-500'
                      }`}
                    >
                      Kas Masuk
                    </button>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nominal (Rp)</label>
                  <input
                    type="number"
                    value={pettyAmount}
                    onChange={e => setPettyAmount(e.target.value)}
                    required
                    min="1"
                    className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm"
                    placeholder="0"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Keterangan / Alasan</label>
                  <textarea
                    value={pettyDesc}
                    onChange={e => setPettyDesc(e.target.value)}
                    required
                    rows={3}
                    className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-xs"
                    placeholder="Misal: beli sapu baru, parkir ojol, dll..."
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition"
                >
                  Simpan Catatan
                </button>
              </form>
            </div>

            <div className="lg:col-span-2 space-y-6 text-left">
              <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm flex justify-between items-center">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Saldo Kas Kecil Toko</p>
                  <h3 className="text-xl font-bold text-zinc-900 mt-1">Rp {pettyBalance.toLocaleString('id-ID')}</h3>
                </div>
                <div className="text-right text-[10px] text-zinc-450 space-y-0.5">
                  <p>Modal Awal Baseline: <span className="font-bold font-mono">Rp 2.000.000</span></p>
                  <p className="text-emerald-600 font-semibold font-mono">Total Masuk: +Rp {totalPettyIn.toLocaleString('id-ID')}</p>
                  <p className="text-rose-600 font-semibold font-mono">Total Keluar: -Rp {totalPettyOut.toLocaleString('id-ID')}</p>
                </div>
              </div>

              <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                <h4 className="font-bold text-zinc-800 text-sm mb-4">Mutasi Kas Kecil</h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                        <th className="p-3 text-left">Tanggal</th>
                        <th className="p-3 text-left">Tipe</th>
                        <th className="p-3 text-left">Keterangan</th>
                        <th className="p-3 text-right">Jumlah</th>
                        <th className="p-3 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-100">
                      {pettyList.map(item => (
                        <tr key={item.id} className="hover:bg-zinc-50/50">
                          <td className="p-3 text-zinc-550">{new Date(item.date).toLocaleDateString('id-ID')}</td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                              item.type === 'in' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'
                            }`}>
                              {item.type === 'in' ? 'Kas Masuk' : 'Kas Keluar'}
                            </span>
                          </td>

                          <td className={`p-3 text-right font-bold font-mono ${
                            item.type === 'in' ? 'text-emerald-600' : 'text-rose-600'

                            {item.type === 'in' ? '+' : '-'} Rp {item.amount.toLocaleString('id-ID')}

                            <button

                <div>

                  <input
                    type="number"
                    value={taxAmount}
                    onChange={e => setTaxAmount(e.target.value)}
                    required
                    min="1"
                    className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm"
                    placeholder="0"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Kode NTPN Setoran</label>
                  <input
                    type="text"
                    value={taxNtpn}
                    onChange={e => setTaxNtpn(e.target.value)}
                    required
                    className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm font-mono"
                    placeholder="16 digit NTPN..."
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition"
                >
                  Simpan Bukti Setor
                </button>
              </form>
            </div>

            <div className="lg:col-span-2 space-y-6">
              <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Penjualan POS</p>
                  <h3 className="text-md font-bold text-zinc-800 mt-1 font-mono">Rp {totalTxSales.toLocaleString('id-ID')}</h3>
                </div>
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Kewajiban PPN (10%)</p>
                  <h3 className="text-md font-bold text-amber-600 mt-1 font-mono">Rp {calculatedPpn.toLocaleString('id-ID')}</h3>

                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Sudah Setor (NTPN)</p>
                  <h3 className="text-md font-bold text-emerald-600 mt-1 font-mono">Rp {totalTaxPaid.toLocaleString('id-ID')}</h3>
                </div>

                <h4 className="font-bold text-zinc-800 text-sm mb-4">Riwayat Setoran Pajak (NTPN)</h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                        <th className="p-3 text-left">Masa Pajak</th>
                        <th className="p-3 text-left">Kode NTPN</th>
                        <th className="p-3 text-left">Tanggal Setor</th>
                        <th className="p-3 text-right">Nominal</th>
                        <th className="p-3 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-100">
                      {taxList.map(item => (
                        <tr key={item.id} className="hover:bg-zinc-50/50">
                          <td className="p-3 font-bold text-zinc-700">{item.period}</td>
                          <td className="p-3 font-mono text-sky-750 font-semibold">{item.ntpn}</td>
                          <td className="p-3 text-zinc-500">{new Date(item.date).toLocaleDateString('id-ID')}</td>
                          <td className="p-3 text-right font-bold text-zinc-800 font-mono">Rp {item.amount.toLocaleString('id-ID')}</td>
                          <td className="p-3 text-right">
                            <button
                              onClick={() => handleDeleteTaxRecord(item.id)}
                              className="p-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100"
                            >
                              <Icon name="trash-2" size={12} />
                            </button>
                          </td>
                        </tr>
                      ))}
                      {taxList.length === 0 && (
                        <tr>
                          <td colSpan="5" className="text-center p-8 text-zinc-400">
                            Belum ada setoran pajak PPN diinput.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderKeuanganWorkspace = () => {
        const totalRevenue = (db.transactions || []).reduce((acc, t) => acc + (t.total || 0), 0);
        const totalExpenses = (db.expenses || []).reduce((acc, e) => acc + (e.amount || 0), 0);
        const unpaidInvoicesAmount = (db.invoices || []).filter(i => i.status === 'unpaid' || i.status === 'Belum Lunas').reduce((acc, i) => acc + (i.amount || 0), 0);
        const netProfit = totalRevenue - totalExpenses;

        const cashFlow = [];
        (db.transactions || []).forEach(t => {
          cashFlow.push({
            id: t.id,
            date: t.date,
            type: 'Masuk (Penjualan)',
            amount: t.total,
            desc: `Transaksi POS - Kasir: ${t.cashier}`,
            isIncoming: true
          });
        });
        (db.expenses || []).forEach(e => {
          cashFlow.push({
            id: e.id,
            date: e.date || e.createdAt?.slice(0, 10) || new Date().toISOString().slice(0, 10),
            type: `Keluar (${e.category})`,
            amount: e.amount,
            desc: e.desc || e.description || '-',
            isIncoming: false
          });
        });
        const cashFlowSorted = cashFlow.sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10);

        return (
          <div className="space-y-6 text-left">
            <div className="flex border-b border-zinc-200 gap-4 mb-4 overflow-x-auto whitespace-nowrap scrollbar-none">
              <button onClick={() => setActiveTab('overview')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'overview' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Ringkasan Keuangan</button>
              <button onClick={() => setActiveTab('invoices')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'invoices' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Invoice Pemasok</button>
              <button onClick={() => setActiveTab('expenses')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'expenses' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Pengeluaran Harian</button>
              <button onClick={() => setActiveTab('petty_cash')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'petty_cash' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Kas Kecil (Petty Cash)</button>
              <button onClick={() => setActiveTab('tax_ppn')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'tax_ppn' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Pajak PPN & Setoran</button>
              <button onClick={() => setActiveTab('pl_report')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'pl_report' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Laporan Laba Rugi</button>
              <button onClick={() => setActiveTab('bank_deposit')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'bank_deposit' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Setoran Bank</button>
            </div>

            {activeTab === 'overview' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm">
                    <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Pendapatan POS</p>
                    <h3 className="text-lg font-bold text-emerald-600 mt-1 font-mono">Rp {totalRevenue.toLocaleString('id-ID')}</h3>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm">
                    <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Pengeluaran</p>
                    <h3 className="text-lg font-bold text-rose-600 mt-1 font-mono">Rp {totalExpenses.toLocaleString('id-ID')}</h3>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm">
                    <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Piutang / Belum Lunas</p>
                    <h3 className="text-lg font-bold text-amber-600 mt-1 font-mono">Rp {unpaidInvoicesAmount.toLocaleString('id-ID')}</h3>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm">
                    <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Laba / (Rugi) Bersih</p>
                    <h3 className={`text-lg font-bold mt-1 font-mono ${netProfit >= 0 ? 'text-sky-600' : 'text-rose-600'}`}>
                      Rp {netProfit.toLocaleString('id-ID')}
                    </h3>
                  </div>
                </div>

                <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Arus Kas & Transaksi Terakhir</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">Tanggal</th>
                          <th className="p-3 text-left">Tipe Aliran</th>
                          <th className="p-3 text-left">Keterangan</th>
                          <th className="p-3 text-right">Nominal</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {cashFlowSorted.map((item, idx) => (
                          <tr key={idx} className="hover:bg-zinc-50/50">
                            <td className="p-3 text-zinc-550">{new Date(item.date).toLocaleDateString('id-ID')}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${item.isIncoming ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}`}>
                                {item.type}
                              </span>
                            </td>
                            <td className="p-3 text-zinc-650 italic">{item.desc}</td>
                            <td className={`p-3 text-right font-bold font-mono ${item.isIncoming ? 'text-emerald-600' : 'text-rose-600'}`}>
                              {item.isIncoming ? '+' : '-'} Rp {item.amount.toLocaleString('id-ID')}
                            </td>
                          </tr>
                        ))}
                        {cashFlowSorted.length === 0 && (
                          <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Belum ada aktivitas kas keluar/masuk.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'invoices' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Catat Invoice Pengadaan</h4>
                  <form onSubmit={handleAddFinInvoice} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nomor Invoice</label>
                      <input type="text" value={finInvNo} onChange={e => setFinInvNo(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="INV-FIN-001..." />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Pemasok / Supplier</label>
                      <input type="text" value={finInvSupplier} onChange={e => setFinInvSupplier(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="Distributor Utama..." />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Tagihan (Rp)</label>
                        <input type="number" value={finInvAmount} onChange={e => setFinInvAmount(e.target.value)} required min="1" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="0" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Jatuh Tempo</label>
                        <input type="date" value={finInvDueDate} onChange={e => setFinInvDueDate(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Simpan Invoice</button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Daftar Tagihan Invoice</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">No Invoice</th>
                          <th className="p-3 text-left">Supplier</th>
                          <th className="p-3 text-right">Nominal</th>
                          <th className="p-3 text-center">Jatuh Tempo</th>
                          <th className="p-3 text-center">Status</th>
                          <th className="p-3 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {invoicesList.map(item => (
                          <tr key={item.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 font-mono font-bold text-sky-750">{item.invoiceNo || item.invNo}</td>
                            <td className="p-3 font-bold text-zinc-700">{item.supplier}</td>
                            <td className="p-3 text-right font-bold text-zinc-800 font-mono">Rp {item.amount?.toLocaleString('id-ID')}</td>
                            <td className="p-3 text-center text-zinc-500">{item.dueDate}</td>
                            <td className="p-3 text-center">
                              <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                                (item.status === 'Lunas' || item.status === 'paid') ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'
                              }`}>{item.status === 'paid' ? 'Lunas' : (item.status === 'unpaid' ? 'Belum Lunas' : item.status)}</span>
                            </td>
                            <td className="p-3 text-right space-x-1">
                              <button onClick={() => handleToggleFinInvoice(item.id)} className="px-2 py-1 bg-zinc-100 text-zinc-700 font-bold rounded hover:bg-zinc-200 text-[10px]">Ubah Status</button>
                              <button onClick={() => handleDeleteInvoice(item.id)} className="p-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100"><Icon name="trash-2" size={12} /></button>
                            </td>
                          </tr>
                        ))}
                        {invoicesList.length === 0 && (
                          <tr><td colSpan="6" className="text-center p-8 text-zinc-400">Belum ada invoice pengadaan.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'expenses' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Catat Pengeluaran Toko</h4>
                  <form onSubmit={handleAddFinExpense} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Kategori</label>
                      <select value={finExpCategory} onChange={e => setFinExpCategory(e.target.value)} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm focus:bg-white">
                        <option value="Bahan Baku">Bahan Baku</option>
                        <option value="Sewa Tempat">Sewa Tempat</option>
                        <option value="Listrik, Air & Internet">Listrik, Air & Internet</option>
                        <option value="Perlengkapan Kantor">Perlengkapan Kantor</option>
                        <option value="Gaji Karyawan">Gaji Karyawan</option>
                        <option value="Lain-Lain">Lain-Lain</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Jumlah Biaya (Rp)</label>
                      <input type="number" value={finExpAmount} onChange={e => setFinExpAmount(e.target.value)} required min="1" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="0" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Keterangan</label>
                      <textarea value={finExpDesc} onChange={e => setFinExpDesc(e.target.value)} required rows={3} className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-xs" placeholder="Misal: Pembelian gas, nota galon air..."></textarea>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-zinc-900 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Simpan Pengeluaran</button>
                  </form>
                </div>

                <div className="lg:col-span-2 bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Catatan Riwayat Pengeluaran</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3 text-left">Tanggal</th>
                          <th className="p-3 text-left">Kategori</th>
                          <th className="p-3 text-left">Keterangan</th>
                          <th className="p-3 text-right">Nominal</th>
                          <th className="p-3 text-right">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {expensesList.map(item => (
                          <tr key={item.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 text-zinc-550">{item.date}</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded font-bold bg-amber-50 text-amber-700 text-[10px]">{item.category}</span></td>
                            <td className="p-3 text-zinc-650 italic">{item.desc || item.description}</td>
                            <td className="p-3 text-right font-bold text-zinc-800 font-mono">Rp {item.amount?.toLocaleString('id-ID')}</td>
                            <td className="p-3 text-right">
                              <button onClick={() => handleDeleteExpense(item.id)} className="p-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100"><Icon name="trash-2" size={12} /></button>
                            </td>
                          </tr>
                        ))}
                        {expensesList.length === 0 && (
                          <tr><td colSpan="5" className="text-center p-8 text-zinc-400">Belum ada pengeluaran dicatat.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'petty_cash' && renderPettyCashView()}
            {activeTab === 'tax_ppn' && renderTaxPpnView()}

            {activeTab === 'pl_report' && (() => {
              const monthStr = plMonth;
              const monthTx = (db.transactions || []).filter(tx => {
                return tx.createdAt && tx.createdAt.startsWith(monthStr) && tx.paymentStatus === 'paid';
              });
              const totalRevenue = monthTx.reduce((acc, tx) => acc + (tx.total || 0), 0);
              const totalCostOfSales = monthTx.reduce((acc, tx) => {
                const itemsCost = (tx.items || []).reduce((sum, item) => {
                  const prodCost = item.cost || 0;
                  return sum + (prodCost * item.qty);
                }, 0);
                return acc + itemsCost;
              }, 0);
              const grossProfit = totalRevenue - totalCostOfSales;

              const monthExpenses = (db.expenses || []).filter(e => {
                return (e.date && e.date.startsWith(monthStr)) || (e.createdAt && e.createdAt.startsWith(monthStr));
              });
              const totalExpensesValue = monthExpenses.reduce((acc, e) => acc + (parseFloat(e.amount) || 0), 0);

              const monthInvoices = (db.invoices || []).filter(inv => {
                return (inv.date && inv.date.startsWith(monthStr)) || (inv.createdAt && inv.createdAt.startsWith(monthStr));
              });
              const totalInvoicesPaid = monthInvoices.filter(i => i.status === 'Lunas' || i.status === 'paid').reduce((acc, i) => acc + (parseFloat(i.amount) || 0), 0);

              const totalOpExpenses = totalExpensesValue + totalInvoicesPaid;
              const netProfit = grossProfit - totalOpExpenses;

              return (
                <div className="space-y-6 text-left animate-[fadeIn_0.2s_ease-out]">
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <h4 className="font-bold text-zinc-800 text-sm">Filter Bulan Laporan Laba Rugi</h4>
                      <p className="text-xs text-zinc-400 mt-0.5">Pilih bulan pembukuan untuk menghitung laba rugi bersih secara real-time.</p>
                    </div>
                    <input
                      type="month"
                      value={plMonth}
                      onChange={e => setPlMonth(e.target.value)}
                      className="px-4 py-2 bg-zinc-50 border border-zinc-200 rounded-xl text-sm outline-none font-bold text-zinc-700"
                    />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div className="bg-white border border-zinc-200 p-5 rounded-2xl shadow-sm">
                      <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Total Pendapatan (Revenue)</p>
                      <p className="text-xl font-extrabold text-zinc-850 mt-1 font-mono">Rp {totalRevenue.toLocaleString('id-ID')}</p>
                      <p className="text-[10px] text-zinc-400 mt-1">{monthTx.length} Transaksi POS Berhasil</p>
                    </div>
                    <div className="bg-white border border-zinc-200 p-5 rounded-2xl shadow-sm">
                      <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Harga Pokok Penjualan (HPP)</p>
                      <p className="text-xl font-extrabold text-zinc-850 mt-1 font-mono">Rp {totalCostOfSales.toLocaleString('id-ID')}</p>
                      <p className="text-[10px] text-zinc-400 mt-1">Estimasi Modal Stok Terjual</p>
                    </div>
                    <div className="bg-white border border-zinc-200 p-5 rounded-2xl shadow-sm">
                      <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Laba Kotor (Gross Profit)</p>
                      <p className="text-xl font-extrabold text-emerald-650 mt-1 font-mono">Rp {grossProfit.toLocaleString('id-ID')}</p>
                      <p className="text-[10px] text-zinc-400 mt-1">Profit margin: {totalRevenue > 0 ? Math.round((grossProfit / totalRevenue) * 100) : 0}%</p>
                    </div>
                    <div className="bg-white border border-zinc-200 p-5 rounded-2xl shadow-sm">
                      <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Laba Bersih (Net Profit)</p>
                      <p className={`text-xl font-extrabold mt-1 font-mono ${netProfit >= 0 ? 'text-emerald-750' : 'text-rose-600'}`}>
                        Rp {netProfit.toLocaleString('id-ID')}
                      </p>
                      <p className="text-[10px] text-zinc-400 mt-1">Setelah dikurangi biaya & tagihan paid</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                      <div className="flex justify-between items-center mb-4">
                        <h5 className="font-bold text-zinc-800 text-xs uppercase tracking-wider">Rincian Pengeluaran Kas (Rp {totalExpensesValue.toLocaleString('id-ID')})</h5>
                        <Icon name="trending-down" className="text-rose-500" size={16} />
                      </div>
                      <div className="overflow-y-auto max-h-60 custom-scroll text-xs">
                        <table className="w-full">
                          <thead>
                            <tr className="bg-zinc-50 text-zinc-500 font-bold border-b border-zinc-200">
                              <th className="p-2 text-left">Tanggal</th>
                              <th className="p-2 text-left">Kategori</th>
                              <th className="p-2 text-left">Keterangan</th>
                              <th className="p-2 text-right">Nominal</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-zinc-100">
                            {monthExpenses.map(e => (
                              <tr key={e.id} className="hover:bg-zinc-50/50">
                                <td className="p-2 text-zinc-500">{e.date || e.createdAt?.slice(0, 10)}</td>
                                <td className="p-2 font-bold text-zinc-700">{e.category}</td>
                                <td className="p-2 text-zinc-650">{e.desc || e.description}</td>
                                <td className="p-2 text-right font-mono font-bold text-rose-600">Rp {e.amount.toLocaleString('id-ID')}</td>
                              </tr>
                            ))}
                            {monthExpenses.length === 0 && (
                              <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Tidak ada pengeluaran kas dicatat pada bulan ini.</td></tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">
                      <div className="flex justify-between items-center mb-4">
                        <h5 className="font-bold text-zinc-800 text-xs uppercase tracking-wider">Tagihan Pemasok Lunas (Rp {totalInvoicesPaid.toLocaleString('id-ID')})</h5>
                        <Icon name="file-text" className="text-sky-500" size={16} />
                      </div>
                      <div className="overflow-y-auto max-h-60 custom-scroll text-xs">
                        <table className="w-full">
                          <thead>
                            <tr className="bg-zinc-50 text-zinc-500 font-bold border-b border-zinc-200">
                              <th className="p-2 text-left">Tanggal</th>
                              <th className="p-2 text-left">Supplier</th>
                              <th className="p-2 text-left">No Invoice</th>
                              <th className="p-2 text-right">Nominal</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-zinc-100">
                            {monthInvoices.filter(inv => inv.status === 'Lunas' || inv.status === 'paid').map(i => (
                              <tr key={i.id} className="hover:bg-zinc-50/50">
                                <td className="p-2 text-zinc-500">{i.dueDate || i.createdAt?.slice(0,10)}</td>

                              <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Tidak ada tagihan supplier yang dibayarkan lunas pada bulan ini.</td></tr>

                        </table>
                      </div>
                    </div>
                  </div>
                </div>

            })()}

            {activeTab === 'bank_deposit' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-[fadeIn_0.2s_ease-out]">
                <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm text-left">

                  <form onSubmit={handleAddDeposit} className="space-y-4">

                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Pilih Bank Tujuan</label>

                        <option value="BCA">Bank BCA</option>
                        <option value="Mandiri">Bank Mandiri</option>
                        <option value="BRI">Bank BRI</option>
                        <option value="BNI">Bank BNI</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nominal Setoran (Rp)</label>
                      <input type="number" value={depAmount} onChange={e => setDepAmount(e.target.value)} required min="1" className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm font-mono font-bold" placeholder="0" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Tanggal Setoran</label>
                      <input type="date" value={depDate} onChange={e => setDepDate(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" />
                    </div>

                      <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Nama Penyetor (Staf)</label>
                      <input type="text" value={depStaff} onChange={e => setDepStaff(e.target.value)} required className="w-full px-3 py-2 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white text-sm" placeholder="Nama staf pembawa uang..." />

                    <button type="submit" className="w-full py-2.5 bg-zinc-950 text-white rounded-xl font-bold text-xs hover:bg-zinc-800 transition">Simpan Setoran</button>

                  <h4 className="font-bold text-zinc-800 text-sm mb-4">Daftar Riwayat Setoran Kas ke Bank</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-left">
                      <thead>
                        <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                          <th className="p-3">Tanggal</th>
                          <th className="p-3">Bank</th>
                          <th className="p-3 text-right">Nominal</th>
                          <th className="p-3">Nama Penyetor</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100 font-medium">
                        {(db.bankDeposits || []).map(d => (
                          <tr key={d.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 text-zinc-500">{d.date}</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded font-black bg-blue-50 text-blue-700 text-[10px]">{d.bank}</span></td>
                            <td className="p-3 text-right font-mono font-bold text-zinc-800">Rp {d.amount?.toLocaleString('id-ID')}</td>
                            <td className="p-3 font-semibold text-zinc-650">{d.staff}</td>
                          </tr>

                          <tr><td colSpan="4" className="text-center p-8 text-zinc-400">Belum ada riwayat setoran kas ke bank.</td></tr>

      const renderManagerWorkspace = () => {
        const todayStr = new Date().toISOString().slice(0, 10);
        const todaySales = (db.transactions || []).filter(t => t.date?.slice(0, 10) === todayStr).reduce((acc, t) => acc + (t.total || 0), 0);
        const pendingBypasses = (db.bypassRequests || []).filter(r => r.status === 'pending');
        const lowStockItems = db.products.filter(p => p.active !== false && (p.stock || 0) <= (p.minStock || 5));
        const lowStockCount = lowStockItems.length;

        const auditLogs = db.auditLogs || [];

        return (
          <div className="space-y-6 text-left">
            <div className="flex border-b border-zinc-200 gap-4 mb-4 overflow-x-auto whitespace-nowrap scrollbar-none">
              <button onClick={() => setActiveTab('overview')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'overview' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Ringkasan Operasional</button>
              <button onClick={() => setActiveTab('target_sales')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'target_sales' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Target Penjualan</button>
              <button onClick={() => setActiveTab('bypass')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'bypass' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Otorisasi Izin Kasir ({pendingBypasses.length})</button>
              <button onClick={() => setActiveTab('audit')} className={`pb-2.5 font-bold text-sm transition ${activeTab === 'audit' ? 'border-b-2 border-sky-600 text-sky-600' : 'text-zinc-400'}`}>Log Audit Pegawai</button>
            </div>

            {activeTab === 'overview' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm">
                    <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Penjualan Hari Ini</p>
                    <h3 className="text-lg font-bold text-emerald-600 mt-1 font-mono">Rp {todaySales.toLocaleString('id-ID')}</h3>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm">
                    <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Izin Bypass Tertunda</p>
                    <h3 className="text-lg font-bold text-amber-600 mt-1">{pendingBypasses.length} Permintaan</h3>
                  </div>
                  <div className="bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm">
                    <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Pemberitahuan Stok Rendah</p>
                    <h3 className="text-lg font-bold text-rose-600 mt-1">{lowStockCount} Produk</h3>
                  </div>
                </div>

                          <th className="p-3 text-left">Nama Produk</th>
                          <th className="p-3 text-center">Stok Saat Ini</th>
                          <th className="p-3 text-center">Batas Minimum</th>
                          <th className="p-3 text-right">Status</th>

                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {lowStockItems.map(p => (
                          <tr key={p.id} className="hover:bg-zinc-50/50">
                            <td className="p-3 font-mono text-zinc-500">{p.sku}</td>
                            <td className="p-3 font-bold text-zinc-700">{p.name}</td>
                            <td className="p-3 text-center font-mono font-bold text-rose-600">{p.stock} pcs</td>
                            <td className="p-3 text-center font-mono text-zinc-400">{p.minStock || 5} pcs</td>
                            <td className="p-3 text-right">
                              <span className="px-2 py-0.5 rounded font-bold text-[10px] bg-rose-50 text-rose-700">Urgen</span>
                            </td>
                          </tr>
                        ))}
                        {lowStockItems.length === 0 && (
                          <tr><td colSpan="5" className="text-center p-8 text-zinc-400">Semua stok barang aman dan tercukupi.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'target_sales' && (() => {
              const currentTargetObj = db.salesTargets || { target: 50000000, month: new Date().toISOString().slice(0, 7) };

              const currentMonthTx = (db.transactions || []).filter(t => t.date && t.date.slice(0, 7) === currentMonthStr);
              const currentMonthRevenue = currentMonthTx.reduce((acc, t) => acc + (t.total || 0), 0);
              const percentage = Math.min(100, Math.round((currentMonthRevenue / currentTargetObj.target) * 100) || 0);

              return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="bg-white rounded-2xl border border-zinc-200 p-5 h-fit shadow-sm">
                    <h4 className="font-bold text-zinc-800 text-sm mb-4">Set Target Penjualan Bulanan</h4>
                    <form onSubmit={handleSaveSalesTarget} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Masa Target (Bulan Ini)</label>
                        <input
                          type="text"
                          disabled
                          value={new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })}
                          className="w-full px-3 py-2 bg-zinc-100 border border-zinc-200 rounded-xl text-sm font-bold text-zinc-650 cursor-not-allowed"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase mb-1">Target Nominal (Rp)</label>
                        <input
                          type="number"
                          value={targetAmount}
