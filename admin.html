          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div className="bg-white rounded-2xl shadow-sm border border-zinc-200 p-6 flex items-center gap-5">
              <div className="w-14 h-14 rounded-full bg-emerald-100 flex items-center justify-center">
                <span className="font-extrabold text-xl text-emerald-600">Rp</span>
              </div>
              <div className="text-left">
                <p className="text-sm text-zinc-500 font-medium mb-1">Total Pendapatan</p>
                <p className="text-3xl font-extrabold text-zinc-800">Rp {totalSales.toLocaleString('id-ID')}</p>
              </div>
            </div>
            <div className="bg-white rounded-2xl shadow-sm border border-zinc-200 p-6 flex items-center gap-5">
              <div className="w-14 h-14 rounded-full bg-sky-100 flex items-center justify-center">
                <Icon name="shopping-bag" size={28} className="text-sky-600" />
              </div>
              <div className="text-left">
                <p className="text-sm text-zinc-500 font-medium mb-1">Jumlah Transaksi</p>
                <p className="text-3xl font-extrabold text-zinc-800">{count} Nota</p>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-zinc-200 p-6 mb-6">
            <div className="flex justify-between items-center mb-4">
              <h4 className="font-bold text-zinc-800">Grafik Penjualan</h4>
              <div className="flex bg-zinc-100 p-1 rounded-xl">
                <button onClick={() => setChartType('line')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${chartType === 'line' ? 'bg-white shadow-sm text-indigo-600 border border-zinc-200/50' : 'text-zinc-500 hover:text-zinc-800'}`}>
                  <Icon name="activity" size={14} /> Area
                </button>
                <button onClick={() => setChartType('bar')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${chartType === 'bar' ? 'bg-white shadow-sm text-emerald-600 border border-zinc-200/50' : 'text-zinc-500 hover:text-zinc-800'}`}>
                  <Icon name="bar-chart" size={14} /> Batang
                </button>
              </div>
            </div>
            <div className="h-64 relative w-full">
              <canvas ref={chartRef}></canvas>
            </div>
          </div>
          
          <div className="bg-white rounded-2xl shadow-sm border border-zinc-200 overflow-hidden mb-6">
            <div className="px-6 py-5 border-b border-zinc-100 bg-zinc-50/50 flex justify-between items-center">
              <h4 className="font-bold text-zinc-800">Riwayat Transaksi Terbaru</h4>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[600px]">
                <thead>
                  <tr className="bg-white border-b border-zinc-100">
                    <th className="text-left px-6 py-4 text-xs font-bold text-zinc-500 uppercase">ID / Waktu</th>
                    <th className="text-left px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Kasir</th>
                    <th className="text-center px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Metode</th>
                    <th className="text-right px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Total</th>
                    <th className="text-right px-6 py-4 text-xs font-bold text-zinc-500 uppercase pr-8">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-50">
                  {filteredTx.map(t => (
                    <tr key={t.id} className="hover:bg-zinc-50/40 transition-colors">
                      <td className="px-6 py-4 text-left vertical-middle">
                        <div className="font-mono text-[11px] text-zinc-800 font-bold tracking-tight">{t.id}</div>
                        <div className="text-[10px] text-zinc-400 font-medium mt-0.5">
                          {new Date(t.date).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}
                        </div>
                      </td>
                      <td className="px-6 py-4 text-xs font-semibold text-zinc-700 text-left vertical-middle">{t.cashier}</td>
                      <td className="px-6 py-4 text-center text-xs font-semibold text-zinc-650 vertical-middle flex flex-col items-center justify-center">
                        <span className={`inline-flex px-2.5 py-0.5 rounded-full text-[10px] font-bold border transition ${
                          t.method === 'qris' ? 'bg-indigo-50 border-indigo-100 text-indigo-750' : 
                          t.method === 'transfer' ? 'bg-blue-50 border-blue-100 text-blue-750' :
                          t.method === 'debt' ? 'bg-amber-50 border-amber-200 text-amber-750' :
                          'bg-emerald-50 border-emerald-100 text-emerald-750'
                        }`}>
                          {t.method === 'qris' ? 'QRIS' : t.method === 'transfer' ? 'TRANSFER' : t.method === 'debt' ? 'HUTANG' : 'CASH'}
                        </span>
                        {t.method === 'debt' && t.debtNotes && (
                          <div 
                            className="text-[9px] text-amber-700 bg-amber-50/40 px-2 py-0.5 rounded-md border border-amber-100 mt-1 font-medium max-w-[150px] truncate shadow-2xs" 
                            title={t.debtNotes}
                          >
                            {t.debtNotes}
                          </div>
                        )}
                      </td>
                      <td className="px-6 py-4 text-right font-bold text-zinc-900 text-sm vertical-middle">Rp {t.total?.toLocaleString('id-ID')}</td>
                      <td className="px-6 py-4 vertical-middle">
                        {['admin', 'owner'].includes(app.user?.role) && (
                          <div className="flex justify-end gap-1">
                            <button 
                              onClick={() => handleEditClick(t)} 
                              className="p-1.5 text-zinc-500 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition" 
                              title="Edit Transaksi"
                            >
                              <Icon name="edit" size={14} />
                            </button>
                            <button 
                              onClick={() => handleDeleteClick(t)} 
                              className="p-1.5 text-zinc-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" 
                              title="Hapus Transaksi"
                            >
                              <Icon name="trash-2" size={14} />
                            </button>
                          </div>
                        )}
                      </td>
                    </tr>
                  ))}
                  {filteredTx.length === 0 && (
                    <tr><td colSpan="5" className="text-center py-8 text-zinc-400">Tidak ada transaksi di periode ini</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Riwayat Shift Kasir (Semua role bisa melihat, admin bisa kelola) */}
          <div className="bg-white rounded-2xl shadow-sm border border-zinc-200 overflow-hidden mb-6">
            <div className="px-6 py-5 border-b border-zinc-100 bg-zinc-50/50 flex justify-between items-center">
              <h4 className="font-bold text-zinc-800">Laporan Shift & Kas Mandiri</h4>
              {['admin', 'owner'].includes(app.user?.role) && (
              <button 
                onClick={() => setShowShiftModal({ mode: 'add' })}
                className="px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition active:scale-95 animate-[scaleIn_0.15s_ease-out]"
              >
                <Icon name="plus" size={14} />
                <span>Tambah Shift</span>
              </button>
              )}
            </div>
            <div className="overflow-x-auto">
              <table className="w-full min-w-[600px]">
                <thead>
                  <tr className="bg-white border-b border-zinc-100">
                    <th className="text-left px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Kasir / Waktu</th>
                    <th className="text-right px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Modal Awal</th>
                    <th className="text-right px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Diharapkan</th>
                    <th className="text-right px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Fisik Laci</th>
                    <th className="text-right px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Selisih</th>
                    <th className="text-center px-6 py-4 text-xs font-bold text-zinc-500 uppercase">Status</th>
                    <th className="text-right px-6 py-4 text-xs font-bold text-zinc-500 uppercase pr-8">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-50">
                  {(db.shifts || []).slice(0, 10).map(s => {
                    const diff = s.difference || 0;
                    return (
                      <tr key={s.id} className="hover:bg-zinc-50/50">
                        <td className="px-6 py-4 text-left">
                          <div className="font-semibold text-zinc-800">{s.cashierName}</div>
                          <div className="text-xs text-zinc-400">
                            {new Date(s.startTime).toLocaleTimeString('id-ID')} {s.endTime && ` - ${new Date(s.endTime).toLocaleTimeString('id-ID')}`}
                          </div>
                        </td>
                        <td className="px-6 py-4 text-right font-medium text-zinc-700">Rp {s.startCash.toLocaleString('id-ID')}</td>
                        <td className="px-6 py-4 text-right font-medium text-zinc-700">Rp {s.expectedCash?.toLocaleString('id-ID') || 0}</td>
                        <td className="px-6 py-4 text-right font-medium text-zinc-700">Rp {s.actualCash?.toLocaleString('id-ID') || 0}</td>
                        <td className={`px-6 py-4 text-right font-bold ${diff === 0 ? 'text-zinc-700' : diff > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {diff === 0 ? 'Pas' : diff > 0 ? `+Rp ${diff.toLocaleString('id-ID')}` : `-Rp ${Math.abs(diff).toLocaleString('id-ID')}`}
                        </td>
                        <td className="px-6 py-4 text-center">
                          <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${
                            s.status === 'open' ? 'bg-emerald-50 text-emerald-700 border-emerald-100/60' : 'bg-zinc-50 text-zinc-600 border-zinc-200/60'
                          }`}>
                            <span className={`w-1.5 h-1.5 rounded-full ${s.status === 'open' ? 'bg-emerald-500 animate-pulse' : 'bg-zinc-400'}`}></span>
                            {s.status === 'open' ? 'Buka' : 'Tutup'}
                          </span>
                        </td>
                        <td className="px-6 py-4">
                          {['admin', 'owner'].includes(app.user?.role) && (
                          <div className="flex justify-end gap-1.5 pr-2">
                            <button onClick={() => setShowShiftModal({ mode: 'edit', shift: s })} className="p-2 text-zinc-400 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition" title="Edit Shift"><Icon name="pencil" size={14} /></button>
                            <button onClick={() => handleDeleteShiftClick(s.id)} className="p-2 text-zinc-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Hapus Shift"><Icon name="trash-2" size={14} /></button>
                          </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                  {(db.shifts || []).length === 0 && (
                    <tr><td colSpan="6" className="text-center py-8 text-zinc-400">Belum ada laporan shift</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Edit Transaction Modal */}
          {editTx && (
            <TransactionEditModal tx={editTx} onClose={() => setEditTx(null)} app={app} />
          )}

          {/* Shift Form Modal */}
          {showShiftModal && (
            <ShiftFormModal 
              shift={showShiftModal.shift} 
              onSave={handleSaveShift} 
              onCancel={() => setShowShiftModal(null)} 
            />
          )}

          {/* Admin Verification Modal for Cashier Operations */}
          {showAdminAuthModal && (
            <VoidWithPINModal
              onConfirm={() => {
                setShowAdminAuthModal(false);
                if (authAction === 'edit') {
                  setEditTx(targetTx);
                } else if (authAction === 'delete') {
                  handleDeleteTransaction(targetTx.id);
                }
                setTargetTx(null);
                setAuthAction(null);
              }}
              onCancel={() => {
                setShowAdminAuthModal(false);
                setTargetTx(null);
                setAuthAction(null);
              }}
            />
          )}
          {approvalPrompt && (
            <ReasonModal
              isOpen={!!approvalPrompt}
              onClose={() => setApprovalPrompt(null)}
              title={approvalPrompt.title}
              onSubmit={(reason) => {
                const currentDb = getDB();
                const newApproval = {
                  id: 'AP' + Date.now(),
                  requesterId: app.user.id,
                  requesterName: app.user.name,
                  requesterRole: app.user.role,
                  type: approvalPrompt.type,
                  targetId: approvalPrompt.targetId,
                  reason: reason.trim(),
                  data: approvalPrompt.data || null,
                  status: 'pending',
                  createdAt: new Date().toISOString()
                };
                currentDb.adminApprovals.push(newApproval);
                saveDB(currentDb);
                app.refreshDB();
                app.addToast('Pengajuan berhasil dikirim ke Owner', 'success');
                setApprovalPrompt(null);
                setShowShiftModal(null);
              }}
            />
          )}
        </div>
      );
    }
    
    // ==================== SHIFT FORM MODAL ====================

    function formatDateTimeLocal(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      if (isNaN(date.getTime())) return '';
      const tzoffset = date.getTimezoneOffset() * 60000;
      const localISOTime = (new Date(date.getTime() - tzoffset)).toISOString().slice(0, 16);
      return localISOTime;
    }


    function ShiftFormModal({ shift, onSave, onCancel }) {
      const [startTime, setStartTime] = useState(shift ? formatDateTimeLocal(shift.startTime) : formatDateTimeLocal(new Date().toISOString()));
      const [endTime, setEndTime] = useState(shift ? formatDateTimeLocal(shift.endTime) : formatDateTimeLocal(new Date().toISOString()));
      const [startCash, setStartCash] = useState(shift ? String(shift.startCash) : '0');
      const [expectedCash, setExpectedCash] = useState(shift ? String(shift.expectedCash) : '0');
      const [actualCash, setActualCash] = useState(shift ? String(shift.actualCash) : '0');
      
      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          startTime: new Date(startTime).toISOString(),
          endTime: new Date(endTime).toISOString(),
          startCash: parseFloat(startCash) || 0,
          expectedCash: parseFloat(expectedCash) || 0,
          actualCash: parseFloat(actualCash) || 0
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 backdrop-blur-sm p-4 animate-[fadeIn_0.2s_ease-out]">
          <div className="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden animate-[scaleIn_0.2s_ease-out]">
            <div className="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50 text-left">
              <h3 className="text-lg font-bold text-zinc-800">{shift ? 'Edit Shift' : 'Tambah Shift'}</h3>
              <button onClick={onCancel} type="button" className="p-2 bg-zinc-100 rounded-full text-zinc-500 hover:bg-zinc-200 transition"><Icon name="x" size={16} /></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 text-left space-y-4">
              <div>
                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Waktu Mulai</label>
                <input type="datetime-local" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Waktu Selesai</label>
                <input type="datetime-local" value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Modal Awal (Rp)</label>
                <input type="number" value={startCash} onChange={e => setStartCash(e.target.value)} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" min="0" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Diharapkan (Rp)</label>
                <input type="number" value={expectedCash} onChange={e => setExpectedCash(e.target.value)} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" min="0" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Uang Fisik Laci (Rp)</label>
                <input type="number" value={actualCash} onChange={e => setActualCash(e.target.value)} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800" min="0" required />
              </div>
              <div className="flex gap-3 pt-2">
                <button type="button" onClick={onCancel} className="flex-1 py-3 bg-zinc-100 text-zinc-700 rounded-xl font-semibold hover:bg-zinc-200 transition">Batal</button>
                <button type="submit" className="flex-1 py-3 bg-sky-600 text-white rounded-xl font-semibold hover:bg-sky-700 transition shadow-lg">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==================== TUTUP SHIFT MODAL ====================

    function UsersPage() {
      const app = useContext(AppContext);
      const [showForm, setShowForm] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [scannerUser, setScannerUser] = useState(null);
      const [historyUser, setHistoryUser] = useState(null);
      const [search, setSearch] = useState('');

      const db = getDB();
      const users = db.users
        .filter(u => {
          const keyword = search.trim().toLowerCase();
          if (!keyword) return true;
          return `${u.name} ${u.email} ${u.role}`.toLowerCase().includes(keyword);
        })
        .sort((a, b) => {
          if ((b.active === false) !== (a.active === false)) return (a.active === false) ? 1 : -1;
          return (a.name || '').localeCompare(b.name || '');
        });

      const roleLabel = (role) => getRoleName(role, db);

      const [approvalPrompt, setApprovalPrompt] = useState(null);

      const handleSave = (formData) => {
        const error = validateUserData(formData, editingUser?.id || null);
        if (error) {
          app.addToast(error, 'error');
          return;
        }

        if (app.user?.role !== 'owner') {
          // Redirect to approval
          setApprovalPrompt({
            title: editingUser ? 'Pengajuan Edit Pengguna' : 'Pengajuan Tambah Pengguna',
            type: editingUser ? 'user_edit' : 'user_add',
            targetId: editingUser?.id || null,
            data: {
              name: formData.name.trim(),
              email: formData.email.trim().toLowerCase(),
              role: formData.role,
              password: formData.password || undefined
            }
          });
          setShowForm(false);
          setEditingUser(null);
          return;
        }

        const db = getDB();
        const now = new Date().toISOString();
        if (editingUser) {
          const idx = db.users.findIndex(u => u.id === editingUser.id);
          if (idx !== -1) {
            db.users[idx] = {
              ...db.users[idx],
              name: formData.name.trim(),
              email: formData.email.trim().toLowerCase(),
              role: formData.role,
              updatedAt: now
            };
            if (formData.password) db.users[idx].password = formData.password;
          }
          app.addToast('Pengguna diperbarui', 'success');
        } else {
          db.users.push({
            id: 'u' + Date.now(),
            name: formData.name.trim(),
            email: formData.email.trim().toLowerCase(),
            password: formData.password,
            role: formData.role,
            active: true,
            entryStatus: 'exited',
            createdAt: now,
            updatedAt: now
          });
          app.addToast('Pengguna ditambahkan', 'success');
        }

        saveDB(db);
        app.refreshDB();
        setShowForm(false);
        setEditingUser(null);
      };

      const toggleActive = (targetUser) => {
        if (targetUser.id === app.user?.id) {
          app.addToast('Akun yang sedang login tidak bisa dinonaktifkan', 'error');
          return;
        }
        if (targetUser.role === 'owner') {
          app.addToast('Anda tidak memiliki akses untuk mengubah status akun Pemilik!', 'error');
          return;
        }

        if (app.user?.role !== 'owner') {
          setApprovalPrompt({
            title: 'Pengajuan Ubah Status Pengguna',
            type: 'user_status',
            targetId: targetUser.id,
            data: {
              name: targetUser.name,
              active: !targetUser.active
            }
          });
          return;
        }

        const db = getDB();
        const idx = db.users.findIndex(u => u.id === targetUser.id);
        if (idx !== -1) {
          db.users[idx].active = db.users[idx].active === false;
          db.users[idx].entryStatus = 'exited';
          db.users[idx].updatedAt = new Date().toISOString();
          saveDB(db);
          app.refreshDB();
          app.addToast(db.users[idx].active ? 'Pengguna diaktifkan' : 'Pengguna dinonaktifkan', 'success');
        }
      };

      const deleteUser = (targetUser) => {
        if (targetUser.id === app.user?.id) {
          app.addToast('Akun yang sedang login tidak bisa dihapus', 'error');
          return;
        }
        if (targetUser.role === 'owner') {
          app.addToast('Anda tidak memiliki akses untuk menghapus akun Pemilik!', 'error');
          return;
        }

        if (app.user?.role !== 'owner') {
          setApprovalPrompt({
            title: 'Pengajuan Hapus Pengguna',
            type: 'user_delete',
            targetId: targetUser.id,
            data: {
              name: targetUser.name
            }
          });
          return;
        }

        if (!confirm(`Hapus permanen pengguna "${targetUser.name}"? Pengguna tidak bisa dikembalikan lagi.`)) return;

        const db = getDB();
        db.deletedUserIds = db.deletedUserIds || [];
        if (!db.deletedUserIds.includes(targetUser.id)) {
          db.deletedUserIds.push(targetUser.id);
        }
        db.users = db.users.filter(u => u.id !== targetUser.id);
        saveDB(db);
        app.refreshDB();
        app.addToast('Pengguna dihapus permanen', 'success');
      };

      return (
        <div className="pb-24 md:pb-8">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div>
              <h3 className="text-xl font-bold text-zinc-800">Manajemen Pengguna</h3>
              <p className="text-sm text-zinc-500">{db.users.length} akun terdaftar</p>
            </div>
            {['admin', 'owner'].includes(app.user?.role) && (
            <button
              onClick={() => { setEditingUser(null); setShowForm(true); }}
              className="w-full sm:w-auto px-5 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-md transition"
            >
              <Icon name="user-plus" size={18} /> Tambah Pengguna
            </button>
            )}
          </div>

          {app.user?.role !== 'owner' && (
            <div className="mb-5 p-4 bg-amber-50/50 border border-amber-200 rounded-2xl flex items-start gap-3 text-xs text-amber-850 font-medium leading-normal animate-[fadeIn_0.2s_ease-out]">
              <Icon name="info" size={16} className="text-amber-600 flex-shrink-0 mt-0.5" />
              <div>
                <p className="font-bold text-amber-900">Perhatian: Modifikasi Pengguna Memerlukan Persetujuan</p>
                <p className="text-amber-700/90 mt-0.5">Setiap tindakan penambahan, pengubahan data, pengaktifan/penonaktifan, atau penghapusan pengguna oleh selain Owner akan diajukan ke Owner untuk disetujui terlebih dahulu sebelum dieksekusi.</p>
              </div>
            </div>

                  requesterRole: app.user.role,

                  reason: reason.trim(),
                  data: approvalPrompt.data || null,
                  status: 'pending',
                  createdAt: new Date().toISOString()

                currentDb.adminApprovals.push(newApproval);
                saveDB(currentDb);
                app.refreshDB();
                app.addToast('Pengajuan perubahan pengguna dikirim ke Owner', 'success');
                setApprovalPrompt(null);

    // ==================== PURCHASES PAGE (PENGADAAN) ====================

    function PurchasesPage() {
      const app = useContext(AppContext);
      const db = getDB();
      const [showForm, setShowForm] = useState(false);
      const [showApproveModal, setShowApproveModal] = useState(null);
      const [showRejectModal, setShowRejectModal] = useState(null);
      const [editingPurchase, setEditingPurchase] = useState(null);
      
      const [productName, setProductName] = useState('');
      const [supplierName, setSupplierName] = useState('');
      const [qty, setQty] = useState('');
      const [cost, setCost] = useState('');
      const [type, setType] = useState('buy');
      const [notes, setNotes] = useState('');
      const [selectedProductId, setSelectedProductId] = useState('');

      const [appQty, setAppQty] = useState('');
      const [appCost, setAppCost] = useState('');
      const [appNotes, setAppNotes] = useState('');
      const [rejNotes, setRejNotes] = useState('');
      const [appActionType, setAppActionType] = useState('buy');

      const list = useMemo(() => {
        return (db.purchases || []).sort((a, b) => new Date(b.date) - new Date(a.date));
      }, [db.purchases, app.dbVersion]);

      const handleCreate = (e) => {
        e.preventDefault();
        const currentDb = getDB();
        currentDb.purchases = currentDb.purchases || [];
        
        let pName = productName;
        if (selectedProductId) {
          const match = currentDb.products.find(p => p.id === selectedProductId);
          if (match) pName = match.name;
        }

        const newProposal = {
          id: 'PRC' + Date.now(),
          proposedBy: app.user.name,
          proposedById: app.user.id,
          proposedByRole: app.user.role,
          date: new Date().toISOString(),
          productName: pName,
          productId: selectedProductId || null,
          supplierName,
          qty: parseFloat(qty),
          cost: parseFloat(cost),
          total: parseFloat(qty) * parseFloat(cost),
          type,
          status: 'pending',
          notes,
          approvedQty: parseFloat(qty),
          ownerNotes: ''
        };

        currentDb.purchases.push(newProposal);
        logAuditAction('Ajukan Pengadaan', `Mengajukan pengadaan "${pName}" (${qty} pcs) ke Pemilik.`, app.user);
        saveDB(currentDb);
        app.refreshDB();
        
        setProductName('');
        setSupplierName('');
        setQty('');
        setCost('');
        setType('buy');
        setNotes('');
        setSelectedProductId('');
        setShowForm(false);
        app.addToast('Pengajuan pengadaan berhasil dikirim', 'success');
      };

      const handleApprove = (e) => {
        e.preventDefault();
        const currentDb = getDB();
        const idx = currentDb.purchases.findIndex(p => p.id === showApproveModal.id);
        if (idx !== -1) {
          const p = currentDb.purchases[idx];
          const finalQty = parseFloat(appQty);
          const finalCost = parseFloat(appCost);
          const finalTotal = finalQty * finalCost;

          p.type = appActionType; // Owner overrides type
          if (appActionType === 'void') {
            p.status = 'void';
          } else {
            p.status = 'approved';
          }
          p.approvedQty = finalQty;
          p.cost = finalCost;
          p.total = finalTotal;
          p.ownerNotes = appNotes;
          p.feedbackSeen = false; // Flag for proposer notification
          p.updatedAt = new Date().toISOString();

          let matchedProduct = null;
          if (p.productId) {
            matchedProduct = currentDb.products.find(x => x.id === p.productId);
          } else {
            matchedProduct = currentDb.products.find(x => x.name.toLowerCase() === p.productName.toLowerCase());
          }

          if (p.status === 'approved') {
            if (p.type === 'buy') {
              if (matchedProduct) {
                matchedProduct.stock = parseFloat((matchedProduct.stock + finalQty).toFixed(3));
                matchedProduct.cost = finalCost;
                matchedProduct.updatedAt = new Date().toISOString();
              } else {
                currentDb.products.push({
                  id: 'p' + Date.now(),
                  sku: 'SKU' + Date.now().toString().slice(-6),
                  name: p.productName,
                  category: 'Lainnya',
                  price: finalCost * 1.5,
                  cost: finalCost,
                  stock: finalQty,
                  active: true,
                  minStock: 5,
                  createdAt: new Date().toISOString(),
                  updatedAt: new Date().toISOString(),
                  createdBy: app.user?.name,
                  createdById: app.user?.id
                });
              }
            } else if (['refund', 'take'].includes(p.type)) {
              if (matchedProduct) {
                matchedProduct.stock = Math.max(0, parseFloat((matchedProduct.stock - finalQty).toFixed(3)));
                matchedProduct.updatedAt = new Date().toISOString();
              }
            }
          }

          logAuditAction('Persetujuan Pengadaan', `Owner menyetujui pengadaan "${p.productName}" dengan tindakan "${appActionType}" (${finalQty} pcs, Total Rp ${finalTotal.toLocaleString('id-ID')}).`, app.user);
          saveDB(currentDb);
          app.refreshDB();
        }
        setShowApproveModal(null);
        app.addToast('Pengadaan berhasil diproses oleh Owner', 'success');
      };

      const handleReject = (e) => {
        e.preventDefault();
        const currentDb = getDB();
        const idx = currentDb.purchases.findIndex(p => p.id === showRejectModal.id);
        if (idx !== -1) {
          const p = currentDb.purchases[idx];
          p.status = 'rejected';
          p.ownerNotes = rejNotes;
          p.feedbackSeen = false; // Flag for proposer notification
          p.updatedAt = new Date().toISOString();

          logAuditAction('Tolak Pengadaan', `Menolak pengadaan "${p.productName}" dengan alasan: ${rejNotes}`, app.user);
          saveDB(currentDb);
          app.refreshDB();
        }
        setShowRejectModal(null);
        setRejNotes('');
        app.addToast('Pengadaan ditolak oleh Owner', 'info');
      };

      const handleVoid = (id) => {
        if (!confirm('Apakah Anda yakin ingin membatalkan pengajuan ini?')) return;
        const currentDb = getDB();
        const idx = currentDb.purchases.findIndex(p => p.id === id);
        if (idx !== -1) {
          const p = currentDb.purchases[idx];
          p.status = 'void';
          p.updatedAt = new Date().toISOString();

          logAuditAction('Void Pengadaan', `Membatalkan (void) pengadaan "${p.productName}"`, app.user);
          saveDB(currentDb);
          app.refreshDB();
          app.addToast('Pengadaan di-void', 'warning');
        }
      };

      const handleDeletePurchase = (id) => {
        if (!confirm('Apakah Anda yakin ingin menghapus catatan pengadaan ini?')) return;
        const currentDb = getDB();
        const idx = currentDb.purchases.findIndex(p => p.id === id);
        if (idx !== -1) {
          const p = currentDb.purchases[idx];
          
          if (p.status === 'approved') {
            let matchedProduct = null;
            if (p.productId) {
              matchedProduct = currentDb.products.find(x => x.id === p.productId);
            } else {
              matchedProduct = currentDb.products.find(x => x.name.toLowerCase() === p.productName.toLowerCase());
            }

            if (matchedProduct) {
              const finalQty = p.approvedQty || p.qty || 0;
              if (p.type === 'buy') {
                matchedProduct.stock = Math.max(0, parseFloat((matchedProduct.stock - finalQty).toFixed(3)));
              } else if (['refund', 'take'].includes(p.type)) {
                matchedProduct.stock = parseFloat((matchedProduct.stock + finalQty).toFixed(3));
              }
              matchedProduct.updatedAt = new Date().toISOString();
            }
          }

          currentDb.purchases.splice(idx, 1);
          logAuditAction('Hapus Pengadaan', `Menghapus pengadaan "${p.productName}" (${p.id})`, app.user);
          saveDB(currentDb);
          app.refreshDB();
          app.addToast('Pengadaan berhasil dihapus', 'success');
        }
      };

      const handleSaveEditPurchase = (e) => {
        e.preventDefault();
        const currentDb = getDB();
        const idx = currentDb.purchases.findIndex(p => p.id === editingPurchase.id);
        if (idx !== -1) {
          const oldP = currentDb.purchases[idx];
          
          let pName = editingPurchase.productName;
          if (editingPurchase.productId) {
            const match = currentDb.products.find(p => p.id === editingPurchase.productId);
            if (match) pName = match.name;
          }

          const newQty = parseFloat(editingPurchase.qty) || 0;
          const newCost = parseFloat(editingPurchase.cost) || 0;
          const newTotal = newQty * newCost;

          if (oldP.status === 'approved') {
            let matchedProduct = null;
            if (oldP.productId) {
              matchedProduct = currentDb.products.find(x => x.id === oldP.productId);
            } else {
              matchedProduct = currentDb.products.find(x => x.name.toLowerCase() === oldP.productName.toLowerCase());
            }

            if (matchedProduct) {
              const oldQty = oldP.approvedQty || oldP.qty || 0;
              
              if (oldP.type === 'buy') {
                matchedProduct.stock = Math.max(0, matchedProduct.stock - oldQty);
              } else if (['refund', 'take'].includes(oldP.type)) {
                matchedProduct.stock = matchedProduct.stock + oldQty;
              }

              if (editingPurchase.type === 'buy') {
                matchedProduct.stock = parseFloat((matchedProduct.stock + newQty).toFixed(3));
                matchedProduct.cost = newCost;
              } else if (['refund', 'take'].includes(editingPurchase.type)) {
                matchedProduct.stock = Math.max(0, parseFloat((matchedProduct.stock - newQty).toFixed(3)));
              }
              matchedProduct.updatedAt = new Date().toISOString();
            }
          }

          oldP.productName = pName;
          oldP.productId = editingPurchase.productId || null;
          oldP.supplierName = editingPurchase.supplierName;
          oldP.qty = newQty;
          oldP.approvedQty = newQty;
          oldP.cost = newCost;
          oldP.total = newTotal;
          oldP.type = editingPurchase.type;
          oldP.notes = editingPurchase.notes;
          oldP.updatedAt = new Date().toISOString();

          logAuditAction('Edit Pengadaan', `Mengedit pengadaan "${pName}" (${editingPurchase.id})`, app.user);
          saveDB(currentDb);
          app.refreshDB();
          setEditingPurchase(null);
          app.addToast('Pengadaan berhasil diperbarui', 'success');
        }
      };

      return (
        <div className="pb-24 md:pb-8 text-left">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div>
              <h3 className="text-xl font-bold text-zinc-800">Manajemen Pengadaan & Ritel</h3>
              <p className="text-sm text-zinc-500">Ajukan pembelian produk, retur barang, atau kelola inventaris ritel.</p>
            </div>
            {(['admin', 'owner', 'keuangan', 'manager'].includes(app.user?.role) || ['admin_operasional', 'admin_keuangan', 'admin_hr', 'admin_marketing', 'admin_gudang', 'keuangan', 'manager', 'supervisor', 'staff'].includes(app.user?.roleId)) && (
              <button
                onClick={() => {
                  setProductName('');
                  setSupplierName('');
                  setQty('');
                  setCost('');
                  setType('buy');
                  setNotes('');
                  setSelectedProductId('');
                  setShowForm(true);
                }}
                className="px-5 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-md transition cursor-pointer"
              >
                <Icon name="plus" size={18} /> Ajukan Pengadaan
              </button>
            )}
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-zinc-200 overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left">
                <thead className="bg-zinc-50 border-b border-zinc-200">
                  <tr>
                    <th className="px-5 py-3.5 text-xs font-bold text-zinc-500 uppercase tracking-wider">Proposal / Tanggal</th>
                    <th className="px-5 py-3.5 text-xs font-bold text-zinc-500 uppercase tracking-wider">Pengaju</th>
                    <th className="px-5 py-3.5 text-xs font-bold text-zinc-500 uppercase tracking-wider">Produk & Supplier</th>
                    <th className="px-5 py-3.5 text-xs font-bold text-zinc-500 uppercase tracking-wider">Jenis</th>
                    <th className="px-5 py-3.5 text-xs font-bold text-zinc-500 uppercase tracking-wider">Estimasi Harga & Jumlah</th>
                    <th className="px-5 py-3.5 text-xs font-bold text-zinc-500 uppercase tracking-wider text-center">Status</th>
                    <th className="px-5 py-3.5 text-xs font-bold text-zinc-500 uppercase tracking-wider text-right pr-8">Aksi</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-100 text-sm">
                  {list.map(p => {
                    const dateStr = new Date(p.date).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                    return (
                      <tr key={p.id} className="hover:bg-zinc-50/50">
                        <td className="px-5 py-4 font-mono text-xs">
                          <div className="font-bold text-sky-650">{p.id}</div>
                          <div className="text-[10px] text-zinc-450 mt-0.5">{dateStr}</div>
                        </td>
                        <td className="px-5 py-4">
                          <div className="font-bold text-zinc-700">{p.proposedBy}</div>
                          <div className="text-[10px] text-zinc-400 capitalize">{p.proposedByRole === 'keuangan' ? 'Keuangan' : p.proposedByRole}</div>
                        </td>
                        <td className="px-5 py-4">
                          <div className="font-bold text-zinc-800">{p.productName}</div>
                          <div className="text-xs text-zinc-450">Supplier: {p.supplierName || '-'}</div>
                          {p.notes && <div className="text-[10px] text-zinc-500 italic mt-1 font-mono">Ket: {p.notes}</div>}
                        </td>
                        <td className="px-5 py-4">
                          <span className={`inline-flex px-2 py-0.5 rounded-lg text-xs font-semibold border ${
                            p.type === 'buy' ? 'bg-sky-50/60 text-sky-700 border-sky-100' :
                            p.type === 'refund' ? 'bg-amber-50/60 text-amber-700 border-amber-100' :
                            p.type === 'take' ? 'bg-violet-50/60 text-violet-700 border-violet-100' : 'bg-rose-50/60 text-rose-700 border-rose-100'
                          }`}>
                            {p.type === 'buy' ? 'Beli Baru / Restock' :
                             p.type === 'refund' ? 'Retur Pemasok' :
                             p.type === 'take' ? 'Ambil Stok' : 'Void Barang'}
                          </span>
                        </td>
                        <td className="px-5 py-4">
                          <div className="font-bold text-zinc-800">Rp {p.total?.toLocaleString('id-ID')}</div>
                          <div className="text-xs text-zinc-450">{p.approvedQty || p.qty} pcs @ Rp {p.cost?.toLocaleString('id-ID')}</div>
                        </td>
                        <td className="px-5 py-4 text-center">
                          <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${
                            p.status === 'approved' ? 'bg-emerald-50 text-emerald-700 border-emerald-100/60' :
                            p.status === 'rejected' ? 'bg-rose-50 text-rose-700 border-rose-100/60' :
                            p.status === 'void' ? 'bg-zinc-50 text-zinc-500 border-zinc-200/60' : 'bg-amber-50 text-amber-700 border-amber-100/60'
                          }`}>
                            <span className={`w-1.5 h-1.5 rounded-full ${
                              p.status === 'approved' ? 'bg-emerald-500' :
                              p.status === 'rejected' ? 'bg-rose-500' :
                              p.status === 'void' ? 'bg-zinc-400' : 'bg-amber-500'
                            }`}></span>
                            {p.status === 'approved' ? 'Disetujui' :
                             p.status === 'rejected' ? 'Ditolak' :
                             p.status === 'void' ? 'Dibatalkan' : 'Menunggu'}
                          </span>
                          {p.ownerNotes && <div className="text-[10px] text-zinc-400 mt-1">Catatan: {p.ownerNotes}</div>}
                        </td>
                        <td className="px-5 py-4 text-right pr-6">
                          <div className="flex justify-end gap-1.5">
                            {p.status === 'pending' && app.user?.role === 'owner' && (
                              <>
                                <button
                                  onClick={() => {
                                    setAppQty(String(p.qty));
                                    setAppCost(String(p.cost));
                                    setAppNotes('');
                                    setAppActionType(p.type || 'buy');
                                    setShowApproveModal(p);
                                  }}
                                  className="px-2.5 py-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-xs font-bold transition flex items-center gap-1"
                                >
                                  <Icon name="check" size={13} /> Setujui
                                </button>
                                <button
                                  onClick={() => {
                                    setRejNotes('');
                                    setShowRejectModal(p);
                                  }}
                                  className="px-2.5 py-1.5 bg-rose-50 text-rose-700 hover:bg-rose-100 rounded-lg text-xs font-bold transition flex items-center gap-1"
                                >
                                  <Icon name="x" size={13} /> Tolak
                                </button>
                              </>
                            )}
                            {p.status === 'pending' && (app.user?.id === p.proposedById || app.user?.role === 'owner') && (
                              <button
                                onClick={() => handleVoid(p.id)}
                                className="p-2 text-zinc-500 hover:bg-zinc-100 rounded-lg transition"
                                title="Batalkan Pengajuan"
                              >
                                <Icon name="slash" size={14} />
                              </button>
                            )}
                            {(app.user?.role === 'owner' || app.user?.role === 'admin' || ['admin_operasional', 'admin_keuangan', 'admin_hr', 'admin_marketing', 'admin_gudang', 'keuangan', 'manager', 'supervisor', 'staff'].includes(app.user?.roleId)) && (
                              <>
                                <button
                                  onClick={() => setEditingPurchase({ ...p })}
                                  className="p-2 text-zinc-400 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition"
                                  title="Edit Pengadaan"
                                >
                                  <Icon name="pencil" size={14} />
                                </button>
                                <button
                                  onClick={() => handleDeletePurchase(p.id)}
                                  className="p-2 text-zinc-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                                  title="Hapus Pengadaan"
                                >
                                  <Icon name="trash-2" size={14} />
                                </button>
                              </>
                            )}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                  {list.length === 0 && (
                    <tr>
                      <td colSpan="7" className="text-center py-16 text-zinc-400 font-medium">
                        <Icon name="shopping-bag" size={40} className="mx-auto mb-3 text-zinc-300" />
                        <p>Belum ada pengajuan pengadaan barang</p>
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {showForm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 backdrop-blur-sm p-4 animate-[fadeIn_0.2s]">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-[scaleIn_0.2s]">
                <div className="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
                  <h3 className="font-bold text-zinc-855 text-lg flex items-center gap-2">
                    <Icon name="shopping-bag" className="text-sky-600" />
                    <span>Buat Pengajuan Pengadaan</span>
                  </h3>
                  <button onClick={() => setShowForm(false)} className="p-2 bg-zinc-100 text-zinc-500 hover:bg-zinc-200 rounded-full transition"><Icon name="x" size={16} /></button>
                </div>
                <form onSubmit={handleCreate} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Tipe Pengadaan</label>
                    <select value={type} onChange={e => {
                      setType(e.target.value);
                      setSelectedProductId('');
                      setProductName('');
                      setCost('');
                    }} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-semibold focus:border-sky-500">
                      <option value="buy">Pembelian Baru / Restock (Buy)</option>
                      <option value="refund">Retur ke Supplier (Refund)</option>
                      <option value="take">Ambil Stok (Ambil Berapa)</option>
                      <option value="void">Void / Pembatalan Barang (Void)</option>
                    </select>
                  </div>

                  {type !== 'buy' ? (
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Pilih Produk Dari Katalog</label>
                      <select
                        value={selectedProductId}
                        onChange={e => {
                          setSelectedProductId(e.target.value);
                          const prod = db.products.find(x => x.id === e.target.value);
                          if (prod) {
                            setProductName(prod.name);
                            setCost(String(prod.cost || 0));
                          } else {
                            setProductName('');
                            setCost('');
                          }
                        }}
                        className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500"
                        required
                      >
                        <option value="">-- Pilih Produk --</option>
                        {db.products.filter(p => p.active !== false).map(p => (
                          <option key={p.id} value={p.id}>{p.name} (Stok: {p.stock} | HPP: Rp {p.cost})</option>
                        ))}
                      </select>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Sumber Produk</label>
                        <select
                          onChange={e => {
                            const val = e.target.value;
                            if (val === 'new') {
                              setSelectedProductId('');
                              setProductName('');
                              setCost('');
                            } else {
                              setSelectedProductId(val);
                              const prod = db.products.find(x => x.id === val);
                              if (prod) {
                                setProductName(prod.name);
                                setCost(String(prod.cost || 0));
                              }
                            }
                          }}
                          className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-semibold focus:border-sky-500"
                        >
                          <option value="new">-- Produk Baru (Ketik Nama Manual) --</option>
                          {db.products.filter(p => p.active !== false).map(p => (
                            <option key={p.id} value={p.id}>Restock: {p.name} (Stok: {p.stock} | HPP: Rp {p.cost})</option>
                          ))}
                        </select>
                      </div>

                      {!selectedProductId && (
                        <div>
                          <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Nama Produk Baru</label>
                          <input type="text" value={productName} onChange={e => setProductName(e.target.value)} required className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500" placeholder="Ketik nama produk baru..." />
                        </div>
                      )}
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Supplier / Pemasok</label>
                    <input type="text" value={supplierName} onChange={e => setSupplierName(e.target.value)} required className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500" placeholder="Nama supplier/pemasok..." />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Jumlah (Qty)</label>
                      <input type="number" value={qty} onChange={e => setQty(e.target.value)} required min="1" step="any" className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500" placeholder="0" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Harga per Unit (Rp)</label>
                      <input type="number" value={cost} onChange={e => setCost(e.target.value)} required min="0" className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500" placeholder="HPP unit..." />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Catatan / Keterangan</label>
                    <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={3} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500" placeholder="Alasan pengadaan atau detail khusus..."></textarea>
                  </div>

                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setShowForm(false)} className="flex-1 py-3 bg-zinc-100 text-zinc-700 rounded-xl text-sm font-semibold hover:bg-zinc-200 transition">Batal</button>
                    <button type="submit" className="flex-1 py-3 bg-sky-600 text-white rounded-xl text-sm font-semibold hover:bg-sky-700 transition shadow-md flex items-center justify-center gap-1.5"><Icon name="send" size={16} />Kirim Pengajuan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {editingPurchase && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 backdrop-blur-sm p-4 animate-[fadeIn_0.2s]">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-[scaleIn_0.2s]">
                <div className="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
                  <h3 className="font-bold text-zinc-855 text-lg flex items-center gap-2">
                    <Icon name="shopping-bag" className="text-sky-600" />
                    <span>Edit Data Pengadaan</span>
                  </h3>
                  <button onClick={() => setEditingPurchase(null)} className="p-2 bg-zinc-100 text-zinc-500 hover:bg-zinc-200 rounded-full transition"><Icon name="x" size={16} /></button>
                </div>
                <form onSubmit={handleSaveEditPurchase} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Tipe Pengadaan</label>
                    <select value={editingPurchase.type} onChange={e => {
                      setEditingPurchase(prev => ({
                        ...prev,
                        type: e.target.value,
                        productId: e.target.value !== 'buy' ? prev.productId : '',
                        productName: e.target.value !== 'buy' ? prev.productName : ''
                      }));
                    }} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-semibold focus:border-sky-500">
                      <option value="buy">Pembelian Baru / Restock (Buy)</option>
                      <option value="refund">Retur ke Supplier (Refund)</option>
                      <option value="take">Ambil Stok (Ambil Berapa)</option>
                      <option value="void">Void / Pembatalan Barang (Void)</option>
                    </select>
                  </div>

                  {editingPurchase.type !== 'buy' ? (
                    <div>
                      <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Pilih Produk Dari Katalog</label>
                      <select
                        value={editingPurchase.productId || ''}
                        onChange={e => {
                          const val = e.target.value;
                          const prod = db.products.find(x => x.id === val);
                          setEditingPurchase(prev => ({
                            ...prev,
                            productId: val,
                            productName: prod ? prod.name : '',
                            cost: prod ? String(prod.cost || 0) : ''
                          }));
                        }}
                        className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500"
                        required
                      >
                        <option value="">-- Pilih Produk --</option>
                        {db.products.filter(p => p.active !== false).map(p => (
                          <option key={p.id} value={p.id}>{p.name} (Stok: {p.stock} | HPP: Rp {p.cost})</option>
                        ))}
                      </select>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Sumber Produk</label>
                        <select
                          value={editingPurchase.productId || 'new'}
                          onChange={e => {
                            const val = e.target.value;
                            if (val === 'new') {
                              setEditingPurchase(prev => ({
                                ...prev,
                                productId: '',
                                productName: '',
                                cost: ''
                              }));
                            } else {
                              const prod = db.products.find(x => x.id === val);
                              setEditingPurchase(prev => ({
                                ...prev,
                                productId: val,
                                productName: prod ? prod.name : '',
                                cost: prod ? String(prod.cost || 0) : ''
                              }));
                            }
                          }}
                          className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-semibold focus:border-sky-500"
                        >
                          <option value="new">-- Produk Baru (Ketik Nama Manual) --</option>
                          {db.products.filter(p => p.active !== false).map(p => (
                            <option key={p.id} value={p.id}>Restock: {p.name} (Stok: {p.stock} | HPP: Rp {p.cost})</option>
                          ))}
                        </select>
                      </div>

                      {!editingPurchase.productId && (
                        <div>
                          <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Nama Produk Baru</label>
                          <input type="text" value={editingPurchase.productName || ''} onChange={e => setEditingPurchase(prev => ({ ...prev, productName: e.target.value }))} required className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500" placeholder="Ketik nama produk baru..." />
                        </div>
                      )}
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Supplier / Pemasok</label>

                    <p><span className="font-bold">Barang:</span> {showApproveModal.productName}</p>
                    <p><span className="font-bold">Supplier:</span> {showApproveModal.supplierName}</p>
                    <p><span className="font-bold">Pengaju:</span> {showApproveModal.proposedBy} ({showApproveModal.proposedByRole === 'keuangan' ? 'Keuangan' : showApproveModal.proposedByRole})</p>
                    <p><span className="font-bold">Diajukan:</span> {showApproveModal.qty} pcs @ Rp {showApproveModal.cost?.toLocaleString('id-ID')} (Total: Rp {showApproveModal.total?.toLocaleString('id-ID')})</p>

                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1">Opsi Tindakan Pemilik</label>

              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-[scaleIn_0.2s]">
                <div className="p-5 border-b border-rose-100 bg-rose-50/50 flex justify-between items-center">
                  <h3 className="font-bold text-rose-900 text-base flex items-center gap-2">
                    <Icon name="x-circle" />
                    <span>Tolak Pengadaan</span>
                  </h3>
                  <button onClick={() => setShowRejectModal(null)} className="p-1.5 text-zinc-400 hover:bg-zinc-100 rounded-full transition"><Icon name="x" size={16} /></button>

                <form onSubmit={handleReject} className="p-5 space-y-4 text-left">
                  <div>
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1">Alasan Penolakan</label>
                    <textarea value={rejNotes} onChange={e => setRejNotes(e.target.value)} required rows={3} className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none text-zinc-800 text-sm font-medium focus:border-sky-500" placeholder="Alasan mengapa pengadaan ini ditolak..."></textarea>
                  </div>

                  <div className="flex gap-2.5 pt-1">
                    <button type="button" onClick={() => setShowRejectModal(null)} className="flex-1 py-2.5 bg-zinc-100 text-zinc-700 rounded-xl text-xs font-bold hover:bg-zinc-200 transition">Batal</button>
                    <button type="submit" className="flex-1 py-2.5 bg-rose-600 text-white rounded-xl text-xs font-bold hover:bg-rose-700 transition shadow-md">

                </form>
              </div>
            </div>
          )}
