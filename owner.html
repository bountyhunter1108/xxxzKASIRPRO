                        )}

                        {/* Generic/Standard diff layouts (Fallback) */}
                        {!['transaction_edit', 'user_edit', 'product_edit', 'shift_edit'].includes(req.type) && (
                          <div className="p-3 bg-zinc-50 border border-zinc-150 rounded-xl font-mono text-[10px] text-zinc-650 space-y-1">
                            {req.type === 'transaction_delete' && <div>Hapus Transaksi ID: <span className="font-bold text-rose-600">{req.targetId}</span></div>}
                            {req.type === 'shift_delete' && <div>Hapus Laporan Shift ID: <span className="font-bold text-rose-600">{req.targetId}</span></div>}
                            {req.type === 'user_delete' && <div>Hapus Permanen Karyawan: <span className="font-bold text-rose-600">{req.data?.name}</span></div>}
                            {req.type === 'user_status' && <div>Ganti status aktif {req.data?.name} menjadi: <span className="font-bold">{req.data?.active ? 'Aktif' : 'Nonaktif'}</span></div>}
                            {req.type === 'product_add' && (
                              <div className="grid grid-cols-2 gap-2">
                                <div>Produk: {req.data?.name} | SKU: {req.data?.sku}</div>
                                <div>Harga Jual: Rp {req.data?.price?.toLocaleString('id-ID')} | Stok: {req.data?.stock}</div>
                              </div>
                            )}
                            {req.type === 'product_delete' && <div>Hapus Produk Catalog: <span className="font-bold text-rose-600">{req.data?.name}</span></div>}
                            {req.type === 'shift_add' && (
                              <div className="grid grid-cols-2 gap-2">
                                <div>Modal: Rp {req.data?.startCash?.toLocaleString('id-ID')}</div>
                                <div>Laci: Rp {req.data?.actualCash?.toLocaleString('id-ID')}</div>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              {approvals.length === 0 && (
                <p className="text-center py-12 text-zinc-400 text-xs font-semibold">Belum ada pengajuan masuk.</p>
              )}
            </div>
          </div>
        );
      };



      const allTx = useMemo(() => db.transactions || [], [db.transactions, app.dbVersion]);

      const filteredTx = useMemo(() => {
        const now = new Date();
        let txs = allTx.filter(t => !t.deleted);

        if (filter === 'today') {
          txs = txs.filter(t => new Date(t.date).toDateString() === now.toDateString());
        } else if (filter === '7days') {
          const past = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          txs = txs.filter(t => new Date(t.date) >= past);
        } else if (filter === 'month') {
          txs = txs.filter(t => {
            const d = new Date(t.date);
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          });
        } else if (filter === 'year') {
          txs = txs.filter(t => {
            const d = new Date(t.date);
            return d.getFullYear() === now.getFullYear();
          });
        }
        return txs;
      }, [allTx, filter]);

      // Calculations
      const metrics = useMemo(() => {
        let totalRevenue = 0;
        let totalCost = 0;
        
        filteredTx.forEach(tx => {
          totalRevenue += (tx.total || 0);
          tx.items.forEach(item => {
            const costVal = item.cost !== undefined ? item.cost : 0;
            totalCost += (costVal * item.qty);
          });
        });

        const profit = totalRevenue - totalCost;
        return {
          revenue: totalRevenue,
          cost: totalCost,
          profit: profit,
          count: filteredTx.length
        };
      }, [filteredTx]);

      // Owner Fixed Summary: profit harian, bulanan, tahunan, stok (owner)
      const ownerSummary = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        
        let dailyProfit = 0;
        let monthlyProfit = 0;
        let yearlyProfit = 0;

        (allTx || []).forEach(tx => {
          if (tx.deleted) return;
          const txDate = new Date(tx.date);
          let txRevenue = tx.total || 0;
          let txCost = 0;
          tx.items.forEach(item => {
            const costVal = item.cost !== undefined ? item.cost : 0;
            txCost += (costVal * item.qty);
          });
          const txProfit = txRevenue - txCost;

          // Harian
          if (txDate >= startOfToday) {
            dailyProfit += txProfit;
          }
          // Bulanan
          if (txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear()) {
            monthlyProfit += txProfit;
          }
          // Tahunan
          if (txDate.getFullYear() === now.getFullYear()) {
            yearlyProfit += txProfit;
          }
        });

        // Stok
        let totalStockQty = 0;
        let totalStockVal = 0;
        (db.products || []).forEach(p => {
          if (p.active !== false) {
            const qty = p.stock || 0;
            const cost = p.cost || 0;
            totalStockQty += qty;
            totalStockVal += (qty * cost);
          }
        });

        return {
          dailyProfit,
          monthlyProfit,
          yearlyProfit,
          totalStockQty,
          totalStockVal
        };
      }, [allTx, db.products, app.dbVersion]);

      // Best Sellers
      const bestSellers = useMemo(() => {
        const counts = {};
        filteredTx.forEach(tx => {
          tx.items.forEach(item => {
            if (!counts[item.id]) {
              counts[item.id] = { id: item.id, name: item.name, category: item.category, qty: 0, revenue: 0 };
            }
            counts[item.id].qty += item.qty;
            counts[item.id].revenue += (item.effectivePrice * item.qty);
          });
        });
        return Object.values(counts).sort((a, b) => b.qty - a.qty).slice(0, 5);
      }, [filteredTx]);

      // Shifts
      const shiftsList = useMemo(() => {
        return [...(db.shifts || [])].sort((a, b) => new Date(b.startTime) - new Date(a.startTime)).slice(0, 5);
      }, [db.shifts, app.dbVersion]);

      // AI Stock Prediction
      const aiStockPredictions = useMemo(() => {
        const transactions = db.transactions || [];
        const products = db.products || [];
        const sales30Days = {};
        const thirtyDaysAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
        
        transactions.forEach(t => {
          const txTime = new Date(t.date || t.timestamp).getTime();
          if (txTime >= thirtyDaysAgo) {
            (t.items || []).forEach(item => {
              const pId = item.id;
              const salesQty = item.qty || item.quantity || 1;
              sales30Days[pId] = (sales30Days[pId] || 0) + salesQty;
            });
          }
        });

        const predictions = [];
        products.forEach(p => {
          if (p.active === false) return;
          const qtySold = sales30Days[p.id] || 0;
          const velocity = qtySold / 30;
          
          if (velocity > 0) {
            const currentStock = p.stock || 0;
            const daysRemaining = currentStock / velocity;
            if (daysRemaining <= 7) {
              predictions.push({
                id: p.id,
                name: p.name,
                sku: p.sku,
                stock: currentStock,
                dailySales: velocity.toFixed(1),
                daysRemaining: Math.ceil(daysRemaining)
              });
            }
          } else if ((p.stock || 0) <= 0) {
            predictions.push({
              id: p.id,
              name: p.name,
              sku: p.sku,
              stock: p.stock || 0,
              dailySales: '0.0',
              daysRemaining: 0
            });
          }
        });

        return predictions.sort((a, b) => a.daysRemaining - b.daysRemaining).slice(0, 5);
      }, [db.products, db.transactions]);

      // Audit Logs
      const auditList = useMemo(() => {
        return (db.auditLogs || []).slice(0, 10);
      }, [db.auditLogs, app.dbVersion]);

      const { chartLabels, chartDataSales, chartDataProfit } = useMemo(() => {
        const daily = {};
        filteredTx.forEach(t => {
          const d = new Date(t.date).toLocaleDateString('id-ID', { month: 'short', day: 'numeric' });
          if (!daily[d]) {
            daily[d] = { sales: 0, cost: 0 };
          }
          daily[d].sales += t.total;
          t.items.forEach(item => {
            const costVal = item.cost !== undefined ? item.cost : 0;
            daily[d].cost += (costVal * item.qty);
          });
        });
        const labels = Object.keys(daily).reverse();
        const sales = Object.values(daily).map(v => v.sales).reverse();
        const profits = Object.values(daily).map(v => v.sales - v.cost).reverse();
        return { chartLabels: labels, chartDataSales: sales, chartDataProfit: profits };
      }, [filteredTx]);

      // Category Sales Memo
      const categorySales = useMemo(() => {
        const catMap = {};
        filteredTx.forEach(t => {
          t.items.forEach(item => {
            const prod = db.products ? db.products.find(p => p.id === item.id) : null;
            const cat = prod && prod.category ? prod.category : 'Umum';
            catMap[cat] = (catMap[cat] || 0) + (item.price * item.qty);
          });
        });
        return catMap;
      }, [filteredTx, db.products]);

      // Payment Distribution Memo
      const paymentDistribution = useMemo(() => {
        const payMap = { cash: 0, qris: 0, transfer: 0, debt: 0 };
        filteredTx.forEach(t => {
          const method = t.method || 'cash';
          payMap[method] = (payMap[method] || 0) + (t.total || 0);
        });
        return payMap;
      }, [filteredTx]);

      // Radar Performance Metrics Memo
      const radarMetrics = useMemo(() => {
        const totalRev = filteredTx.reduce((s, t) => s + (t.total || 0), 0);
        const totalCost = filteredTx.reduce((s, t) => s + (t.cost || 0), 0);
        const profitScore = totalRev > 0 ? Math.min(100, Math.max(0, ((totalRev - totalCost) / totalRev) * 100 * 2)) : 0;
        const qrisCount = filteredTx.filter(t => t.method === 'qris').length;
        const qrisRatio = filteredTx.length > 0 ? (qrisCount / filteredTx.length) * 100 : 0;
        const memberCount = filteredTx.filter(t => t.memberId || t.memberName).length;
        const memberRatio = filteredTx.length > 0 ? (memberCount / filteredTx.length) * 100 : 0;
        const totalActiveProducts = db.products ? db.products.filter(p => p.active !== false).length : 0;
        const uniqueSoldProducts = new Set();
        filteredTx.forEach(t => t.items.forEach(i => uniqueSoldProducts.add(i.id)));
        const turnoverRatio = totalActiveProducts > 0 ? (uniqueSoldProducts.size / totalActiveProducts) * 100 : 0;
        const shifts = db.shifts || [];
        const closedShifts = shifts.filter(s => s.status === 'closed');
        const perfectShifts = closedShifts.filter(s => s.difference === 0).length;
        const cashierScore = closedShifts.length > 0 ? (perfectShifts / closedShifts.length) * 100 : 80;
        return [
          Math.round(Math.max(10, profitScore)), 
          Math.round(Math.max(10, qrisRatio)), 
          Math.round(Math.max(10, memberRatio)), 
          Math.round(Math.max(10, turnoverRatio)), 
          Math.round(Math.max(10, cashierScore))
        ];
      }, [filteredTx, db.products, db.shifts]);

      // Render chart
      useEffect(() => {
        if (dashboardTab !== 'overview' || !chartRef.current) return;
        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        
        const salesGradient = ctx.createLinearGradient(0, 0, 0, 240);
        salesGradient.addColorStop(0, 'rgba(79, 70, 229, 0.18)'); // Indigo-600
        salesGradient.addColorStop(0.5, 'rgba(79, 70, 229, 0.06)');
        salesGradient.addColorStop(1, 'rgba(79, 70, 229, 0.0)');

        const profitGradient = ctx.createLinearGradient(0, 0, 0, 240);
        profitGradient.addColorStop(0, 'rgba(16, 185, 129, 0.18)'); // Emerald-500
        profitGradient.addColorStop(0.5, 'rgba(16, 185, 129, 0.06)');
        profitGradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

        chartInstance.current = new Chart(chartRef.current, {
          type: 'line',
          data: {
            labels: chartLabels,
            datasets: [
              {
                label: 'Pendapatan',
                data: chartDataSales,
                borderColor: '#4f46e5', // Indigo-600
                backgroundColor: salesGradient,
                borderWidth: 3,
                fill: true,
                tension: 0.35,
                pointBackgroundColor: '#fff',
                pointBorderColor: '#4f46e5',
                pointBorderWidth: 3,
                pointRadius: 4,
                pointHoverRadius: 7,
                pointHoverBackgroundColor: '#4f46e5',
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 3
              },
              {
                label: 'Laba Bersih',
                data: chartDataProfit,
                borderColor: '#10b981', // Emerald-500
                backgroundColor: profitGradient,
                borderWidth: 3,
                fill: true,
                tension: 0.35,
                pointBackgroundColor: '#fff',
                pointBorderColor: '#10b981',
                pointBorderWidth: 3,
                pointRadius: 4,
                pointHoverRadius: 7,
                pointHoverBackgroundColor: '#10b981',
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 3
              }
            ]
          },
          plugins: [
            {
              id: 'customShadow',
              beforeDatasetsDraw(chart, args, options) {
                const { ctx } = chart;
                ctx.save();
                ctx.shadowColor = 'rgba(79, 70, 229, 0.06)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;
              },
              afterDatasetsDraw(chart, args, options) {
                const { ctx } = chart;
                ctx.restore();
              }
            }
          ],
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            animations: {
              y: {
                type: 'number',
                easing: 'easeOutQuart',
                duration: 1200,
                from: (ctx) => {
                  if (ctx.type === 'data') {
                    return ctx.chart.scales.y.getPixelForValue(0);
                  }
                },
                delay: (ctx) => {
                  if (ctx.type === 'data') {
                    return ctx.index * 60;
                  }
                }
              },
              opacity: {
                easing: 'easeInOutQuad',
                duration: 800,
                from: 0,
                to: 1,
                delay: (ctx) => {
                  if (ctx.type === 'data') {
                    return ctx.index * 30;
                  }
                }
              }
            },
            plugins: {
              legend: { 
                position: 'top', 
                labels: { 
                  usePointStyle: true,
                  pointStyle: 'circle',
                  boxWidth: 6,
                  boxHeight: 6,
                  font: { family: 'Inter', size: 11, weight: 'bold' },
                  color: '#4b5563'
                } 
              },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                titleFont: { size: 12, weight: 'bold', family: 'Inter' },
                bodyFont: { size: 11, family: 'Inter' },
                padding: 12,
                cornerRadius: 10,
                borderWidth: 1,
                borderColor: 'rgba(255, 255, 255, 0.08)',
                callbacks: {
                  label: function(context) {
                    return ` ${context.dataset.label}: Rp ${context.raw.toLocaleString('id-ID')}`;
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: 'rgba(0, 0, 0, 0.03)', drawBorder: false },
                ticks: {
                  callback: (value) => 'Rp ' + value.toLocaleString('id-ID'),
                  font: { family: 'Inter', size: 10 },
                  color: '#64748b'
                }
              },
              x: {
                grid: { display: false },
                ticks: { font: { family: 'Inter', size: 10 }, color: '#64748b' }
              }
            }
          }
        });

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [chartLabels, chartDataSales, chartDataProfit, dashboardTab]);

      // Owner Dashboard New Visualizations Effect
      useEffect(() => {
        if (dashboardTab !== 'overview') return;

        // Clean up previous instances
        if (radarChartInstance.current) radarChartInstance.current.destroy();
        if (donutChartInstance.current) donutChartInstance.current.destroy();
        if (barChartCategoryInstance.current) barChartCategoryInstance.current.destroy();

        // 1. Radar Chart (Kinerja Operasional - Foto 1 & 2)
        if (radarChartRef.current) {
          radarChartInstance.current = new Chart(radarChartRef.current, {
            type: 'radar',
            data: {
              labels: ['Profitabilitas', 'Digitalisasi QRIS', 'Loyalitas Member', 'Perputaran Stok', 'Akurasi Kasir'],
              datasets: [{
                label: 'Skor Performa',
                data: radarMetrics,
                backgroundColor: 'rgba(14, 165, 233, 0.15)', // Sky-500 transparan
                borderColor: '#0ea5e9', // Sky-500 pastel
                borderWidth: 2,
                pointBackgroundColor: '#0ea5e9',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: '#0ea5e9',
                pointRadius: 3.5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animations: {
                r: {
                  type: 'number',
                  easing: 'easeOutBack',
                  duration: 1400
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: 'rgba(15, 23, 42, 0.95)',
                  padding: 10,
                  cornerRadius: 8,
                  callbacks: {
                    label: (ctx) => ` Skor: ${ctx.raw} / 100`
                  }
                }
              },
              scales: {
                r: {
                  angleLines: { color: 'rgba(0, 0, 0, 0.05)' },
                  grid: { color: 'rgba(0, 0, 0, 0.05)' },
                  pointLabels: {
                    font: { family: 'Inter', size: 9, weight: 'bold' },
                    color: '#64748b'
                  },
                  ticks: {
                    display: false,
                    stepSize: 20
                  },
                  suggestedMin: 0,
                  suggestedMax: 100
                }
              }
            }
          });
        }

        // 2. Donut Chart (Distribusi Pembayaran - Foto 2 & 5)
        if (donutChartRef.current) {
          donutChartInstance.current = new Chart(donutChartRef.current, {
            type: 'doughnut',
            data: {
              labels: ['Tunai (Cash)', 'Nontunai (QRIS)', 'Transfer Bank', 'Hutang / Bon'],
              datasets: [{
                data: [
                  paymentDistribution.cash || 0,
                  paymentDistribution.qris || 0,
                  paymentDistribution.transfer || 0,
                  paymentDistribution.debt || 0
                ],
                backgroundColor: [
                  '#f59e0b', // Amber (Tunai)
                  '#2cc2d6', // Cyan (QRIS)
                  '#3b82f6', // Blue (Transfer)
                  '#d97706'  // Dark Amber (Hutang)
                ],
                borderWidth: 2,
                borderColor: '#fff',
                hoverOffset: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '65%',
              animations: {
                animateScale: { duration: 1000, easing: 'easeOutBack' },
                animateRotate: { duration: 1200, easing: 'easeOutBack' }
              },
              plugins: {
                legend: {
                  display: true,
                  position: 'bottom',
                  labels: {
                    boxWidth: 8,
                    boxHeight: 8,
                    usePointStyle: true,
                    pointStyle: 'circle',
                    font: { family: 'Inter', size: 10, weight: 'bold' },
                    color: '#64748b'
                  }
                },
                tooltip: {
                  backgroundColor: 'rgba(15, 23, 42, 0.95)',
                  padding: 10,
                  cornerRadius: 8,
                  callbacks: {
                    label: (ctx) => ` ${ctx.label}: Rp ${ctx.raw.toLocaleString('id-ID')}`
                  }
                }
              }
            }
          });
        }

        // 3. Bar Chart Kategori Produk (Foto 3 & 5)
        if (barChartCategoryRef.current) {
          const catLabels = Object.keys(categorySales);
          const catData = Object.values(categorySales);
          
          const ctxBar = barChartCategoryRef.current.getContext('2d');
          const barGradient = ctxBar.createLinearGradient(0, 0, 0, 220);
          barGradient.addColorStop(0, '#38bdf8'); // Sky-400
          barGradient.addColorStop(1, '#4f46e5'); // Indigo-600

          barChartCategoryInstance.current = new Chart(barChartCategoryRef.current, {
            type: 'bar',
            data: {
              labels: catLabels.length > 0 ? catLabels : ['Umum'],
              datasets: [{
                label: 'Penjualan',
                data: catData.length > 0 ? catData : [0],
                backgroundColor: barGradient,
                hoverBackgroundColor: '#4f46e5',
                borderRadius: 8,
                borderSkipped: false,
                barPercentage: 0.5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animations: {
                y: {
                  type: 'number',
                  easing: 'easeOutBack',
                  duration: 1000,
                  from: (ctx) => {
                    if (ctx.type === 'data') return ctx.chart.scales.y.getPixelForValue(0);
                  },
                  delay: (ctx) => {
                    if (ctx.type === 'data') return ctx.index * 60;
                  }
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: 'rgba(15, 23, 42, 0.95)',
                  padding: 10,
                  cornerRadius: 8,
                  callbacks: {
                    label: (ctx) => ` Rp ${ctx.raw.toLocaleString('id-ID')}`
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: 'rgba(0, 0, 0, 0.03)', drawBorder: false },
                  ticks: {
                    callback: (val) => {
                      if (val >= 1000000) return 'Rp ' + (val / 1000000).toFixed(1) + ' jt';
                      if (val >= 1000) return 'Rp ' + (val / 1000).toFixed(0) + 'k';
                      return 'Rp ' + val;
                    },
                    font: { family: 'Inter', size: 9 },
                    color: '#94a3b8'
                  }
                },
                x: {
                  grid: { display: false },
                  ticks: { font: { family: 'Inter', size: 9 }, color: '#94a3b8' }
                }
              }
            }
          });
        }

        return () => {
          if (radarChartInstance.current) radarChartInstance.current.destroy();
          if (donutChartInstance.current) donutChartInstance.current.destroy();
          if (barChartCategoryInstance.current) barChartCategoryInstance.current.destroy();
        };
      }, [dashboardTab, radarMetrics, paymentDistribution, categorySales]);

      const renderOverview = () => {
        const today = new Date();
        
        // 1. Calculate Monthly Goal metrics
        const monthlyTxs = allTx.filter(t => {
          if (t.deleted) return false;
          const d = new Date(t.date);
          return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
        });
        const monthlySalesRevenue = monthlyTxs.reduce((sum, t) => sum + (t.total || 0), 0);
        const progressPercentage = salesTarget > 0 ? Math.min(100, (monthlySalesRevenue / salesTarget) * 100).toFixed(1) : 0;
        const lastDayOfMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
        const daysRemaining = lastDayOfMonth - today.getDate() + 1;
        const isGoalAchieved = monthlySalesRevenue >= salesTarget;

        // 2. Predict Peak Busy Hour Range
        const hourCounts = Array(24).fill(0);
        allTx.filter(t => !t.deleted).forEach(t => {
          try {
            const hr = new Date(t.date).getHours();
            hourCounts[hr]++;
          } catch(e) {}
        });
        const maxHour = hourCounts.indexOf(Math.max(...hourCounts));
        const busyHourString = hourCounts.reduce((s, c) => s + c, 0) > 0 
          ? `${String(maxHour).padStart(2, '0')}:00 - ${String((maxHour + 2) % 24).padStart(2, '0')}:00` 
          : 'Belum terdeteksi';

        // 3. Average Order Value (AOV)
        const validTxs = allTx.filter(t => !t.deleted);
        const totalRevenueValid = validTxs.reduce((sum, t) => sum + (t.total || 0), 0);
        const aov = validTxs.length > 0 ? Math.round(totalRevenueValid / validTxs.length) : 0;

        // 4. Inventory and Shift health
        const criticalProducts = (db.products || []).filter(p => p.active !== false && (p.stock || 0) <= (p.minStock || 5));
        const activeShiftsList = db.shifts || [];
        const hasShiftDiscrepancy = activeShiftsList.some(s => s.status === 'closed' && s.difference !== 0);

        return (
          <>

              </h4>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {staffs.map(u => {
                  const now = new Date();
                  const isOnline = u.entryStatus === 'entered' && u.lastActive && (now - new Date(u.lastActive)) < 5 * 60 * 1000;
                  
                  const staffTx = allTx.filter(t => t.cashierId === u.id || (t.cashier && t.cashier.toLowerCase() === u.name.toLowerCase()));

                  const uName = u.name || u.email;

                  return (

                        <div className="flex items-center gap-3">

                          <div>

                              {u.name}
                              {(() => {
                                const cls = getRoleBadgeStyle(u.role, db);
                                return (
                                  <span className={`text-[9px] font-extrabold px-1.5 py-0.5 rounded border uppercase tracking-wider ${cls}`}>

                        </div>
                        
                        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border ${

                        }`}>
                          <span className="relative flex h-1.5 w-1.5">
                            {isOnline && <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>}
                            <span className={`relative inline-flex rounded-full h-1.5 w-1.5 ${isOnline ? 'bg-emerald-500' : 'bg-zinc-400'}`}></span>

                        </span>
                      </div>

                      <div className="grid grid-cols-3 gap-2 bg-white border border-zinc-200 rounded-xl p-3 text-center text-xs">

                          <p className="text-zinc-450 text-[10px] uppercase font-bold mb-0.5">Aktif Terakhir</p>
                          <p className="font-semibold text-zinc-700 truncate" title={u.lastActive ? new Date(u.lastActive).toLocaleString('id-ID') : 'Belum pernah'}>

                        </div>
                        <div>
                          <p className="text-zinc-450 text-[10px] uppercase font-bold mb-0.5">Penjualan</p>
                          <p className="font-bold text-zinc-800">{staffTx.length} Nota <span className="text-[10px] text-zinc-400 font-normal">(Rp {totalSales.toLocaleString('id-ID')})</span></p>

                        <div>
                          <p className="text-zinc-450 text-[10px] uppercase font-bold mb-0.5">Input Barang</p>

                        <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Aktivitas Terakhir:</p>

              </div>
            </div>
          </div>
        );
      };

      const renderFinance = () => {
        const approvedPurchases = (db.purchases || []).filter(p => p.status === 'approved');
        
        let buyTotal = 0;
        let refundTotal = 0;
        let takeTotal = 0;
        let voidTotal = 0;

        approvedPurchases.forEach(p => {
          const tVal = p.total || ((p.approvedQty || p.qty || 0) * (p.cost || 0));
          if (p.type === 'buy') buyTotal += tVal;
          else if (p.type === 'refund') refundTotal += tVal;
          else if (p.type === 'take') takeTotal += tVal;
          else if (p.type === 'void') voidTotal += tVal;
        });

        const revenue = metrics.revenue;
        const hpp = metrics.cost;
        const grossProfit = metrics.profit;
        const netProfit = grossProfit - buyTotal - takeTotal - voidTotal + refundTotal;
        const marginPct = revenue > 0 ? (grossProfit / revenue) : 0.40;
        const marginPctDisplay = marginPct * 100;

        const lowStockItems = db.products.filter(p => p.active !== false && p.stock <= (p.minStock || 5));
        const totalRestockBudget = lowStockItems.reduce((sum, p) => {
          const needed = Math.max(0, (p.minStock || 5) - p.stock);
          return sum + (needed * (p.cost || 0));
        }, 0);

        // BEP Calculations
        const bepRevenue = marginPct > 0 ? fixedExpenses / marginPct : fixedExpenses / 0.40;
        const bepDaily = bepRevenue / 30;
        
        // Calculate daily average sales based on current selected filter
        let daysForFilter = 30;
        if (filter === 'today') daysForFilter = 1;
        else if (filter === '7days') daysForFilter = 7;
        else if (filter === 'month') daysForFilter = 30;
        else if (filter === 'year') daysForFilter = 365;
        const currentDailyAvg = revenue / daysForFilter;
        const isBebCovered = currentDailyAvg >= bepDaily;

        return (
          <div className="space-y-6  text-left">
            {/* Top Cards Financial Metrics */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              <div className="bg-white border border-zinc-200 rounded-3xl p-5 shadow-xs flex items-center gap-4 hover-lift">
                <div className="w-12 h-12 rounded-2xl bg-indigo-50 border border-indigo-100 text-indigo-650 flex items-center justify-center flex-shrink-0">
                  <Icon name="landmark" size={24} />
                </div>
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Laba Kotor Penjualan</p>
                  <h4 className="text-xl font-black text-zinc-800">Rp {grossProfit.toLocaleString('id-ID')}</h4>
                  <p className="text-[10px] text-indigo-600 mt-1 font-bold">Margin: {marginPctDisplay.toFixed(1)}%</p>
                </div>
              </div>

              <div className="bg-white border border-zinc-200 rounded-3xl p-5 shadow-xs flex items-center gap-4 hover-lift">
                <div className="w-12 h-12 rounded-2xl bg-amber-50 border border-amber-100 text-amber-650 flex items-center justify-center flex-shrink-0">
                  <Icon name="shopping-bag" size={24} />
                </div>
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Pengeluaran & Operasional</p>
                  <h4 className="text-xl font-black text-zinc-800">Rp {(buyTotal + takeTotal + voidTotal).toLocaleString('id-ID')}</h4>
                  <p className="text-[10px] text-zinc-450 mt-1 font-medium">Beli: Rp {buyTotal.toLocaleString('id-ID')} | Ambil: Rp {takeTotal.toLocaleString('id-ID')}</p>
                </div>
              </div>

              <div className="bg-white border border-zinc-200 rounded-3xl p-5 shadow-xs flex items-center gap-4 hover-lift">
                <div className="w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-100 text-emerald-650 flex items-center justify-center flex-shrink-0">
                  <Icon name="trending-up" size={24} />
                </div>
                <div>
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-0.5">Laba Bersih Akhir</p>
                  <h4 className={`text-xl font-black ${netProfit >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    Rp {netProfit.toLocaleString('id-ID')}
                  </h4>
                  <p className="text-[10px] text-zinc-450 mt-1 font-medium">Setelah pengadaan & retur</p>
                </div>
              </div>
            </div>

            {/* Middle Section: Cost breakdown, BEP Simulator, Restock Plan */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Card 1: Expenditure details */}

                <div>
                  <h4 className="font-extrabold text-sm text-zinc-800 mb-4 flex items-center gap-2">
                    <Icon name="pie-chart" size={16} className="text-zinc-600" />
                    <span>Rincian Pengeluaran Ritel</span>
                  </h4>

                    <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                      <span className="text-xs text-zinc-500 font-semibold flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-sky-500"></span>Pembelian (Buy)</span>
                      <span className="text-xs font-bold text-zinc-800">Rp {buyTotal.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                      <span className="text-xs text-zinc-500 font-semibold flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-violet-500"></span>Ambil Stok (Take)</span>
                      <span className="text-xs font-bold text-zinc-800">Rp {takeTotal.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                      <span className="text-xs text-zinc-500 font-semibold flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-rose-500"></span>Void Barang (Void)</span>
                      <span className="text-xs font-bold text-zinc-800">Rp {voidTotal.toLocaleString('id-ID')}</span>
                    </div>
                    <div className="flex justify-between items-center py-2">
                      <span className="text-xs text-zinc-500 font-semibold flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500"></span>Retur Supplier (Refund)</span>
                      <span className="text-xs font-bold text-emerald-600">+ Rp {refundTotal.toLocaleString('id-ID')}</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Card 2: Break-Even Simulator */}
              <div className="bg-white border border-zinc-200 rounded-3xl p-5 shadow-xs flex flex-col justify-between text-left">
                <div>
                  <div className="flex justify-between items-center mb-3">
                    <h4 className="font-extrabold text-sm text-zinc-800 flex items-center gap-2">
                      <Icon name="calculator" size={16} className="text-amber-500" />
                      <span>Simulator Titik Impas (BEP)</span>
                    </h4>
                    <button
                      onClick={() => {
                        const val = prompt("Masukkan biaya operasional tetap bulanan (sewa, listrik, dll) (Rp):", fixedExpenses);
                        if (val !== null && !isNaN(Number(val)) && Number(val) >= 0) {
                          setFixedExpenses(Number(val));
                          app.addToast("Biaya operasional tetap diperbarui", "success");
                        }
                      }}
                      className="p-1 px-2 bg-zinc-50 hover:bg-zinc-150 text-zinc-500 border border-zinc-200 rounded-lg text-[10px] font-bold transition flex items-center gap-0.5"
                      title="Set Biaya"
                    >
                      <Icon name="edit" size={10} /> Set Biaya
                    </button>
                  </div>

                  <div className="space-y-2.5 text-xs text-zinc-650">
                    <div className="flex justify-between">
                      <span>Biaya Operasional Tetap / Bulan:</span>
                      <strong className="text-zinc-800">Rp {fixedExpenses.toLocaleString('id-ID')}</strong>
                    </div>
                    <div className="flex justify-between">
                      <span>Omset Titik Impas / Bulan (BEP):</span>
                      <strong className="text-zinc-800">Rp {Math.round(bepRevenue).toLocaleString('id-ID')}</strong>
                    </div>
                    <div className="flex justify-between border-b border-zinc-100 pb-2">
                      <span>Target Omset Harian:</span>
                      <strong className="text-indigo-650 font-bold">Rp {Math.round(bepDaily).toLocaleString('id-ID')}</strong>
                    </div>
                  </div>
                </div>

                <div className={`mt-3 p-3 rounded-2xl border text-xs leading-normal font-medium ${isBebCovered ? 'bg-emerald-50/50 border-emerald-100 text-emerald-800' : 'bg-amber-50/50 border-amber-100 text-amber-800'}`}>
                  <div className="flex gap-2">
                    <Icon name={isBebCovered ? "check-circle" : "alert-triangle"} size={14} className="flex-shrink-0 mt-0.5" />
                    <div>
                      {isBebCovered ? (
                        <span>Omset harian rata-rata Anda saat ini (<strong>Rp {Math.round(currentDailyAvg).toLocaleString('id-ID')}</strong>) melampaui target titik impas.</span>
                      ) : (
                        <span>Rata-rata omset harian saat ini masih di bawah titik impas. Butuh tambahan omset sebesar <strong>Rp {Math.round(bepDaily - currentDailyAvg).toLocaleString('id-ID')}</strong> per hari.</span>
                      )}
                    </div>
                  </div>
                </div>
              </div>

              {/* Card 3: Restock Plan */}
              <div className="bg-white border border-zinc-200 rounded-3xl p-5 shadow-xs flex flex-col justify-between text-left">
                <div>
                  <div className="flex justify-between items-center mb-3">
                    <h4 className="font-extrabold text-sm text-zinc-800 flex items-center gap-2">
                      <Icon name="package-plus" size={16} className="text-emerald-500" />
                      <span>Rencana Anggaran Belanja (Restock)</span>
                    </h4>
                  </div>
                  <div className="overflow-y-auto max-h-40 custom-scroll pr-1">
                    <table className="w-full text-xs text-left">
                      <thead className="bg-zinc-50 text-zinc-500 border-b border-zinc-150 font-bold sticky top-0">
                        <tr>
                          <th className="p-1">Produk</th>
                          <th className="p-1 text-center">Stok</th>
                          <th className="p-1 text-right">Biaya</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-100">
                        {lowStockItems.length === 0 ? (
                          <tr><td colSpan="3" className="p-4 text-center text-zinc-400 font-medium">Stok semua aman!</td></tr>
                        ) : (
                          lowStockItems.map(p => {
                            const needed = Math.max(0, (p.minStock || 5) - p.stock);
                            const budget = needed * (p.cost || 0);
                            return (
                              <tr key={p.id} className="hover:bg-zinc-50/50">
                                <td className="p-1 py-1.5">
                                  <div className="font-bold text-zinc-700 truncate max-w-[100px]" title={p.name}>{p.name}</div>
                                </td>
                                <td className="p-1 text-center text-rose-600 font-bold">{p.stock} pcs</td>
                                <td className="p-1 text-right font-bold text-zinc-800">Rp {budget.toLocaleString('id-ID')}</td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="mt-3 pt-3 border-t border-zinc-100 flex justify-between items-center text-xs font-bold">
                  <span className="text-zinc-450">Total Budget Restock:</span>
                  <span className="text-rose-650 text-sm">Rp {totalRestockBudget.toLocaleString('id-ID')}</span>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderFullAuditLogs = () => {
        const fullLogs = db.auditLogs || [];
        return (
          <div className="bg-white border border-zinc-200 rounded-2xl p-5 shadow-xs flex flex-col ">
            <h4 className="font-bold text-sm text-zinc-800 mb-4 flex items-center gap-2">

              <span>Seluruh Catatan Audit Sistem ({fullLogs.length})</span>

            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left">
                <thead className="bg-zinc-50 border-b border-zinc-200 text-zinc-550 font-bold">
                  <tr>
                    <th className="p-3">Waktu</th>
                    <th className="p-3">Pengguna (Role)</th>
                    <th className="p-3">Aktivitas</th>
                    <th className="p-3">Detail</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-100">
                  {fullLogs.length === 0 ? (
                    <tr><td colSpan="4" className="p-6 text-center text-zinc-400">Tidak ada log aktivitas</td></tr>
                  ) : (
                    fullLogs.map(log => (
                      <tr key={log.id} className="hover:bg-zinc-50/50">
                        <td className="p-3 text-zinc-450 font-mono" style={{ whiteSpace: 'nowrap' }}>{new Date(log.timestamp).toLocaleString('id-ID')}</td>
                        <td className="p-3">
                          <div className="font-bold text-zinc-700">{log.user}</div>
                          <div className="text-[10px] text-zinc-400 font-medium">{log.role}</div>
                        </td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            log.action === 'Penjualan' ? 'bg-emerald-50 text-emerald-700' :
                            log.action === 'Diskon Manual' ? 'bg-amber-50 text-amber-700' :
                            log.action === 'Tambah Produk' ? 'bg-sky-50 text-sky-700' :
                            log.action === 'Ubah Produk' ? 'bg-indigo-50 text-indigo-700' :
                            log.action === 'Hapus Produk' ? 'bg-rose-50 text-rose-700' : 'bg-zinc-100 text-zinc-600'
                          }`}>{log.action}</span>
                        </td>
                        <td className="p-3 text-zinc-600 font-medium leading-relaxed">{log.details}</td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      const renderPerformanceDashboard = () => {
        return (
          <div className="space-y-6 text-left ">
            <div className="bg-white rounded-2xl border border-zinc-200 p-6 shadow-sm">
              <div className="flex items-center gap-3 mb-2">
                <span className="p-2.5 bg-emerald-50 text-emerald-600 rounded-xl"><Icon name="activity" size={20} /></span>
                <div>
                  <h4 className="font-bold text-zinc-800 text-sm">Status Kinerja & Kecepatan Website</h4>
                  <p className="text-xs text-zinc-400">Pemantauan kesehatan aplikasi, utilisasi memori cache, dan kecepatan sinkronisasi secara real-time.</p>
                </div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mt-6">
                <div className="p-4 bg-zinc-50 border border-zinc-200 rounded-2xl text-center">
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Rata-Rata Waktu Muat</p>

                  <span className="text-[9px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold mt-2 inline-block">Sangat Ringan</span>
                </div>
                <div className="p-4 bg-zinc-50 border border-zinc-200 rounded-2xl text-center">
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Hit-Rate Cache Database</p>
                  <p className="text-xl font-black text-sky-600 font-mono">100% Hit</p>
                  <span className="text-[9px] px-1.5 py-0.5 rounded bg-sky-50 text-sky-700 font-bold mt-2 inline-block">`__db_cache` Aktif</span>
                </div>
                <div className="p-4 bg-zinc-50 border border-zinc-200 rounded-2xl text-center">
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Status Supabase Realtime</p>
                  <p className="text-xl font-black text-emerald-600 font-mono">Tersambung</p>
                  <span className="text-[9px] px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold mt-2 inline-block">1 Channel Aktif</span>
                </div>
                <div className="p-4 bg-zinc-50 border border-zinc-200 rounded-2xl text-center">
                  <p className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1">Latensi Kamera & GPS</p>
                  <p className="text-xl font-black text-zinc-700 font-mono">~45 ms</p>
                  <span className="text-[9px] px-1.5 py-0.5 rounded bg-zinc-100 text-zinc-650 font-bold mt-2 inline-block">Optimal</span>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm">

                    <div>
                      <p className="font-bold text-zinc-700">Penyimpanan Terpakai</p>
                      <p className="text-[10px] text-zinc-400">Total data Smile POS</p>

                    <div>

                      <p className="text-[10px] text-zinc-400">Menghapus sesi tidak aktif setelah 7 hari</p>
                    </div>
                    <span className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold text-[9px]">AKTIF</span>
                  </div>
                  <div className="flex justify-between items-center p-3 bg-zinc-50 border border-zinc-200 rounded-xl">
                    <div>
                      <p className="font-bold text-zinc-700">Kompresi Gambar Monitoring</p>
                      <p className="text-[10px] text-zinc-400">Resolusi rendah 160x120 JPEG</p>
                    </div>
                    <span className="font-mono font-bold text-zinc-700">Quality: 0.45</span>
