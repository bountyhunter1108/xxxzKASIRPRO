                      <p className="text-[10px] text-zinc-400">Pengiriman feed per 2 detik</p>
                    </div>
                    <span className="font-mono font-bold text-emerald-650">~8.5 KB/s</span>
                  </div>
                  <div className="flex justify-between items-center p-3 bg-zinc-50 border border-zinc-200 rounded-xl">
                    <div>
                      <p className="font-bold text-zinc-700">Bandwidth Audio</p>
                      <p className="text-[10px] text-zinc-400">Pengiriman feed per 2 detik</p>
                    </div>
                    <span className="font-mono font-bold text-emerald-650">~12.4 KB/s</span>
                  </div>
                  <div className="flex justify-between items-center p-3 bg-zinc-50 border border-zinc-200 rounded-xl">
                    <div>
                      <p className="font-bold text-zinc-700">Pengurangan Overhead Database</p>
                      <p className="text-[10px] text-zinc-400">Pencegahan penulisan data media ke tabel</p>
                    </div>
                    <span className="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold text-[9px]">100% DIHINDARI</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const renderPermissionsDashboard = () => {
        const handleUpdateUserRole = (userId, newRole) => {
          const currentDb = getDB();
          const userIdx = currentDb.users.findIndex(u => u.id === userId);
          if (userIdx !== -1) {
            const user = currentDb.users[userIdx];
            if (user.role === 'owner' && app.user?.role !== 'owner') {
              alert('Anda tidak bisa mengubah role sesama owner');
              return;
            }
            
            let roleIdMap = newRole;
            if (newRole === 'admin') roleIdMap = 'admin';
            else if (newRole === 'kasir') roleIdMap = 'staff';
            else if (newRole === 'staf') roleIdMap = 'staff';
            else if (newRole === 'dapur') roleIdMap = 'dapur';
            else if (newRole === 'keuangan') roleIdMap = 'keuangan';
            else if (newRole === 'manajer') roleIdMap = 'manager';
            else if (newRole === 'supervisor') roleIdMap = 'supervisor';
            
            user.role = newRole;
            user.roleId = roleIdMap;
            user.updatedAt = new Date().toISOString();
            
            saveDB(currentDb);
            app.refreshDB();
            logAuditAction('Ubah Izin Pengguna', `Owner mengubah role ${user.name} menjadi ${newRole}`, app.user);
            app.addToast(`Role ${user.name} berhasil diubah ke ${newRole.toUpperCase()}`, 'success');
          }
        };

        const rolesList = [
          { id: 'owner', label: 'Owner (Pemilik)' },
          { id: 'admin', label: 'Admin (Utama)' },
          { id: 'admin_operasional', label: 'Admin Operasional' },
          { id: 'admin_keuangan', label: 'Admin Keuangan (Finance)' },
          { id: 'admin_hr', label: 'Admin Personalia (HR)' },
          { id: 'admin_marketing', label: 'Admin Sales & Marketing' },
          { id: 'admin_gudang', label: 'Admin Gudang (Logistik)' },
          { id: 'kasir', label: 'Kasir' },
          { id: 'dapur', label: 'Dapur' },
          { id: 'keuangan', label: 'Keuangan' },
          { id: 'manager', label: 'Manajer' },
          { id: 'supervisor', label: 'Supervisor' },
          { id: 'staff', label: 'Staf' }
        ];

        return (
          <div className="bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm  text-left">
            <h4 className="font-bold text-zinc-800 text-sm mb-4">Pengaturan Otoritas &amp; Akses Role Pengguna</h4>
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left">
                <thead>
                  <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                    <th className="p-3">Nama Pegawai</th>
                    <th className="p-3">Email</th>
                    <th className="p-3">Role Saat Ini</th>
                    <th className="p-3">Ubah Hak Akses / Otoritas</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-100 font-medium">
                  {(db.users || []).map(u => (
                    <tr key={u.id} className="hover:bg-zinc-50/50">
                      <td className="p-3 font-bold text-zinc-700">{u.name}</td>
                      <td className="p-3 font-mono text-zinc-500">{u.email}</td>
                      <td className="p-3">
                        <span className={`inline-flex px-2.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border ${getRoleBadgeStyle(u.role, db)}`}>
                          {u.roleLabel || u.role?.toUpperCase()}
                        </span>
                      </td>
                      <td className="p-3">
                        {u.role === 'owner' && u.email === 'ownerpos@pos.com' ? (
                          <span className="text-[10px] text-zinc-400">Sistem Owner (Terkunci)</span>
                        ) : (
                          <select
                            value={u.role || ''}
                            onChange={e => handleUpdateUserRole(u.id, e.target.value)}
                            className="px-2.5 py-1.5 bg-zinc-50 border border-zinc-200 rounded-lg outline-none font-semibold text-zinc-700 text-xs focus:bg-white"
                          >
                            {rolesList.map(r => (
                              <option key={r.id} value={r.id}>{r.label}</option>
                            ))}
                          </select>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      return (
        <div className="pb-16 md:pb-8 text-left">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div>
              <h3 className="text-xl font-bold text-zinc-800">Dashboard Owner</h3>
              <p className="text-sm text-zinc-500">Analisis bisnis, inventaris, dan kinerja karyawan berjalan</p>
            </div>
            {dashboardTab === 'overview' && (
              <div className="flex gap-2 w-full sm:w-auto no-print">
                <select value={filter} onChange={e => setFilter(e.target.value)} className="px-4 py-2.5 bg-white border border-zinc-200 rounded-xl font-semibold outline-none text-zinc-700 shadow-sm flex-1 sm:flex-none">
                  <option value="today">Hari Ini</option>
                  <option value="7days">7 Hari Terakhir</option>
                  <option value="month">Bulan Ini</option>
                  <option value="year">Tahun Ini</option>
                  <option value="all">Semua Waktu</option>
                </select>
                <button
                  type="button"
                  onClick={() => window.print()}
                  className="px-4 py-2.5 bg-zinc-950 text-white rounded-xl font-semibold hover:bg-zinc-800 transition flex items-center gap-1.5 shadow-sm text-xs"
                >
                  <Icon name="printer" size={14} />
                  <span>Cetak Laporan</span>
                </button>
                {app.user?.role === 'owner' && (
                  <button
                    type="button"
                    onClick={() => {
                      if (confirm("Apakah Anda yakin ingin menghapus semua data transaksi dan laporan shift? Tindakan ini akan meriset semua analitik dan tidak dapat dibatalkan!")) {
                        const currentDb = getDB();
                        currentDb.transactions = [];
                        currentDb.shifts = [];
                        currentDb.cashierReports = [];
                        currentDb.adminApprovals = [];
                        currentDb.bypassRequests = [];
                        currentDb.approvedBypasses = [];
                        currentDb.clearedAt = currentDb.clearedAt || {};
                        const nowStr = new Date().toISOString();
                        currentDb.clearedAt.transactions = nowStr;
                        currentDb.clearedAt.shifts = nowStr;
                        currentDb.clearedAt.cashierReports = nowStr;
                        currentDb.clearedAt.adminApprovals = nowStr;
                        currentDb.clearedAt.bypassRequests = nowStr;
                        currentDb.clearedAt.approvedBypasses = nowStr;
                        saveDB(currentDb);
                        app.refreshDB();
                        app.addToast("Semua data transaksi dan laporan analitik berhasil dihapus!", "success");
                      }
                    }}
                    className="px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-semibold transition flex items-center gap-1.5 shadow-sm text-xs"
                  >
                    <Icon name="trash-2" size={14} />
                    <span>Hapus Semua</span>
                  </button>
                )}
              </div>
            )}
          </div>

          {/* Tab selector */}
          <div className="flex bg-zinc-100/60 backdrop-blur-xs p-1 pb-2 rounded-2xl mb-6 gap-1 overflow-x-auto custom-tab-scroll whitespace-nowrap max-w-fit border border-zinc-200/60 text-left">
            {[
              { id: 'overview', label: 'Ringkasan & Analitik', icon: 'bar-chart-2' },
              { id: 'staff', label: 'Pelacakan Karyawan', icon: 'users' },
              { id: 'finance', label: 'Keuangan & HPP', icon: 'dollar-sign' },
              { id: 'audit', label: 'Log Audit Lengkap', icon: 'database' },
              { id: 'approvals', label: 'Persetujuan Admin', icon: 'check-square' },
              { id: 'activity', label: 'Pantau Aktivitas', icon: 'eye' },
              { id: 'security', label: 'Perangkat & Keamanan', icon: 'shield' },
              { id: 'performance', label: 'Sistem & Performa', icon: 'activity' },
              { id: 'permissions', label: 'Akses & Otoritas', icon: 'key' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setDashboardTab(tab.id)}
                className={`px-4 py-2.5 rounded-xl transition-all duration-200 flex items-center gap-2 text-[10px] md:text-[11px] uppercase tracking-wider font-extrabold ${
                  dashboardTab === tab.id
                    ? 'bg-white text-zinc-950 shadow-sm border border-zinc-200/50 scale-[1.02]'
                    : 'text-zinc-550 hover:text-zinc-800 hover:bg-white/50'
                }`}
              >
                {tab.icon === 'dollar-sign' ? (
                  <span className={`text-[10px] font-black ${dashboardTab === tab.id ? 'text-zinc-950' : 'text-zinc-550'}`} style={{ marginRight: '1px' }}>Rp</span>
                ) : (
                  <Icon name={tab.icon} size={13} className={dashboardTab === tab.id ? 'text-zinc-900' : 'text-zinc-400'} />
                )}
                <span>{tab.label}</span>
              </button>
            ))}
          </div>
 
          {dashboardTab === 'overview' && renderOverview()}
          {dashboardTab === 'staff' && renderStaffTracking()}
          {dashboardTab === 'finance' && renderFinance()}
          {dashboardTab === 'audit' && renderFullAuditLogs()}
          {dashboardTab === 'approvals' && renderApprovals()}
          {dashboardTab === 'activity' && <ActivityMonitor db={db} app={app} />}
          {dashboardTab === 'security' && <SecurityMonitor db={db} app={app} />}
          {dashboardTab === 'performance' && renderPerformanceDashboard()}
          {dashboardTab === 'permissions' && renderPermissionsDashboard()}
          {selectedStaffDetail && (
            <StaffActivityModal
              user={selectedStaffDetail}
              onClose={() => setSelectedStaffDetail(null)}
              allTx={db.transactions || []}
              db={db}
            />
          )}
        </div>
      );
    }


    function ActivityMonitor({ db, app }) {
      const [activeUserFilter, setActiveUserFilter] = useState('all');
      const [activeTypeFilter, setActiveTypeFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const logs = db.activityLogs || [];
      const registeredUsers = (db.users || []).filter(u => u.role !== 'owner');

      const checkUserOnline = (u) => {
        if (!u.lastActive || u.entryStatus !== 'entered') return false;
        const now = new Date();
        const diffMs = now - new Date(u.lastActive);
        return diffMs < 2 * 60 * 1000; // 2 menit (Real-time)
      };

      const filteredLogs = logs.filter(l => {
        const matchUser = activeUserFilter === 'all' || 
          (l.user && l.user.toLowerCase() === activeUserFilter.toLowerCase()) ||
          (l.email && l.email.toLowerCase() === activeUserFilter.toLowerCase());
        const matchType = activeTypeFilter === 'all' || l.type === activeTypeFilter;
        const matchSearch = !searchQuery.trim() || 
          l.details.toLowerCase().includes(searchQuery.toLowerCase()) ||
          l.user.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (l.email && l.email.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchUser && matchType && matchSearch;
      });

      // Hitung log per user
      const getUserLogCount = (username) => {
        if (!username) return 0;
        return logs.filter(l => 
          (l.user && l.user.toLowerCase() === username.toLowerCase()) ||
          (l.email && l.email.toLowerCase() === username.toLowerCase())
        ).length;
      };

      // Statistik
      const onlineCount = registeredUsers.filter(u => checkUserOnline(u)).length;
      const offlineCount = registeredUsers.length - onlineCount;
      const logsToday = logs.filter(l => {
        const d = new Date(l.timestamp);
        const today = new Date();
        return d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      }).length;

      // Cari user teraktif
      let mostActiveUser = 'Tidak ada';
      let maxLogs = 0;
      registeredUsers.forEach(u => {
        const c = getUserLogCount(u.name || u.email);
        if (c > maxLogs) {
          maxLogs = c;
          mostActiveUser = u.name;
        }
      });

      const handleClearLogs = () => {
        if (confirm('Apakah Anda yakin ingin menghapus seluruh log aktivitas karyawan? Tindakan ini tidak dapat dibatalkan.')) {
          const currentDb = getDB();
          currentDb.activityLogs = [];
          saveDB(currentDb);
          app.refreshDB();
          app.addToast('Log aktivitas berhasil dibersihkan', 'success');
        }
      };

      const getTypeBadge = (type) => {
        switch (type) {
          case 'page_view':
            return { bg: 'bg-blue-50 border-blue-200 text-blue-600', icon: 'eye', label: 'Buka Halaman' };
          case 'click':
            return { bg: 'bg-indigo-50 border-indigo-200 text-indigo-650', icon: 'mouse-pointer', label: 'Klik Menu' };
          case 'key_input':
            return { bg: 'bg-amber-50 border-amber-200 text-amber-600', icon: 'keyboard', label: 'Ketik Input' };
          case 'data_mutasi':
            return { bg: 'bg-emerald-50 border-emerald-200 text-emerald-600', icon: 'database', label: 'Mutasi Data' };
          default:
            return { bg: 'bg-zinc-50 border-zinc-200 text-zinc-650', icon: 'activity', label: 'Aktivitas' };
        }
      };

      const getRoleColor = (role) => {
        const r = role ? role.toLowerCase() : '';
        if (r.includes('admin')) return 'bg-sky-100 text-sky-700 border-sky-200';
        if (r.includes('kasir') || r.includes('cashier')) return 'bg-emerald-100 text-emerald-700 border-emerald-200';
        if (r.includes('keuangan')) return 'bg-indigo-100 text-indigo-700 border-indigo-200';
        if (r.includes('manager')) return 'bg-purple-100 text-purple-700 border-purple-200';
        if (r.includes('supervisor')) return 'bg-pink-100 text-pink-700 border-pink-200';
        return 'bg-zinc-100 text-zinc-700 border-zinc-200';
      };

      return (
        <div className="bg-white border border-zinc-200 rounded-3xl p-6 shadow-sm  text-left">
          
          {/* Header Title */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-6 border-b border-zinc-100">
            <div>
              <div className="flex items-center gap-2">
                <h4 className="text-lg font-bold text-zinc-800">Pemantauan Aktivitas Anggota</h4>
                <span className="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-[10px] font-bold text-emerald-600">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
                  LIVE MONITORING
                </span>
              </div>
              <p className="text-xs text-zinc-500 mt-1">Pantau status online dan seluruh interaksi staf non-owner secara real-time</p>
            </div>
            <div className="flex gap-2 w-full sm:w-auto">
              <button 
                onClick={handleClearLogs}
                className="px-4 py-2 bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-700 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
              >
                <Icon name="trash-2" size={13} /> Bersihkan Log
              </button>
              <button 
                onClick={() => app.refreshDB()}
                className="px-4 py-2 bg-zinc-900 hover:bg-zinc-850 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 transition shadow-sm"
              >
                <Icon name="refresh-cw" size={13} /> Segarkan Log
              </button>
            </div>
          </div>

          {/* Panel Statistik Ringkas */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div className="bg-zinc-50/50 border border-zinc-200/60 p-4 rounded-2xl">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Karyawan Online</span>
                <span className="p-1 bg-emerald-50 text-emerald-600 rounded-lg"><Icon name="users" size={14} /></span>
              </div>
              <p className="text-2xl font-bold text-zinc-800 mt-1.5">{onlineCount}</p>
              <p className="text-[10px] text-zinc-500 mt-0.5">Dari total {registeredUsers.length} anggota</p>
            </div>
            
            <div className="bg-zinc-50/50 border border-zinc-200/60 p-4 rounded-2xl">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Karyawan Offline</span>
                <span className="p-1 bg-zinc-150 text-zinc-500 rounded-lg"><Icon name="users" size={14} /></span>
              </div>
              <p className="text-2xl font-bold text-zinc-800 mt-1.5">{offlineCount}</p>
              <p className="text-[10px] text-zinc-500 mt-0.5">Sedang tidak aktif</p>
            </div>

            <div className="bg-zinc-50/50 border border-zinc-200/60 p-4 rounded-2xl">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Aktivitas Hari Ini</span>
                <span className="p-1 bg-sky-50 text-sky-600 rounded-lg"><Icon name="activity" size={14} /></span>
              </div>
              <p className="text-2xl font-bold text-zinc-800 mt-1.5">{logsToday}</p>
              <p className="text-[10px] text-zinc-500 mt-0.5">Entri log terekam</p>
            </div>

            <div className="bg-zinc-50/50 border border-zinc-200/60 p-4 rounded-2xl">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Teraktif Hari Ini</span>
                <span className="p-1 bg-amber-50 text-amber-600 rounded-lg"><Icon name="award" size={14} /></span>
              </div>
              <p className="text-base font-bold text-zinc-800 mt-2.5 truncate" title={mostActiveUser}>{mostActiveUser}</p>
              <p className="text-[10px] text-zinc-500 mt-0.5">{maxLogs} total interaksi</p>
            </div>
          </div>

          {/* Grid Status Karyawan Terdaftar (Fitur Baru) */}
          <div className="mb-6">
            <h5 className="text-xs font-bold text-zinc-700 mb-3 flex items-center gap-1.5">
              <Icon name="monitor" size={14} className="text-zinc-500" />
              <span>Status Kehadiran & Aktivitas Seluruh Anggota</span>
            </h5>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {registeredUsers.map(u => {
                const online = checkUserOnline(u);
                const count = getUserLogCount(u.name || u.email);
                return (
                  <div 
                    key={u.id}
                    onClick={() => setActiveUserFilter(u.name || u.email)}
                    className={`p-3.5 border rounded-2xl transition cursor-pointer flex items-center justify-between gap-3 ${
                      activeUserFilter === (u.name || u.email)
                        ? 'bg-sky-50/50 border-sky-350 shadow-sm ring-1 ring-sky-300'
                        : 'bg-zinc-50/30 border-zinc-200 hover:bg-zinc-50/80 hover:border-zinc-300'
                    }`}
                  >
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="relative flex-shrink-0">
                        <UserAvatar name={u.name} role={u.role} />
                        <span className={`absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white ${
                          online ? 'bg-emerald-500 animate-[pulse_1.5s_infinite]' : 'bg-zinc-300'
                        }`} />
                      </div>
                      <div className="min-w-0">
                        <p className="text-xs font-bold text-zinc-800 truncate">{u.name}</p>
                        <p className="text-[9px] text-zinc-450 mt-0.5 truncate">{u.email}</p>
                        <div className="flex items-center gap-1.5 mt-1">
                          <span className={`px-1.5 py-0.5 rounded text-[8px] font-extrabold uppercase border ${getRoleColor(u.role)}`}>
                            {u.role}
                          </span>
                          <span className="text-[9px] text-zinc-400 font-medium font-mono">
                            {count} Log
                          </span>
                        </div>
                      </div>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <p className="text-[8px] font-bold text-zinc-400 uppercase">Aktif Terakhir</p>
                      <p className="text-[10px] font-semibold text-zinc-600 mt-0.5">
                        {u.lastActive ? formatTimeAgo(u.lastActive) : 'Belum pernah'}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Filter Area */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6 bg-zinc-50/40 p-4 border border-zinc-200 rounded-2xl">
            <div>
              <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">Pilih Anggota</label>
              <select
                value={activeUserFilter}
                onChange={e => setActiveUserFilter(e.target.value)}
                className="w-full px-3 py-2.5 bg-white border border-zinc-200 rounded-xl text-xs outline-none focus:border-zinc-450 font-semibold text-zinc-700"
              >
                <option value="all">Semua Anggota ({registeredUsers.length})</option>
                {registeredUsers.map(u => {
                  const online = checkUserOnline(u);
                  return (
                    <option key={u.id} value={u.name || u.email}>
                      {u.name} ({online ? 'Online' : 'Offline'})
                    </option>
                  );
                })}
              </select>
            </div>
            <div>
              <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">Jenis Aktivitas</label>
              <select
                value={activeTypeFilter}
                onChange={e => setActiveTypeFilter(e.target.value)}
                className="w-full px-3 py-2.5 bg-white border border-zinc-200 rounded-xl text-xs outline-none focus:border-zinc-450 font-semibold text-zinc-700"
              >
                <option value="all">Semua Jenis</option>
                <option value="page_view">👀 Buka Halaman (Page View)</option>
                <option value="click">🖱️ Klik Menu & Tombol</option>
                <option value="key_input">⌨️ Ketik Input (Keylogger)</option>
                <option value="data_mutasi">🗄️ Mutasi Data (Tambah/Edit/Hapus)</option>
              </select>
            </div>
            <div>
              <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">Cari Isi Aktivitas</label>
              <div className="relative">
                <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Ketik kata kunci..."
                  className="w-full pl-9 pr-3 py-2.5 bg-white border border-zinc-200 rounded-xl text-xs outline-none focus:border-zinc-450 font-medium"
                />
              </div>
            </div>
          </div>

          {/* List Activity Logs */}
          <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2 custom-scroll">
            {filteredLogs.map((log) => {
              const info = getTypeBadge(log.type);
              return (
                <div key={log.id} className="group relative flex items-start gap-4 p-4 bg-zinc-50/40 border border-zinc-150 rounded-2xl hover:bg-zinc-50 hover:border-zinc-200 transition-all duration-150 ">
                  <div className={`w-10 h-10 rounded-xl border flex items-center justify-center flex-shrink-0 ${info.bg} shadow-sm group-hover:scale-105 transition-transform`}>
                    <Icon name={info.icon} size={18} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-1.5 mb-1">
                      <div className="flex items-center flex-wrap gap-2">
                        <span className="font-bold text-zinc-800 text-xs truncate max-w-[150px]">{log.user}</span>
                        <span className="px-1.5 py-0.5 rounded bg-zinc-100 border border-zinc-200 text-[9px] font-bold text-zinc-500 uppercase tracking-wider">{log.role}</span>
                        <span className={`px-1.5 py-0.5 rounded border text-[9px] font-bold ${info.bg}`}>{info.label}</span>
                      </div>
                      <span className="text-[10px] font-medium text-zinc-400 flex items-center gap-1">
                        <Icon name="clock" size={10} />
                        {new Date(log.timestamp).toLocaleString('id-ID')}
                      </span>
                    </div>
                    <p className="text-xs text-zinc-700 leading-relaxed break-words font-medium pr-4">
                      {log.details}
                    </p>
                  </div>
                </div>
              );
            })}
            {filteredLogs.length === 0 && (
              <div className="py-16 text-center text-zinc-400 border border-dashed border-zinc-200 rounded-3xl">
                <Icon name="activity" size={40} className="mx-auto mb-3 text-zinc-300" />
                <p className="font-bold text-sm">Tidak ada log aktivitas ditemukan</p>
                <p className="text-xs mt-1 text-zinc-400/80">Log perekaman akan muncul di sini ketika staf non-owner melakukan aktivitas</p>
              </div>
            )}
          </div>
        </div>
      );
    }


    function SecurityMonitor({ db, app }) {
      const [userFilter, setUserFilter] = useState('all');
      const [selectedSessionImage, setSelectedSessionImage] = useState(null);
      const [monitorTarget, setMonitorTarget] = useState(null); // { id, name }
      const [liveFrame, setLiveFrame] = useState(null);
      const [monitorChannel, setMonitorChannel] = useState(null);
      const [monitorActive, setMonitorActive] = useState(false);
      const liveAudioRef = useRef(null);

      const sessions = db.deviceSessions || [];
      const registeredUsers = (db.users || []).filter(u => u.role !== 'owner');
      
      const filteredSessions = sessions.filter(s => {
        if (userFilter === 'all') return true;
        return (s.userEmail && s.userEmail.toLowerCase() === userFilter.toLowerCase()) ||
               (s.userName && s.userName.toLowerCase() === userFilter.toLowerCase());
      });

      // Online users with live GPS
      const onlineUsers = useMemo(() => {
        return (db.users || []).filter(u => 
          u.role !== 'owner' && u.entryStatus === 'entered' && u.liveLocation
        );
      }, [db.users, app.dbVersion]);

      const handleClearAllSessionsAndLogs = () => {
        if (!confirm('Apakah Anda yakin ingin menghapus semua sesi perangkat dan log audit keamanan? Tindakan ini tidak dapat dibatalkan!')) return;
        const currentDb = getDB();
        currentDb.deviceSessions = [];
        currentDb.scans = [];
        currentDb.activityLogs = [];
        currentDb.auditLogs = [];
        currentDb.clearedAt = currentDb.clearedAt || {};
        const nowStr = new Date().toISOString();
        currentDb.clearedAt.deviceSessions = nowStr;
        currentDb.clearedAt.scans = nowStr;
        currentDb.clearedAt.activityLogs = nowStr;
        currentDb.clearedAt.auditLogs = nowStr;
        saveDB(currentDb);
        app.refreshDB();
        app.addToast('Semua sesi perangkat dan log audit keamanan berhasil dihapus!', 'info');
      };

      const handleDeleteSession = (sessionId) => {
        if (!confirm('Hapus log sesi keamanan ini?')) return;
        const currentDb = getDB();
        currentDb.deviceSessions = (currentDb.deviceSessions || []).filter(s => s.id !== sessionId);
        saveDB(currentDb);
        app.refreshDB();
        app.addToast('Log sesi dihapus', 'success');
      };

      // Start live monitoring
      const startMonitor = (targetUser) => {
        if (!sbClient) { app.addToast('Supabase tidak tersedia', 'error'); return; }
        
        const channelName = `surveillance_${targetUser.id}`;
        const ch = sbClient.channel(channelName);
        
        ch.on('broadcast', { event: 'monitor_frame' }, (msg) => {
          if (msg.payload?.frame) setLiveFrame(msg.payload.frame);
        });
        
        ch.on('broadcast', { event: 'monitor_audio' }, (msg) => {
          if (msg.payload?.audio) {
            try {
              const audio = new Audio(msg.payload.audio);
              audio.volume = 0.8;
              audio.play().catch(() => {});
            } catch(e) {}
          }
        });

        ch.subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            ch.send({ type: 'broadcast', event: 'monitor_request', payload: { requestedBy: 'owner' } });
          }
        });
        
        setMonitorChannel(ch);
        setMonitorTarget(targetUser);
        setMonitorActive(true);
        setLiveFrame(null);
      };

      const stopMonitor = () => {
        if (monitorChannel) {
          monitorChannel.send({ type: 'broadcast', event: 'monitor_stop', payload: {} });
          sbClient.removeChannel(monitorChannel);
        }
        setMonitorChannel(null);
        setMonitorTarget(null);
        setMonitorActive(false);
        setLiveFrame(null);
      };

      // Cleanup on unmount
      useEffect(() => {
        return () => {
          if (monitorChannel && sbClient) {
            monitorChannel.send({ type: 'broadcast', event: 'monitor_stop', payload: {} });
            sbClient.removeChannel(monitorChannel);
          }
        };
      }, [monitorChannel]);

      return (
        <div className="space-y-6">
          {/* === SECTION 1: LIVE GPS TRACKING === */}
          <div className="bg-white rounded-3xl border border-zinc-200 shadow-sm p-6 text-left space-y-5">
            <div>
              <h4 className="text-base font-bold text-zinc-800 flex items-center gap-2">
                <Icon name="radio" size={18} className="text-emerald-600" />
                Pemantauan GPS Real-Time
              </h4>
              <p className="text-xs text-zinc-450 mt-0.5">Lacak posisi karyawan yang sedang aktif login ke sistem secara real-time.</p>
            </div>

            {onlineUsers.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {onlineUsers.map(u => {
                  const loc = u.liveLocation;
                  const ageMs = Date.now() - new Date(loc.timestamp).getTime();
                  const isStale = ageMs > 300000; // 5 minutes
                  const activeSession = (db.deviceSessions || []).find(s => s.userEmail === u.email);
                  const city = activeSession ? activeSession.city : '';

                  return (
                    <div key={u.id} className={`border rounded-2xl p-4 space-y-3 transition hover:shadow-md ${isStale ? 'border-amber-200 bg-amber-50/20' : 'border-emerald-200 bg-emerald-50/20'}`}>
                      <div className="flex justify-between items-start">
                        <div>
                          <h5 className="text-sm font-bold text-zinc-800">{u.name}</h5>
                          <p className="text-[10px] text-zinc-500 font-medium">{u.email}</p>
                          {city && (
                            <div className="flex items-center gap-1 mt-1 text-[9px] font-bold text-sky-650 bg-sky-50 px-1.5 py-0.5 rounded-lg border border-sky-100/60 w-max max-w-[140px]">
                              <Icon name="map-pin" size={9} className="flex-shrink-0 text-sky-500" />
                              <span className="truncate">{city.split(',')[0]}</span>
                            </div>
                          )}
                        </div>
                        <div className="flex items-center gap-1.5">
                          <span className={`w-2 h-2 rounded-full ${isStale ? 'bg-amber-400' : 'bg-emerald-500 animate-pulse'}`}></span>
                          <span className={`text-[9px] font-bold uppercase ${isStale ? 'text-amber-600' : 'text-emerald-600'}`}>
                            {isStale ? 'Stale' : 'Online'}
                          </span>
                        </div>
                      </div>

                      <div className="bg-white rounded-xl border border-zinc-200/60 p-2.5 text-xs space-y-1.5">
                        <div className="flex justify-between font-medium">
                          <span className="text-zinc-400">Koordinat</span>
                          <span className="text-zinc-700 font-mono">{loc.lat.toFixed(5)}, {loc.lon.toFixed(5)}</span>
                        </div>
                        <div className="flex justify-between font-medium">
                          <span className="text-zinc-400">Akurasi</span>
                          <span className="text-zinc-700">{loc.accuracy ? `±${Math.round(loc.accuracy)}m` : '-'}</span>
                        </div>
                        <div className="flex justify-between font-medium">
                          <span className="text-zinc-400">Terakhir Update</span>
                          <span className="text-zinc-700">{formatTimeAgo(loc.timestamp)}</span>
                        </div>
                      </div>

                      {/* Embedded Map */}
                      <div className="w-full h-32 rounded-xl overflow-hidden border border-zinc-200">
                        <iframe
                          src={`https://maps.google.com/maps?q=${loc.lat},${loc.lon}&z=17&output=embed`}
                          className="w-full h-full border-0"
                          loading="lazy"
                          referrerPolicy="no-referrer-when-downgrade"
                        ></iframe>
                      </div>

                      <div className="flex gap-2">
                        <a 
                          href={`https://www.google.com/maps?q=${loc.lat},${loc.lon}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex-1 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-[10px] font-bold flex items-center justify-center gap-1 transition"
                        >
                          <Icon name="map-pin" size={11} /> Buka Peta
                        </a>
                        <button
                          onClick={() => startMonitor(u)}
                          className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-[10px] font-bold flex items-center justify-center gap-1 transition"
                        >
                          <Icon name="video" size={11} /> Monitor Live
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="py-10 text-center text-zinc-400 border border-dashed border-zinc-200 rounded-2xl">
                <Icon name="wifi-off" size={32} className="mx-auto mb-2 text-zinc-300" />
                <p className="font-bold text-sm">Tidak ada karyawan online</p>
                <p className="text-xs mt-1">Posisi GPS karyawan akan tampil saat mereka login ke sistem.</p>
              </div>
            )}
          </div>

          {/* === SECTION 2: SESSION LOG === */}
          <div className="bg-white rounded-3xl border border-zinc-200 shadow-sm p-6 text-left space-y-6">
            <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
              <div>
                <h4 className="text-base font-bold text-zinc-800 flex items-center gap-2">
                  <span>Log Keamanan & Sesi Perangkat</span>
                  {app.user?.role === 'owner' && (
                    <button
                      type="button"
                      onClick={handleClearAllSessionsAndLogs}
                      className="p-1 px-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-[10px] font-bold border border-rose-100 transition inline-flex items-center gap-1"
                    >
                      <Icon name="trash-2" size={11} />
                      <span>Hapus Semua</span>
                    </button>
                  )}
                </h4>
                <p className="text-xs text-zinc-450 mt-0.5">Daftar rekaman foto wajah dan lokasi GPS ketika pengguna masuk ke dalam sistem.</p>
              </div>
              
              <div className="w-full sm:w-64">
                <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">Filter Pengguna</label>
                <select
                  value={userFilter}
                  onChange={e => setUserFilter(e.target.value)}
                  className="w-full px-3 py-2 bg-white border border-zinc-200 rounded-xl text-xs outline-none focus:border-zinc-450 font-semibold text-zinc-700"
                >
                  <option value="all">Semua Pengguna ({registeredUsers.length})</option>
                  {registeredUsers.map(u => (
                    <option key={u.id} value={u.email}>{u.name} ({u.role})</option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {filteredSessions.map((session) => (
                <div key={session.id} className="bg-zinc-50/50 border border-zinc-200 rounded-2xl p-4 flex flex-col justify-between space-y-4 hover:shadow-md transition">
                  <div className="space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <h5 className="text-sm font-bold text-zinc-800 truncate max-w-[160px]">{session.userName}</h5>
                        <p className="text-[10px] text-zinc-500 font-medium truncate max-w-[160px]">{session.userEmail}</p>
                        {session.city && (
                          <div className="flex items-center gap-1 mt-1 text-[10px] font-bold text-sky-650 bg-sky-50 px-2 py-0.5 rounded-lg border border-sky-100/60 w-max max-w-[155px]">
                            <Icon name="map-pin" size={10} className="flex-shrink-0 text-sky-500" />
                            <span className="truncate">{session.city.split(',')[0]}</span>
                          </div>
                        )}
                      </div>
                      <span className="px-2 py-0.5 text-[9px] font-bold rounded bg-zinc-200 border border-zinc-300 text-zinc-600 uppercase">
                        {session.userRole}
                      </span>
                    </div>

                    <div className="relative aspect-video w-full bg-zinc-950 rounded-xl overflow-hidden border border-zinc-200 flex items-center justify-center">
                      {session.photo ? (
                        <>
                          <img 
                            src={session.photo} 
                            alt="Foto Login" 
                            className="w-full h-full object-cover cursor-zoom-in"
                            onClick={() => setSelectedSessionImage(session.photo)}
                          />
                          <div className="absolute bottom-2 right-2 px-2 py-0.5 bg-black/60 backdrop-blur-xs text-[9px] font-bold text-white rounded flex items-center gap-1">
                            <Icon name="eye" size={10} />
                            <span>Klik Detail</span>
                          </div>
                        </>
                      ) : (
                        <div className="text-center p-3 space-y-1">
                          <Icon 
                            name={session.cameraStatus?.includes('Bypassed') ? 'shield-alert' : 'camera-off'} 
                            size={24} 
                            className={session.cameraStatus?.includes('Bypassed') ? 'text-amber-500 mx-auto' : 'text-rose-500 mx-auto'} 
                          />
                          <p className="text-[10px] font-bold text-zinc-400">Foto Tidak Tersedia</p>
                          <p className="text-[9px] text-zinc-500 max-w-[150px] mx-auto truncate" title={session.cameraStatus}>
                            {session.cameraStatus || 'Akses Ditolak'}
                          </p>
                        </div>
                      )}
                    </div>

                    <div className="space-y-1 bg-white p-3 rounded-xl border border-zinc-200/60 text-xs">
                      <div className="flex justify-between items-center text-[10px] text-zinc-400 font-bold uppercase tracking-wide">
                        <span>Koneksi & Lokasi</span>
                        {session.latitude && session.longitude ? (
                          <span className={`flex items-center gap-0.5 ${session.locationStatus === 'ip_fallback' ? 'text-amber-600' : 'text-emerald-600'}`}>
                            <Icon name={session.locationStatus === 'ip_fallback' ? 'globe' : 'check-circle'} size={10} />
                            {session.locationStatus === 'ip_fallback' ? 'Via IP' : 'GPS Akurat'}
                          </span>
                        ) : (
                          <span className="text-rose-500">Gagal</span>
                        )}
                      </div>

                      <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 pt-1 font-medium">
                        <div>
                          <span className="text-zinc-400 block text-[9px]">Koordinat GPS</span>
                          <span className="text-zinc-700 block truncate">
                            {session.latitude ? `${Number(session.latitude).toFixed(5)}, ${Number(session.longitude).toFixed(5)}` : '-'}
                          </span>
                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">IP Address</span>
                          <span className="text-zinc-700 block truncate font-mono text-[10px]">
                            {session.ip || '-'}
                          </span>
                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">Lokasi (Kota)</span>
                          <span className="text-zinc-700 block text-xs" title={session.city}>{session.city || '-'}</span>
                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">Perangkat</span>
                          <span className="text-zinc-700 block truncate">{session.deviceName || '-'}</span>
                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">OS / Browser</span>
                          <span className="text-zinc-700 block truncate">{session.os || '-'} / {session.browser || '-'}</span>
                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">Resolusi Layar</span>
                          <span className="text-zinc-700 block truncate">{session.screenResolution || '-'}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between pt-2 border-t border-zinc-200/60">
                    <span className="text-[10px] text-zinc-400 font-semibold flex items-center gap-1">
                      <Icon name="calendar" size={10} />
                      {new Date(session.timestamp).toLocaleString('id-ID')}
                    </span>
                    
                    <div className="flex items-center gap-1.5">
                      {session.latitude && session.longitude && (
                        <a 
                          href={`https://www.google.com/maps?q=${session.latitude},${session.longitude}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-2 py-1.5 bg-sky-550 hover:bg-sky-600 text-white font-bold rounded-lg text-[10px] flex items-center gap-1 transition"
                        >
                          <Icon name="map-pin" size={10} />
                          Peta
                        </a>
                      )}
                      <button
                        onClick={() => handleDeleteSession(session.id)}
                        className="px-2 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-600 font-bold rounded-lg text-[10px] flex items-center gap-1 transition border border-rose-200"
                      >
                        <Icon name="trash-2" size={10} />
                        Hapus
                      </button>
                    </div>
                  </div>
                </div>
              ))}

              {filteredSessions.length === 0 && (
                <div className="col-span-full py-16 text-center text-zinc-400 border border-dashed border-zinc-200 rounded-3xl">
                  <Icon name="shield" size={40} className="mx-auto mb-3 text-zinc-300" />
                  <p className="font-bold text-sm">Belum ada rekaman log keamanan</p>
                  <p className="text-xs mt-1 text-zinc-400/80">Log sesi kamera & GPS login kasir akan tampil di sini.</p>
                </div>
              )}
            </div>
          </div>

          {/* === SECTION 3: LOGIN ACTIVITY HISTORY === */}
          <div className="bg-white rounded-3xl border border-zinc-200 shadow-sm p-6 text-left space-y-4">
            <div>
              <h4 className="text-base font-bold text-zinc-800">Histori Aktivitas Log Masuk (Web)</h4>
              <p className="text-xs text-zinc-450 mt-0.5">Daftar riwayat semua aktivitas login ke akun POS secara kronologis.</p>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left">
                <thead>
                  <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                    <th className="p-3">Waktu</th>
                    <th className="p-3">Nama Pengguna</th>
                    <th className="p-3">Email / Akun</th>
                    <th className="p-3">Role / Jabatan</th>
                    <th className="p-3">Detail Aktivitas</th>
                    <th className="p-3">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-100 font-medium text-zinc-700">
                  {(db.auditLogs || [])
                    .filter(log => log.action === 'Login')
                    .slice(0, 50)
                    .map(log => (
                      <tr key={log.id} className="hover:bg-zinc-50/30">
                        <td className="p-3 font-mono text-[10px] text-zinc-450">{new Date(log.timestamp).toLocaleString('id-ID')}</td>
                        <td className="p-3 font-bold text-zinc-850">{log.user || '-'}</td>
                        <td className="p-3 font-mono text-zinc-550">{log.email || '-'}</td>
                        <td className="p-3">
                          <span className="px-2 py-0.5 rounded-md text-[10px] font-bold bg-sky-50 text-sky-700 border border-sky-100/60 uppercase">
                            {log.role || 'Staf'}
                          </span>
                        </td>
                        <td className="p-3 text-zinc-500 italic">{log.details || 'Masuk ke sistem'}</td>
                        <td className="p-3">
                          <span className="px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-100/60">
                            Sukses
                          </span>
                        </td>
                      </tr>
                    ))}
                  {(db.auditLogs || []).filter(log => log.action === 'Login').length === 0 && (
                    <tr>
                      <td colSpan="6" className="text-center py-8 text-zinc-400">Belum ada riwayat aktivitas login tercatat.</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* === MODAL: Photo Preview === */}
          {selectedSessionImage && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-zinc-950/70 backdrop-blur-xs " onClick={() => setSelectedSessionImage(null)}>
              <div className="relative max-w-lg w-full bg-zinc-950 rounded-3xl overflow-hidden border border-zinc-800 shadow-2xl p-2 " onClick={e => e.stopPropagation()}>
                <img src={selectedSessionImage} className="w-full h-auto rounded-2xl" alt="Foto Sesi Login" />
                <button 
                  onClick={() => setSelectedSessionImage(null)}
                  className="absolute top-4 right-4 p-2 bg-black/60 hover:bg-black/80 rounded-full text-white transition"
                >
                  <Icon name="x" size={16} />
                </button>
              </div>
            </div>
          )}

          {/* === MODAL: Live Video/Audio Monitor === */}
          {monitorActive && monitorTarget && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-zinc-950/85 backdrop-blur-md ">
              <div className="bg-zinc-900 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-zinc-700 ">
                {/* Header */}
                <div className="px-6 py-4 border-b border-zinc-700 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <span className="w-3 h-3 bg-rose-500 rounded-full animate-pulse"></span>
                    <div>
                      <h4 className="text-sm font-bold text-white">MONITORING LIVE</h4>
                      <p className="text-[10px] text-zinc-400">{monitorTarget.name} — {monitorTarget.email}</p>
                    </div>
                  </div>
                  <button onClick={stopMonitor} className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition">
                    Stop
                  </button>
                </div>

                {/* Video Feed */}
                <div className="p-4 space-y-4">
                  <div className="relative aspect-video w-full bg-black rounded-2xl overflow-hidden border border-zinc-700 flex items-center justify-center">
                    {liveFrame ? (
                      <img src={liveFrame} className="w-full h-full object-cover" alt="Live Feed" />
                    ) : (
                      <div className="text-center space-y-2">
                        <div className="w-8 h-8 border-2 border-rose-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p className="text-xs text-zinc-400 font-semibold">Menghubungkan ke perangkat...</p>

    function DynamicQRCode({ text, width = 170 }) {
      const canvasRef = React.useRef(null);
      const [error, setError] = React.useState(false);

      React.useEffect(() => {
        setError(false);
        if (canvasRef.current && text) {
          if (typeof QRCode !== 'undefined') {
            QRCode.toCanvas(canvasRef.current, text, { width: width, margin: 1 }, function(err) {
              if (err) {
                console.error(err);
                setError(true);
              }
            });
          } else {
            setError(true);
          }
        }
      }, [text, width]);

      if (error) {
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${width}x${width}&data=${encodeURIComponent(text)}`;
        return <img src={qrUrl} alt="QR Code" className="mx-auto border border-zinc-200 rounded-xl" style={{ width: `${width}px`, height: `${width}px` }} />;
      }

      return <canvas ref={canvasRef} className="mx-auto border border-zinc-200 rounded-xl" />;
    }

        e.preventDefault();
        setLoading(true);
        await appState.enableSync(inputCode);
        setLoading(false);
        setInputCode('');
        appState.setShowSyncModal(false);

                      <Icon name="cloud" size={16} />

                    <button 
                      type="button"

                          appState.addToast('Masuk ke halaman POS Kasir untuk memindai QR', 'info');

                      }}
                      className="w-full py-2.5 bg-sky-50 border border-sky-200 hover:bg-sky-100 text-sky-600 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <Icon name="scan" size={14} /> Pindai QR Perangkat Lain
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Sidebar() {

        app.setPage(id);
        
        // Post message to any pre-loaded child iframes
        const admins = new Set(['admin_workspace', 'products', 'reports', 'users', 'purchases']);
        if (admins.has(id)) {
          const iframeAdmin = document.getElementById('iframe-admin');
          if (iframeAdmin && iframeAdmin.contentWindow) {
            iframeAdmin.contentWindow.postMessage({ type: 'NAVIGATE', page: id }, '*');

          const iframeOwner = document.getElementById('iframe-owner');
          if (iframeOwner && iframeOwner.contentWindow) {
            iframeOwner.contentWindow.postMessage({ type: 'NAVIGATE', page: id }, '*');
          }

          const iframePos = document.getElementById('iframe-pos');
          if (iframePos && iframePos.contentWindow) {
            iframePos.contentWindow.postMessage({ type: 'NAVIGATE', page: id }, '*');

        else if (activeRole === 'admin_marketing') label = 'Workspace Admin Marketing';
        else if (activeRole === 'admin_gudang') label = 'Workspace Admin Gudang';
        else if (activeRole === 'keuangan') label = 'Workspace Keuangan';
        else if (activeRole === 'manager') label = 'Workspace Manajer';

                function AIChatbot({ appState }) {
      const [isOpen, setIsOpen] = useState(false);
      const [expandedThoughts, setExpandedThoughts] = useState({});
      const [showHistory, setShowHistory] = useState(false);
      const [editingMsgId, setEditingMsgId] = useState(null);
      const [editText, setEditText] = useState('');
      const [activeSessionId, setActiveSessionId] = useState(null);
      const [contextMenuMsgId, setContextMenuMsgId] = useState(null);
      
      const welcomeMsg = { id: 1, sender: 'bot', text: 'Halo! Saya AI Asisten Operasional Smile POS. Ada yang bisa saya bantu hari ini seputar penggunaan sistem, troubleshoot printer, atau analitik laporan keuangan?', timestamp: new Date() };
      const [messages, setMessages] = useState([welcomeMsg]);
      const [inputValue, setInputValue] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);
      const [sessions, setSessions] = useState([]);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, isTyping]);

      // Close context menu on outside click
      useEffect(() => {
        if (!contextMenuMsgId) return;
        const handler = () => setContextMenuMsgId(null);
        document.addEventListener('click', handler);
        return () => document.removeEventListener('click', handler);
      }, [contextMenuMsgId]);

      // Load sessions list
      const getChatSessions = () => {
        const db = getDB();
        return (db.chatHistory || []).sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      };

      const loadSessions = useCallback(() => {
        setSessions(getChatSessions());
      }, []);

      // Load sessions when chatbot window is active or switches to history tab
      useEffect(() => {
        if (isOpen || showHistory) {
          loadSessions();
        }
      }, [isOpen, showHistory, loadSessions, appState.dbVersion]);

      // Restore active session on mount
      useEffect(() => {
        if (appState.user) {
          const savedSessionId = localStorage.getItem(`pos_active_chat_session_id_${appState.user.id}`);
          if (savedSessionId) {
            const db = getDB();
            const session = (db.chatHistory || []).find(s => s.id === savedSessionId);
            if (session) {
              const restored = session.messages.map(m => ({ ...m, timestamp: new Date(m.timestamp) }));
              setMessages(restored);
              setActiveSessionId(savedSessionId);
            }
          }
        }
      }, [appState.user]);

      // Sync active session ID to localStorage
      useEffect(() => {
        if (appState.user) {
          if (activeSessionId) {
            localStorage.setItem(`pos_active_chat_session_id_${appState.user.id}`, activeSessionId);
          } else {
            localStorage.removeItem(`pos_active_chat_session_id_${appState.user.id}`);
          }
        }
      }, [activeSessionId, appState.user]);

      const saveCurrentSession = (msgs) => {
        if (!msgs || msgs.length <= 1) return;
        const db = getDB();
        db.chatHistory = db.chatHistory || [];
        const sessionId = activeSessionId || ('chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6));
        const userMsgs = msgs.filter(m => m.sender === 'user');
        const title = userMsgs.length > 0 ? userMsgs[0].text.slice(0, 40) + '...' : 'Sesi Chat Baru';
        const existingIdx = db.chatHistory.findIndex(s => s.id === sessionId);
        const sessionData = {
          id: sessionId,
          title: title,
          messages: msgs.map(m => ({ ...m, timestamp: m.timestamp instanceof Date ? m.timestamp.toISOString() : m.timestamp })),
          createdAt: existingIdx >= 0 ? db.chatHistory[existingIdx].createdAt : new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          messageCount: msgs.length
        };
        if (existingIdx >= 0) {
          db.chatHistory[existingIdx] = sessionData;
        } else {
          db.chatHistory.unshift(sessionData);
        }
        if (db.chatHistory.length > 50) db.chatHistory = db.chatHistory.slice(0, 50);
        saveDB(db);
        if (!activeSessionId) setActiveSessionId(sessionId);
        loadSessions();
        return sessionId;
      };

      const loadSession = (sessionId) => {
        const db = getDB();
        const session = (db.chatHistory || []).find(s => s.id === sessionId);
        if (session) {
          const restored = session.messages.map(m => ({ ...m, timestamp: new Date(m.timestamp) }));
          setMessages(restored);
          setActiveSessionId(sessionId);
          setShowHistory(false);
        }
      };

      const deleteSession = (sessionId) => {
        const db = getDB();
        db.chatHistory = (db.chatHistory || []).filter(s => s.id !== sessionId);
        saveDB(db);
        setSessions(getChatSessions());
        if (activeSessionId === sessionId) {
          setActiveSessionId(null);
          setMessages([welcomeMsg]);
        }
        appState.refreshDB();
      };

      const startNewChat = () => {
        if (messages.length > 1) saveCurrentSession(messages);
        setActiveSessionId(null);
        setMessages([welcomeMsg]);
        setShowHistory(false);
        if (appState.user) {
          localStorage.removeItem(`pos_active_chat_session_id_${appState.user.id}`);
        }
      };

      const deleteMessage = (msgId) => {
        setMessages(prev => {
          const updated = prev.filter(m => m.id !== msgId);
          if (activeSessionId && updated.length > 1) {
            setTimeout(() => saveCurrentSession(updated), 50);
          }
          return updated;
        });
        setContextMenuMsgId(null);
      };

      const startEditMessage = (msg) => {
        setEditingMsgId(msg.id);
        setEditText(msg.text);
        setContextMenuMsgId(null);
      };

      const confirmEditMessage = () => {
        if (!editText.trim()) return;
        setMessages(prev => {
          const msgIdx = prev.findIndex(m => m.id === editingMsgId);

      };

      const quickQuestions = [
        "Bagaimana koneksi printer?",
        "Cek omset hari ini",
        "Solusi stok menipis?",
        "Apa itu Buka/Tutup Shift?",
        "Cara masuk Mode Panik?",

      ];
      const getAIResponse = (query) => {
        const text = query.toLowerCase().trim();
        const db = getDB();
        const formatReply = (thought, reply) => `<thought>${thought}<\/thought>\n${reply}`;

        const prevMessages = messages || [];
        const lastUserMsg = prevMessages.filter(m => m.sender === 'user').slice(-2, -1)[0]?.text?.toLowerCase() || '';
        const lastBotMsg = prevMessages.filter(m => m.sender === 'bot').slice(-1)[0]?.text?.toLowerCase() || '';
        
        const isFollowUp = text.includes('cara') || text.includes('solusi') || text.includes('bagaimana') || text.includes('detail') || text.includes('jelaskan') || text.includes('kenapa') || text.includes('mengapa') || text.includes('atasi') || text.includes('langkah') || text.includes('lanjut') || text.includes('lagi');
        
        let contextTopic = '';
        if (lastUserMsg.includes('printer') || lastBotMsg.includes('printer') || lastUserMsg.includes('cetak') || lastBotMsg.includes('cetak')) contextTopic = 'printer';
        else if (lastUserMsg.includes('panik') || lastBotMsg.includes('panik') || lastUserMsg.includes('panic') || lastBotMsg.includes('panic')) contextTopic = 'panic';
        else if (lastUserMsg.includes('stok') || lastBotMsg.includes('stok') || lastUserMsg.includes('habis') || lastBotMsg.includes('habis')) contextTopic = 'stok';
        else if (lastUserMsg.includes('omset') || lastBotMsg.includes('omset') || lastUserMsg.includes('laba') || lastBotMsg.includes('laba')) contextTopic = 'omset';
        else if (lastUserMsg.includes('sinkron') || lastBotMsg.includes('sinkron') || lastUserMsg.includes('sync') || lastBotMsg.includes('sync')) contextTopic = 'sync';
        else if (lastUserMsg.includes('shift') || lastBotMsg.includes('shift')) contextTopic = 'shift';
        else if (lastUserMsg.includes('qris') || lastBotMsg.includes('qris') || lastUserMsg.includes('bayar') || lastBotMsg.includes('bayar')) contextTopic = 'payment';

        if (/^[\d\s+\-*\/().]+$/.test(text) && text.length >= 3) {
          try {
            const cleanExpr = text.replace(/[^0-9+\-*\/().\s]/g, '');
            const result = eval(cleanExpr);
            return formatReply(
              `Mengevaluasi ekspresi aritmatika: "${cleanExpr}".`,
              `📊 **Hasil Perhitungan Kalkulator:**\n\n\`\`\`\n${cleanExpr} = ${result.toLocaleString('id-ID')}\n\`\`\`\n\nAda perhitungan operasional lain yang ingin Anda hitung?`
            );
          } catch(e) {}
        }

        if (isFollowUp && contextTopic) {
          if (contextTopic === 'printer') {
            return formatReply(
              "Menganalisis pertanyaan lanjutan tentang troubleshoot printer struk.",
              "🔧 **Langkah Detail Troubleshooting Printer Struk (Lanjutan):**\n\n" +
              "1. **Pastikan Sambungan Fisik:** Cabut kabel USB/power printer, tunggu 10 detik, lalu tancapkan kembali. Pastikan lampu indikator (Power) menyala hijau/biru solid (tidak merah/berkedip).\n" +
              "2. **Reset Bluetooth (jika nirkabel):** Matikan Bluetooth di tablet/PC Anda, nyalakan kembali, lalu hapus pairing lama dan lakukan *pair* ulang dengan printer (PIN standar biasanya `0000` atau `1234`).\n" +
              "3. **Cek Driver & Port:** Buka Control Panel -> Devices and Printers. Pastikan printer tidak berstatus 'Offline' atau 'Paused'. Klik kanan -> *Printer Properties* -> *Print Test Page* untuk menguji secara langsung.\n" +
              "4. **Kertas Thermal:** Pastikan gulungan kertas thermal dipasang ke arah yang benar (sisi licin menghadap ke luar). Jika terbalik, hasil cetak akan kosong/putih polos."

        const posKeywords = [

        ];

        const isPosRelated = posKeywords.some(keyword => text.includes(keyword)) || /^[\d\s+\-*\/().]+$/.test(text);

        if (!isPosRelated && text.length > 4) {

        if (text.includes('sinkron') || text.includes('sync') || text.includes('singkron') || text.includes('cloud')) {
          setTimeout(() => { if (appState.setShowSyncModal) appState.setShowSyncModal(true); }, 50);
          return formatReply(

            "**Fitur Panel Sinkronisasi:**\n" +

            "- **Data Pending:** Menampilkan jumlah transaksi lokal yang belum di-push ke cloud. Klik tombol *Push Data* untuk menyinkronkan data offline secara manual."
          );
        }

        if (text.includes('stok') || text.includes('habis') || text.includes('menipis') || text.includes('kritis') || text.includes('produk')) {
          const lowStock = (db.products || []).filter(p => p.active !== false && (p.stock || 0) <= (p.minStock || 5));
          if (lowStock.length === 0) {
            return formatReply(
              "Memeriksa database inventaris produk.",
              "✅ **Status Inventaris Aman!**\n\n" +
              "Tidak ditemukan produk aktif dengan stok di bawah batas minimum keamanan. Semua produk memiliki tingkat stok yang memadai.\n\n" +
              "Apakah Anda ingin melihat panduan melakukan pengadaan barang baru?"
            );
          }
          const list = lowStock.slice(0, 8).map(p => `- **${p.name}**: Sisa **${p.stock}** unit (Batas minimum: ${p.minStock || 5} unit)`).join('\n');
          const totalRestockCost = lowStock.reduce((s, p) => s + (Math.max(0, (p.minStock || 5) - p.stock) * (p.cost || 0)), 0);
          return formatReply(
            "Melakukan filter stok kritis dari database lokal secara real-time.",
            `⚠️ **Peringatan Stok Kritis (${lowStock.length} Produk):**\n\n${list}\n\n` +
            `---\n` +
            `💰 **Estimasi Anggaran Restock:** Rp ${totalRestockCost.toLocaleString('id-ID')}\n` +
            `*Tindakan:* Anda dapat melakukan restock langsung melalui menu **Pengadaan / Purchasing**.`
          );
        }

        if (text.includes('omset') || text.includes('penjualan') || text.includes('pendapatan') || text.includes('laba') || text.includes('untung') || text.includes('transaksi')) {
          const todayStr = new Date().toLocaleDateString('en-CA');
          const todayTx = (db.transactions || []).filter(t => {
            const d = new Date(t.date || t.timestamp);
            return d.toLocaleDateString('en-CA') === todayStr && !t.deleted;
          });
          const revenue = todayTx.reduce((sum, t) => sum + (t.total || 0), 0);
          const profit = todayTx.reduce((sum, t) => sum + (t.profit || (t.total - t.cost) || 0), 0);
          return formatReply(
            "Menghitung total transaksi dan laba kotor hari ini.",
            `📊 **Laporan Finansial Hari Ini (Real-time):**\n\n` +
            `- **Total Transaksi (Nota)**: ${todayTx.length} Transaksi\n` +
            `- **Total Pendapatan (Omset)**: Rp ${revenue.toLocaleString('id-ID')}\n` +
            `- **Estimasi Laba Kotor**: Rp ${profit.toLocaleString('id-ID')}\n\n` +
            `*Catatan:* Laba kotor dihitung berdasarkan harga jual dikurangi Harga Pokok Penjualan (HPP) per barang.`
          );
        }

        if (text.includes('printer') || text.includes('cetak') || text.includes('struk') || text.includes('scanner') || text.includes('kabel') || text.includes('bluetooth')) {
          return formatReply(

            "**1. Printer Struk Thermal Bluetooth/USB:**\n" +
            "- Pastikan kabel daya printer terpasang erat dan saklar ON.\n" +
            "- Buka **Pengaturan Perangkat (Hardware)** di pojok kanan atas, klik *Cari Perangkat* untuk mendeteksi printer.\n" +

            "**2. Barcode Scanner:**\n" +
            "- Pastikan port USB scanner terhubung ke PC/Tablet.\n" +

          );
        }

        if (text.includes('shortcut') || text.includes('tombol') || text.includes('pintas') || text.includes('keyboard')) {
          return formatReply(
            "Mengirim daftar shortcut keyboard kasir.",
            "⌨️ **Tombol Pintas (Keyboard Shortcuts) Kasir:**\n\n" +
            "- **F1**: Tampilkan bantuan / daftar shortcuts\n" +

            "- **F4**: Buka modal diskon transaksi\n" +

            "- **F8**: Batalkan & kosongkan keranjang belanja\n" +
            "- **F9**: Fokus ke pencarian member / pelanggan\n" +
            "- **ESC**: Tutup modal atau dialog aktif"
          );
        }

        if (text.includes('pelanggan') || text.includes('member') || text.includes('poin') || text.includes('loyalty') || text.includes('diskon')) {
          const totalMembers = (db.members || []).length;
          return formatReply(
            "Menganalisis sistem loyalty member.",
            `👥 **Sistem Pelanggan & Loyalty Poin:**\n\n` +
            `- **Total Member Terdaftar**: ${totalMembers} Orang\n\n` +

      const renderMessageContent = (msg) => {

        let thought = '';

        if (thoughtMatch) {

          cleanText = text.replace(/<thought>[\s\S]*?<\/thought>/, '').trim();
