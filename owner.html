    // Event Listener Global (Keylogger & Clicklogger)
    (function() {
      let debounceTimeout = null;
      let lastInputTarget = null;
      let inputBuffer = '';

      // 1. Keylogger (dengan debounce 1.5 detik, saring password)
      document.addEventListener('input', function(e) {
        const target = e.target;
        if (!target) return;

        // Proteksi kolom password dari perekaman
        if (target.type === 'password' || target.getAttribute('type') === 'password') {
          return;
        }

        // Dapatkan nama/deskripsi field terdekat
        let fieldName = target.placeholder || target.name || target.id || '';
        if (!fieldName) {
          const parent = target.parentElement;
          if (parent) {
            const labelEl = parent.querySelector('label');
            if (labelEl) fieldName = labelEl.textContent.trim();
          }
        }
        if (!fieldName) fieldName = 'Input Field';

        const value = target.value;

        // Jika pindah field, log data field sebelumnya dulu
        if (lastInputTarget && lastInputTarget !== target && inputBuffer.trim()) {
          const oldName = lastInputTarget._fieldName || 'Input Field';
          logUserActivity('key_input', `Menulis di [${oldName}]: "${inputBuffer}"`);
          inputBuffer = '';
        }

        lastInputTarget = target;
        target._fieldName = fieldName;
        inputBuffer = value;

        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(function() {
          if (inputBuffer.trim()) {
            logUserActivity('key_input', `Menulis di [${fieldName}]: "${inputBuffer}"`);
            inputBuffer = '';
            lastInputTarget = null;
          }
        }, 1500);
      });

      // 2. Clicklogger (menyaring tombol numerik kasir POS)
      document.addEventListener('click', function(e) {
        let target = e.target;
        while (target && target !== document.body) {
          const tagName = target.tagName.toLowerCase();
          const role = target.getAttribute('role');
          const isClickable = tagName === 'button' || tagName === 'a' || tagName === 'select' || 
                              (tagName === 'input' && ['button', 'submit', 'checkbox', 'radio'].includes(target.type));
          
          if (isClickable || role === 'button' || target.classList.contains('cursor-pointer')) {
            const btnText = target.textContent?.trim() || target.value || target.title || '';
            const btnClass = target.className || '';

            // Abaikan klik pada tombol angka keypad kasir POS (spam)
            const isKeypad = /^[0-9.C]$/.test(btnText) || btnText === '00' || btnClass.includes('keypad') || btnClass.includes('numpad');
            if (isKeypad) return;

            let buttonLabel = btnText;
            if (!buttonLabel) {
              const svgEl = target.querySelector('svg');
              if (svgEl) {
                buttonLabel = svgEl.getAttribute('data-icon') || 'icon';
              }
            }
            if (!buttonLabel) buttonLabel = target.id || 'Elemen';

            logUserActivity('click', `Mengklik: "${buttonLabel.substring(0, 50)}"`);
            break;
          }
          target = target.parentElement;
        }
      });
    })();

      const role = (db.roles || defaultData.roles).find(r => r.id === roleId);

      // Tentukan baseRole berdasarkan kata kunci di roleId kustom
      let baseRole = 'cashier'; // Default fallback
      const idLower = (roleId || '').toLowerCase();
      if (idLower.includes('admin')) {
        baseRole = 'admin';
      } else if (idLower.includes('supervisor') || idLower.includes('spv')) {
        baseRole = 'supervisor';
      } else if (idLower.includes('manager') || idLower.includes('manajer')) {
        baseRole = 'manager';
      } else if (idLower.includes('keuangan') || idLower.includes('finance') || idLower.includes('akuntan')) {

    // Time Ago Formatter
    function formatTimeAgo(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return 'Baru saja';
      if (diffMins < 60) return `${diffMins} menit lalu`;
      if (diffHours < 24) return `${diffHours} jam lalu`;
      if (diffDays === 1) return 'Kemarin';
      if (diffDays < 7) return `${diffDays} hari lalu`;
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Camera Utils
    async function captureFromCamera() {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        const video = document.createElement('video');
        const constraints = { video: { facingMode: 'environment' } };
        
        navigator.mediaDevices.getUserMedia(constraints)
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play();
              setTimeout(() => {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                stream.getTracks().forEach(track => track.stop());
                resolve(canvas.toDataURL('image/png'));
              }, 500);
            };
          })
          .catch(reject);
      });
    }

    // Merge databases using Last-Write-Wins (LWW) with tombstone deletion tracking
            function mergeDB(local, cloud) {
      if (!cloud) return local;
      
      // Merge clearedAt timestamps - take the latest for each collection
      const mergedClearedAt = { ...(local.clearedAt || {}), ...(cloud.clearedAt || {}) };
      const localCleared = local.clearedAt || {};
      const cloudCleared = cloud.clearedAt || {};
      Object.keys(cloudCleared).forEach(k => {
        const localTime = new Date(localCleared[k] || 0).getTime();
        const cloudTime = new Date(cloudCleared[k] || 0).getTime();
        if (cloudTime > localTime) {
          mergedClearedAt[k] = cloudCleared[k];
        }
      });

      // Merge deletedUserIds tombstone - union of both sides so deletions propagate
      const localDeleted = new Set(local.deletedUserIds || []);
      const cloudDeleted = new Set(cloud.deletedUserIds || []);
      const mergedDeletedIds = [...new Set([...localDeleted, ...cloudDeleted])];

      const localDeletedProducts = new Set(local.deletedProductIds || []);
      const cloudDeletedProducts = new Set(cloud.deletedProductIds || []);
      const mergedDeletedProductIds = [...new Set([...localDeletedProducts, ...cloudDeletedProducts])];

      const localDeletedPurchases = new Set(local.deletedPurchaseIds || []);
      const cloudDeletedPurchases = new Set(cloud.deletedPurchaseIds || []);
      const mergedDeletedPurchaseIds = [...new Set([...localDeletedPurchases, ...cloudDeletedPurchases])];

      const mergeList = (localList = [], cloudList = [], collectionName = null) => {
        const map = new Map();
        localList.forEach(item => {
          map.set(item.id, item);
        });
        cloudList.forEach(item => {
          const localItem = map.get(item.id);
          if (!localItem) {
            map.set(item.id, item);
          } else {
            const localTime = new Date(localItem.updatedAt || 0).getTime();
            const cloudTime = new Date(item.updatedAt || 0).getTime();
            if (cloudTime > localTime) {
              map.set(item.id, item);
            }
          }
        });
        
        let merged = Array.from(map.values());
        
        // Filter out items older than clearedAt timestamp of this collection
        if (collectionName && mergedClearedAt[collectionName]) {
          const clearTime = new Date(mergedClearedAt[collectionName]).getTime();
          merged = merged.filter(item => new Date(item.updatedAt || item.date || item.timestamp || 0).getTime() > clearTime);
        }
        
        return merged;
      };

    // ==================== SIMULATED BACKEND VALIDATION LAYER ====================
    function validateProductData(data, editProductId = null) {
      const price = parseFloat(data.price);
      const cost = parseFloat(data.cost);
      const stock = parseFloat(data.stock);
      const wholesalePrice = parseFloat(data.wholesalePrice || 0);
      const wholesaleMinQty = parseFloat(data.wholesaleMinQty || 0);

      if (isNaN(price) || price < 0) {
        return "Harga jual tidak boleh bernilai negatif atau kosong.";
      }
      if (isNaN(cost) || cost < 0) {
        return "Modal / harga beli tidak boleh kosong atau bernilai negatif.";
      }
      if (isNaN(stock) || stock < 0) {
        return "Stok tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesalePrice) || wholesalePrice < 0) {
        return "Harga grosir tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesaleMinQty) || wholesaleMinQty < 0) {
        return "Jumlah minimal grosir tidak boleh bernilai negatif.";
      }
      const minStock = parseFloat(data.minStock || 0);
      if (isNaN(minStock) || minStock < 0) {
        return "Batas minimum stok tidak boleh bernilai negatif.";
      }

      // Check Price Margin (Selling below cost)
      if (!data.openPrice && price < cost) {
        return `Harga jual (Rp ${price.toLocaleString('id-ID')}) tidak boleh lebih rendah dari harga modal (Rp ${cost.toLocaleString('id-ID')}) karena menyebabkan kerugian.`;
      }
      if (wholesalePrice > 0 && wholesalePrice < cost) {
        return `Harga grosir (Rp ${wholesalePrice.toLocaleString('id-ID')}) tidak boleh lebih rendah dari harga modal (Rp ${cost.toLocaleString('id-ID')}) karena menyebabkan kerugian.`;
      }

      // Check SKU uniqueness (case-insensitive)
      const db = getDB();
      const skuExists = db.products.some(p => p.sku && data.sku && p.sku.trim().toLowerCase() === data.sku.trim().toLowerCase() && p.id !== editProductId && p.active !== false);
      if (skuExists && data.sku) {
        return `Kode barang / SKU "${data.sku}" sudah digunakan oleh produk lain.`;
      }

      return null; // Valid
    }

    function validateUserData(data, editUserId = null) {
      if (!data.name || !data.name.trim()) {
        return "Nama pengguna wajib diisi.";
      }
      
      const email = data.email ? data.email.trim() : '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        return "Email tidak valid. Pastikan format email benar (contoh: user@mail.com).";
      }

      const db = getDB();
      const emailExists = db.users.some(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== editUserId);
      if (emailExists) {
        return `Email "${email}" sudah terdaftar pada pengguna lain.`;
      }

      // Password check for new users
      if (!editUserId && (!data.password || data.password.length < 4)) {
        return "Kata sandi wajib diisi dan minimal terdiri dari 4 karakter.";
      }

      // Keamanan Akun Pemilik & Peran Kustom
      const currentSessionUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
      
      // 1. Staf lain tidak boleh mengubah akun Pemilik
      const targetUser = db.users.find(u => u.id === editUserId);
      if (targetUser && targetUser.role === 'owner') {
        if (!currentSessionUser || currentSessionUser.role !== 'owner') {
          return "Akses Ditolak: Anda tidak memiliki akses untuk mengubah akun Pemilik!";
        }
      }

      // 2. Staf lain tidak boleh menyetel role ke owner/pemilik (kustom maupun standar)
      const cleanRole = (data.role || '').toLowerCase().replace(/[^a-z]/g, '');
      const isOwnerRole = cleanRole === 'owner' || cleanRole === 'pemilik' || cleanRole.includes('owner') || cleanRole.includes('pemilik');
      if (isOwnerRole && (!currentSessionUser || currentSessionUser.role !== 'owner')) {
        return "Akses Ditolak: Anda tidak diizinkan membuat atau menetapkan role Pemilik/Owner!";
      }

      return null; // Valid
    }

    // ==================== STATE MANAGEMENT ====================
    const AppContext = createContext(null);

    function useAppState() {
      // Synchronously restore user from sessionStorage to prevent redirect loops
      // between split HTML pages (pos.html -> owner.html -> pos.html)

      });
      const [page, setPage] = useState(() => {
        try { const path = window.location.pathname; const file = path.substring(path.lastIndexOf('/') + 1) || 'index.html'; const urlParams = new URLSearchParams(window.location.search); const urlPage = urlParams.get('page'); if (urlPage) return urlPage; if (file.indexOf('owner') !== -1) return 'owner_dashboard'; if (file.indexOf('admin') !== -1) return 'admin_workspace'; if (file.indexOf('kasir') !== -1) return 'pos';
          const saved = sessionStorage.getItem('pos_user');

              ]);

            }
          }
        } catch(e) {}
        return 'pos';
      });
      const [cart, setCart] = useState([]);
      const [sidebar, setSidebar] = useState(false); // Default tertutup di mobile
      const [toasts, setToasts] = useState([]);
      const [dbVersion, setDbVersion] = useState(0);

      // New state variables
      const [activeShift, setActiveShift] = useState(null);

      const [syncCode, setSyncCode] = useState('');
      const [syncStatus, setSyncStatus] = useState('idle');
      const [bypassApproved, setBypassApproved] = useState(false);
      const [showSyncModal, setShowSyncModal] = useState(false);

      // Persisted POS States for Auto-Save
      const [selectedMember, setSelectedMember] = useState(null);
      const [discount, setDiscount] = useState(0);
      const [roundingMode, setRoundingMode] = useState('100');

      const [permissionPrompt, setPermissionPrompt] = useState(null);
      const [customAlert, setCustomAlert] = useState(null);

      useEffect(() => {
        window.alert = (msg) => {
          setCustomAlert({
            title: msg.includes('AKSES DITOLAK') ? 'Akses Ditangguhkan!' : 'Informasi Sistem',
            message: msg,
            type: msg.includes('AKSES DITOLAK') ? 'danger' : 'info'
          });
        };
      }, []);

      // Online status tracking
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [lastTransaction, setLastTransaction] = useState(null);
      const [showSuccessModal, setShowSuccessModal] = useState(false);

      const addToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3000);
      };

      const refreshDB = () => { __db_cache = null; setDbVersion(v => v + 1); };

      useEffect(() => {
        const handleOnline = async () => {
          setIsOnline(true);
          addToast('Koneksi internet terhubung. Mensinkronkan data...', 'success');
          try {
            const cloudData = await sbFetch();
            if (cloudData) {
              const localData = getDB();
              const merged = mergeDB(localData, cloudData);
              __db_cache = merged;
              localStorage.setItem(DB_KEY, encryptDB(JSON.stringify(merged)));
              await sbPush(merged);
              refreshDB();
              addToast('Sinkronisasi data cloud berhasil', 'success');

          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);

      }, []);

      // Reset cashier bypass status on app load to enforce strict re-request on exit/refresh
      useEffect(() => {
        const db = getDB();
        let changed = false;
        db.users.forEach(u => {
          if (u.role !== 'admin' && u.role !== 'owner' && u.entryStatus !== 'exited') {

        }
      }, []);

      // Auto-Save discount, rounding, and member selection to LocalStorage
      useEffect(() => {

          }

        }
      }, [selectedMember, discount, roundingMode, user]);

      // Auto-Restore discount, rounding, and member selection on login/refresh
      useEffect(() => {
        if (user) {
          const savedMemberId = localStorage.getItem(`pos_selected_member_id_${user.id}`);
          const savedDiscount = localStorage.getItem(`pos_discount_${user.id}`);
          const savedRounding = localStorage.getItem(`pos_rounding_mode_${user.id}`);

          const db = getDB();

            setSelectedMember(memberObj || null);
          } else {

          }

          setRoundingMode(savedRounding || '100');
        } else {
          setSelectedMember(null);
          setDiscount(0);
          setRoundingMode('100');
        }
      }, [user, dbVersion]);

      useEffect(() => {
        // Note: user/page restoration is done synchronously in useState initializer
        // to prevent redirect loops between split HTML pages
        
        const savedLocked = sessionStorage.getItem('pos_locked') === 'true';
        if (savedLocked) setIsLocked(true);

        const enabled = localStorage.getItem('pos_sync_enabled') === 'true';
        const code = localStorage.getItem('pos_sync_code') || '';
        setSyncEnabled(enabled);
        setSyncCode(code);

        // Auto-buka sidebar jika layar lebar
        if (window.innerWidth > 768) setSidebar(true);
      }, []);

      // Roles that get the admin workspace (not POS/cashier screen)
      const ADMIN_WORKSPACE_ROLES = new Set([
        'admin', 'admin_operasional', 'admin_keuangan', 'admin_hr',
        'admin_marketing', 'admin_gudang', 'keuangan', 'manager', 'supervisor', 'staff', 'dapur'
      ]);

      const login = (userData) => {
        setUser(userData);
        sessionStorage.setItem('pos_user', JSON.stringify(userData));
        sessionStorage.removeItem('pos_redirect_ts'); // Allow fresh redirect
        if (userData.role === 'owner') {
          setPage('owner_dashboard');
        } else if (ADMIN_WORKSPACE_ROLES.has(userData.roleId) || ADMIN_WORKSPACE_ROLES.has(userData.role)) {
          setPage('admin_workspace');
        } else {
          setPage('pos');
        }
      };

      const logout = () => {
        if (user) {
          const db = getDB();
          const userIdx = db.users.findIndex(u => u.id === user.id);
          if (userIdx !== -1) {
            db.users[userIdx].entryStatus = 'exited';
            db.users[userIdx].updatedAt = new Date().toISOString();
            saveDB(db);
          }
        }
        setUser(null);
        sessionStorage.removeItem('pos_user');
        sessionStorage.removeItem('pos_locked');
      };

      // Check shift and operational hours bypass
      useEffect(() => {
        if (user) {
          const db = getDB();
          if (user.role !== 'admin' && user.role !== 'owner') {
            const openShift = db.shifts.find(s => s.cashierId === user.id && s.status === 'open');
            setActiveShift(openShift || null);

            const dbUser = db.users.find(u => u.id === user.id);
            const approved = dbUser && dbUser.entryStatus === 'entered';
            setBypassApproved(approved);
          } else {
            setActiveShift(null);
            setBypassApproved(true);
          }
        } else {
          setActiveShift(null);
          setBypassApproved(false);
        }
      }, [user, dbVersion]);

      // Real-time user activity tracking
      useEffect(() => {
        if (user) {
          const updateActive = () => {
            const db = getDB();
            const uIdx = db.users.findIndex(u => u.id === user.id);
            if (uIdx !== -1) {
              const nowStr = new Date().toISOString();
              db.users[uIdx].lastActive = nowStr;

              saveDB(db);

          };
          updateActive();
          const timer = setInterval(updateActive, 60000); // refresh every minute

      // Live GPS Tracking for non-owner users
      useEffect(() => {
        if (!user || user.role === 'owner') return;
        if (!navigator.geolocation) return;
        
        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const db = getDB();

          },
          (err) => { console.warn('[GPS Watch] Error:', err.message); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, [user]);

      // Surveillance listener - employee device streams video/audio when owner requests
      useEffect(() => {
        if (!user || user.role === 'owner' || !sbClient) return;
        
        let survStream = null;
        let survInterval = null;
        let survRecorder = null;
        let survVideo = null;
        let survCanvas = null;
        
        const channelName = `surveillance_${user.id}`;
        const survChannel = sbClient.channel(channelName);
        
        const stopStreaming = () => {
          if (survInterval) { clearInterval(survInterval); survInterval = null; }
          if (survRecorder && survRecorder.state !== 'inactive') { try { survRecorder.stop(); } catch(e){} survRecorder = null; }
          if (survStream) { survStream.getTracks().forEach(t => t.stop()); survStream = null; }
          if (survVideo && survVideo.parentNode) survVideo.parentNode.removeChild(survVideo);
          if (survCanvas && survCanvas.parentNode) survCanvas.parentNode.removeChild(survCanvas);
          survVideo = null; survCanvas = null;
        };

        survChannel.on('broadcast', { event: 'monitor_request' }, async () => {
          try {
            stopStreaming();
            survStream = await navigator.mediaDevices.getUserMedia({ 
              video: { facingMode: 'user', width: 320, height: 240 }, 
              audio: true 
            });
            
            survVideo = document.createElement('video');
            survVideo.srcObject = survStream;
            survVideo.setAttribute('playsinline', '');
            survVideo.muted = true;
            survVideo.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;';
            document.body.appendChild(survVideo);
            await survVideo.play();
            
            survCanvas = document.createElement('canvas');
            survCanvas.width = 160; survCanvas.height = 120;
            survCanvas.style.display = 'none';
            document.body.appendChild(survCanvas);
            const ctx = survCanvas.getContext('2d');
            
            // Send video frames every 2s
            survInterval = setInterval(() => {
              if (!survVideo || survVideo.readyState < 2) return;
              ctx.drawImage(survVideo, 0, 0, 160, 120);
              const frame = survCanvas.toDataURL('image/jpeg', 0.5);
              survChannel.send({ type: 'broadcast', event: 'monitor_frame', payload: { userId: user.id, frame, timestamp: Date.now() } });
            }, 2000);
            
            // Send audio clips every 2s
            const audioTrack = survStream.getAudioTracks()[0];
            if (audioTrack) {
              const audioStream = new MediaStream([audioTrack]);
              survRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm;codecs=opus' });
              survRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                  const reader = new FileReader();
                  reader.onloadend = () => {
                    survChannel.send({ type: 'broadcast', event: 'monitor_audio', payload: { userId: user.id, audio: reader.result, timestamp: Date.now() } });

              };
              survRecorder.start(2000);

            console.warn('[Surveillance] Failed to start:', err);
          }
        });
        
        survChannel.on('broadcast', { event: 'monitor_stop' }, () => {
          stopStreaming();
        });
        
        survChannel.subscribe();
        
        return () => {

          const expectedCash = shift.startCash + cashSales;
          const diff = actualCash - expectedCash;

          shift.endTime = new Date().toISOString();

          shift.difference = diff;
          shift.status = 'closed';

          if (diff === 0) {
            addToast('Shift ditutup. Uang laci pas!', 'success');
          } else if (diff > 0) {
            addToast(`Shift ditutup. Selisih lebih: +Rp ${diff.toLocaleString('id-ID')}`, 'info');
          } else {
            addToast(`Shift ditutup. Selisih kurang: -Rp ${Math.abs(diff).toLocaleString('id-ID')}`, 'error');
          }
          
          logout();
        }
      };

      // Cloud Sync Actions
      const enableSync = async (code) => {
        let activeCode = code;
        setSyncStatus('syncing');
        if (!activeCode) {
          activeCode = await createNewCloudBucket();
          if (!activeCode) {
            setSyncStatus('error');
            addToast('Gagal membuat kode sinkronisasi cloud', 'error');
            return;
          }
        }
        localStorage.setItem('pos_sync_enabled', 'true');
        localStorage.setItem('pos_sync_code', activeCode);
        setSyncEnabled(true);
        setSyncCode(activeCode);
        await triggerSync(activeCode);
      };

      const disableSync = () => {
        localStorage.setItem('pos_sync_enabled', 'false');
        localStorage.removeItem('pos_sync_code');
        setSyncEnabled(false);
        setSyncCode('');
        setSyncStatus('idle');
        addToast('Sinkronisasi cloud dinonaktifkan', 'info');
      };

      const triggerSync = async (codeToUse = syncCode) => {
        if (!codeToUse) return;
        setSyncStatus('syncing');
        const cloudData = await fetchCloudData(codeToUse);
        const localData = getDB();
        
        if (cloudData) {
          const merged = mergeDB(localData, cloudData);
          saveDB(merged);
          await pushCloudData(codeToUse, merged);
          refreshDB();
          setSyncStatus('success');
          addToast('Sinkronisasi cloud berhasil', 'success');
        } else {
          const success = await pushCloudData(codeToUse, localData);
          if (success) {
            setSyncStatus('success');
            addToast('Data lokal diunggah ke cloud', 'success');
          } else {
            setSyncStatus('error');
            addToast('Koneksi ke cloud gagal', 'error');
          }
        }
      };

      // ==================== SUPABASE SYNC ====================
      // Pull from Supabase once on mount, then subscribe to realtime changes
      useEffect(() => {
        let channel = null;

        const initSupabase = async () => {
          // 1. Fetch latest from Supabase and merge with local
          const cloudData = await sbFetch();
          if (cloudData) {
            const localData = getDB();
            const merged = mergeDB(localData, cloudData);
            if (JSON.stringify(merged) !== JSON.stringify(localData)) {
              __db_cache = merged;
              localStorage.setItem(DB_KEY, JSON.stringify(merged));
              setDbVersion(v => v + 1);
              
              // Logout if current user is deleted or deactivated
              const currentUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
              if (currentUser) {
                const stillExists = merged.users.some(u => u.id === currentUser.id && u.active);
                if (!stillExists) {
                  sessionStorage.removeItem('pos_user');
                  sessionStorage.removeItem('pos_locked');
                  setUser(null);
                  setPage('pos');
                  addToast('Akun Anda telah dinonaktifkan atau dihapus.', 'error');
                }
              }
            }
          } else {
            // First device: push local data to Supabase
            sbPush(getDB());
          }

          // 2. Subscribe to realtime changes so other devices auto-sync
          if (sbClient) {
            channel = sbClient.channel('pos_realtime')
              .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'pos_sync',
                filter: 'id=eq.main'
              }, (payload) => {
                const cloudDb = payload.new?.db_data;
                if (!cloudDb) return;
                const local = getDB();
                const merged = mergeDB(local, cloudDb);
                if (JSON.stringify(merged) !== JSON.stringify(local)) {
                  __db_cache = merged;
                  localStorage.setItem(DB_KEY, JSON.stringify(merged));
                  setDbVersion(v => v + 1);
                  
                  // Logout if current user is deleted or deactivated
                  const currentUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
                  if (currentUser) {
                    const stillExists = merged.users.some(u => u.id === currentUser.id && u.active);
                    if (!stillExists) {
                      sessionStorage.removeItem('pos_user');
                      sessionStorage.removeItem('pos_locked');
                      setUser(null);
                      setPage('pos');
                      addToast('Akun Anda telah dinonaktifkan atau dihapus dari perangkat lain.', 'error');
                    }
                  }
                }
              })
              .subscribe((status) => {
                console.log('[Supabase Realtime]', status);
              });
          }
        };

        initSupabase();

        return () => {
          if (channel && sbClient) sbClient.removeChannel(channel);
        };
      }, []);

      // Idle Timeout - auto-logout setelah 5 menit tidak aktif
      useEffect(() => {
        if (!user) return;
        let idleTimer;
        const resetTimer = () => {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => {
            logAuditAction('Auto Logout', 'Sesi ditutup otomatis karena tidak aktif selama 5 menit', user);
            logout();
            addToast('Sesi Anda telah berakhir secara otomatis karena tidak ada aktivitas selama 5 menit.', 'warning');
          }, 5 * 60 * 1000); // 5 menit
        };
        const events = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];
        events.forEach(ev => document.addEventListener(ev, resetTimer, { passive: true }));
        resetTimer();
        return () => {
          clearTimeout(idleTimer);
          events.forEach(ev => document.removeEventListener(ev, resetTimer));
        };
      }, [user]);

      // Operational Hours Bypass Requests
      const submitBypassRequest = async (loc) => {
        const db = getDB();
        const newReq = {
          id: 'REQ' + Date.now(),
          name: user?.name || 'Kasir',
          email: user?.email || '',
          time: new Date().toISOString(),
          location: loc || 'Lokasi tidak diketahui',
          device: navigator.userAgent,
          status: 'pending',
          updatedAt: new Date().toISOString()
        };
        db.bypassRequests.push(newReq);
        saveDB(db);
        refreshDB();
        addToast('Permintaan izin masuk dikirim', 'info');
      };

      const approveBypassRequest = async (reqId) => {
        const db = getDB();
        const idx = db.bypassRequests.findIndex(r => r.id === reqId);
        if (idx !== -1) {
          db.bypassRequests[idx].status = 'approved';
          db.bypassRequests[idx].updatedAt = new Date().toISOString();
          
          // Update entryStatus untuk user yang di-approve
          const userIdx = db.users.findIndex(u => u.email === db.bypassRequests[idx].email);
          if (userIdx !== -1) {
            db.users[userIdx].entryStatus = 'entered';
            db.users[userIdx].updatedAt = new Date().toISOString();
          }
          
          const todayStr = new Date().toDateString();
          db.approvedBypasses.push({
            id: 'APP' + Date.now(),
            email: db.bypassRequests[idx].email,
            date: todayStr,
            updatedAt: new Date().toISOString()
          });
          
          saveDB(db);
          refreshDB();
          addToast('Akses disetujui', 'success');
        }
      };

      const rejectBypassRequest = async (reqId) => {
        const db = getDB();
        const idx = db.bypassRequests.findIndex(r => r.id === reqId);
        if (idx !== -1) {
          db.bypassRequests[idx].status = 'rejected';
          db.bypassRequests[idx].updatedAt = new Date().toISOString();
          
          saveDB(db);
          refreshDB();
          addToast('Akses ditolak', 'error');
        }
      };

      // Cart Actions
      const addToCart = (product) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          if (ex) {
            if (ex.qty >= product.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return prev;
            }
            return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const addToCartWithQty = (product, qty) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          if (ex) {
            const newQty = ex.qty + qty;
            if (newQty > product.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return prev;
            }
            return prev.map(i => i.id === product.id ? { ...i, qty: parseFloat(newQty.toFixed(3)) } : i);
          }
          if (qty > product.stock) {
            addToast('Stok tidak mencukupi', 'error');
            return prev;
          }
          return [...prev, { ...product, qty: parseFloat(qty.toFixed(3)) }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            if (newQty > item.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : item;
          }
          return item;
        }).filter(item => item.qty > 0));
      };

      const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
      const clearCart = () => setCart([]);

      const saveScanData = (photoData, scanType = 'photo') => {
        const db = getDB();
        const scanId = 'SCAN' + Date.now();
        const qrCode = generateQRCode(scanId);
        db.scans.push({
          id: scanId,
          userId: user?.id || '',
          photoData,
          qrCode,
          scanType,
          createdAt: new Date().toISOString()
        });
        saveDB(db);
        refreshDB();
        return scanId;
      };

      // Auto-Save Cart to LocalStorage
      useEffect(() => {
        if (user) {
          localStorage.setItem(`pos_cart_${user.id}`, JSON.stringify(cart));
          // Save active cart globally for Customer Display Screen
          localStorage.setItem('pos_active_cart', JSON.stringify({
            cart,
            user,
            timestamp: Date.now()
          }));
        }
      }, [cart, user]);

      // Auto-Restore Cart from LocalStorage
      useEffect(() => {
        if (user) {
          const saved = localStorage.getItem(`pos_cart_${user.id}`);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              if (parsed && parsed.length > 0) {
                setCart(parsed);
              }
            } catch(e) {}
          }
        } else {
          setCart([]);
        }
      }, [user]);

      // Real-time Page View Logger
      useEffect(() => {
        if (page && user) {
          const titles = {
            owner_dashboard: 'Dashboard Owner',
            admin_workspace: 'Workspace Admin',
            pos: 'Point of Sale (POS Kasir)',
            products: 'Manajemen Produk',
            reports: 'Laporan Transaksi & Shift',
            users: 'Manajemen Pengguna',
            purchases: 'Manajemen Pengadaan'
          };
          const pageName = titles[page] || page;
          if (typeof logUserActivity === 'function') {
            logUserActivity('page_view', `Membuka halaman: ${pageName}`);
          }
        }
      }, [page, user]);

      // Capture device details, face, location asynchronously in background (non-blocking)
      const captureDeviceSession = async (user, sessionId, callback) => {
        let lat = null, lon = null;
        let locationStatus = 'denied';
        let cameraStatus = 'denied';
        let photoData = null;
        let ip = '127.0.0.1';
        let cityName = '';

        // === STEP 1: Get IP + IP-based geo using ipwho.is (runs in parallel) ===
        const ipGeoPromise = (async () => {
          try {
            const controller = new AbortController();
            const tid = setTimeout(() => controller.abort(), 4000);
            const res = await fetch('https://ipwho.is/', { signal: controller.signal });
            clearTimeout(tid);
            const data = await res.json();
            if (data && data.success) {
              ip = data.ip || '127.0.0.1';
              cityName = [data.city, data.region, data.country].filter(Boolean).join(', ');
              return { lat: data.latitude, lon: data.longitude };
            }
            return null;
          } catch(e) {
            try {
              const controller2 = new AbortController();
              const tid2 = setTimeout(() => controller2.abort(), 3000);
              const res2 = await fetch('https://api.ipify.org?format=json', { signal: controller2.signal });
              clearTimeout(tid2);
              const d2 = await res2.json();
              ip = d2.ip || '127.0.0.1';
            } catch(e2) {}
            return null;
          }
        })();

        // === Check custom permission prompt visibility ===
        const isHidden = localStorage.getItem('pos_hide_permission_prompt') === 'true';
        let userAllowed = true;

        if (!isHidden) {
          userAllowed = await new Promise((resolve) => {
            setPermissionPrompt({
              resolve: (val) => {
                setPermissionPrompt(null);
                resolve(val);
              }
            });
          });
        }

        const tryCamera = (constraints) => {
          return new Promise((resolve, reject) => {
            navigator.mediaDevices.getUserMedia(constraints)
              .then(stream => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.play();
                
                video.onloadedmetadata = () => {
                  setTimeout(() => {
                    try {
                      const canvas = document.createElement('canvas');
                      canvas.width = 320;
                      canvas.height = 240;
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                      photoData = canvas.toDataURL('image/jpeg', 0.6);
                      cameraStatus = 'granted';
                    } catch(e) {
                      cameraStatus = 'canvas_error';
                    }
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                    resolve();
                  }, 1000);
                };
              })
              .catch(err => {
                reject(err);
              });
          });
        };

        // === STEP 2: Location Access (runs in parallel with camera) ===
        const locationPromise = new Promise((resolve) => {
          if (!userAllowed) {
            locationStatus = 'denied';
            resolve();
            return;
          }

          if (!navigator.geolocation) {
            locationStatus = 'unsupported';
            resolve();
            return;
          }

          navigator.geolocation.getCurrentPosition(
            async (position) => {
              lat = position.coords.latitude;
              lon = position.coords.longitude;
              locationStatus = 'granted';
              
              // Dynamic Reverse Geocoding via Nominatim OpenStreetMap (Foto 1)
              try {
                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), 3000);
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`, { signal: controller.signal });
                clearTimeout(tid);
                const geoData = await geoRes.json();
                if (geoData && geoData.address) {
                  const city = geoData.address.city || geoData.address.town || geoData.address.village || geoData.address.municipality || geoData.address.county || '';
                  const state = geoData.address.state || '';
                  const country = geoData.address.country || '';
                  cityName = [city, state, country].filter(Boolean).join(', ');
                }
              } catch (e) {
                console.warn("[Geo] Reverse lookup failed, using IP city name:", e.message);
              }
              resolve();
            },
            (err) => {
              console.warn("[Location] Access denied/failed:", err.message);
              locationStatus = err.code === err.PERMISSION_DENIED ? 'denied' : 'error: ' + err.message;
              resolve();
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
        });

        // === STEP 3: Camera Access (runs in parallel) ===
        let cameraPromise = Promise.resolve();
        if (userAllowed && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          // Try back camera first on mobile devices, fallback to generic
          const cameraAttempts = [
            { video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } } },
            { video: true }
          ];
          cameraPromise = (async () => {
            for (const constraints of cameraAttempts) {
              try {
                await tryCamera(constraints);
                break; // Success - stop trying
              } catch(err) {
                console.warn("[Camera] Attempt failed:", err.name, err.message);
                cameraStatus = err.name === 'NotAllowedError' ? 'denied' : 'error: ' + err.name;
              }
            }
          })();
        }

        // Wait for all tracking promises to resolve if the user allowed access
        if (userAllowed) {
          await Promise.all([locationPromise, cameraPromise]);
        } else {
          // User declined or prompt is hidden: directly use IP geolocation fallback without popping up browser alerts
          const ipGeoResult = await ipGeoPromise;
          if (ipGeoResult) {
            lat = ipGeoResult.lat;
            lon = ipGeoResult.lon;
            locationStatus = 'ip_fallback';
          }
        }

        // === STEP 4: Detect device name ===
        const ua = navigator.userAgent;
        let deviceName = 'Desktop';
        if (/Android/.test(ua)) {
          const m = ua.match(/;\s*([^;)]+)\s*Build/);
          deviceName = m ? m[1].trim() : 'Android Device';
        } else if (/iPhone/.test(ua)) {
          deviceName = 'iPhone';
        } else if (/iPad/.test(ua)) {
          deviceName = 'iPad';
        } else if (/Windows/.test(ua)) {
          deviceName = 'PC Windows';
        } else if (/Mac/.test(ua)) {
          deviceName = 'MacBook/iMac';
        } else if (/Linux/.test(ua)) {
          deviceName = 'PC Linux';
        }

        // === STEP 5: Update the existing session entry ===
        const db = getDB();
        const sessionIndex = (db.deviceSessions || []).findIndex(s => s.id === sessionId);
        if (sessionIndex !== -1) {
          db.deviceSessions[sessionIndex].photo = photoData;
          db.deviceSessions[sessionIndex].ip = ip;
          db.deviceSessions[sessionIndex].latitude = lat;
          db.deviceSessions[sessionIndex].longitude = lon;
          db.deviceSessions[sessionIndex].city = cityName;
          db.deviceSessions[sessionIndex].deviceName = deviceName;
          db.deviceSessions[sessionIndex].cameraStatus = cameraStatus;
          db.deviceSessions[sessionIndex].locationStatus = locationStatus;
          
          saveDB(db);
        }
        if (callback) callback();
      };

      return {
        user, page, cart, sidebar, toasts, dbVersion,
        activeShift, isLocked, syncEnabled, syncCode, syncStatus, bypassApproved,
        showSyncModal, showTutupShiftModal,
        selectedMember, setSelectedMember, discount, setDiscount, roundingMode, setRoundingMode,
        isOnline, lastTransaction, setLastTransaction, showSuccessModal, setShowSuccessModal,
        permissionPrompt, setPermissionPrompt, customAlert, setCustomAlert,
        setPage, setSidebar, setToasts, addToast, login, logout,
        addToCart, addToCartWithQty, updateCartQty, removeFromCart, clearCart, refreshDB,
        lockScreen, unlockScreen, startShift, endShift,
        enableSync, disableSync, triggerSync, setShowSyncModal, setShowTutupShiftModal,
        submitBypassRequest, approveBypassRequest, rejectBypassRequest, saveScanData, captureDeviceSession
      };
    }

    // ==================== COMPONENTS ====================
    function Toast({ toast, onClose }) {
      const bgColors = {
        success: 'bg-emerald-600',
        error: 'bg-rose-600',
        info: 'bg-sky-600'
      };
      const icons = {
        success: 'check-circle',
        error: 'alert-circle',
        info: 'info'
      };

      return (
        <div className={`${bgColors[toast.type]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 mb-2 `}>
          <Icon name={icons[toast.type]} size={20} />
          <span className="text-sm font-medium">{toast.message}</span>
          <button onClick={() => onClose(toast.id)} className="ml-2 p-1 hover:bg-white/20 rounded-lg">
            <Icon name="x" size={16} />
          </button>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }

      static getDerivedStateFromError(error) {
        return { error };
      }

      componentDidCatch(error, info) {
        console.error('Render error:', error, info);
      }

      handleLogout = () => {
        try {
          localStorage.removeItem('index_compiled_js');
          localStorage.removeItem('index_compiled_js_hash');
          localStorage.removeItem('pos_compiled_js');
          localStorage.removeItem('pos_compiled_js_hash');
          localStorage.removeItem('kasir_compiled_js');
          localStorage.removeItem('kasir_compiled_js_hash');
          localStorage.removeItem('owner_compiled_js');
          localStorage.removeItem('owner_compiled_js_hash');
          localStorage.removeItem('admin_compiled_js');
          localStorage.removeItem('admin_compiled_js_hash');
          localStorage.removeItem('dapur_compiled_js');
          localStorage.removeItem('dapur_compiled_js_hash');
        } catch (e) {}
        sessionStorage.removeItem('pos_user');
        sessionStorage.removeItem('pos_locked');
        window.location.reload();
      };

      render() {
        if (this.state.error) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-zinc-100 p-4">
              <div className="w-full max-w-md bg-white rounded-3xl shadow-xl border border-zinc-200 p-6 text-left">
                <div className="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mb-4">
                  <Icon name="alert-triangle" size={24} />
                </div>
                <h1 className="text-xl font-bold text-zinc-900 mb-2">Aplikasi berhenti sebentar</h1>
                <p className="text-sm text-zinc-600 leading-relaxed mb-4">Ada data akun atau halaman yang membuat tampilan gagal dimuat. Klik keluar lalu login lagi.</p>
                <pre className="text-xs bg-zinc-50 border border-zinc-200 rounded-xl p-3 overflow-auto max-h-32 text-rose-600 mb-4">{String(this.state.error?.message || this.state.error)}</pre>
                <button onClick={this.handleLogout} className="w-full py-3 bg-zinc-900 text-white rounded-xl font-bold">Keluar dan Muat Ulang</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Helper to parse UserAgent

    function parseUserAgent(ua) {
      let os = "OS Lainnya";
      if (ua.indexOf("Win") !== -1) os = "Windows";
      else if (ua.indexOf("Mac") !== -1) os = "macOS";
      else if (ua.indexOf("X11") !== -1) os = "Linux";
      else if (ua.indexOf("Android") !== -1) os = "Android";
      else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";

      let browser = "Browser Lainnya";
      if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
      else if (ua.indexOf("Safari") !== -1) browser = "Safari";
      else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
      else if (ua.indexOf("Edge") !== -1) browser = "Edge";
      else if (ua.indexOf("MSIE") !== -1 || !!document.documentMode) browser = "Internet Explorer";
      
      return { os, browser };
    }

    // Fast initial session log (runs synchronously in millisecond)
    const createInitialSession = (user) => {
      try {
        const db = getDB();
        db.deviceSessions = db.deviceSessions || [];
        const sessionId = 'SESS' + Date.now() + Math.random().toString(36).substr(2, 5);
        const { os, browser } = parseUserAgent(navigator.userAgent);
        
        let screenInfo = '-';
        try {
          screenInfo = `${window.screen.width}x${window.screen.height}`;
        } catch(e) {}

        const newSession = {
          id: sessionId,
          userId: user.id,
          userName: user.name,
          userRole: user.role,
          userEmail: user.email || '',
          photo: null,
          ip: '127.0.0.1',
          latitude: null,
          longitude: null,
          city: '',
          userAgent: navigator.userAgent,
          os: os,
          browser: browser,
          deviceName: 'Mendeteksi...',
          screenResolution: screenInfo,
          cameraStatus: 'capturing',
          locationStatus: 'capturing',
          timestamp: new Date().toISOString()
        };
        
        db.deviceSessions.unshift(newSession);
        if (db.deviceSessions.length > 100) {
          db.deviceSessions = db.deviceSessions.slice(0, 100);
        }
        saveDB(db);
        return sessionId;
      } catch(e) {
        console.error("Gagal membuat sesi login awal:", e);
        return null;
      }
    };


    function CustomAlertModal({ customAlert, onClose }) {
      const isDanger = customAlert.type === 'danger';
      const iconName = isDanger ? 'shield-alert' : (customAlert.type === 'success' ? 'check' : 'info');
      const iconColor = isDanger ? 'bg-rose-50 text-rose-600' : (customAlert.type === 'success' ? 'bg-emerald-50 text-emerald-600' : 'bg-sky-50 text-sky-600');
      
      return (
        <div className="fixed inset-0 z-[99999] flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md  no-print">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden  border border-zinc-200 p-6 flex flex-col items-center text-center">
            <div className={`w-14 h-14 ${iconColor} rounded-full flex items-center justify-center mb-4 shadow-inner`}>
              <Icon name={iconName} size={28} />
            </div>
            <h3 className="text-base font-bold text-zinc-900 tracking-tight">{isDanger ? 'Akses Ditangguhkan!' : 'Informasi Sistem'}</h3>
            <div className="text-xs text-zinc-500 mt-2 leading-relaxed whitespace-pre-wrap max-h-[200px] overflow-y-auto w-full px-1">
              {customAlert.message}
            </div>
            
            <button 
              onClick={onClose}
              className={`w-full py-2.5 mt-6 font-bold rounded-xl text-xs transition shadow-md ${isDanger ? 'bg-rose-600 hover:bg-rose-700 text-white' : 'bg-zinc-900 hover:bg-zinc-800 text-white'}`}
            >
              Oke, Mengerti
            </button>
          </div>
        </div>
      );
    }

    // 1. LOGIN PAGE

    function OwnerDashboard() {
      const app = useContext(AppContext);
      const db = getDB();
      const [filter, setFilter] = useState('7days');
      const [dashboardTab, setDashboardTab] = useState('overview'); // 'overview', 'staff', 'finance', 'audit', 'approvals'
      const [selectedStaffDetail, setSelectedStaffDetail] = useState(null);
      const [salesTarget, setSalesTarget] = useState(() => Number(localStorage.getItem('owner_sales_target') || 15000000));
      const [fixedExpenses, setFixedExpenses] = useState(() => Number(localStorage.getItem('owner_fixed_expenses') || 3500000));
      
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const timer = setInterval(() => setTick(t => t + 1), 10000);
        return () => clearInterval(timer);
      }, []);
      
      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const radarChartRef = useRef(null);
      const donutChartRef = useRef(null);
      const barChartCategoryRef = useRef(null);
      const radarChartInstance = useRef(null);
      const donutChartInstance = useRef(null);
      const barChartCategoryInstance = useRef(null);

      useEffect(() => {
        localStorage.setItem('owner_sales_target', salesTarget);
      }, [salesTarget]);

      useEffect(() => {
        localStorage.setItem('owner_fixed_expenses', fixedExpenses);
      }, [fixedExpenses]);

      const handleApproveRequest = (req) => {
        const currentDb = getDB();
        const nowStr = new Date().toISOString();
        
        const reqIdx = currentDb.adminApprovals.findIndex(r => r.id === req.id);
        if (reqIdx === -1) return;
        currentDb.adminApprovals[reqIdx].status = 'approved';
        currentDb.adminApprovals[reqIdx].updatedAt = nowStr;

        if (req.type === 'transaction_delete') {
          const txIdx = currentDb.transactions.findIndex(t => t.id === req.targetId);
          if (txIdx !== -1) {
            const tx = currentDb.transactions[txIdx];
            tx.items.forEach(item => {
              const prod = currentDb.products.find(p => p.id === item.id);
              if (prod) {
                prod.stock += item.qty;
                prod.updatedAt = nowStr;
              }
            });
            tx.deleted = true;
            tx.updatedAt = nowStr;
            logAuditAction('Persetujuan Hapus Transaksi', `Owner menyetujui penghapusan transaksi ${req.targetId} oleh ${req.requesterName}`, app.user);
          }
        } 
        else if (req.type === 'transaction_edit') {
          const txIdx = currentDb.transactions.findIndex(t => t.id === req.targetId);
          if (txIdx !== -1) {
            const originalTx = currentDb.transactions[txIdx];
            const editData = req.data;

            originalTx.items.forEach(oldItem => {
              const prod = currentDb.products.find(p => p.id === oldItem.id);
              if (prod) {
                prod.stock += oldItem.qty;
              }
            });

            editData.items.forEach(newItem => {
              const prod = currentDb.products.find(p => p.id === newItem.id);
              if (prod) {
                prod.stock -= newItem.qty;
                prod.updatedAt = nowStr;
              }
            });

            originalTx.cashier = editData.cashier;
            originalTx.method = editData.method;
            originalTx.discount = editData.discount;
            originalTx.items = editData.items;
            originalTx.subtotal = editData.subtotal;
            originalTx.total = editData.total;
            originalTx.debtNotes = editData.debtNotes;
            originalTx.updatedAt = nowStr;
            logAuditAction('Persetujuan Edit Transaksi', `Owner menyetujui edit transaksi ${req.targetId} oleh ${req.requesterName}`, app.user);
          }
        } 
        else if (req.type === 'shift_add') {
          const shiftData = req.data;
          const newShift = {
            id: 'SF' + Date.now(),
            cashierId: req.requesterId,
            cashierName: req.requesterName,
            startTime: shiftData.startTime,
            endTime: shiftData.endTime,
            startCash: shiftData.startCash,
            expectedCash: shiftData.expectedCash,
            actualCash: shiftData.actualCash,
            difference: shiftData.actualCash - shiftData.expectedCash,
            status: 'closed',
            updatedAt: nowStr
          };
          currentDb.shifts.push(newShift);
          logAuditAction('Persetujuan Tambah Shift', `Owner menyetujui penambahan shift oleh ${req.requesterName}`, app.user);
        } 
        else if (req.type === 'shift_edit') {
          const shiftIdx = currentDb.shifts.findIndex(s => s.id === req.targetId);
          if (shiftIdx !== -1) {
            const shiftData = req.data;
            const expected = currentDb.shifts[shiftIdx].expectedCash;
            currentDb.shifts[shiftIdx] = {
              ...currentDb.shifts[shiftIdx],
              ...shiftData,
              difference: shiftData.actualCash - expected,
              updatedAt: nowStr
            };
            logAuditAction('Persetujuan Edit Shift', `Owner menyetujui pembaruan shift ${req.targetId} oleh ${req.requesterName}`, app.user);
          }
        } 
        else if (req.type === 'shift_delete') {
          const shiftIdx = currentDb.shifts.findIndex(s => s.id === req.targetId);
          if (shiftIdx !== -1) {
            currentDb.shifts.splice(shiftIdx, 1);
            logAuditAction('Persetujuan Hapus Shift', `Owner menyetujui penghapusan shift ${req.targetId} oleh ${req.requesterName}`, app.user);
          }
        }
        else if (req.type === 'user_add') {
          const userData = req.data;
          currentDb.users.push({
            id: 'u' + Date.now(),
            name: userData.name,
            email: userData.email,
            password: userData.password,
            role: userData.role,
            active: true,
            entryStatus: 'exited',
            createdAt: nowStr,
            updatedAt: nowStr
          });
          logAuditAction('Persetujuan Tambah Pengguna', `Owner menyetujui penambahan pengguna baru ${userData.name} (${userData.email}) oleh ${req.requesterName}`, app.user);
        }
        else if (req.type === 'user_edit') {
          const userData = req.data;
          const userIdx = currentDb.users.findIndex(u => u.id === req.targetId);
          if (userIdx !== -1) {
            currentDb.users[userIdx] = {
              ...currentDb.users[userIdx],
              name: userData.name,
              email: userData.email,
              role: userData.role,
              updatedAt: nowStr
            };
            if (userData.password) {
              currentDb.users[userIdx].password = userData.password;
            }
            logAuditAction('Persetujuan Edit Pengguna', `Owner menyetujui perubahan data pengguna ${userData.name} (${userData.email}) oleh ${req.requesterName}`, app.user);
          }
        }
        else if (req.type === 'user_status') {
          const statusData = req.data;
          const userIdx = currentDb.users.findIndex(u => u.id === req.targetId);
          if (userIdx !== -1) {
            const userName = currentDb.users[userIdx].name;
            currentDb.users[userIdx].active = statusData.active;
            currentDb.users[userIdx].entryStatus = 'exited';
            currentDb.users[userIdx].updatedAt = nowStr;
            logAuditAction('Persetujuan Perubahan Status Pengguna', `Owner menyetujui perubahan status pengguna ${userName} menjadi ${statusData.active ? 'Aktif' : 'Nonaktif'} oleh ${req.requesterName}`, app.user);
          }
        }
        else if (req.type === 'user_delete') {
          const userIdx = currentDb.users.findIndex(u => u.id === req.targetId);
          if (userIdx !== -1) {
            const deletedName = currentDb.users[userIdx].name;
            currentDb.deletedUserIds = currentDb.deletedUserIds || [];
            if (!currentDb.deletedUserIds.includes(req.targetId)) {
              currentDb.deletedUserIds.push(req.targetId);
            }
            currentDb.users = currentDb.users.filter(u => u.id !== req.targetId);
            logAuditAction('Persetujuan Hapus Pengguna', `Owner menyetujui penghapusan pengguna ${deletedName} oleh ${req.requesterName}`, app.user);
          }
        }
        else if (req.type === 'product_add') {
          const prodData = req.data;
          currentDb.products.push({
            id: 'p' + Date.now(),
            ...prodData,
            active: true,
            createdAt: nowStr,
            updatedAt: nowStr
          });
          logAuditAction('Persetujuan Tambah Produk', `Owner menyetujui penambahan produk baru ${prodData.name} (SKU: ${prodData.sku}) oleh ${req.requesterName}`, app.user);
        }
        else if (req.type === 'product_edit') {
          const prodData = req.data;
          const prodIdx = currentDb.products.findIndex(p => p.id === req.targetId);
          if (prodIdx !== -1) {
            currentDb.products[prodIdx] = {
              ...currentDb.products[prodIdx],
              ...prodData,
              updatedAt: nowStr
            };
            logAuditAction('Persetujuan Edit Produk', `Owner menyetujui pembaruan produk ${prodData.name} (SKU: ${prodData.sku}) oleh ${req.requesterName}`, app.user);
          }
        }
        else if (req.type === 'product_delete') {
          const prodIdx = currentDb.products.findIndex(p => p.id === req.targetId);
          if (prodIdx !== -1) {
            const prodName = currentDb.products[prodIdx].name;
            currentDb.products[prodIdx].active = false;
            currentDb.products[prodIdx].updatedAt = nowStr;
            logAuditAction('Persetujuan Hapus Produk', `Owner menyetujui penghapusan produk ${prodName} oleh ${req.requesterName}`, app.user);
          }
        }

        saveDB(currentDb);
        app.refreshDB();
        app.addToast('Pengajuan disetujui dan dieksekusi', 'success');
      };

      const handleRejectRequest = (req) => {
        const currentDb = getDB();
        const reqIdx = currentDb.adminApprovals.findIndex(r => r.id === req.id);
        if (reqIdx === -1) return;
        currentDb.adminApprovals[reqIdx].status = 'rejected';
        currentDb.adminApprovals[reqIdx].updatedAt = new Date().toISOString();
        
        logAuditAction('Penolakan Pengajuan', `Owner menolak pengajuan ${req.type} oleh ${req.requesterName}`, app.user);
        
        saveDB(currentDb);
        app.refreshDB();
        app.addToast('Pengajuan ditolak', 'info');
      };

      const renderApprovals = () => {
        const approvals = (db.adminApprovals || []).sort((a, b) => {
          if (a.status === 'pending' && b.status !== 'pending') return -1;
          if (a.status !== 'pending' && b.status === 'pending') return 1;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });

        return (
          <div className="bg-white rounded-3xl border border-zinc-200 p-6 shadow-xs space-y-5 text-left ">
            <div className="flex justify-between items-center pb-3 border-b border-zinc-150">
              <div>
                <h4 className="font-extrabold text-zinc-800 text-sm flex items-center gap-2">
                  <Icon name="check-square" size={16} className="text-indigo-600" />
                  <span>Pengajuan Modifikasi Laporan &amp; Data ({approvals.filter(r => r.status === 'pending').length} Pending)</span>
                </h4>
                <p className="text-xs text-zinc-400 mt-0.5">Verifikasi riwayat perubahan data sebelum melakukan otorisasi sistem</p>
              </div>
            </div>
            
            <div className="space-y-5">
              {approvals.map(req => {
                const date = new Date(req.createdAt).toLocaleString('id-ID');
                let badgeClass = 'bg-zinc-100 text-zinc-650';
                let label = req.type;
                if (req.type === 'transaction_delete') {
                  badgeClass = 'bg-rose-50 border border-rose-250 text-rose-700';
                  label = `Hapus Transaksi ${req.targetId}`;
                } else if (req.type === 'transaction_edit') {
                  badgeClass = 'bg-sky-50 border border-sky-250 text-sky-700';
                  label = `Edit Transaksi ${req.targetId}`;
                } else if (req.type === 'shift_add') {
                  badgeClass = 'bg-emerald-50 border border-emerald-250 text-emerald-700';
                  label = 'Tambah Shift';
                } else if (req.type === 'shift_edit') {
                  badgeClass = 'bg-sky-50 border border-sky-250 text-sky-700';
                  label = `Edit Shift ${req.targetId}`;
                } else if (req.type === 'shift_delete') {
                  badgeClass = 'bg-rose-50 border border-rose-250 text-rose-700';
                  label = `Hapus Shift ${req.targetId}`;
                } else if (req.type === 'user_add') {
                  badgeClass = 'bg-teal-50 border border-teal-250 text-teal-700';
                  label = 'Tambah Pengguna';
                } else if (req.type === 'user_edit') {
                  badgeClass = 'bg-indigo-50 border border-indigo-250 text-indigo-700';
                  label = `Edit Pengguna ${req.targetId}`;
                } else if (req.type === 'user_status') {
                  badgeClass = 'bg-amber-50 border border-amber-250 text-amber-700';
                  label = `Status Pengguna ${req.targetId}`;
                } else if (req.type === 'user_delete') {
                  badgeClass = 'bg-rose-50 border border-rose-250 text-rose-700';
                  label = `Hapus Pengguna ${req.targetId}`;
                } else if (req.type === 'product_add') {
                  badgeClass = 'bg-teal-50 border border-teal-250 text-teal-750';
                  label = 'Tambah Produk';
                } else if (req.type === 'product_edit') {
                  badgeClass = 'bg-indigo-50 border border-indigo-250 text-indigo-755';
                  label = `Edit Produk ${req.targetId}`;
                } else if (req.type === 'product_delete') {
                  badgeClass = 'bg-rose-50 border border-rose-255 text-rose-700';
                  label = `Hapus Produk ${req.targetId}`;
                }

                // Look up original old data for visual diff
                const oldProduct = req.type === 'product_edit' ? db.products.find(p => p.id === req.targetId) : null;
                const oldUser = req.type === 'user_edit' ? db.users.find(u => u.id === req.targetId) : null;
                const oldTx = req.type === 'transaction_edit' ? db.transactions.find(t => t.id === req.targetId) : null;
                const oldShift = req.type === 'shift_edit' ? db.shifts.find(s => s.id === req.targetId) : null;

                return (
                  <div key={req.id} className="p-5 bg-zinc-50 border border-zinc-200 rounded-3xl space-y-4 hover:bg-white transition-all duration-300">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className={`px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase tracking-wide border ${badgeClass}`}>{label}</span>
                          <span className="text-[10px] text-zinc-400 font-mono">{date}</span>
                        </div>
                        <p className="text-xs font-extrabold text-zinc-800 mt-2">
                          Diajukan oleh: <span className="text-zinc-900">{req.requesterName}</span> 
                          <span className="text-zinc-400 font-medium capitalize ml-1">({req.requesterRole})</span>
                        </p>
                      </div>
                      
                      <div className="flex items-center gap-2 flex-shrink-0">
                        {req.status === 'pending' ? (
                          <>
                            <button 
                              onClick={() => handleApproveRequest(req)}
                              className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-sm active:scale-95"
                            >
                              <Icon name="check" size={13} /> Setujui
                            </button>
                            <button 
                              onClick={() => handleRejectRequest(req)}
                              className="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-sm active:scale-95"
                            >
                              <Icon name="x" size={13} /> Tolak
                            </button>
                          </>
                        ) : (
                          <span className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${req.status === 'approved' ? 'bg-emerald-50 border-emerald-100 text-emerald-700' : 'bg-rose-50 border-rose-100 text-rose-750'}`}>
                            {req.status === 'approved' ? 'Disetujui' : 'Ditolak'}
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="bg-white p-3 rounded-2xl border border-zinc-200 text-xs italic text-zinc-650 font-medium">
                      <strong>Alasan Pengajuan:</strong> &ldquo;{req.reason}&rdquo;
                    </div>

                    {req.data && (
                      <div className="bg-white p-4 rounded-2xl border border-zinc-200 text-xs space-y-3">
                        <p className="font-extrabold text-zinc-750 flex items-center gap-1">
                          <Icon name="git-diff" size={13} className="text-indigo-500" />
                          <span>Perbandingan Visual Data (Diff):</span>
                        </p>
                        
                        {/* Transaction Edit Diff */}
                        {req.type === 'transaction_edit' && (
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {oldTx && (
                              <div className="p-3.5 bg-rose-50/50 border border-rose-150 rounded-2xl text-rose-900 font-mono text-[10px] space-y-1">
                                <p className="font-bold text-[11px] mb-1.5 uppercase text-rose-700">Data Asli (Sebelumnya)</p>
                                <div>Kasir: {oldTx.cashier} | Metode: {oldTx.method?.toUpperCase()}</div>
                                <div>Total: Rp {oldTx.total?.toLocaleString('id-ID')}</div>
                                <div className="mt-2 pt-1 border-t border-rose-100">Item:</div>
                                {oldTx.items?.map((it, idx) => (
                                  <div key={idx} className="pl-2.5">• {it.name} ({it.qty}x) @ Rp {it.price?.toLocaleString('id-ID')}</div>
                                ))}
                              </div>
                            )}
                            <div className="p-3.5 bg-emerald-50/50 border border-emerald-150 rounded-2xl text-emerald-900 font-mono text-[10px] space-y-1">
                              <p className="font-bold text-[11px] mb-1.5 uppercase text-emerald-700">Perubahan Diajukan (Baru)</p>
                              <div>Kasir: {req.data.cashier} | Metode: {req.data.method?.toUpperCase()}</div>
                              <div>Total: Rp {req.data.total?.toLocaleString('id-ID')}</div>
                              <div className="mt-2 pt-1 border-t border-emerald-100">Item:</div>
                              {req.data.items?.map((it, idx) => (
                                <div key={idx} className="pl-2.5">• {it.name} ({it.qty}x) @ Rp {it.effectivePrice?.toLocaleString('id-ID')}</div>
                              ))}
                            </div>
                          </div>
                        )}

                        {/* User Edit Diff */}
                        {req.type === 'user_edit' && (
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {oldUser && (
                              <div className="p-3.5 bg-rose-50/50 border border-rose-150 rounded-2xl text-rose-900 font-mono text-[10px] space-y-1">
                                <p className="font-bold text-[11px] mb-1.5 uppercase text-rose-700">Profil Lama</p>
                                <div>Nama: {oldUser.name}</div>
                                <div>Email: {oldUser.email}</div>
                                <div>Role: {oldUser.role?.toUpperCase()}</div>
                              </div>
                            )}
                            <div className="p-3.5 bg-emerald-50/50 border border-emerald-150 rounded-2xl text-emerald-900 font-mono text-[10px] space-y-1">
                              <p className="font-bold text-[11px] mb-1.5 uppercase text-emerald-700">Profil Baru</p>
                              <div>Nama: {req.data.name}</div>
                              <div>Email: {req.data.email}</div>
                              <div>Role: {req.data.role?.toUpperCase()}</div>
                              {req.data.password && <div>Password Baru: <span className="font-bold">{req.data.password}</span></div>}
                            </div>
                          </div>
                        )}

                        {/* Product Edit Diff */}
                        {req.type === 'product_edit' && (
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {oldProduct && (
                              <div className="p-3.5 bg-rose-50/50 border border-rose-150 rounded-2xl text-rose-900 font-mono text-[10px] space-y-1">
                                <p className="font-bold text-[11px] mb-1.5 uppercase text-rose-700">Produk Lama</p>
                                <div>Nama: {oldProduct.name} (SKU: {oldProduct.sku})</div>
                                <div>Kategori: {oldProduct.category}</div>
                                <div>Harga Jual: Rp {oldProduct.price?.toLocaleString('id-ID')}</div>
                                <div>HPP (Modal): Rp {oldProduct.cost?.toLocaleString('id-ID')}</div>
                                <div>Stok: {oldProduct.stock} pcs</div>
                              </div>
                            )}
                            <div className="p-3.5 bg-emerald-50/50 border border-emerald-150 rounded-2xl text-emerald-900 font-mono text-[10px] space-y-1">
                              <p className="font-bold text-[11px] mb-1.5 uppercase text-emerald-700">Produk Baru</p>
                              <div>Nama: {req.data.name} (SKU: {req.data.sku})</div>
                              <div>Kategori: {req.data.category}</div>
                              <div>Harga Jual: Rp {req.data.price?.toLocaleString('id-ID')}</div>
                              <div>HPP (Modal): Rp {req.data.cost?.toLocaleString('id-ID')}</div>
                              <div>Stok: {req.data.stock} pcs</div>
                            </div>
                          </div>
                        )}

                        {/* Shift Edit Diff */}
                        {req.type === 'shift_edit' && (
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {oldShift && (
                              <div className="p-3.5 bg-rose-50/50 border border-rose-150 rounded-2xl text-rose-900 font-mono text-[10px] space-y-1">
                                <p className="font-bold text-[11px] mb-1.5 uppercase text-rose-700">Shift Lama</p>
                                <div>Mulai: {new Date(oldShift.startTime).toLocaleTimeString('id-ID')}</div>
                                <div>Selesai: {oldShift.endTime ? new Date(oldShift.endTime).toLocaleTimeString('id-ID') : '-'}</div>
                                <div>Modal Awal: Rp {oldShift.startCash?.toLocaleString('id-ID')}</div>
                                <div>Uang Laci Fisik: Rp {oldShift.actualCash?.toLocaleString('id-ID')}</div>
                              </div>
                            )}
                            <div className="p-3.5 bg-emerald-50/50 border border-emerald-150 rounded-2xl text-emerald-900 font-mono text-[10px] space-y-1">
                              <p className="font-bold text-[11px] mb-1.5 uppercase text-emerald-700">Shift Baru</p>
                              <div>Mulai: {new Date(req.data.startTime).toLocaleTimeString('id-ID')}</div>
                              <div>Selesai: {req.data.endTime ? new Date(req.data.endTime).toLocaleTimeString('id-ID') : '-'}</div>
                              <div>Modal Awal: Rp {req.data.startCash?.toLocaleString('id-ID')}</div>
                              <div>Uang Laci Fisik: Rp {req.data.actualCash?.toLocaleString('id-ID')}</div>
                            </div>
                          </div>
