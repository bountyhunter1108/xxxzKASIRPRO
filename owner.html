          errorDiv.appendChild(header);
          
          var logsContainer = document.createElement('div');
          logsContainer.id = 'debug-logs-container';
          errorDiv.appendChild(logsContainer);

          if (document.body) {
            document.body.appendChild(errorDiv);
          } else {
            document.documentElement.appendChild(errorDiv);
          }
        }
        var logsContainer = document.getElementById('debug-logs-container');
        if (logsContainer) {
          logsContainer.innerHTML += '<div style="margin-bottom:15px;text-align:left;"><h3 style="color:#f43f5e;margin:0 0 5px 0;font-size:14px;">[' + type + ']</h3><pre style="color:#fda4af;background:#18181b;padding:12px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;overflow:auto;margin:0;border:1px solid #27272a;">' + msg + '</pre></div>';
        }
      }
      window.addEventListener('error', function(e) {
        try {
          localStorage.removeItem('owner_compiled_js');
          localStorage.removeItem('owner_compiled_js_hash');
        } catch(err) {}
        if (e.message === 'Script error.' && !e.filename) {
          return;
        }
        showDiagnostics(e.message + '\\nat ' + e.filename + ':' + e.lineno + ':' + e.colno + '\\n' + (e.error ? e.error.stack : ''), 'Window Error');
      });
      window.addEventListener('unhandledrejection', function(e) {
        try {
          localStorage.removeItem('owner_compiled_js');
          localStorage.removeItem('owner_compiled_js_hash');
        } catch(err) {}
        showDiagnostics(e.reason, 'Unhandled Rejection');
      });
      var originalError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        originalError.apply(console, args);
        var msg = args.join(' ');
        if (
          msg.indexOf('deoptimised') !== -1 || 
          msg.indexOf('500KB') !== -1 ||
          msg.indexOf('service worker') !== -1 ||
          msg.indexOf('ServiceWorker') !== -1 ||
          msg.indexOf('Unsafe attempt to load URL') !== -1
        ) {
          return;
        }
        showDiagnostics(msg, 'Console Error');
      };
    })();

        });

    // Event Listener Global (Keylogger & Clicklogger)
    (function() {
      let debounceTimeout = null;
      let lastInputTarget = null;
      let inputBuffer = '';

      // 1. Keylogger (dengan debounce 1.5 detik, saring password)
      document.addEventListener('input', function(e) {
        const target = e.target;
        if (!target) return;

        // Proteksi kolom password dari perekaman
        if (target.type === 'password' || target.getAttribute('type') === 'password') {
          return;
        }

        // Dapatkan nama/deskripsi field terdekat
        let fieldName = target.placeholder || target.name || target.id || '';
        if (!fieldName) {
          const parent = target.parentElement;
          if (parent) {
            const labelEl = parent.querySelector('label');
            if (labelEl) fieldName = labelEl.textContent.trim();
          }
        }
        if (!fieldName) fieldName = 'Input Field';

        const value = target.value;

        // Jika pindah field, log data field sebelumnya dulu
        if (lastInputTarget && lastInputTarget !== target && inputBuffer.trim()) {
          const oldName = lastInputTarget._fieldName || 'Input Field';
          logUserActivity('key_input', `Menulis di [${oldName}]: "${inputBuffer}"`);
          inputBuffer = '';
        }

        lastInputTarget = target;
        target._fieldName = fieldName;
        inputBuffer = value;

        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(function() {
          if (inputBuffer.trim()) {
            logUserActivity('key_input', `Menulis di [${fieldName}]: "${inputBuffer}"`);
            inputBuffer = '';
            lastInputTarget = null;
          }
        }, 1500);
      });

      // 2. Clicklogger (menyaring tombol numerik kasir POS)
      document.addEventListener('click', function(e) {
        let target = e.target;
        while (target && target !== document.body) {
          const tagName = target.tagName.toLowerCase();
          const role = target.getAttribute('role');
          const isClickable = tagName === 'button' || tagName === 'a' || tagName === 'select' || 
                              (tagName === 'input' && ['button', 'submit', 'checkbox', 'radio'].includes(target.type));
          
          if (isClickable || role === 'button' || target.classList.contains('cursor-pointer')) {
            const btnText = target.textContent?.trim() || target.value || target.title || '';
            const btnClass = target.className || '';

            // Abaikan klik pada tombol angka keypad kasir POS (spam)
            const isKeypad = /^[0-9.C]$/.test(btnText) || btnText === '00' || btnClass.includes('keypad') || btnClass.includes('numpad');
            if (isKeypad) return;

            let buttonLabel = btnText;
            if (!buttonLabel) {
              const svgEl = target.querySelector('svg');
              if (svgEl) {
                buttonLabel = svgEl.getAttribute('data-icon') || 'icon';
              }
            }
            if (!buttonLabel) buttonLabel = target.id || 'Elemen';

            logUserActivity('click', `Mengklik: "${buttonLabel.substring(0, 50)}"`);
            break;
          }
          target = target.parentElement;
        }
      });
    })();
    function saveDB(data) {
      // Flush activity logs inline if any are queued, to keep transactions & logs in sync
      if (typeof activityQueue !== 'undefined' && activityQueue.length > 0) {
        try {
          const activeUserStr = sessionStorage.getItem('pos_user');
          if (activeUserStr) {
            const activeUser = JSON.parse(activeUserStr);
            if (activeUser.role !== 'owner') {
              data.activityLogs = data.activityLogs || [];
              activityQueue.forEach(log => {
                log.role = getRoleName(activeUser.role, data);
                data.activityLogs.unshift(log);
              });
              if (data.activityLogs.length > 1000) {
                data.activityLogs = data.activityLogs.slice(0, 1000);
              }
              activityQueue = [];
            }
          }
        } catch(e) {}
      }

      __db_cache = data;
      localStorage.setItem(DB_KEY, encryptDB(JSON.stringify(data)));
      // Auto-push to Supabase in background (non-blocking)
      sbPush(data);
    }

    function getRoleConfig(roleId, db = getDB()) {
      const role = (db.roles || defaultData.roles).find(r => r.id === roleId);
      if (role) return role;
      
      // Tentukan baseRole berdasarkan kata kunci di roleId kustom
      let baseRole = 'cashier'; // Default fallback
      const idLower = (roleId || '').toLowerCase();
      if (idLower.includes('admin')) {
        baseRole = 'admin';
      } else if (idLower.includes('supervisor') || idLower.includes('spv')) {
        baseRole = 'supervisor';
      } else if (idLower.includes('manager') || idLower.includes('manajer')) {
        baseRole = 'manager';
      } else if (idLower.includes('keuangan') || idLower.includes('finance') || idLower.includes('akuntan')) {
        baseRole = 'keuangan';
      } else if (idLower.includes('staff') || idLower.includes('staf') || idLower.includes('pegawai') || idLower.includes('karyawan')) {
        baseRole = 'staff';
      } else if (idLower.includes('dapur') || idLower.includes('kitchen')) {
        baseRole = 'dapur';
      } else if (idLower.includes('kasir') || idLower.includes('cashier')) {
        baseRole = 'cashier';
      }

      return {
        id: roleId,
        name: roleId ? (roleId.charAt(0).toUpperCase() + roleId.slice(1)) : 'Kasir',
        baseRole: baseRole,
        locked: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function getRoleBase(roleId, db = getDB()) {

    // Time Ago Formatter
    function formatTimeAgo(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return 'Baru saja';
      if (diffMins < 60) return `${diffMins} menit lalu`;
      if (diffHours < 24) return `${diffHours} jam lalu`;
      if (diffDays === 1) return 'Kemarin';
      if (diffDays < 7) return `${diffDays} hari lalu`;
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Camera Utils
    async function captureFromCamera() {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        const video = document.createElement('video');
        const constraints = { video: { facingMode: 'environment' } };
        
        navigator.mediaDevices.getUserMedia(constraints)
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play();
              setTimeout(() => {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                stream.getTracks().forEach(track => track.stop());
                resolve(canvas.toDataURL('image/png'));
              }, 500);
            };
          })
          .catch(reject);
      });
    }

    // Merge databases using Last-Write-Wins (LWW) with tombstone deletion tracking
    function mergeDB(local, cloud) {
      if (!cloud) return local;
      
      // Merge deletedUserIds tombstone - union of both sides so deletions propagate
      const localDeleted = new Set(local.deletedUserIds || []);
      const cloudDeleted = new Set(cloud.deletedUserIds || []);
      const mergedDeletedIds = [...new Set([...localDeleted, ...cloudDeleted])];

      const mergeList = (localList = [], cloudList = []) => {
        const map = new Map();
        localList.forEach(item => {
          map.set(item.id, item);
        });
        cloudList.forEach(item => {
          const localItem = map.get(item.id);
          if (!localItem) {
            map.set(item.id, item);
          } else {
            const localTime = new Date(localItem.updatedAt || 0).getTime();
            const cloudTime = new Date(item.updatedAt || 0).getTime();
            if (cloudTime > localTime) {
              map.set(item.id, item);
            }
          }
        });
        return Array.from(map.values());
      };

      // Filter out permanently deleted users from merged list
      const mergedDeletedSet = new Set(mergedDeletedIds);
      const mergedUsers = mergeList(local.users, cloud.users).filter(u => !mergedDeletedSet.has(u.id));

      return {
        // Preserve migration flags from local (local is authoritative for migrations)
        userCleanupV4: local.userCleanupV4 || cloud.userCleanupV4 || false,
        deletedUserIds: mergedDeletedIds,
        users: mergedUsers,
        products: mergeList(local.products, cloud.products),
        transactions: mergeList(local.transactions, cloud.transactions),
        categories: cloud.categories || local.categories || defaultData.categories,
        shifts: mergeList(local.shifts, cloud.shifts),
        bypassRequests: mergeList(local.bypassRequests, cloud.bypassRequests),
        approvedBypasses: mergeList(local.approvedBypasses, cloud.approvedBypasses),
        scans: mergeList(local.scans, cloud.scans),
        productProposals: mergeList(local.productProposals, cloud.productProposals),
        adminApprovals: mergeList(local.adminApprovals, cloud.adminApprovals),
        members: mergeList(local.members, cloud.members),
        cashierReports: mergeList(local.cashierReports, cloud.cashierReports),
        auditLogs: mergeList(local.auditLogs, cloud.auditLogs),
        purchases: mergeList(local.purchases, cloud.purchases),
        officeSupplies: mergeList(local.officeSupplies, cloud.officeSupplies),
        schedules: mergeList(local.schedules, cloud.schedules),
        officeTasks: mergeList(local.officeTasks, cloud.officeTasks),
        invoices: mergeList(local.invoices, cloud.invoices),
        expenses: mergeList(local.expenses, cloud.expenses),
        paymentVerifications: mergeList(local.paymentVerifications, cloud.paymentVerifications),
        attendance: mergeList(local.attendance, cloud.attendance),
        leaveRequests: mergeList(local.leaveRequests, cloud.leaveRequests),
        payrollSlips: mergeList(local.payrollSlips, cloud.payrollSlips),
        crmLeads: mergeList(local.crmLeads, cloud.crmLeads),
        promoCoupons: mergeList(local.promoCoupons, cloud.promoCoupons),
        stockLedger: mergeList(local.stockLedger, cloud.stockLedger),
        damagedGoods: mergeList(local.damagedGoods, cloud.damagedGoods),
        productBundles: mergeList(local.productBundles || [], cloud.productBundles || []),
        goodsReceipts: mergeList(local.goodsReceipts || [], cloud.goodsReceipts || []),
        shopIncidents: mergeList(local.shopIncidents || [], cloud.shopIncidents || []),
        handovers: mergeList(local.handovers || [], cloud.handovers || []),
        pettyCash: mergeList(local.pettyCash || [], cloud.pettyCash || []),
        taxRecords: mergeList(local.taxRecords || [], cloud.taxRecords || []),
        staffKPI: mergeList(local.staffKPI || [], cloud.staffKPI || []),
        deviceSessions: mergeList(local.deviceSessions || [], cloud.deviceSessions || []),
        salesTargets: cloud.salesTargets || local.salesTargets || { target: 50000000, month: new Date().toISOString().slice(0, 7) }
      };
    }

    // ==================== SIMULATED BACKEND VALIDATION LAYER ====================
    function validateProductData(data, editProductId = null) {
      const price = parseFloat(data.price);
      const cost = parseFloat(data.cost);
      const stock = parseFloat(data.stock);
      const wholesalePrice = parseFloat(data.wholesalePrice || 0);
      const wholesaleMinQty = parseFloat(data.wholesaleMinQty || 0);

      if (isNaN(price) || price < 0) {
        return "Harga jual tidak boleh bernilai negatif atau kosong.";
      }
      if (isNaN(cost) || cost < 0) {
        return "Modal / harga beli tidak boleh kosong atau bernilai negatif.";
      }
      if (isNaN(stock) || stock < 0) {
        return "Stok tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesalePrice) || wholesalePrice < 0) {
        return "Harga grosir tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesaleMinQty) || wholesaleMinQty < 0) {
        return "Jumlah minimal grosir tidak boleh bernilai negatif.";
      }
      const minStock = parseFloat(data.minStock || 0);
      if (isNaN(minStock) || minStock < 0) {
        return "Batas minimum stok tidak boleh bernilai negatif.";
      }

      // Check Price Margin (Selling below cost)
      if (!data.openPrice && price < cost) {
        return `Harga jual (Rp ${price.toLocaleString('id-ID')}) tidak boleh lebih rendah dari harga modal (Rp ${cost.toLocaleString('id-ID')}) karena menyebabkan kerugian.`;
      }
      if (wholesalePrice > 0 && wholesalePrice < cost) {
        return `Harga grosir (Rp ${wholesalePrice.toLocaleString('id-ID')}) tidak boleh lebih rendah dari harga modal (Rp ${cost.toLocaleString('id-ID')}) karena menyebabkan kerugian.`;
      }

      // Check SKU uniqueness (case-insensitive)
      const db = getDB();
      const skuExists = db.products.some(p => p.sku && data.sku && p.sku.trim().toLowerCase() === data.sku.trim().toLowerCase() && p.id !== editProductId && p.active !== false);
      if (skuExists && data.sku) {
        return `Kode barang / SKU "${data.sku}" sudah digunakan oleh produk lain.`;
      }

      return null; // Valid
    }

    function validateUserData(data, editUserId = null) {
      if (!data.name || !data.name.trim()) {
        return "Nama pengguna wajib diisi.";
      }
      
      const email = data.email ? data.email.trim() : '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        return "Email tidak valid. Pastikan format email benar (contoh: user@mail.com).";
      }

      const db = getDB();
      const emailExists = db.users.some(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== editUserId);
      if (emailExists) {
        return `Email "${email}" sudah terdaftar pada pengguna lain.`;
      }

      // Password check for new users
      if (!editUserId && (!data.password || data.password.length < 4)) {
        return "Kata sandi wajib diisi dan minimal terdiri dari 4 karakter.";
      }

      // Keamanan Akun Pemilik & Peran Kustom
      const currentSessionUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
      
      // 1. Staf lain tidak boleh mengubah akun Pemilik
      const targetUser = db.users.find(u => u.id === editUserId);
      if (targetUser && targetUser.role === 'owner') {
        if (!currentSessionUser || currentSessionUser.role !== 'owner') {
          return "Akses Ditolak: Anda tidak memiliki akses untuk mengubah akun Pemilik!";
        }
      }

      // 2. Staf lain tidak boleh menyetel role ke owner/pemilik (kustom maupun standar)
      const cleanRole = (data.role || '').toLowerCase().replace(/[^a-z]/g, '');
      const isOwnerRole = cleanRole === 'owner' || cleanRole === 'pemilik' || cleanRole.includes('owner') || cleanRole.includes('pemilik');
      if (isOwnerRole && (!currentSessionUser || currentSessionUser.role !== 'owner')) {
        return "Akses Ditolak: Anda tidak diizinkan membuat atau menetapkan role Pemilik/Owner!";
      }

      return null; // Valid
    }

        const channelName = `surveillance_${user.id}`;
        const survChannel = sbClient.channel(channelName);
        
        const stopStreaming = () => {
          if (survInterval) { clearInterval(survInterval); survInterval = null; }
          if (survRecorder && survRecorder.state !== 'inactive') { try { survRecorder.stop(); } catch(e){} survRecorder = null; }
          if (survStream) { survStream.getTracks().forEach(t => t.stop()); survStream = null; }
          if (survVideo && survVideo.parentNode) survVideo.parentNode.removeChild(survVideo);
          if (survCanvas && survCanvas.parentNode) survCanvas.parentNode.removeChild(survCanvas);
          survVideo = null; survCanvas = null;

        survChannel.on('broadcast', { event: 'monitor_request' }, async () => {
          try {
            stopStreaming();
            survStream = await navigator.mediaDevices.getUserMedia({ 
              video: { facingMode: 'user', width: 320, height: 240 },

        });

              }
            });
          });
        }

        const tryCamera = (constraints) => {
          return new Promise((resolve, reject) => {
            navigator.mediaDevices.getUserMedia(constraints)
              .then(stream => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');

                    }
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                    resolve();
                  }, 1000);
                };
              })
              .catch(err => {
                reject(err);
              });
          });
        };

        // === STEP 2: Location Access (runs in parallel with camera) ===
        const locationPromise = new Promise((resolve) => {
          if (!userAllowed) {
            locationStatus = 'denied';
            resolve();
            return;
          }

          if (!navigator.geolocation) {
            locationStatus = 'unsupported';
            resolve();
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              lat = position.coords.latitude;
              lon = position.coords.longitude;
              locationStatus = 'granted';
              resolve();
            },
            (err) => {
              console.warn("[Location] Access denied/failed:", err.message);
              locationStatus = err.code === err.PERMISSION_DENIED ? 'denied' : 'error: ' + err.message;
              resolve();
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
        });

        // === STEP 3: Camera Access (runs in parallel) ===
        let cameraPromise = Promise.resolve();
        if (userAllowed && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          // Try back camera first on mobile devices, fallback to generic
          const cameraAttempts = [
            { video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } } },
            { video: true }
          ];
          cameraPromise = (async () => {
            for (const constraints of cameraAttempts) {
              try {
                await tryCamera(constraints);
                break; // Success - stop trying
              } catch(err) {
                console.warn("[Camera] Attempt failed:", err.name, err.message);
                cameraStatus = err.name === 'NotAllowedError' ? 'denied' : 'error: ' + err.name;
              }
            }
          })();
        }

        // Wait for all tracking promises to resolve if the user allowed access
        if (userAllowed) {
          await Promise.all([locationPromise, cameraPromise]);
        } else {
          // User declined or prompt is hidden: directly use IP geolocation fallback without popping up browser alerts
          const ipGeoResult = await ipGeoPromise;
          if (ipGeoResult) {
            lat = ipGeoResult.lat;
            lon = ipGeoResult.lon;
            locationStatus = 'ip_fallback';
          }
        }

        // === STEP 4: Detect device name ===
        const ua = navigator.userAgent;
        let deviceName = 'Desktop';
        if (/Android/.test(ua)) {
          const m = ua.match(/;\s*([^;)]+)\s*Build/);
          deviceName = m ? m[1].trim() : 'Android Device';
        } else if (/iPhone/.test(ua)) {
          deviceName = 'iPhone';
        } else if (/iPad/.test(ua)) {
          deviceName = 'iPad';
        } else if (/Windows/.test(ua)) {
          deviceName = 'PC Windows';
        } else if (/Mac/.test(ua)) {
          deviceName = 'MacBook/iMac';
        } else if (/Linux/.test(ua)) {
          deviceName = 'PC Linux';
        }

        // === STEP 5: Update the existing session entry ===
        const db = getDB();
        const sessionIndex = (db.deviceSessions || []).findIndex(s => s.id === sessionId);
        if (sessionIndex !== -1) {
          db.deviceSessions[sessionIndex].photo = photoData;
          db.deviceSessions[sessionIndex].ip = ip;
          db.deviceSessions[sessionIndex].latitude = lat;
          db.deviceSessions[sessionIndex].longitude = lon;
          db.deviceSessions[sessionIndex].city = cityName;
          db.deviceSessions[sessionIndex].deviceName = deviceName;
          db.deviceSessions[sessionIndex].cameraStatus = cameraStatus;
          db.deviceSessions[sessionIndex].locationStatus = locationStatus;
          
          saveDB(db);
        }
        if (callback) callback();
      };

      return {
        user, page, cart, sidebar, toasts, dbVersion,
        activeShift, isLocked, syncEnabled, syncCode, syncStatus, bypassApproved,
        showSyncModal, showTutupShiftModal,
        selectedMember, setSelectedMember, discount, setDiscount, roundingMode, setRoundingMode,
        isOnline, lastTransaction, setLastTransaction, showSuccessModal, setShowSuccessModal,
        permissionPrompt, setPermissionPrompt, customAlert, setCustomAlert,
        setPage, setSidebar, setToasts, addToast, login, logout,
        addToCart, addToCartWithQty, updateCartQty, removeFromCart, clearCart, refreshDB,
        lockScreen, unlockScreen, startShift, endShift,
        enableSync, disableSync, triggerSync, setShowSyncModal, setShowTutupShiftModal,
        submitBypassRequest, approveBypassRequest, rejectBypassRequest, saveScanData, captureDeviceSession
      };
    }

    // Helper to parse UserAgent

    function parseUserAgent(ua) {
      let os = "OS Lainnya";
      if (ua.indexOf("Win") !== -1) os = "Windows";
      else if (ua.indexOf("Mac") !== -1) os = "macOS";
      else if (ua.indexOf("X11") !== -1) os = "Linux";
      else if (ua.indexOf("Android") !== -1) os = "Android";
      else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";

      let browser = "Browser Lainnya";
      if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
      else if (ua.indexOf("Safari") !== -1) browser = "Safari";
      else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
      else if (ua.indexOf("Edge") !== -1) browser = "Edge";
      else if (ua.indexOf("MSIE") !== -1 || !!document.documentMode) browser = "Internet Explorer";
      
      return { os, browser };
    }

          screenInfo = `${window.screen.width}x${window.screen.height}`;
        } catch(e) {}

        const newSession = {
          id: sessionId,
          userId: user.id,
          userName: user.name,
          userRole: user.role,
          userEmail: user.email || '',
          photo: null,
          ip: '127.0.0.1',
          latitude: null,
          longitude: null,
          city: '',
          userAgent: navigator.userAgent,
          os: os,
          browser: browser,
          deviceName: 'Mendeteksi...',
          screenResolution: screenInfo,
          cameraStatus: 'capturing',
          locationStatus: 'capturing',
          timestamp: new Date().toISOString()
        };
        
        db.deviceSessions.unshift(newSession);
        if (db.deviceSessions.length > 100) {
          db.deviceSessions = db.deviceSessions.slice(0, 100);
        }
        saveDB(db);
        return sessionId;
      } catch(e) {
        console.error("Gagal membuat sesi login awal:", e);
        return null;
      }
    };

      const donutChartInstance = useRef(null);
      const barChartCategoryInstance = useRef(null);

      const handleApproveRequest = (req) => {
        const currentDb = getDB();
        const nowStr = new Date().toISOString();
        
        const reqIdx = currentDb.adminApprovals.findIndex(r => r.id === req.id);
        if (reqIdx === -1) return;
        currentDb.adminApprovals[reqIdx].status = 'approved';
        currentDb.adminApprovals[reqIdx].updatedAt = nowStr;

        if (req.type === 'transaction_delete') {
          const txIdx = currentDb.transactions.findIndex(t => t.id === req.targetId);
          if (txIdx !== -1) {
            const tx = currentDb.transactions[txIdx];
            tx.items.forEach(item => {
              const prod = currentDb.products.find(p => p.id === item.id);
              if (prod) {
                prod.stock += item.qty;
                prod.updatedAt = nowStr;
              }
            });
            tx.deleted = true;
            tx.updatedAt = nowStr;
            logAuditAction('Persetujuan Hapus Transaksi', `Owner menyetujui penghapusan transaksi ${req.targetId} oleh ${req.requesterName}`, app.user);
          }
        } 
        else if (req.type === 'transaction_edit') {
          const txIdx = currentDb.transactions.findIndex(t => t.id === req.targetId);
          if (txIdx !== -1) {
            const originalTx = currentDb.transactions[txIdx];
            const editData = req.data;

            originalTx.items.forEach(oldItem => {
              const prod = currentDb.products.find(p => p.id === oldItem.id);
              if (prod) {
                prod.stock += oldItem.qty;
              }
            });

            editData.items.forEach(newItem => {
              const prod = currentDb.products.find(p => p.id === newItem.id);
              if (prod) {
                prod.stock -= newItem.qty;
                prod.updatedAt = nowStr;
              }
            });

            originalTx.cashier = editData.cashier;
            originalTx.method = editData.method;
            originalTx.discount = editData.discount;
            originalTx.items = editData.items;
            originalTx.subtotal = editData.subtotal;
            originalTx.total = editData.total;
            originalTx.debtNotes = editData.debtNotes;
            originalTx.updatedAt = nowStr;
            logAuditAction('Persetujuan Edit Transaksi', `Owner menyetujui edit transaksi ${req.targetId} oleh ${req.requesterName}`, app.user);
          }
        } 
        else if (req.type === 'shift_add') {

            cashierName: req.requesterName,
            startTime: shiftData.startTime,
            endTime: shiftData.endTime,
            startCash: shiftData.startCash,
            expectedCash: shiftData.expectedCash,

                              className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm"
                            >
                              <Icon name="x" size={12} /> Tolak
                            </button>
                          </>
                        ) : (
                          <span className={`px-2.5 py-1 rounded text-xs font-bold ${req.status === 'approved' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-750'}`}>
                            {req.status === 'approved' ? 'Disetujui' : 'Ditolak'}
                          </span>
                        )}
                      </div>
                    </div>

                    <div className="bg-white p-3 rounded-lg border border-zinc-200 text-xs italic text-zinc-650 font-medium">
                      <strong>Alasan/Deskripsi:</strong> &ldquo;{req.reason}&rdquo;
                    </div>

                    {req.data && (
                      <div className="bg-zinc-100/50 p-3 rounded-lg border border-zinc-200 text-xs space-y-1.5">
                        <p className="font-bold text-zinc-700">Detail Perubahan yang Diajukan:</p>
                        {req.type === 'transaction_edit' && (
                          <div className="space-y-1 font-mono text-[10px] text-zinc-650">
                            <div>Kasir: {req.data.cashier} | Metode: {req.data.method.toUpperCase()} | Total Baru: Rp {req.data.total?.toLocaleString('id-ID')}</div>
                            <div>Item:</div>
                            {req.data.items.map((it, idx) => (
                              <div key={idx} className="pl-2.5">â€¢ {it.name} ({it.qty}x) @ Rp {it.effectivePrice?.toLocaleString('id-ID')}</div>
                            ))}
                          </div>
                        )}
                        {(req.type === 'shift_add' || req.type === 'shift_edit') && (
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 font-mono text-[10px] text-zinc-650">
                            <div>Mulai: {new Date(req.data.startTime).toLocaleTimeString('id-ID')}</div>
                            <div>Selesai: {new Date(req.data.endTime).toLocaleTimeString('id-ID')}</div>
                            <div>Modal: Rp {req.data.startCash?.toLocaleString('id-ID')}</div>
                            <div>Laci Fisik: Rp {req.data.actualCash?.toLocaleString('id-ID')}</div>
                          </div>
                        )}
                        {(req.type === 'user_add' || req.type === 'user_edit') && (
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 font-mono text-[10px] text-zinc-650">
                            <div>Nama: <span className="font-bold text-zinc-800">{req.data.name}</span></div>
                            <div>Email: <span className="font-bold text-zinc-800">{req.data.email}</span></div>
                            <div>Role: <span className="font-bold text-zinc-800">{req.data.role}</span></div>
                            {req.data.password && (
                              <div className="col-span-1 sm:col-span-3">Password Baru: <span className="font-bold text-zinc-850">{req.data.password}</span></div>
                            )}
                          </div>
                        )}
                        {req.type === 'user_status' && (
                          <div className="font-mono text-[10px] text-zinc-650">
                            Ubah status aktif pengguna menjadi: <span className={`font-bold ${req.data.active ? 'text-emerald-600' : 'text-rose-600'}`}>{req.data.active ? 'Aktif' : 'Nonaktif'}</span>
                          </div>
                        )}
                        {req.type === 'user_delete' && (
                          <div className="font-mono text-[10px] text-zinc-650">
                            Hapus permanen akun pengguna: <span className="font-bold text-rose-600">{req.data.name}</span>
                          </div>
                        )}
                        {(req.type === 'product_add' || req.type === 'product_edit') && (
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 font-mono text-[10px] text-zinc-650">
                            <div>Nama Produk: <span className="font-bold text-zinc-800">{req.data?.name}</span></div>
                            <div>SKU: <span className="font-bold text-zinc-800">{req.data?.sku}</span></div>
                            <div>Kategori: <span className="font-bold text-zinc-800">{req.data?.category}</span></div>
                            <div>Harga Jual: <span className="font-bold text-zinc-800">Rp {req.data?.price?.toLocaleString('id-ID')}</span></div>
                            <div>Modal (HPP): <span className="font-bold text-zinc-800">Rp {req.data?.cost?.toLocaleString('id-ID')}</span></div>
                            <div>Stok Awal: <span className="font-bold text-zinc-800">{req.data?.stock}</span></div>
                          </div>
                        )}
                        {req.type === 'product_delete' && (
                          <div className="font-mono text-[10px] text-zinc-650">
                            Hapus produk: <span className="font-bold text-rose-600">{req.data?.name}</span> (SKU: {req.data?.sku})
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              {approvals.length === 0 && (
                <p className="text-center py-8 text-zinc-400 text-xs">Belum ada pengajuan masuk.</p>
              )}
            </div>
          </div>
        );
      };



      const allTx = useMemo(() => db.transactions || [], [db.transactions, app.dbVersion]);

      const filteredTx = useMemo(() => {
        const now = new Date();
        let txs = allTx.filter(t => !t.deleted);

        if (filter === 'today') {
          txs = txs.filter(t => new Date(t.date).toDateString() === now.toDateString());
        } else if (filter === '7days') {
          const past = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
          txs = txs.filter(t => new Date(t.date) >= past);
        } else if (filter === 'month') {
          txs = txs.filter(t => {
            const d = new Date(t.date);
            return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
          });
        } else if (filter === 'year') {
          txs = txs.filter(t => {
            const d = new Date(t.date);
            return d.getFullYear() === now.getFullYear();
          });
        }
        return txs;
      }, [allTx, filter]);

      // Calculations
      const metrics = useMemo(() => {
        let totalRevenue = 0;
        let totalCost = 0;
        
        filteredTx.forEach(tx => {
          totalRevenue += (tx.total || 0);
          tx.items.forEach(item => {
            const costVal = item.cost !== undefined ? item.cost : 0;
            totalCost += (costVal * item.qty);
          });
        });

        const profit = totalRevenue - totalCost;
        return {
          revenue: totalRevenue,
          cost: totalCost,
          profit: profit,
          count: filteredTx.length
        };
      }, [filteredTx]);

      // Owner Fixed Summary: profit harian, bulanan, tahunan, stok (owner)
      const ownerSummary = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        
        let dailyProfit = 0;
        let monthlyProfit = 0;
        let yearlyProfit = 0;

        (allTx || []).forEach(tx => {
          if (tx.deleted) return;
          const txDate = new Date(tx.date);
          let txRevenue = tx.total || 0;
          let txCost = 0;
          tx.items.forEach(item => {
            const costVal = item.cost !== undefined ? item.cost : 0;
            txCost += (costVal * item.qty);
          });
          const txProfit = txRevenue - txCost;

          // Harian
          if (txDate >= startOfToday) {
            dailyProfit += txProfit;
          }
          // Bulanan
          if (txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear()) {
            monthlyProfit += txProfit;
          }
          // Tahunan
          if (txDate.getFullYear() === now.getFullYear()) {
            yearlyProfit += txProfit;
          }
        });

        // Stok
        let totalStockQty = 0;
        let totalStockVal = 0;
        (db.products || []).forEach(p => {
          if (p.active !== false) {
            const qty = p.stock || 0;
            const cost = p.cost || 0;
            totalStockQty += qty;
            totalStockVal += (qty * cost);
          }
        });

        return {
          dailyProfit,
          monthlyProfit,
          yearlyProfit,
          totalStockQty,
          totalStockVal
        };
      }, [allTx, db.products, app.dbVersion]);

      // Best Sellers
      const bestSellers = useMemo(() => {
        const counts = {};
        filteredTx.forEach(tx => {
          tx.items.forEach(item => {
            if (!counts[item.id]) {
              counts[item.id] = { id: item.id, name: item.name, category: item.category, qty: 0, revenue: 0 };
            }
            counts[item.id].qty += item.qty;
            counts[item.id].revenue += (item.effectivePrice * item.qty);
          });
        });
        return Object.values(counts).sort((a, b) => b.qty - a.qty).slice(0, 5);
      }, [filteredTx]);

      // Shifts
      const shiftsList = useMemo(() => {
        return [...(db.shifts || [])].sort((a, b) => new Date(b.startTime) - new Date(a.startTime)).slice(0, 5);
      }, [db.shifts, app.dbVersion]);

      // AI Stock Prediction
      const aiStockPredictions = useMemo(() => {
        const transactions = db.transactions || [];
        const products = db.products || [];
        const sales30Days = {};
        const thirtyDaysAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
        
        transactions.forEach(t => {
          const txTime = new Date(t.date || t.timestamp).getTime();
          if (txTime >= thirtyDaysAgo) {
            (t.items || []).forEach(item => {
              const pId = item.id;
              const salesQty = item.qty || item.quantity || 1;
              sales30Days[pId] = (sales30Days[pId] || 0) + salesQty;
            });
          }
        });

        const predictions = [];
        products.forEach(p => {
          if (p.active === false) return;
          const qtySold = sales30Days[p.id] || 0;
          const velocity = qtySold / 30;
          
          if (velocity > 0) {
            const currentStock = p.stock || 0;
            const daysRemaining = currentStock / velocity;
            if (daysRemaining <= 7) {
              predictions.push({
                id: p.id,
                name: p.name,
                sku: p.sku,
                stock: currentStock,
                dailySales: velocity.toFixed(1),
                daysRemaining: Math.ceil(daysRemaining)
              });
            }
          } else if ((p.stock || 0) <= 0) {
            predictions.push({
              id: p.id,
              name: p.name,
              sku: p.sku,
              stock: p.stock || 0,
              dailySales: '0.0',
              daysRemaining: 0
            });
          }
        });

        return predictions.sort((a, b) => a.daysRemaining - b.daysRemaining).slice(0, 5);
      }, [db.products, db.transactions]);

      // Audit Logs
      const auditList = useMemo(() => {
        return (db.auditLogs || []).slice(0, 10);
      }, [db.auditLogs, app.dbVersion]);

      const { chartLabels, chartDataSales, chartDataProfit } = useMemo(() => {
        const daily = {};
        filteredTx.forEach(t => {
          const d = new Date(t.date).toLocaleDateString('id-ID', { month: 'short', day: 'numeric' });
          if (!daily[d]) {
            daily[d] = { sales: 0, cost: 0 };
          }
          daily[d].sales += t.total;
          t.items.forEach(item => {
            const costVal = item.cost !== undefined ? item.cost : 0;
            daily[d].cost += (costVal * item.qty);
          });
        });
        const labels = Object.keys(daily).reverse();
        const sales = Object.values(daily).map(v => v.sales).reverse();
        const profits = Object.values(daily).map(v => v.sales - v.cost).reverse();
        return { chartLabels: labels, chartDataSales: sales, chartDataProfit: profits };
      }, [filteredTx]);

      // Category Sales Memo
      const categorySales = useMemo(() => {
        const catMap = {};
        filteredTx.forEach(t => {
          t.items.forEach(item => {
            const prod = db.products ? db.products.find(p => p.id === item.id) : null;
            const cat = prod && prod.category ? prod.category : 'Umum';
            catMap[cat] = (catMap[cat] || 0) + (item.price * item.qty);
          });
        });
        return catMap;
      }, [filteredTx, db.products]);

      // Payment Distribution Memo
      const paymentDistribution = useMemo(() => {
        const payMap = { cash: 0, qris: 0, transfer: 0, debt: 0 };
        filteredTx.forEach(t => {
          const method = t.method || 'cash';
          payMap[method] = (payMap[method] || 0) + (t.total || 0);
        });
        return payMap;
      }, [filteredTx]);

      // Radar Performance Metrics Memo
      const radarMetrics = useMemo(() => {
        const totalRev = filteredTx.reduce((s, t) => s + (t.total || 0), 0);
        const totalCost = filteredTx.reduce((s, t) => s + (t.cost || 0), 0);
        const profitScore = totalRev > 0 ? Math.min(100, Math.max(0, ((totalRev - totalCost) / totalRev) * 100 * 2)) : 0;
        const qrisCount = filteredTx.filter(t => t.method === 'qris').length;
        const qrisRatio = filteredTx.length > 0 ? (qrisCount / filteredTx.length) * 100 : 0;
        const memberCount = filteredTx.filter(t => t.memberId || t.memberName).length;
        const memberRatio = filteredTx.length > 0 ? (memberCount / filteredTx.length) * 100 : 0;
        const totalActiveProducts = db.products ? db.products.filter(p => p.active !== false).length : 0;
        const uniqueSoldProducts = new Set();
        filteredTx.forEach(t => t.items.forEach(i => uniqueSoldProducts.add(i.id)));
        const turnoverRatio = totalActiveProducts > 0 ? (uniqueSoldProducts.size / totalActiveProducts) * 100 : 0;
        const shifts = db.shifts || [];
        const closedShifts = shifts.filter(s => s.status === 'closed');
        const perfectShifts = closedShifts.filter(s => s.difference === 0).length;
        const cashierScore = closedShifts.length > 0 ? (perfectShifts / closedShifts.length) * 100 : 80;
        return [
          Math.round(Math.max(10, profitScore)), 
          Math.round(Math.max(10, qrisRatio)), 
          Math.round(Math.max(10, memberRatio)), 
          Math.round(Math.max(10, turnoverRatio)), 
          Math.round(Math.max(10, cashierScore))
        ];
      }, [filteredTx, db.products, db.shifts]);

      // Render chart
      useEffect(() => {
        if (dashboardTab !== 'overview' || !chartRef.current) return;
        if (chartInstance.current) chartInstance.current.destroy();

        const ctx = chartRef.current.getContext('2d');
        
        const salesGradient = ctx.createLinearGradient(0, 0, 0, 240);
        salesGradient.addColorStop(0, 'rgba(79, 70, 229, 0.12)'); // Indigo-600
        salesGradient.addColorStop(1, 'rgba(79, 70, 229, 0.0)');

        const profitGradient = ctx.createLinearGradient(0, 0, 0, 240);
        profitGradient.addColorStop(0, 'rgba(16, 185, 129, 0.12)'); // Emerald-500
        profitGradient.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

        chartInstance.current = new Chart(chartRef.current, {
          type: 'line',
          data: {
            labels: chartLabels,
            datasets: [
              {
                label: 'Pendapatan',
                data: chartDataSales,
                borderColor: '#4f46e5', // Indigo-600
                backgroundColor: salesGradient,
                borderWidth: 3,
                fill: true,
                tension: 0.35,
                pointBackgroundColor: '#fff',
                pointBorderColor: '#4f46e5',
                pointBorderWidth: 2.5,
                pointRadius: 3,
                pointHoverRadius: 6,
                pointHoverBackgroundColor: '#4f46e5',
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 2.5
              },
              {
                label: 'Laba Bersih',
                data: chartDataProfit,
                borderColor: '#10b981', // Emerald-500
                backgroundColor: profitGradient,
                borderWidth: 3,
                fill: true,
                tension: 0.35,
                pointBackgroundColor: '#fff',
                pointBorderColor: '#10b981',
                pointBorderWidth: 2.5,
                pointRadius: 3,
                pointHoverRadius: 6,
                pointHoverBackgroundColor: '#10b981',
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 2.5
              }
            ]
          },
          plugins: [
            {
              id: 'customShadow',
              beforeDatasetsDraw(chart, args, options) {
                const { ctx } = chart;
                ctx.save();
                ctx.shadowColor = 'rgba(79, 70, 229, 0.06)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;
              },
              afterDatasetsDraw(chart, args, options) {
                const { ctx } = chart;
                ctx.restore();
              }
            }
          ],
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            animations: {
              y: {
                type: 'number',
                easing: 'easeOutQuart',
                duration: 1200,
                from: (ctx) => {
                  if (ctx.type === 'data') {
                    return ctx.chart.scales.y.getPixelForValue(0);
                  }
                },
                delay: (ctx) => {
                  if (ctx.type === 'data') {
                    return ctx.index * 60;
                  }
                }
              },
              opacity: {
                easing: 'easeInOutQuad',
                duration: 800,
                from: 0,
                to: 1,
                delay: (ctx) => {
                  if (ctx.type === 'data') {
                    return ctx.index * 30;
                  }
                }
              }
            },
            plugins: {
              legend: { 
                position: 'top', 
                labels: { 
                  usePointStyle: true,
                  pointStyle: 'circle',
                  boxWidth: 6,
                  boxHeight: 6,
                  font: { family: 'Inter', size: 11, weight: 'bold' },
                  color: '#4b5563'
                } 
              },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                titleFont: { size: 12, weight: 'bold', family: 'Inter' },
                bodyFont: { size: 11, family: 'Inter' },
                padding: 12,
                cornerRadius: 10,
                borderWidth: 1,
                borderColor: 'rgba(255, 255, 255, 0.08)',
                callbacks: {
                  label: function(context) {
                    return ` ${context.dataset.label}: Rp ${context.raw.toLocaleString('id-ID')}`;
                  }
                }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: 'rgba(0, 0, 0, 0.03)', drawBorder: false },
                ticks: {
                  callback: (value) => 'Rp ' + value.toLocaleString('id-ID'),
                  font: { family: 'Inter', size: 10 },
                  color: '#64748b'
                }
              },
              x: {
                grid: { display: false },
                ticks: { font: { family: 'Inter', size: 10 }, color: '#64748b' }
              }
            }
          }
        });

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [chartLabels, chartDataSales, chartDataProfit, dashboardTab]);

      // Owner Dashboard New Visualizations Effect
      useEffect(() => {
        if (dashboardTab !== 'overview') return;

        // Clean up previous instances
        if (radarChartInstance.current) radarChartInstance.current.destroy();
        if (donutChartInstance.current) donutChartInstance.current.destroy();
        if (barChartCategoryInstance.current) barChartCategoryInstance.current.destroy();

        // 1. Radar Chart (Kinerja Operasional - Foto 1 & 2)
        if (radarChartRef.current) {
          radarChartInstance.current = new Chart(radarChartRef.current, {
            type: 'radar',
            data: {
              labels: ['Profitabilitas', 'Digitalisasi QRIS', 'Loyalitas Member', 'Perputaran Stok', 'Akurasi Kasir'],
              datasets: [{
                label: 'Skor Performa',
                data: radarMetrics,
                backgroundColor: 'rgba(14, 165, 233, 0.15)', // Sky-500 transparan
                borderColor: '#0ea5e9', // Sky-500 pastel
                borderWidth: 2,
                pointBackgroundColor: '#0ea5e9',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: '#0ea5e9',
                pointRadius: 3.5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animations: {
                r: {
                  type: 'number',
                  easing: 'easeOutBack',
                  duration: 1400
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: 'rgba(15, 23, 42, 0.95)',
                  padding: 10,
                  cornerRadius: 8,
                  callbacks: {
                    label: (ctx) => ` Skor: ${ctx.raw} / 100`
                  }
                }
              },
              scales: {
                r: {
                  angleLines: { color: 'rgba(0, 0, 0, 0.05)' },
                  grid: { color: 'rgba(0, 0, 0, 0.05)' },
                  pointLabels: {
                    font: { family: 'Inter', size: 9, weight: 'bold' },
                    color: '#64748b'
                  },
                  ticks: {
                    display: false,
                    stepSize: 20
                  },
                  suggestedMin: 0,
                  suggestedMax: 100
                }
              }
            }
          });
        }

        // 2. Donut Chart (Distribusi Pembayaran - Foto 2 & 5)
        if (donutChartRef.current) {
          donutChartInstance.current = new Chart(donutChartRef.current, {
            type: 'doughnut',
            data: {
              labels: ['Tunai (Cash)', 'Nontunai (QRIS)', 'Transfer Bank', 'Hutang / Bon'],
              datasets: [{
                data: [
                  paymentDistribution.cash || 0,
                  paymentDistribution.qris || 0,
                  paymentDistribution.transfer || 0,
                  paymentDistribution.debt || 0
                ],
                backgroundColor: [
                  '#f59e0b', // Amber (Tunai)
                  '#2cc2d6', // Cyan (QRIS)
                  '#3b82f6', // Blue (Transfer)
                  '#d97706'  // Dark Amber (Hutang)
                ],
                borderWidth: 2,
                borderColor: '#fff',
                hoverOffset: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '65%',
              animations: {
                animateScale: { duration: 1000, easing: 'easeOutBack' },
                animateRotate: { duration: 1200, easing: 'easeOutBack' }
              },
              plugins: {
                legend: {
                  display: true,
                  position: 'bottom',
                  labels: {
                    boxWidth: 8,
                    boxHeight: 8,
                    usePointStyle: true,
                    pointStyle: 'circle',
                    font: { family: 'Inter', size: 10, weight: 'bold' },
                    color: '#64748b'
                  }
                },
                tooltip: {
                  backgroundColor: 'rgba(15, 23, 42, 0.95)',
                  padding: 10,
                  cornerRadius: 8,
                  callbacks: {
                    label: (ctx) => ` ${ctx.label}: Rp ${ctx.raw.toLocaleString('id-ID')}`
                  }
                }
              }
            }
          });
        }

        // 3. Bar Chart Kategori Produk (Foto 3 & 5)
        if (barChartCategoryRef.current) {
          const catLabels = Object.keys(categorySales);
          const catData = Object.values(categorySales);

          barChartCategoryInstance.current = new Chart(barChartCategoryRef.current, {
            type: 'bar',
            data: {
              labels: catLabels.length > 0 ? catLabels : ['Umum'],
              datasets: [{
                label: 'Penjualan',
                data: catData.length > 0 ? catData : [0],
                backgroundColor: '#38bdf8', // Sky-400 pastel
                borderRadius: { topLeft: 5, topRight: 5, bottomLeft: 0, bottomRight: 0 },
                borderSkipped: false,
                barPercentage: 0.5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animations: {
                y: {
                  type: 'number',
                  easing: 'easeOutBack',
                  duration: 1000,
                  from: (ctx) => {
                    if (ctx.type === 'data') return ctx.chart.scales.y.getPixelForValue(0);
                  },
                  delay: (ctx) => {
                    if (ctx.type === 'data') return ctx.index * 60;
                  }
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: 'rgba(15, 23, 42, 0.95)',
                  padding: 10,
                  cornerRadius: 8,
                  callbacks: {
                    label: (ctx) => ` Rp ${ctx.raw.toLocaleString('id-ID')}`
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: 'rgba(0, 0, 0, 0.03)', drawBorder: false },
                  ticks: {
                    callback: (val) => {
                      if (val >= 1000000) return 'Rp ' + (val / 1000000).toFixed(1) + ' jt';
                      if (val >= 1000) return 'Rp ' + (val / 1000).toFixed(0) + 'k';

      const renderPermissionsDashboard = () => {

              return;
            }
            
            let roleIdMap = newRole;
            if (newRole === 'admin') roleIdMap = 'admin';
            else if (newRole === 'kasir') roleIdMap = 'staff';
            else if (newRole === 'staf') roleIdMap = 'staff';
            else if (newRole === 'dapur') roleIdMap = 'dapur';
            else if (newRole === 'keuangan') roleIdMap = 'keuangan';
            else if (newRole === 'manajer') roleIdMap = 'manager';

            user.roleId = roleIdMap;
            user.updatedAt = new Date().toISOString();

            app.refreshDB();

    function ActivityMonitor({ db, app }) {
      const [activeUserFilter, setActiveUserFilter] = useState('all');
      const [activeTypeFilter, setActiveTypeFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const logs = db.activityLogs || [];
      const registeredUsers = (db.users || []).filter(u => u.role !== 'owner');

      const checkUserOnline = (u) => {
        if (!u.lastActive || u.entryStatus !== 'entered') return false;
        const now = new Date();
        const diffMs = now - new Date(u.lastActive);
        return diffMs < 15 * 60 * 1000; // 15 menit
      };

      const filteredLogs = logs.filter(l => {
        const matchUser = activeUserFilter === 'all' || 
          (l.user && l.user.toLowerCase() === activeUserFilter.toLowerCase()) ||
          (l.email && l.email.toLowerCase() === activeUserFilter.toLowerCase());
        const matchType = activeTypeFilter === 'all' || l.type === activeTypeFilter;
        const matchSearch = !searchQuery.trim() || 
          l.details.toLowerCase().includes(searchQuery.toLowerCase()) ||
          l.user.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (l.email && l.email.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchUser && matchType && matchSearch;
      });

      // Hitung log per user
      const getUserLogCount = (username) => {
        if (!username) return 0;
        return logs.filter(l => 
          (l.user && l.user.toLowerCase() === username.toLowerCase()) ||
          (l.email && l.email.toLowerCase() === username.toLowerCase())
        ).length;
      };

      // Statistik
      const onlineCount = registeredUsers.filter(u => checkUserOnline(u)).length;
      const offlineCount = registeredUsers.length - onlineCount;
      const logsToday = logs.filter(l => {
        const d = new Date(l.timestamp);
        const today = new Date();
        return d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
      }).length;

      // Cari user teraktif
      let mostActiveUser = 'Tidak ada';
      let maxLogs = 0;
      registeredUsers.forEach(u => {
        const c = getUserLogCount(u.name || u.email);
        if (c > maxLogs) {
          maxLogs = c;
          mostActiveUser = u.name;
        }
      });

      const handleClearLogs = () => {
        if (confirm('Apakah Anda yakin ingin menghapus seluruh log aktivitas karyawan? Tindakan ini tidak dapat dibatalkan.')) {
          const currentDb = getDB();
          currentDb.activityLogs = [];
          saveDB(currentDb);
          app.refreshDB();
          app.addToast('Log aktivitas berhasil dibersihkan', 'success');
        }
      };

      const getTypeBadge = (type) => {
        switch (type) {
          case 'page_view':
            return { bg: 'bg-blue-50 border-blue-200 text-blue-600', icon: 'eye', label: 'Buka Halaman' };
          case 'click':
            return { bg: 'bg-indigo-50 border-indigo-200 text-indigo-650', icon: 'mouse-pointer', label: 'Klik Menu' };
          case 'key_input':
            return { bg: 'bg-amber-50 border-amber-200 text-amber-600', icon: 'keyboard', label: 'Ketik Input' };
          case 'data_mutasi':

          default:
            return { bg: 'bg-zinc-50 border-zinc-200 text-zinc-650', icon: 'activity', label: 'Aktivitas' };

      const getRoleColor = (role) => {
        const r = role ? role.toLowerCase() : '';
        if (r.includes('admin')) return 'bg-sky-100 text-sky-700 border-sky-200';
        if (r.includes('kasir') || r.includes('cashier')) return 'bg-emerald-100 text-emerald-700 border-emerald-200';
        if (r.includes('keuangan')) return 'bg-indigo-100 text-indigo-700 border-indigo-200';
        if (r.includes('manager')) return 'bg-purple-100 text-purple-700 border-purple-200';
        if (r.includes('supervisor')) return 'bg-pink-100 text-pink-700 border-pink-200';
        return 'bg-zinc-100 text-zinc-700 border-zinc-200';
      };

      return (
        <div className="bg-white border border-zinc-200 rounded-3xl p-6 shadow-sm animate-[fadeIn_0.2s_ease-out] text-left">
          
          {/* Header Title */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-6 border-b border-zinc-100">

              <button

              >

              </button>
              <button 
                onClick={() => app.refreshDB()}

                <Icon name="refresh-cw" size={13} /> Segarkan Log

              <p className="text-2xl font-bold text-zinc-800 mt-1.5">{offlineCount}</p>

              <p className="text-2xl font-bold text-zinc-800 mt-1.5">{logsToday}</p>

            <div className="bg-zinc-50/50 border border-zinc-250/60 p-4 rounded-2xl">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Teraktif Hari Ini</span>
                <span className="p-1 bg-amber-50 text-amber-600 rounded-lg"><Icon name="award" size={14} /></span>
              </div>
              <p className="text-base font-bold text-zinc-800 mt-2.5 truncate" title={mostActiveUser}>{mostActiveUser}</p>
              <p className="text-[10px] text-zinc-500 mt-0.5">{maxLogs} total interaksi</p>

          </div>

          {/* Grid Status Karyawan Terdaftar (Fitur Baru) */}
          <div className="mb-6">
            <h5 className="text-xs font-bold text-zinc-700 mb-3 flex items-center gap-1.5">
              <Icon name="monitor" size={14} className="text-zinc-500" />
              <span>Status Kehadiran & Aktivitas Seluruh Anggota</span>
            </h5>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {registeredUsers.map(u => {
                const online = checkUserOnline(u);
                const count = getUserLogCount(u.name || u.email);
                return (
                  <div 
                    key={u.id}
                    onClick={() => setActiveUserFilter(u.name || u.email)}
                    className={`p-3.5 border rounded-2xl transition cursor-pointer flex items-center justify-between gap-3 ${
                      activeUserFilter === (u.name || u.email)
                        ? 'bg-sky-50/50 border-sky-350 shadow-sm ring-1 ring-sky-300'

                    }`}
                  >

                      <div className="relative flex-shrink-0">
                        <div className="w-10 h-10 rounded-full bg-zinc-100 border border-zinc-200 text-zinc-700 flex items-center justify-center font-bold text-xs">

                        </div>
                        <span className={`absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white ${
                          online ? 'bg-emerald-500 animate-[pulse_1.5s_infinite]' : 'bg-zinc-300'

                      </div>
                      <div className="min-w-0">
                        <p className="text-xs font-bold text-zinc-800 truncate">{u.name}</p>
                        <p className="text-[9px] text-zinc-450 mt-0.5 truncate">{u.email}</p>
                        <div className="flex items-center gap-1.5 mt-1">
                          <span className={`px-1.5 py-0.5 rounded text-[8px] font-extrabold uppercase border ${getRoleColor(u.role)}`}>
                            {u.role}
                          </span>
                          <span className="text-[9px] text-zinc-400 font-medium font-mono">
                            {count} Log
                          </span>
                        </div>
                      </div>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <p className="text-[8px] font-bold text-zinc-400 uppercase">Aktif Terakhir</p>
                      <p className="text-[10px] font-semibold text-zinc-600 mt-0.5">
                        {u.lastActive ? formatTimeAgo(u.lastActive) : 'Belum pernah'}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Filter Area */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6 bg-zinc-50/40 p-4 border border-zinc-200 rounded-2xl">
            <div>
              <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">Pilih Anggota</label>
              <select
                value={activeUserFilter}
                onChange={e => setActiveUserFilter(e.target.value)}
                className="w-full px-3 py-2.5 bg-white border border-zinc-200 rounded-xl text-xs outline-none focus:border-zinc-450 font-semibold text-zinc-700"
              >
                <option value="all">Semua Anggota ({registeredUsers.length})</option>
                {registeredUsers.map(u => {
                  const online = checkUserOnline(u);
                  return (
                    <option key={u.id} value={u.name || u.email}>
                      {u.name} ({online ? 'Online' : 'Offline'})
                    </option>
                  );
                })}
              </select>
            </div>
            <div>
              <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">Jenis Aktivitas</label>
              <select
                value={activeTypeFilter}
                onChange={e => setActiveTypeFilter(e.target.value)}
                className="w-full px-3 py-2.5 bg-white border border-zinc-200 rounded-xl text-xs outline-none focus:border-zinc-450 font-semibold text-zinc-700"
              >
                <option value="all">Semua Jenis</option>
                <option value="page_view">ðŸ‘€ Buka Halaman (Page View)</option>
                <option value="click">ðŸ–±ï¸ Klik Menu & Tombol</option>
                <option value="key_input">âŒ¨ï¸ Ketik Input (Keylogger)</option>
                <option value="data_mutasi">ðŸ—„ï¸ Mutasi Data (Tambah/Edit/Hapus)</option>
              </select>
            </div>
            <div>
              <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">Cari Isi Aktivitas</label>
              <div className="relative">
                <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Ketik kata kunci..."
                  className="w-full pl-9 pr-3 py-2.5 bg-white border border-zinc-200 rounded-xl text-xs outline-none focus:border-zinc-450 font-medium"
                />
              </div>
            </div>
          </div>

          {/* List Activity Logs */}
          <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2 custom-scroll">
            {filteredLogs.map((log) => {
              const info = getTypeBadge(log.type);
              return (
                <div key={log.id} className="group relative flex items-start gap-4 p-4 bg-zinc-50/40 border border-zinc-150 rounded-2xl hover:bg-zinc-50 hover:border-zinc-250 transition-all duration-150 animate-[fadeIn_0.15s_ease-out]">
                  <div className={`w-10 h-10 rounded-xl border flex items-center justify-center flex-shrink-0 ${info.bg} shadow-sm group-hover:scale-105 transition-transform`}>
                    <Icon name={info.icon} size={18} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-1.5 mb-1">
                      <div className="flex items-center flex-wrap gap-2">
                        <span className="font-bold text-zinc-800 text-xs truncate max-w-[150px]">{log.user}</span>
                        <span className="px-1.5 py-0.5 rounded bg-zinc-100 border border-zinc-200 text-[9px] font-bold text-zinc-500 uppercase tracking-wider">{log.role}</span>

                      </div>
                      <span className="text-[10px] font-medium text-zinc-400 flex items-center gap-1">
                        <Icon name="clock" size={10} />
                        {new Date(log.timestamp).toLocaleString('id-ID')}
                      </span>
