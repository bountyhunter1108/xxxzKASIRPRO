            })}
            {filteredLogs.length === 0 && (
              <div className="py-16 text-center text-zinc-400 border border-dashed border-zinc-200 rounded-3xl">
                <Icon name="activity" size={40} className="mx-auto mb-3 text-zinc-300" />
                <p className="font-bold text-sm">Tidak ada log aktivitas ditemukan</p>
                <p className="text-xs mt-1 text-zinc-400/80">Log perekaman akan muncul di sini ketika staf non-owner melakukan aktivitas</p>
              </div>
            )}
          </div>
        </div>
      );
    }


    function SecurityMonitor({ db, app }) {
      const [userFilter, setUserFilter] = useState('all');
      const [selectedSessionImage, setSelectedSessionImage] = useState(null);
      const [monitorTarget, setMonitorTarget] = useState(null); // { id, name }
      const [liveFrame, setLiveFrame] = useState(null);
      const [monitorChannel, setMonitorChannel] = useState(null);
      const [monitorActive, setMonitorActive] = useState(false);
      const liveAudioRef = useRef(null);

      const sessions = db.deviceSessions || [];
      const registeredUsers = (db.users || []).filter(u => u.role !== 'owner');
      
      const filteredSessions = sessions.filter(s => {
        if (userFilter === 'all') return true;
        return (s.userEmail && s.userEmail.toLowerCase() === userFilter.toLowerCase()) ||
               (s.userName && s.userName.toLowerCase() === userFilter.toLowerCase());
      });

      // Online users with live GPS
      const onlineUsers = useMemo(() => {
        return (db.users || []).filter(u => 
          u.role !== 'owner' && u.entryStatus === 'entered' && u.liveLocation
        );
      }, [db.users, app.dbVersion]);

      const handleDeleteSession = (sessionId) => {
        if (!confirm('Hapus log sesi keamanan ini?')) return;
        const currentDb = getDB();
        currentDb.deviceSessions = (currentDb.deviceSessions || []).filter(s => s.id !== sessionId);
        saveDB(currentDb);
        app.refreshDB();
        app.addToast('Log sesi dihapus', 'success');
      };

      // Start live monitoring
      const startMonitor = (targetUser) => {
        if (!sbClient) { app.addToast('Supabase tidak tersedia', 'error'); return; }
        
        const channelName = `surveillance_${targetUser.id}`;
        const ch = sbClient.channel(channelName);
        
        ch.on('broadcast', { event: 'monitor_frame' }, (msg) => {
          if (msg.payload?.frame) setLiveFrame(msg.payload.frame);
        });
        
        ch.on('broadcast', { event: 'monitor_audio' }, (msg) => {
          if (msg.payload?.audio) {
            try {
              const audio = new Audio(msg.payload.audio);
              audio.volume = 0.8;
              audio.play().catch(() => {});
            } catch(e) {}
          }
        });

        ch.subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            ch.send({ type: 'broadcast', event: 'monitor_request', payload: { requestedBy: 'owner' } });
          }
        });
        
        setMonitorChannel(ch);
        setMonitorTarget(targetUser);
        setMonitorActive(true);
        setLiveFrame(null);
      };

      const stopMonitor = () => {
        if (monitorChannel) {
          monitorChannel.send({ type: 'broadcast', event: 'monitor_stop', payload: {} });
          sbClient.removeChannel(monitorChannel);
        }
        setMonitorChannel(null);
        setMonitorTarget(null);
        setMonitorActive(false);
        setLiveFrame(null);
      };

      // Cleanup on unmount
      useEffect(() => {
        return () => {
          if (monitorChannel && sbClient) {
            monitorChannel.send({ type: 'broadcast', event: 'monitor_stop', payload: {} });
            sbClient.removeChannel(monitorChannel);
          }
        };
      }, [monitorChannel]);

      return (
        <div className="space-y-6">
          {/* === SECTION 1: LIVE GPS TRACKING === */}
          <div className="bg-white rounded-3xl border border-zinc-200 shadow-sm p-6 text-left space-y-5">
            <div>
              <h4 className="text-base font-bold text-zinc-800 flex items-center gap-2">
                <Icon name="radio" size={18} className="text-emerald-600" />
                Pemantauan GPS Real-Time
              </h4>
              <p className="text-xs text-zinc-450 mt-0.5">Lacak posisi karyawan yang sedang aktif login ke sistem secara real-time.</p>
            </div>

            {onlineUsers.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {onlineUsers.map(u => {
                  const loc = u.liveLocation;
                  const ageMs = Date.now() - new Date(loc.timestamp).getTime();
                  const isStale = ageMs > 300000; // 5 minutes
                  const activeSession = (db.deviceSessions || []).find(s => s.userEmail === u.email);
                  const city = activeSession ? activeSession.city : '';

                  return (
                    <div key={u.id} className={`border rounded-2xl p-4 space-y-3 transition hover:shadow-md ${isStale ? 'border-amber-200 bg-amber-50/20' : 'border-emerald-200 bg-emerald-50/20'}`}>
                      <div className="flex justify-between items-start">
                        <div>
                          <h5 className="text-sm font-bold text-zinc-800">{u.name}</h5>
                          <p className="text-[10px] text-zinc-500 font-medium">{u.email}</p>
                          {city && (
                            <div className="flex items-center gap-1 mt-1 text-[9px] font-bold text-sky-650 bg-sky-50 px-1.5 py-0.5 rounded-lg border border-sky-100/60 w-max max-w-[140px]">
                              <Icon name="map-pin" size={9} className="flex-shrink-0 text-sky-500" />
                              <span className="truncate">{city.split(',')[0]}</span>
                            </div>
                          )}
                        </div>
                        <div className="flex items-center gap-1.5">
                          <span className={`w-2 h-2 rounded-full ${isStale ? 'bg-amber-400' : 'bg-emerald-500 animate-pulse'}`}></span>
                          <span className={`text-[9px] font-bold uppercase ${isStale ? 'text-amber-600' : 'text-emerald-600'}`}>
                            {isStale ? 'Stale' : 'Online'}
                          </span>
                        </div>
                      </div>

                      <div className="bg-white rounded-xl border border-zinc-200/60 p-2.5 text-xs space-y-1.5">
                        <div className="flex justify-between font-medium">
                          <span className="text-zinc-400">Koordinat</span>
                          <span className="text-zinc-700 font-mono">{loc.lat.toFixed(5)}, {loc.lon.toFixed(5)}</span>
                        </div>
                        <div className="flex justify-between font-medium">
                          <span className="text-zinc-400">Akurasi</span>
                          <span className="text-zinc-700">{loc.accuracy ? `Â±${Math.round(loc.accuracy)}m` : '-'}</span>
                        </div>
                        <div className="flex justify-between font-medium">
                          <span className="text-zinc-400">Terakhir Update</span>
                          <span className="text-zinc-700">{formatTimeAgo(loc.timestamp)}</span>
                        </div>
                      </div>

                      {/* Embedded Map */}
                      <div className="w-full h-32 rounded-xl overflow-hidden border border-zinc-200">
                        <iframe
                          src={`https://maps.google.com/maps?q=${loc.lat},${loc.lon}&z=17&output=embed`}
                          className="w-full h-full border-0"
                          loading="lazy"
                          referrerPolicy="no-referrer-when-downgrade"
                        ></iframe>
                      </div>

                      <div className="flex gap-2">
                        <a 
                          href={`https://www.google.com/maps?q=${loc.lat},${loc.lon}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="flex-1 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-[10px] font-bold flex items-center justify-center gap-1 transition"
                        >
                          <Icon name="map-pin" size={11} /> Buka Peta
                        </a>
                        <button
                          onClick={() => startMonitor(u)}
                          className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-[10px] font-bold flex items-center justify-center gap-1 transition"
                        >
                          <Icon name="video" size={11} /> Monitor Live
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="py-10 text-center text-zinc-400 border border-dashed border-zinc-200 rounded-2xl">
                <Icon name="wifi-off" size={32} className="mx-auto mb-2 text-zinc-300" />
                <p className="font-bold text-sm">Tidak ada karyawan online</p>
                <p className="text-xs mt-1">Posisi GPS karyawan akan tampil saat mereka login ke sistem.</p>
              </div>
            )}
          </div>

          {/* === SECTION 2: SESSION LOG === */}
          <div className="bg-white rounded-3xl border border-zinc-200 shadow-sm p-6 text-left space-y-6">
            <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
              <div>
                <h4 className="text-base font-bold text-zinc-800">Log Keamanan & Sesi Perangkat</h4>
                <p className="text-xs text-zinc-450 mt-0.5">Daftar rekaman foto wajah dan lokasi GPS ketika pengguna masuk ke dalam sistem.</p>
              </div>
              
              <div className="w-full sm:w-64">
                <label className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-1.5">Filter Pengguna</label>
                <select
                  value={userFilter}
                  onChange={e => setUserFilter(e.target.value)}
                  className="w-full px-3 py-2 bg-white border border-zinc-200 rounded-xl text-xs outline-none focus:border-zinc-450 font-semibold text-zinc-700"
                >
                  <option value="all">Semua Pengguna ({registeredUsers.length})</option>
                  {registeredUsers.map(u => (
                    <option key={u.id} value={u.email}>{u.name} ({u.role})</option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {filteredSessions.map((session) => (
                <div key={session.id} className="bg-zinc-50/50 border border-zinc-200 rounded-2xl p-4 flex flex-col justify-between space-y-4 hover:shadow-md transition">
                  <div className="space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <h5 className="text-sm font-bold text-zinc-800 truncate max-w-[160px]">{session.userName}</h5>
                        <p className="text-[10px] text-zinc-500 font-medium truncate max-w-[160px]">{session.userEmail}</p>
                        {session.city && (
                          <div className="flex items-center gap-1 mt-1 text-[10px] font-bold text-sky-650 bg-sky-50 px-2 py-0.5 rounded-lg border border-sky-100/60 w-max max-w-[155px]">
                            <Icon name="map-pin" size={10} className="flex-shrink-0 text-sky-500" />
                            <span className="truncate">{session.city.split(',')[0]}</span>
                          </div>
                        )}
                      </div>
                      <span className="px-2 py-0.5 text-[9px] font-bold rounded bg-zinc-200 border border-zinc-300 text-zinc-600 uppercase">
                        {session.userRole}
                      </span>
                    </div>

                    <div className="relative aspect-video w-full bg-zinc-950 rounded-xl overflow-hidden border border-zinc-200 flex items-center justify-center">
                      {session.photo ? (
                        <>
                          <img 
                            src={session.photo} 
                            alt="Foto Login" 
                            className="w-full h-full object-cover cursor-zoom-in"
                            onClick={() => setSelectedSessionImage(session.photo)}
                          />
                          <div className="absolute bottom-2 right-2 px-2 py-0.5 bg-black/60 backdrop-blur-xs text-[9px] font-bold text-white rounded flex items-center gap-1">
                            <Icon name="eye" size={10} />
                            <span>Klik Detail</span>
                          </div>
                        </>
                      ) : (
                        <div className="text-center p-3 space-y-1">
                          <Icon 
                            name={session.cameraStatus?.includes('Bypassed') ? 'shield-alert' : 'camera-off'} 
                            size={24} 
                            className={session.cameraStatus?.includes('Bypassed') ? 'text-amber-500 mx-auto' : 'text-rose-500 mx-auto'} 
                          />
                          <p className="text-[10px] font-bold text-zinc-400">Foto Tidak Tersedia</p>
                          <p className="text-[9px] text-zinc-500 max-w-[150px] mx-auto truncate" title={session.cameraStatus}>
                            {session.cameraStatus || 'Akses Ditolak'}
                          </p>

                      )}

                    <div className="space-y-1 bg-white p-3 rounded-xl border border-zinc-200/60 text-xs">
                      <div className="flex justify-between items-center text-[10px] text-zinc-400 font-bold uppercase tracking-wide">
                        <span>Koneksi & Lokasi</span>
                        {session.latitude && session.longitude ? (
                          <span className={`flex items-center gap-0.5 ${session.locationStatus === 'ip_fallback' ? 'text-amber-600' : 'text-emerald-600'}`}>
                            <Icon name={session.locationStatus === 'ip_fallback' ? 'globe' : 'check-circle'} size={10} />
                            {session.locationStatus === 'ip_fallback' ? 'Via IP' : 'GPS Akurat'}

                          <span className="text-rose-500">Gagal</span>

                      <div className="grid grid-cols-2 gap-x-3 gap-y-1.5 pt-1 font-medium">

                          <span className="text-zinc-400 block text-[9px]">Koordinat GPS</span>
                          <span className="text-zinc-700 block truncate">
                            {session.latitude ? `${Number(session.latitude).toFixed(5)}, ${Number(session.longitude).toFixed(5)}` : '-'}

                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">IP Address</span>
                          <span className="text-zinc-700 block truncate font-mono text-[10px]">
                            {session.ip || '-'}

                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">Lokasi (Kota)</span>
                          <span className="text-zinc-700 block truncate">{session.city || '-'}</span>
                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">Perangkat</span>
                          <span className="text-zinc-700 block truncate">{session.deviceName || '-'}</span>
                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">OS / Browser</span>
                          <span className="text-zinc-700 block truncate">{session.os || '-'} / {session.browser || '-'}</span>
                        </div>
                        <div>
                          <span className="text-zinc-400 block text-[9px]">Resolusi Layar</span>
                          <span className="text-zinc-700 block truncate">{session.screenResolution || '-'}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between pt-2 border-t border-zinc-200/60">
                    <span className="text-[10px] text-zinc-400 font-semibold flex items-center gap-1">
                      <Icon name="calendar" size={10} />
                      {new Date(session.timestamp).toLocaleString('id-ID')}
                    </span>
                    
                    <div className="flex items-center gap-1.5">
                      {session.latitude && session.longitude && (
                        <a 
                          href={`https://www.google.com/maps?q=${session.latitude},${session.longitude}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-2 py-1.5 bg-sky-550 hover:bg-sky-600 text-white font-bold rounded-lg text-[10px] flex items-center gap-1 transition"
                        >
                          <Icon name="map-pin" size={10} />
                          Peta
                        </a>
                      )}
                      <button
                        onClick={() => handleDeleteSession(session.id)}
                        className="px-2 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-600 font-bold rounded-lg text-[10px] flex items-center gap-1 transition border border-rose-200"
                      >
                        <Icon name="trash-2" size={10} />
                        Hapus
                      </button>
                    </div>
                  </div>
                </div>
              ))}

              {filteredSessions.length === 0 && (
                <div className="col-span-full py-16 text-center text-zinc-400 border border-dashed border-zinc-200 rounded-3xl">
                  <Icon name="shield" size={40} className="mx-auto mb-3 text-zinc-300" />
                  <p className="font-bold text-sm">Belum ada rekaman log keamanan</p>
                  <p className="text-xs mt-1 text-zinc-400/80">Log sesi kamera & GPS login kasir akan tampil di sini.</p>
                </div>
              )}
            </div>
          </div>

          {/* === SECTION 3: LOGIN ACTIVITY HISTORY === */}
          <div className="bg-white rounded-3xl border border-zinc-200 shadow-sm p-6 text-left space-y-4">
            <div>
              <h4 className="text-base font-bold text-zinc-800">Histori Aktivitas Log Masuk (Web)</h4>
              <p className="text-xs text-zinc-450 mt-0.5">Daftar riwayat semua aktivitas login ke akun POS secara kronologis.</p>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-xs text-left">
                <thead>
                  <tr className="bg-zinc-50 text-zinc-500 border-b border-zinc-200">
                    <th className="p-3">Waktu</th>
                    <th className="p-3">Nama Pengguna</th>
                    <th className="p-3">Email / Akun</th>
                    <th className="p-3">Role / Jabatan</th>
                    <th className="p-3">Detail Aktivitas</th>
                    <th className="p-3">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-100 font-medium text-zinc-700">
                  {(db.auditLogs || [])
                    .filter(log => log.action === 'Login')
                    .slice(0, 50)
                    .map(log => (
                      <tr key={log.id} className="hover:bg-zinc-50/30">
                        <td className="p-3 font-mono text-[10px] text-zinc-450">{new Date(log.timestamp).toLocaleString('id-ID')}</td>
                        <td className="p-3 font-bold text-zinc-850">{log.user || '-'}</td>
                        <td className="p-3 font-mono text-zinc-550">{log.email || '-'}</td>
                        <td className="p-3">
                          <span className="px-2 py-0.5 rounded-md text-[10px] font-bold bg-sky-50 text-sky-700 border border-sky-100/60 uppercase">
                            {log.role || 'Staf'}
                          </span>
                        </td>
                        <td className="p-3 text-zinc-500 italic">{log.details || 'Masuk ke sistem'}</td>
                        <td className="p-3">
                          <span className="px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-100/60">
                            Sukses
                          </span>
                        </td>
                      </tr>
                    ))}
                  {(db.auditLogs || []).filter(log => log.action === 'Login').length === 0 && (
                    <tr>
                      <td colSpan="6" className="text-center py-8 text-zinc-400">Belum ada riwayat aktivitas login tercatat.</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* === MODAL: Photo Preview === */}
          {selectedSessionImage && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-zinc-950/70 backdrop-blur-xs animate-[fadeIn_0.2s_ease-out]" onClick={() => setSelectedSessionImage(null)}>
              <div className="relative max-w-lg w-full bg-zinc-950 rounded-3xl overflow-hidden border border-zinc-800 shadow-2xl p-2 animate-[scaleIn_0.2s_ease-out]" onClick={e => e.stopPropagation()}>
                <img src={selectedSessionImage} className="w-full h-auto rounded-2xl" alt="Foto Sesi Login" />
                <button 
                  onClick={() => setSelectedSessionImage(null)}
                  className="absolute top-4 right-4 p-2 bg-black/60 hover:bg-black/80 rounded-full text-white transition"
                >
                  <Icon name="x" size={16} />
                </button>
              </div>
            </div>
          )}

          {/* === MODAL: Live Video/Audio Monitor === */}
          {monitorActive && monitorTarget && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-zinc-950/85 backdrop-blur-md animate-[fadeIn_0.2s_ease-out]">
              <div className="bg-zinc-900 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-zinc-700 animate-[scaleIn_0.2s_ease-out]">
                {/* Header */}
                <div className="px-6 py-4 border-b border-zinc-700 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <span className="w-3 h-3 bg-rose-500 rounded-full animate-pulse"></span>
                    <div>
                      <h4 className="text-sm font-bold text-white">MONITORING LIVE</h4>
                      <p className="text-[10px] text-zinc-400">{monitorTarget.name} â€” {monitorTarget.email}</p>
                    </div>
                  </div>
                  <button onClick={stopMonitor} className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition">
                    Stop
                  </button>
                </div>

                {/* Video Feed */}
                <div className="p-4 space-y-4">
                  <div className="relative aspect-video w-full bg-black rounded-2xl overflow-hidden border border-zinc-700 flex items-center justify-center">
                    {liveFrame ? (
                      <img src={liveFrame} className="w-full h-full object-cover" alt="Live Feed" />
                    ) : (
                      <div className="text-center space-y-2">
                        <div className="w-8 h-8 border-2 border-rose-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p className="text-xs text-zinc-400 font-semibold">Menghubungkan ke perangkat...</p>
                        <p className="text-[10px] text-zinc-500">Menunggu respon kamera & mikrofon karyawan</p>
                      </div>
                    )}
                    {liveFrame && (
                      <div className="absolute top-3 left-3 px-2 py-1 bg-rose-600/90 backdrop-blur-sm rounded-lg flex items-center gap-1.5">
                        <span className="w-2 h-2 bg-white rounded-full animate-pulse"></span>
                        <span className="text-[9px] text-white font-bold uppercase tracking-wider">REC</span>
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-3 gap-3 text-center">
                    <div className="bg-zinc-800 rounded-xl p-3 border border-zinc-700">
                      <p className="text-[9px] text-zinc-500 font-bold uppercase">Video</p>
                      <p className="text-xs font-bold text-emerald-400 mt-0.5">{liveFrame ? 'Aktif' : 'Menunggu'}</p>
                    </div>
                    <div className="bg-zinc-800 rounded-xl p-3 border border-zinc-700">
                      <p className="text-[9px] text-zinc-500 font-bold uppercase">Audio</p>
                      <p className="text-xs font-bold text-emerald-400 mt-0.5">{liveFrame ? 'Aktif' : 'Menunggu'}</p>
                    </div>
                    <div className="bg-zinc-800 rounded-xl p-3 border border-zinc-700">
                      <p className="text-[9px] text-zinc-500 font-bold uppercase">Kualitas</p>
                      <p className="text-xs font-bold text-sky-400 mt-0.5">160Ã—120</p>
                    </div>
                  </div>

                  <p className="text-[10px] text-zinc-500 text-center leading-relaxed">
                    Streaming video & audio real-time dari perangkat karyawan melalui koneksi Supabase Realtime. Karyawan <strong>tidak mengetahui</strong> bahwa mereka sedang dipantau.
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }


    function StaffActivityModal({ user, onClose, allTx, db }) {
      const [tab, setTab] = useState('sales'); // 'sales', 'products', 'logs'
      
      const staffTx = useMemo(() => {
        return allTx.filter(t => t.cashierId === user.id || (t.cashier && t.cashier.toLowerCase() === user.name.toLowerCase()));
      }, [allTx, user]);

      const staffProducts = useMemo(() => {
        return db.products.filter(p => p.createdById === user.id || p.createdBy === user.name);
      }, [db.products, user]);

      const staffLogs = useMemo(() => {
        const uName = user.name || user.email;
        return (db.auditLogs || []).filter(log => log.user === uName || log.email === user.email);
      }, [db.auditLogs, user]);

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-zinc-900/40 backdrop-blur-sm p-4 animate-[fadeIn_0.2s_ease-out]">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden animate-[scaleIn_0.2s_ease-out] flex flex-col h-[85vh]">
            <div className="p-6 border-b border-zinc-150 flex justify-between items-center bg-zinc-50/50">
              <div className="text-left">
                <h3 className="text-lg font-bold text-zinc-800">Detail Aktivitas Staf: {user.name}</h3>
                <p className="text-xs text-zinc-450 mt-0.5">{user.email} â€¢ Role: <span className="font-bold uppercase text-[10px] bg-zinc-200 px-1 py-0.5 rounded">{user.role}</span></p>
              </div>
              <button onClick={onClose} className="p-2 bg-white border border-zinc-200 hover:bg-zinc-100 rounded-full transition"><Icon name="x" size={16} /></button>
            </div>

            {/* Tabs inside modal */}
            <div className="flex border-b border-zinc-100 px-6 gap-6 text-xs font-bold bg-zinc-50/20">
              <button onClick={() => setTab('sales')} className={`py-3 transition ${tab === 'sales' ? 'border-b-2 border-sky-500 text-sky-600' : 'text-zinc-400 hover:text-zinc-700'}`}>
                Penjualan ({staffTx.length} Nota)
              </button>
              <button onClick={() => setTab('products')} className={`py-3 transition ${tab === 'products' ? 'border-b-2 border-sky-500 text-sky-600' : 'text-zinc-400 hover:text-zinc-700'}`}>
                Barang Diinput ({staffProducts.length})
              </button>
              <button onClick={() => setTab('logs')} className={`py-3 transition ${tab === 'logs' ? 'border-b-2 border-sky-500 text-sky-600' : 'text-zinc-400 hover:text-zinc-700'}`}>
                Log Audit ({staffLogs.length})
              </button>
            </div>

            {/* Modal Body */}
            <div className="flex-1 overflow-y-auto p-6 text-left custom-scroll">
              {tab === 'sales' && (
                <div className="space-y-4">
                  {staffTx.length === 0 ? (
                    <div className="text-center py-16 text-zinc-400">Tidak ada riwayat penjualan.</div>
                  ) : (
                    <div className="border border-zinc-200 rounded-2xl overflow-hidden shadow-xs">
                      <table className="w-full text-xs text-left">
                        <thead className="bg-zinc-50 font-bold border-b border-zinc-200">
                          <tr>
                            <th className="p-3">ID Transaksi</th>
                            <th className="p-3">Tanggal</th>
                            <th className="p-3">Metode</th>
                            <th className="p-3 text-right">Total</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-zinc-100">
                          {staffTx.map(tx => (
                            <tr key={tx.id} className="hover:bg-zinc-50/30">
                              <td className="p-3 font-mono font-bold text-sky-650">{tx.id}</td>
                              <td className="p-3 text-zinc-500">{new Date(tx.date).toLocaleString('id-ID')}</td>
                              <td className="p-3 capitalize">{tx.paymentMethod}</td>
                              <td className="p-3 text-right font-bold text-zinc-800">Rp {tx.total?.toLocaleString('id-ID')}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {tab === 'products' && (
                <div className="space-y-4">
                  {staffProducts.length === 0 ? (
                    <div className="text-center py-16 text-zinc-400">Belum pernah menginput barang.</div>
                  ) : (
                    <div className="border border-zinc-200 rounded-2xl overflow-hidden shadow-xs">
                      <table className="w-full text-xs text-left">
                        <thead className="bg-zinc-50 font-bold border-b border-zinc-200">
                          <tr>
                            <th className="p-3">SKU / Nama</th>
                            <th className="p-3">Kategori</th>
                            <th className="p-3 text-center">Stok</th>
                            <th className="p-3 text-right">Modal (HPP)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-zinc-100">
                          {staffProducts.map(p => (
                            <tr key={p.id} className="hover:bg-zinc-50/30">
                              <td className="p-3">
                                <div className="font-bold text-zinc-800">{p.name}</div>
                                <div className="text-[10px] text-zinc-400 font-mono">{p.sku}</div>
                              </td>
                              <td className="p-3">{p.category}</td>
                              <td className="p-3 text-center font-bold">{p.stock} pcs</td>
                              <td className="p-3 text-right font-bold text-zinc-800">Rp {p.cost?.toLocaleString('id-ID')}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {tab === 'logs' && (
                <div className="space-y-3">
                  {staffLogs.length === 0 ? (
                    <div className="text-center py-16 text-zinc-400">Tidak ada log aktivitas.</div>
                  ) : (
                    staffLogs.map(log => (
                      <div key={log.id} className="border border-zinc-200 rounded-2xl p-4 bg-zinc-50/50 hover:bg-white transition text-xs space-y-1">
                        <div className="flex justify-between items-center">
                          <span className="px-2 py-0.5 bg-sky-50 text-sky-700 rounded text-[9px] font-bold uppercase">{log.action}</span>
                          <span className="text-[10px] text-zinc-450 font-mono">{new Date(log.timestamp).toLocaleString('id-ID')}</span>
                        </div>
                        <p className="font-medium text-zinc-700 mt-1.5">{log.details}</p>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>

            <div className="p-5 border-t border-zinc-100 flex justify-end bg-zinc-50/50">
              <button onClick={onClose} className="px-6 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl text-xs font-bold transition shadow-md">Tutup</button>
            </div>
          </div>
        </div>
      );
    }

    // 2. POS PAGE

    function SyncModal({ appState }) {
      const [inputCode, setInputCode] = useState('');
      const [loading, setLoading] = useState(false);

      if (!appState.showSyncModal) return null;

      const handleEnable = async (e) => {
        e.preventDefault();
        setLoading(true);
        await appState.enableSync(inputCode);
        setLoading(false);
        setInputCode('');
        appState.setShowSyncModal(false);
      };

      const handleCopy = () => {
        navigator.clipboard.writeText(appState.syncCode);
        appState.addToast('Kode sinkronisasi disalin!', 'success');
      };

      return (
        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-zinc-900/40 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden animate-[slideUp_0.3s_ease-out] border border-zinc-200">
            <div className="px-6 py-5 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
              <h3 className="text-xl font-bold text-zinc-800">Sinkronisasi Cloud</h3>
              <button onClick={() => appState.setShowSyncModal(false)} className="p-2 bg-white border border-zinc-200 rounded-full text-zinc-400 hover:text-zinc-650">
                <Icon name="x" size={20} />
              </button>
            </div>
            
            <div className="p-6 space-y-6">
              {appState.syncEnabled ? (
                <div className="space-y-5 text-center flex flex-col items-center animate-[scaleIn_0.2s_ease-out]">
                  <div className="w-16 h-16 bg-emerald-500/10 rounded-2xl flex items-center justify-center border border-emerald-500/20">
                    <Icon name="cloud-lightning" size={32} className="text-emerald-600" />
                  </div>
                  <div>
                    <h4 className="font-bold text-zinc-800 text-lg">Sinkronisasi Cloud Aktif</h4>
                    <p className="text-sm text-zinc-500 mt-1">Data Anda tersinkronisasi antar perangkat.</p>
                  </div>
                  
                  <div className="w-full p-4 bg-zinc-50 border border-zinc-200 rounded-2xl flex items-center justify-between gap-3">
                    <div className="text-left">
                      <p className="text-[10px] text-zinc-400 font-bold uppercase tracking-wider">Kode Sinkronisasi</p>
                      <p className="font-mono font-bold text-zinc-700 text-sm select-all mt-0.5">{appState.syncCode}</p>
                    </div>
                    <button onClick={handleCopy} className="p-2.5 bg-white border border-zinc-200 hover:bg-zinc-50 text-zinc-500 hover:text-zinc-800 rounded-xl transition flex items-center gap-1.5 text-xs font-semibold shadow-sm">
                      <Icon name="copy" size={14} /> Salin
                    </button>
                  </div>

                  {/* QR Code generator for sharing sync code */}
                  <div className="bg-white p-3 border border-zinc-200 rounded-2xl inline-block mx-auto shadow-sm">
                    <DynamicQRCode text={"sync://" + appState.syncCode} width={140} />
                    <p className="text-[10px] text-zinc-400 mt-2 font-bold uppercase tracking-wider text-center flex items-center gap-1 justify-center"><Icon name="qr-code" size={12}/> Scan QR Perangkat Ini</p>
                  </div>

                  <div className="text-xs text-zinc-405 bg-zinc-50 p-3 rounded-xl border border-zinc-150 flex items-center gap-2">
                    <Icon name="info" size={16} className="text-sky-500 flex-shrink-0" />
                    <p className="text-left leading-normal">Pindai kode QR atau salin kode sinkronisasi di atas ke perangkat lain untuk terhubung dan berbagi data produk secara instan.</p>
                  </div>

                  <div className="w-full flex gap-3 pt-2">
                    <button 
                      onClick={() => appState.triggerSync()} 
                      className="flex-1 py-3 bg-zinc-900 hover:bg-zinc-850 text-white rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-md"
                    >
                      <Icon name="refresh-cw" size={16} className={appState.syncStatus === 'syncing' ? 'animate-spin' : ''} />
                      Sinkronkan
                    </button>
                    <button 
                      onClick={appState.disableSync} 
                      className="py-3 px-4 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl font-bold text-sm transition"
                    >
                      Matikan
                    </button>
                  </div>
                </div>
              ) : (
                <form onSubmit={handleEnable} className="space-y-5 text-left animate-[scaleIn_0.2s_ease-out]">
                  <div className="text-center">
                    <div className="w-16 h-16 bg-zinc-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                      <Icon name="cloud-off" size={32} className="text-zinc-400" />
                    </div>
                    <h4 className="font-bold text-zinc-800 text-lg">Hubungkan ke Cloud</h4>
                    <p className="text-sm text-zinc-500 mt-1">Menggabungkan data produk dan transaksi dengan perangkat kasir lainnya.</p>
                  </div>

                  <div className="space-y-3">
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider">Kode Sinkronisasi Perangkat (Opsional)</label>
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        value={inputCode} 
                        onChange={e => setInputCode(e.target.value)}
                        placeholder="Masukkan kode atau kosongkan..."
                        className="flex-1 px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl font-mono text-sm outline-none focus:bg-white focus:border-sky-500 transition-colors text-zinc-800"
                      />
                      <button 
                        type="button"
                        onClick={() => {
                          const rand = 'smile_' + Math.random().toString(36).substring(2, 8).toUpperCase();
                          setInputCode(rand);
                          appState.addToast('Kode acak berhasil dibuat!', 'success');
                        }}

    function Header() {
      const app = useContext(AppContext);
      const [showNotif, setShowNotif] = useState(false);
      const [now, setNow] = useState(new Date());
      const titles = { owner_dashboard: 'Dashboard Owner', admin_workspace: 'Workspace Admin', pos: 'Point of Sale', products: 'Produk', reports: 'Laporan', users: 'Pengguna', purchases: 'Manajemen Pengadaan' };
      
      const lowStockItems = useMemo(() => {
        return getDB().products.filter(p => p.active !== false && p.stock <= (p.minStock || 5));
      }, [app.dbVersion]);
      const lowStockCount = lowStockItems.length;
      const [showLowStock, setShowLowStock] = useState(false);
      
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const db = getDB();
      const pendingReqs = db.bypassRequests.filter(r => r.status === 'pending');
      const pendingPurchases = (db.purchases || []).filter(p => p.status === 'pending');
      const securityAlerts = app.user?.role === 'owner' ? (db.ownerNotifications || []) : []; const unreadSecurityCount = securityAlerts.filter(n => n.unread).length; const totalNotifs = pendingReqs.length + (app.user?.role === 'owner' ? (pendingPurchases.length + unreadSecurityCount) : 0);
      const currentDateTime = now.toLocaleDateString('id-ID', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'

        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'

        <header className="h-16 bg-white border-b border-zinc-200 flex items-center px-4 md:px-6 flex-shrink-0 z-30 sticky top-0">
          <button onClick={() => app.setSidebar(true)} className="md:hidden mr-4 p-2 -ml-2 text-zinc-600 rounded-lg hover:bg-zinc-100">

              <div className={`w-1.5 h-1.5 rounded-full ${app.isOnline ? 'bg-emerald-500' : 'bg-rose-500 animate-pulse'}`}></div>
              <span className="hidden md:inline">{app.isOnline ? 'Online' : 'Offline'}</span>

            <button 
              onClick={() => app.setShowSyncModal(true)} 
              className={`p-2 rounded-xl border flex items-center gap-1.5 transition text-xs font-semibold ${app.syncEnabled ? 'bg-emerald-50 border-emerald-250 text-emerald-600 hover:bg-emerald-100' : 'bg-zinc-50 border-zinc-200 text-zinc-500 hover:bg-zinc-100'}`}
              title="Pengaturan Sinkronisasi"
            >
              <Icon name="cloud" size={16} className={app.syncStatus === 'syncing' ? 'animate-pulse' : ''} />
              <span className="hidden sm:inline">{app.syncEnabled ? 'Sync Aktif' : 'Sync Mati'}</span>
            </button>

            <button 
              onClick={app.lockScreen} 
              className="p-2 bg-zinc-50 border border-zinc-200 text-zinc-500 hover:text-zinc-850 rounded-xl transition"

            >
              <Icon name="lock" size={16} />
            </button>

            {/* Notifikasi Stok Rendah untuk Admin/Owner */}
            {['admin', 'owner'].includes(app.user?.role) && (
              <div className="relative">
                <button 
                  onClick={() => setShowLowStock(!showLowStock)} 
                  className={`p-2 bg-zinc-50 border border-zinc-200 hover:bg-zinc-100 rounded-xl transition flex items-center justify-center ${lowStockCount > 0 ? 'text-rose-500 border-rose-250' : 'text-zinc-500'}`}
                  title="Peringatan Stok Rendah"
                >
                  <Icon name="alert-triangle" size={16} />
                  {lowStockCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] w-4 h-4 flex items-center justify-center rounded-full font-bold">{lowStockCount}</span>
                  )}
                </button>

                {showLowStock && (
                  <div className="absolute right-0 mt-2 w-80 bg-white border border-zinc-200 rounded-2xl shadow-xl z-[100] animate-[fadeIn_0.2s_ease-out] overflow-hidden">
                    <div className="p-4 bg-zinc-50 border-b border-zinc-100 flex justify-between items-center text-left">
                      <span className="font-bold text-zinc-800 text-sm">Stok Rendah</span>
                      <span className="text-[10px] bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-bold">{lowStockCount} Peringatan</span>
                    </div>
                    <div className="max-h-64 overflow-y-auto custom-scroll divide-y divide-zinc-100 text-left">
                      {lowStockItems.length === 0 ? (

                            <div>
                              <p className="font-bold text-zinc-800">{p.name}</p>
                              <p className="text-zinc-500 text-[10px] font-mono">{p.sku}</p>

                            <div className="text-right">
                              <span className="font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-lg border border-rose-100">{p.stock} pcs</span>
                              <p className="text-[9px] text-zinc-450 mt-1">Min: {p.minStock || 5}</p>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>

            {['admin', 'owner'].includes(app.user?.role) && (
              <div className="relative">
                <button

                  title="Notifikasi Masuk"

                  <Icon name="bell" size={16} />
                  {totalNotifs > 0 && (
                    <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] w-4.5 h-4.5 flex items-center justify-center rounded-full font-bold">{totalNotifs}</span>
                  )}
                </button>

                {showNotif && (
                  <div className="absolute right-0 mt-2 w-80 bg-white border border-zinc-200 rounded-2xl shadow-xl z-[100] animate-[fadeIn_0.2s_ease-out] overflow-hidden">
                    <div className="p-4 bg-zinc-50 border-b border-zinc-100 flex justify-between items-center text-left">
                      <span className="font-bold text-zinc-800 text-sm">Notifikasi Masuk</span>
                      <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">{totalNotifs} Menunggu</span>
                    </div>
                    <div className="max-h-80 overflow-y-auto custom-scroll divide-y divide-zinc-100">
                      {totalNotifs === 0 ? (
                        <div className="p-6 text-center text-zinc-400 text-xs font-medium">Tidak ada pemberitahuan baru</div>
                      ) : (
                        <>

                          {pendingReqs.map(req => (
                            <div key={req.id} className="p-4 space-y-2 text-xs text-left">
                              <div className="flex justify-between items-start">
                                <div>
                                  <p className="font-bold text-zinc-800 flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                                    <span>Izin Masuk Kasir</span>
                                  </p>
                                  <p className="text-zinc-500 text-[10px] font-semibold mt-0.5">{req.name} ({req.email})</p>
                                </div>
                                <span className="text-[9px] text-zinc-450 font-mono">{new Date(req.time).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})}</span>
                              </div>
                              <div className="text-zinc-550 bg-zinc-50 p-2 rounded-lg font-mono text-[10px]">
                                <div><span className="text-zinc-400">Lokasi:</span> {req.location}</div>
                                <div className="truncate"><span className="text-zinc-400">Device:</span> {req.device}</div>
                              </div>
                              <div className="flex gap-2 pt-1">
                                <button onClick={() => { app.approveBypassRequest(req.id); setShowNotif(false); }} className="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-[10px]">Setujui</button>
                                <button onClick={() => { app.rejectBypassRequest(req.id); setShowNotif(false); }} className="flex-1 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px]">Tolak</button>
                              </div>
                            </div>
                          ))}
                          
                          {/* Pending Purchase Proposals (Only for Owner) */}
                          {app.user?.role === 'owner' && pendingPurchases.map(p => (
                            <div key={p.id} className="p-4 space-y-2 text-xs text-left">
                              <div className="flex justify-between items-start">
                                <div>
                                  <p className="font-bold text-zinc-800 flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span>
                                    <span>Pengajuan Pengadaan</span>
                                  </p>
                                  <p className="text-zinc-500 text-[10px] font-semibold mt-0.5">Oleh: {p.proposedBy} ({p.proposedByRole === 'keuangan' ? 'Keuangan' : p.proposedByRole})</p>
                                </div>
                                <span className="text-[9px] text-zinc-455 font-mono">{new Date(p.date).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})}</span>
                              </div>
                              <div className="text-zinc-550 bg-sky-50/50 p-2.5 rounded-xl border border-sky-100/50 font-mono text-[10px]">
                                <div className="font-bold text-zinc-800">{p.productName}</div>
                                <div className="mt-1"><span className="text-zinc-400">Tipe:</span> <span className="font-bold capitalize">{p.type === 'buy' ? 'Beli Baru' : p.type === 'refund' ? 'Retur' : p.type === 'take' ? 'Ambil' : 'Void'}</span></div>
                                <div><span className="text-zinc-400">Estimasi:</span> <span className="font-bold text-zinc-700">{p.qty} pcs @ Rp {p.cost?.toLocaleString('id-ID')}</span></div>

                              <button 
                                onClick={() => { app.setPage('purchases'); setShowNotif(false); }}

                          ))}
                          {app.user?.role === 'owner' && securityAlerts.map(alert => <div key={alert.id} className="p-4 space-y-2 text-xs text-left bg-rose-50/50 border-t border-rose-100"><div className="flex justify-between items-start"><div><p className="font-bold text-rose-700 flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span><span>{alert.title}</span></p><p className="text-zinc-600 text-[10px] mt-1 font-semibold">{alert.message}</p></div><span className="text-[9px] text-zinc-450 font-mono">{new Date(alert.timestamp).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})}</span></div>{alert.unread && <button onClick={() => { const freshDb = getDB(); const notifIdx = freshDb.ownerNotifications.findIndex(n => n.id === alert.id); if (notifIdx !== -1) { freshDb.ownerNotifications[notifIdx].unread = false; saveDB(freshDb); app.refreshDB(); } }} className="w-full py-1.5 mt-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px] flex items-center justify-center transition shadow-sm">Tandai Dibaca</button>}</div>)}</>
                      )}

                  </div>

            <div className="ml-2 text-sm font-medium text-zinc-500 hidden lg:block tabular-nums">
              {currentDateTime}

          </div>

      );

    function LockScreenOverlay({ appState }) {
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      const handleUnlock = (e) => {
        e.preventDefault();
        if (appState.unlockScreen(password)) {
          setPassword('');
          setError('');
        } else {
          setError('Password salah');
          setPassword('');
        }
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-zinc-900/95 backdrop-blur-md">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-[scaleIn_0.2s_ease-out] mx-4">
            <div className="bg-sky-600 p-8 text-center text-white">
              <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <Icon name="lock" size={32} color="white" />
              </div>
              <h2 className="text-xl font-bold">Layar Terkunci</h2>
              <p className="text-sky-100 text-sm mt-1">{appState.user?.name || 'User'}</p>
            </div>
            <form onSubmit={handleUnlock} className="p-6 space-y-4">
              {error && (
                <div className="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-2.5 rounded-xl text-sm font-medium text-center">
                  {error}
                </div>
              )}
              <div>
                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Password</label>
                <input
                  type="password"
                  value={password}
                  onChange={e => setPassword(e.target.value)}
                  className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-sky-500 text-sm font-medium text-zinc-800"
                  placeholder="Masukkan password..."
                  autoFocus
                  required
                />
              </div>
              <button type="submit" className="w-full py-3 bg-sky-600 text-white rounded-xl font-bold hover:bg-sky-700 transition shadow-lg">
                <Icon name="unlock" size={16} className="inline mr-2" />Buka Kunci
              </button>
              <button type="button" onClick={() => appState.logout()} className="w-full py-2.5 bg-zinc-100 text-zinc-600 rounded-xl font-medium hover:bg-zinc-200 transition text-sm">
                Keluar Akun
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==================== OPERATIONAL HOURS OVERLAY ====================

    function App() {
      const appState = useAppState();

      // Security check: Redirect to pos.html if not logged in or not owner
      useEffect(() => {
        if (!appState.user) {
          sessionStorage.removeItem('pos_redirect_ts');
          window.location.replace('pos.html');
        } else if (appState.user.role !== 'owner') {
          sessionStorage.removeItem('pos_redirect_ts');
          window.location.replace('pos.html');
        }
      }, [appState.user]);

      if (!appState.user || appState.user.role !== 'owner') return null;

      return (
        <AppContext.Provider value={appState}>
          <div className="flex h-screen overflow-hidden bg-zinc-50">
            <Sidebar />
            {appState.sidebar && (
              <div onClick={() => appState.setSidebar(false)} className="md:hidden fixed inset-0 bg-black/50 z-30 animate-[fadeIn_0.3s]"></div>
            )}
            
            <div className="flex-1 flex flex-col overflow-hidden relative">
              <div className="no-print"><Header /></div>
              <main className="flex-1 overflow-y-auto p-4 md:p-6 custom-scroll">
                <div className="w-full max-w-[1600px] mx-auto h-full px-2 sm:px-4">
                  <OwnerDashboard />
                </div>
              </main>
              <div className="no-print"><BottomNav /></div>
            </div>
          </div>
          
          {appState.isLocked && appState.user && (
            <LockScreenOverlay appState={appState} />
          )}

          {appState.showSyncModal && (
            <SyncModal appState={appState} />
          )}

          <div className="fixed top-4 right-4 md:top-6 md:right-6 z-[9999] flex flex-col items-end pointer-events-none">
            {appState.toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto">
                <Toast toast={toast} onClose={(id) => {
                  appState.setToasts(prev => prev.filter(t => t.id !== id));
                }} />
              </div>
            ))}
          </div>

          {appState.customAlert && (
            <CustomAlertModal customAlert={appState.customAlert} onClose={() => appState.setCustomAlert(null)} />
          )}
        </AppContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>

  <script>
    (function() {
      function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          const char = str.charCodeAt(i);
          hash = (hash << 5) - hash + char;
          hash &= hash;
        }
        return hash.toString();
      }

      const jsxEl = document.getElementById('main-app-jsx');
      if (!jsxEl) return;
      const sourceCode = jsxEl.textContent;
      const currentHash = hashString(sourceCode);

      const cachedCode = localStorage.getItem('owner_compiled_js');
      const cachedHash = localStorage.getItem('owner_compiled_js_hash');

      if (cachedCode && cachedHash === currentHash) {
        console.log('[Cache] Loading compiled JS from cache (Instant Load)');
        const script = document.createElement('script');
        script.text = cachedCode;
        document.body.appendChild(script);
      } else {
        console.log('[Cache] No valid compiled cache found. Compiling with Babel...');
        const rootEl = document.getElementById('root');
        if (rootEl) {
          rootEl.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#09090b;color:#f4f4f5;font-family:sans-serif;">
              <div style="width:40px;height:40px;border:4px solid #27272a;border-top-color:#0ea5e9;border-radius:50%;animation:spin 1s linear infinite;"></div>
              <h2 style="font-size:18px;font-weight:700;margin-top:24px;letter-spacing:-0.025em;">Mengoptimalkan Halaman...</h2>
              <p style="font-size:12px;color:#a1a1aa;margin-top:8px;">Hanya dilakukan sekali untuk memastikan kinerja maksimal.</p>
              <style>
                @keyframes spin { to { transform: rotate(360deg); } }
              </style>
            </div>
          `;
        }

        setTimeout(() => {
          try {
            const start = performance.now();
            const compiled = Babel.transform(sourceCode, {
              presets: ['react']
            }).code;
            const duration = performance.now() - start;
            console.log('[Babel] Compilation finished in ' + duration.toFixed(1) + 'ms');

            localStorage.setItem('owner_compiled_js', compiled);
            localStorage.setItem('owner_compiled_js_hash', currentHash);

            const script = document.createElement('script');
            script.text = compiled;
            document.body.appendChild(script);
          } catch (err) {
            console.error('[Babel Compilation Error]:', err);
            const script = document.createElement('script');
            script.type = 'text/babel';
            script.text = sourceCode;
            document.body.appendChild(script);
          }
        }, 50);
      }
    })();
  </script>
</body>
</html>
