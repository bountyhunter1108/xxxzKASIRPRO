                <div className="flex justify-between items-center mb-6">
                  <div className="flex items-center gap-2.5">
                    <div className="p-2.5 bg-sky-50 text-sky-600 rounded-xl">
                      <Icon name="keyboard" size={20} />
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-zinc-950">Panduan Keyboard Shortcuts</h3>
                      <p className="text-[10px] text-zinc-400 font-medium">Gunakan tombol keyboard untuk navigasi cepat kasir</p>
                    </div>
                  </div>
                  <button onClick={() => setShowShortcutModal(false)} className="p-2 bg-zinc-100 rounded-full text-zinc-500 hover:bg-zinc-200 transition">
                    <Icon name="x" size={16} />
                  </button>
                </div>

                <div className="space-y-3.5">
                  <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                    <span className="text-xs font-semibold text-zinc-700">Tampilkan Panduan Ini</span>
                    <kbd className="px-2 py-1 bg-zinc-150 border border-zinc-300 rounded-lg text-[10px] font-bold font-mono shadow-sm">F1</kbd>
                  </div>
                  <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                    <span className="text-xs font-semibold text-zinc-700">Fokus Pencarian Produk</span>
                    <kbd className="px-2 py-1 bg-zinc-150 border border-zinc-300 rounded-lg text-[10px] font-bold font-mono shadow-sm">F2</kbd>
                  </div>
                  <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                    <span className="text-xs font-semibold text-zinc-700">Tambah Diskon Transaksi</span>
                    <kbd className="px-2 py-1 bg-zinc-150 border border-zinc-300 rounded-lg text-[10px] font-bold font-mono shadow-sm">F4</kbd>
                  </div>
                  <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                    <span className="text-xs font-semibold text-zinc-700">Bayar / Selesaikan Transaksi</span>
                    <kbd className="px-2 py-1 bg-zinc-150 border border-zinc-300 rounded-lg text-[10px] font-bold font-mono shadow-sm">F7</kbd>
                  </div>
                  <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                    <span className="text-xs font-semibold text-zinc-700">Bersihkan Keranjang Belanja</span>
                    <kbd className="px-2 py-1 bg-rose-50 border border-rose-200 rounded-lg text-[10px] font-bold font-mono text-rose-600 shadow-sm">F8</kbd>
                  </div>
                  <div className="flex justify-between items-center py-2 border-b border-zinc-100">
                    <span className="text-xs font-semibold text-zinc-700">Fokus Pencarian Pelanggan (Member)</span>

                  </div>
                  <div className="flex justify-between items-center py-2">
                    <span className="text-xs font-semibold text-zinc-700">Tutup / Batalkan Semua Modal</span>
                    <kbd className="px-2 py-1 bg-zinc-150 border border-zinc-300 rounded-lg text-[10px] font-bold font-mono shadow-sm">ESC</kbd>
                  </div>

                <button onClick={() => setShowShortcutModal(false)} className="w-full mt-6 py-3 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl font-bold text-sm transition shadow-md">
                  Mengerti
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }


    function CategoryModal({ onClose, app }) {
      const [categories, setCategories] = useState([]);
      const [newCategory, setNewCategory] = useState('');
      const [editIndex, setEditIndex] = useState(-1);
      const [editValue, setEditValue] = useState('');

      useEffect(() => {
        setCategories(getDB().categories || []);
      }, [app.dbVersion]);

      const handleAdd = (e) => {
        e.preventDefault();
        const trimmed = newCategory.trim();
        if (!trimmed) return;
        if (categories.includes(trimmed)) {
          app.addToast('Kategori sudah ada', 'error');
          return;
        }
        const db = getDB();
        db.categories.push(trimmed);
        saveDB(db);
        app.refreshDB();
        setNewCategory('');
        app.addToast('Kategori ditambahkan', 'success');
      };

      const handleSaveEdit = (idx) => {
        const trimmed = editValue.trim();
        if (!trimmed) return;
        if (categories.includes(trimmed) && categories[idx] !== trimmed) {
          app.addToast('Kategori sudah ada', 'error');
          return;
        }
        const db = getDB();
        const oldName = db.categories[idx];
        db.categories[idx] = trimmed;
        
        // Update products category if they were using the old category
        db.products = db.products.map(p => {
          if (p.category === oldName) p.category = trimmed;
          return p;
        });

        saveDB(db);
        app.refreshDB();
        setEditIndex(-1);
        app.addToast('Kategori diperbarui', 'success');
      };

      const handleDelete = (idx) => {
        const catName = categories[idx];
        const db = getDB();
        const isUsed = db.products.some(p => p.category === catName && p.active);
        if (isUsed) {
          if (!confirm(`Kategori "${catName}" sedang digunakan oleh produk aktif. Tetap hapus?`)) {
            return;
          }
        }
        db.categories.splice(idx, 1);
        saveDB(db);
        app.refreshDB();
        app.addToast('Kategori dihapus', 'success');
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-900/40 backdrop-blur-sm ">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden  flex flex-col max-h-[85vh]">
            <div className="px-6 py-5 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
              <h3 className="text-xl font-bold text-zinc-800 text-left">Kelola Kategori</h3>
              <button onClick={onClose} className="p-2 bg-zinc-100 hover:bg-zinc-200 rounded-full transition"><Icon name="x" size={18} /></button>
            </div>
            
            <div className="p-6 flex-1 overflow-y-auto space-y-5 custom-scroll">
              <form onSubmit={handleAdd} className="flex gap-2">
                <input 
                  type="text" 
                  value={newCategory} 
                  onChange={e => setNewCategory(e.target.value)}
                  placeholder="Kategori baru..." 
                  className="flex-1 px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white focus:border-sky-500 font-medium text-sm text-zinc-800"
                  required
                />
                <button type="submit" className="px-4 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl font-semibold text-sm shadow-md">Tambah</button>
              </form>

              <div className="divide-y divide-zinc-100 border border-zinc-200 rounded-2xl overflow-hidden bg-white">
                {categories.map((c, idx) => (
                  <div key={idx} className="p-4 flex items-center justify-between gap-3 hover:bg-zinc-50/30">
                    {editIndex === idx ? (
                      <div className="flex-1 flex gap-2">
                        <input 
                          type="text" 
                          value={editValue} 
                          onChange={e => setEditValue(e.target.value)}
                          className="flex-1 px-3 py-1.5 bg-white border border-zinc-300 rounded-lg outline-none focus:border-sky-500 text-sm font-semibold"
                          autoFocus
                        />
                        <button onClick={() => handleSaveEdit(idx)} className="p-2 text-emerald-600 bg-emerald-50 rounded-lg hover:bg-emerald-100"><Icon name="check" size={16}/></button>
                        <button onClick={() => setEditIndex(-1)} className="p-2 text-zinc-500 bg-zinc-100 rounded-lg hover:bg-zinc-200"><Icon name="x" size={16}/></button>
                      </div>
                    ) : (
                      <>
                        <span className="font-semibold text-zinc-700 text-sm">{c}</span>
                        <div className="flex gap-1">
                          <button onClick={() => { setEditIndex(idx); setEditValue(c); }} className="p-2 text-sky-600 hover:bg-sky-50 rounded-lg"><Icon name="edit" size={14} /></button>
                          <button onClick={() => handleDelete(idx)} className="p-2 text-rose-600 hover:bg-rose-50 rounded-lg"><Icon name="trash-2" size={14} /></button>
                        </div>
                      </>
                    )}
                  </div>
                ))}
                {categories.length === 0 && <div className="p-6 text-center text-zinc-400 text-sm">Belum ada kategori</div>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 3. PRODUCTS PAGE

    function TransactionEditModal({ tx, onClose, app }) {
      const [cashier, setCashier] = useState(tx.cashier);
      const [method, setMethod] = useState(tx.method || 'cash');
      const [discount, setDiscount] = useState(tx.discount || 0);
      const [items, setItems] = useState(JSON.parse(JSON.stringify(tx.items))); // deep clone
      const [showReason, setShowReason] = useState(false);
      const [debtNotes, setDebtNotes] = useState(tx.debtNotes || '');
      
      const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
      const total = subtotal - discount;

      const handleUpdateQty = (itemId, delta) => {
        const db = getDB();
        const prod = db.products.find(p => p.id === itemId);
        if (!prod) return;

        setItems(prev => prev.map(item => {
          if (item.id === itemId) {
            const currentTxQty = item.qty;
            const newTxQty = currentTxQty + delta;
            
            if (newTxQty < 1) return item;

            const diff = newTxQty - currentTxQty;
            if (diff > 0 && prod.stock < diff) {
              app.addToast(`Stok ${prod.name} tidak mencukupi untuk ditambah`, 'error');
              return item;
            }
            return { ...item, qty: newTxQty };
          }
          return item;
        }));
      };

      const handleRemoveItem = (itemId) => {
        if (items.length <= 1) {
          app.addToast('Transaksi harus memiliki minimal 1 produk', 'error');
          return;
        }
        setItems(prev => prev.filter(i => i.id !== itemId));
      };

      const handleSave = () => {
        const db = getDB();
        if (app.user?.role !== 'owner') {
          // Verify stock first
          let stockOk = true;
          let failedProd = '';
          items.forEach(newItem => {
            const prod = db.products.find(p => p.id === newItem.id);
            const oldQty = tx.items.find(i => i.id === newItem.id)?.qty || 0;
            const diff = newItem.qty - oldQty;
            if (prod && diff > 0 && prod.stock < diff) {
              stockOk = false;
              failedProd = prod.name;
            }
          });
          if (!stockOk) {
            app.addToast(`Stok ${failedProd} tidak mencukupi`, 'error');
            return;
          }
          setShowReason(true);
          return;
        }
        const txIdx = db.transactions.findIndex(t => t.id === tx.id);
        if (txIdx === -1) return;

        const originalTx = db.transactions[txIdx];
        
        // Rollback old stock changes for the original items
        originalTx.items.forEach(oldItem => {
          const prod = db.products.find(p => p.id === oldItem.id);
          if (prod) {
            prod.stock += oldItem.qty; // restore original stock
          }
        });

        // Verify and apply new stock deductions
        let stockOk = true;
        let failedProd = '';
        items.forEach(newItem => {
          const prod = db.products.find(p => p.id === newItem.id);
          if (!prod || prod.stock < newItem.qty) {
            stockOk = false;
            failedProd = prod ? prod.name : 'Produk tidak ditemukan';
          }
        });

        if (!stockOk) {
          app.addToast(`Stok ${failedProd} tidak mencukupi`, 'error');
          // Re-rollback products to keep database consistent
          originalTx.items.forEach(oldItem => {
            const prod = db.products.find(p => p.id === oldItem.id);
            if (prod) {
              prod.stock -= oldItem.qty;
            }
          });
          return;
        }

        // Apply new stock deductions
        items.forEach(newItem => {
          const prod = db.products.find(p => p.id === newItem.id);
          if (prod) {
            prod.stock -= newItem.qty;
            prod.updatedAt = new Date().toISOString();
          }
        });

        // Update transaction details
        originalTx.cashier = cashier;
        originalTx.method = method;
        originalTx.discount = discount;
        originalTx.items = items;
        originalTx.subtotal = subtotal;
        originalTx.total = total;
        originalTx.debtNotes = method === 'debt' ? debtNotes : null;
        originalTx.updatedAt = new Date().toISOString();

        saveDB(db);
        app.refreshDB();
        app.addToast('Transaksi berhasil diperbarui', 'success');
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-2xl max-h-[95vh] overflow-hidden flex flex-col shadow-2xl">
            <div className="p-6 border-b border-zinc-150 flex justify-between items-center bg-zinc-50">
              <div>
                <h3 className="text-lg font-bold text-zinc-950">Edit Transaksi</h3>
                <p className="text-xs text-zinc-500 mt-0.5">ID Transaksi: {tx.id}</p>
              </div>
              <button onClick={onClose} className="p-1.5 hover:bg-zinc-200 rounded-lg transition text-zinc-500">
                <Icon name="x" size={20} />
              </button>
            </div>
            
            <div className="p-6 flex-1 overflow-y-auto space-y-6 text-left">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Kasir</label>
                  <input 
                    type="text" 
                    value={cashier} 
                    onChange={e => setCashier(e.target.value)} 
                    className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl focus:bg-white focus:border-zinc-500 outline-none font-medium text-zinc-800" 
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Metode Pembayaran</label>
                  <select 
                    value={method} 
                    onChange={e => setMethod(e.target.value)} 
                    className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none font-medium text-zinc-800 focus:bg-white focus:border-zinc-500"
                  >
                    <option value="cash">Tunai (Cash)</option>
                    <option value="qris">QRIS</option>
                    <option value="transfer">Transfer Bank</option>
                    <option value="debt">Hutang / Bon</option>
                  </select>
                </div>
              </div>

              {method === 'debt' && (
                <div className="">
                  <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Keterangan Hutang (Nama &amp; Kontak)</label>
                  <textarea
                    value={debtNotes}
                    onChange={e => setDebtNotes(e.target.value)}
                    placeholder="Tulis nama pelanggan, nomor kontak, dan tanggal jatuh tempo..."
                    className="w-full h-20 px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl focus:bg-white focus:border-zinc-500 outline-none font-medium text-zinc-800 resize-none text-xs shadow-2xs"
                    required
                  />
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-3">Item Produk</label>
                <div className="border border-zinc-150 rounded-xl overflow-hidden divide-y divide-zinc-100">
                  {items.map(item => (
                    <div key={item.id} className="p-4 flex items-center justify-between gap-4">
                      <div className="flex-1 min-w-0">
                        <p className="font-semibold text-zinc-800 truncate text-sm">{item.name}</p>
                        <p className="text-xs text-zinc-400 font-medium">Rp {item.price.toLocaleString('id-ID')} x {item.qty}</p>
                      </div>
                      
                      <div className="flex items-center gap-3">
                        <div className="flex items-center bg-zinc-100 rounded-lg p-0.5 border border-zinc-200">
                          <button type="button" onClick={() => handleUpdateQty(item.id, -1)} className="p-1 hover:bg-white rounded text-zinc-650 transition"><Icon name="minus" size={14} /></button>
                          <span className="w-10 text-center font-bold text-xs text-zinc-800">{item.qty}</span>
                          <button type="button" onClick={() => handleUpdateQty(item.id, 1)} className="p-1 hover:bg-white rounded text-zinc-650 transition"><Icon name="plus" size={14} /></button>
                        </div>
                        
                        <button type="button" onClick={() => handleRemoveItem(item.id)} className="p-2 hover:bg-rose-50 rounded-lg text-rose-500 transition" title="Hapus Produk">
                          <Icon name="trash-2" size={16} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="p-4 bg-zinc-50 rounded-xl border border-zinc-150 space-y-2">
                <div className="flex justify-between text-sm text-zinc-650">
                  <span>Subtotal</span>
                  <span className="font-semibold text-zinc-800">Rp {subtotal.toLocaleString('id-ID')}</span>
                </div>
                <div className="flex justify-between items-center text-sm text-zinc-650">
                  <span>Diskon</span>
                  <input 
                    type="number" 
                    value={discount} 
                    onChange={e => setDiscount(Math.max(0, parseInt(e.target.value) || 0))} 
                    className="w-28 text-right px-2.5 py-1 bg-zinc-50 border border-zinc-200 rounded-lg outline-none font-semibold focus:bg-white text-zinc-850" 
                  />
                </div>
                <div className="flex justify-between text-lg font-bold text-zinc-950 pt-2 border-t border-zinc-200">
                  <span>Total Tagihan Baru</span>
                  <span className="text-sky-600">Rp {total.toLocaleString('id-ID')}</span>
                </div>
              </div>
            </div>
            
            <div className="p-6 bg-zinc-50 flex gap-3 border-t border-zinc-150">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-white border border-zinc-200 text-zinc-700 rounded-xl font-semibold hover:bg-zinc-100 transition">Batal</button>
              <button type="button" onClick={handleSave} className="flex-1 py-3 bg-zinc-900 text-white rounded-xl font-semibold hover:bg-zinc-800 transition shadow-md">Simpan Perubahan</button>
            </div>
          </div>
          {showReason && (
            <ReasonModal
              isOpen={showReason}
              onClose={() => setShowReason(false)}
              title="Pengajuan Edit Transaksi"
              onSubmit={(reason) => {
                const currentDb = getDB();
                const newApproval = {
                  id: 'AP' + Date.now(),
                  requesterId: app.user.id,
                  requesterName: app.user.name,
                  requesterRole: app.user.role,
                  type: 'transaction_edit',
                  targetId: tx.id,
                  reason: reason.trim(),
                  data: {
                    cashier,
                    method,
                    discount,
                    items,
                    subtotal,
                    total,
                    debtNotes: method === 'debt' ? debtNotes : null
                  },
                  status: 'pending',
                  createdAt: new Date().toISOString()
                };
                currentDb.adminApprovals.push(newApproval);
                saveDB(currentDb);
                app.refreshDB();
                app.addToast('Pengajuan edit transaksi berhasil dikirim ke Owner', 'success');
                setShowReason(false);
                onClose();
              }}
            />
          )}
        </div>
      );
    }


    function ReasonModal({ isOpen, onClose, onSubmit, title }) {
      const [reason, setReason] = useState('');
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl p-6 text-left border border-zinc-150 ">
            <h3 className="text-base font-bold text-zinc-900 mb-2">{title || 'Alasan Pengajuan'}</h3>
            <p className="text-xs text-zinc-500 mb-4">Aksi modifikasi laporan oleh Admin memerlukan persetujuan dari Owner. Silakan tulis deskripsi/alasan pengajuan Anda.</p>
            <textarea
              value={reason}
              onChange={e => setReason(e.target.value)}
              placeholder="Tulis alasan atau deskripsi pengajuan di sini..."
              className="w-full h-24 p-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-zinc-500 focus:bg-white text-xs font-semibold resize-none mb-4"
            />
            <div className="flex gap-3">
              <button onClick={onClose} type="button" className="flex-1 py-2 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-bold rounded-xl text-xs transition">Batal</button>
              <button 
                onClick={() => {
                  if (!reason.trim()) {
                    alert('Harap isi alasan pengajuan');
                    return;
                  }
                  onSubmit(reason);
                  setReason('');
                }} 
                type="button"
                className="flex-1 py-2 bg-zinc-900 hover:bg-zinc-800 text-white font-bold rounded-xl text-xs transition"
              >
                Kirim Pengajuan
              </button>
            </div>
          </div>
        </div>
      );
    }


    function TutupShiftModal({ appState }) {
      const [actualCash, setActualCash] = useState('');
      const db = getDB();
      const activeShift = appState.activeShift;

      if (!activeShift) return null;

      const cashSales = db.transactions
        .filter(t => t.cashier === appState.user?.name && new Date(t.date) >= new Date(activeShift.startTime) && t.method === 'cash' && !t.deleted)
        .reduce((sum, t) => sum + t.total, 0);

      const expectedCash = activeShift.startCash + cashSales;
      const difference = (parseFloat(actualCash) || 0) - expectedCash;

      const handleSubmit = (e) => {
        e.preventDefault();
        const cash = parseFloat(actualCash) || 0;
        appState.endShift(cash);
        appState.setShowTutupShiftModal(false);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 backdrop-blur-sm p-4 ">
          <div className="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden ">
            <div className="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50 text-left">
              <h3 className="text-lg font-bold text-zinc-800">Tutup Shift</h3>
              <button onClick={() => appState.setShowTutupShiftModal(false)} type="button" className="p-2 bg-zinc-100 rounded-full text-zinc-500 hover:bg-zinc-200 transition"><Icon name="x" size={16} /></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 text-left space-y-4">
              <div className="bg-zinc-50 p-4 rounded-2xl border border-zinc-150 space-y-2 text-sm text-zinc-700">
                <div className="flex justify-between">
                  <span className="text-zinc-500">Kasir:</span>
                  <span className="font-semibold text-zinc-800">{activeShift.cashierName}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-zinc-500">Mulai Shift:</span>
                  <span className="font-medium">{new Date(activeShift.startTime).toLocaleString('id-ID')}</span>
                </div>
                <hr className="border-zinc-200 my-1" />
                <div className="flex justify-between">
                  <span className="text-zinc-500">Modal Awal:</span>
                  <span className="font-semibold">Rp {activeShift.startCash.toLocaleString('id-ID')}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-zinc-500">Penjualan Tunai:</span>
                  <span className="font-semibold text-emerald-600">+Rp {cashSales.toLocaleString('id-ID')}</span>
                </div>
                <div className="flex justify-between border-t border-zinc-200 pt-2 font-bold text-zinc-800">
                  <span>Diharapkan di Laci:</span>
                  <span>Rp {expectedCash.toLocaleString('id-ID')}</span>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Uang Fisik di Laci (Rp)</label>
                <input
                  type="number"
                  value={actualCash}
                  onChange={e => setActualCash(e.target.value)}
                  className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-200 text-lg font-bold text-zinc-800"
                  placeholder="Masukkan jumlah fisik uang..."
                  min="0"
                  required
                />
              </div>

              <div className="flex justify-between items-center bg-zinc-50 p-3.5 rounded-xl border border-zinc-150 text-xs">
                <span className="font-semibold text-zinc-500">Selisih:</span>
                <span className={`font-bold text-sm ${difference === 0 ? 'text-zinc-700' : difference > 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                  {difference === 0 ? 'Pas (Rp 0)' : difference > 0 ? `Lebih: +Rp ${difference.toLocaleString('id-ID')}` : `Kurang: -Rp ${Math.abs(difference).toLocaleString('id-ID')}`}
                </span>
              </div>

              <div className="flex gap-3 pt-2">
                <button type="button" onClick={() => appState.setShowTutupShiftModal(false)} className="flex-1 py-3 bg-zinc-100 text-zinc-700 rounded-xl font-semibold hover:bg-zinc-200 transition">Batal</button>
                <button type="submit" className="flex-1 py-3 bg-rose-600 text-white rounded-xl font-semibold hover:bg-rose-700 transition shadow-lg shadow-rose-600/20">Tutup Shift</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

            </form>
          </div>
        </div>
      );

    // ==================== VOID WITH PIN MODAL ====================

    function VoidWithPINModal({ onConfirm, onCancel }) {
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const handleSubmit = (e) => {
        e.preventDefault();
        const db = getDB();
        const admin = db.users.find(u => ['admin', 'owner'].includes(u.role) && u.password === password && u.active);
        if (admin) {
          onConfirm();
        } else {
          setError('Password Admin/Owner salah!');
          setPassword('');
          setTimeout(() => setError(''), 2500);
        }

    function ScannerModal({ user, onClose, appState }) {
      // Keamanan: Cegah non-owner mengubah foto profil owner
      if (user?.role === 'owner' && appState.user?.role !== 'owner') {
        useEffect(() => {
          appState.addToast('Akses Ditolak: Anda tidak memiliki akses untuk menambah foto Pemilik!', 'error');
          onClose();
        }, []);
        return null;
      }

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [stream, setStream] = useState(null);
      const [cameraError, setCameraError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        let activeStream = null;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(s => {
            activeStream = s;
            setStream(s);
            if (videoRef.current) {
              videoRef.current.srcObject = s;
              videoRef.current.setAttribute("playsinline", true);
              videoRef.current.play();
            }
          })
          .catch(err => {
            console.error("Gagal kamera:", err);
            setCameraError("Tidak dapat mengakses kamera. Pastikan izin kamera aktif.");
          });

        return () => {
          if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
          }
        };
      }, []);

      const handleCapture = () => {
        if (canvasRef.current && videoRef.current) {
          setLoading(true);
          const video = videoRef.current;
          const canvas = canvasRef.current;
          const ctx = canvas.getContext('2d');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          const photo = canvas.toDataURL('image/png');
          appState.saveScanData(photo, 'photo');
          appState.addToast(`Foto ${user.name} berhasil disimpan`, 'success');
          setLoading(false);
          onClose();
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 300;
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxDim) { h *= maxDim / w; w = maxDim; }
            } else {
              if (h > maxDim) { w *= maxDim / h; h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            const photo = canvas.toDataURL('image/jpeg', 0.85);
            appState.saveScanData(photo, 'photo');
            appState.addToast(`Foto ${user.name} berhasil disimpan`, 'success');
            onClose();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 backdrop-blur-sm p-4 ">
          <div className="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden  border border-zinc-200">
            <div className="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
              <div>
                <h3 className="text-lg font-bold text-zinc-800 text-left">Ambil Foto Pengguna</h3>
                <p className="text-xs text-zinc-500 mt-1 text-left">{user.name} ({user.role.toUpperCase()})</p>
              </div>
              <button onClick={onClose} type="button" className="p-2 bg-zinc-100 rounded-full text-zinc-500 hover:bg-zinc-200 transition"><Icon name="x" size={16} /></button>
            </div>
            <div className="p-6 flex flex-col items-center">
              {cameraError ? (
                <div className="w-full h-64 bg-zinc-50 rounded-2xl flex flex-col items-center justify-center text-zinc-400 border border-dashed border-zinc-200 p-4 mb-4">
                  <Icon name="camera-off" size={48} className="mb-2 text-zinc-300" />
                  <p className="text-xs font-semibold text-center text-zinc-500 leading-normal">{cameraError}</p>
                </div>
              ) : (
                <div className="w-full aspect-video bg-zinc-950 rounded-2xl relative overflow-hidden border border-zinc-300 shadow-inner flex items-center justify-center mb-4">
                  <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover" />
                  <canvas ref={canvasRef} className="hidden" />
                </div>
              )}
              
              <div className="w-full flex flex-col gap-3">
                <div className="flex gap-3">
                  {!cameraError && (
                    <button 
                      onClick={handleCapture}
                      disabled={loading}
                      type="button"
                      className="flex-1 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl font-semibold flex items-center justify-center gap-2 transition"
                    >
                      <Icon name="camera" size={16} /> {loading ? 'Mengambil...' : 'Ambil Foto'}
                    </button>
                  )}
                  <button 
                    onClick={onClose} 
                    type="button"
                    className="flex-1 py-2.5 bg-zinc-100 text-zinc-650 rounded-xl font-semibold hover:bg-zinc-200 transition"

                    Batal

                <label className="w-full py-2.5 bg-white border border-zinc-200 hover:bg-zinc-50 text-zinc-700 rounded-xl font-semibold flex items-center justify-center gap-2 cursor-pointer transition active:scale-[0.98] shadow-sm">
                  <Icon name="upload" size={16} />
                  <span>Unggah dari Galeri / Berkas</span>
                  <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                </label>
              </div>
            </div>
          </div>
        </div>
      );
    }


    function POSScannerModal({ onClose, onScanSuccess, onPhotoCapture, appState }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [stream, setStream] = useState(null);
      const [cameraError, setCameraError] = useState('');
      const animationRef = useRef(null);

      useEffect(() => {
        let activeStream = null;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(s => {
            activeStream = s;
            setStream(s);
            if (videoRef.current) {
              videoRef.current.srcObject = s;
              videoRef.current.setAttribute("playsinline", true);
              videoRef.current.play();
            }
          })
          .catch(err => {
            console.error("Gagal kamera:", err);
            setCameraError("Tidak dapat mengakses kamera. Pastikan izin kamera aktif.");
          });

        return () => {
          if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
          }
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
          }
        };
      }, []);

      const tick = () => {
        if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = 300;
            canvas.height = 300;
            const size = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - size) / 2;
            const sy = (video.videoHeight - size) / 2;
            ctx.drawImage(video, sx, sy, size, size, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            try {
              const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
              });
              if (code && code.data) {
                onScanSuccess(code.data);
                return;
              }
            } catch(e) {
              console.error("jsQR error:", e);
            }
          }
        }
        animationRef.current = requestAnimationFrame(tick);
      };

      useEffect(() => {
        if (stream) {
          animationRef.current = requestAnimationFrame(tick);
        }
      }, [stream]);

      const handleCapture = () => {
        if (canvasRef.current) {
          const photo = canvasRef.current.toDataURL('image/png');
          onPhotoCapture(photo);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let qrCodeDecoded = null;
            try {
              const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
              });
              if (code && code.data) {
                qrCodeDecoded = code.data;
              }
            } catch (err) {
              console.error("jsQR error:", err);
            }
            
            if (qrCodeDecoded) {
              onScanSuccess(qrCodeDecoded);
            } else {
              const maxDim = 600;
              let w = img.width;
              let h = img.height;
              if (w > h) {
                if (w > maxDim) { h *= maxDim / w; w = maxDim; }
              } else {
                if (h > maxDim) { w *= maxDim / h; h = maxDim; }
              }
              const outputCanvas = document.createElement('canvas');
              outputCanvas.width = w;
              outputCanvas.height = h;
              const outputCtx = outputCanvas.getContext('2d');
              outputCtx.drawImage(img, 0, 0, w, h);
              
              const photo = outputCanvas.toDataURL('image/jpeg', 0.85);
              onPhotoCapture(photo);
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-zinc-900/60 backdrop-blur-sm p-4">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden  border border-zinc-200">
            <div className="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/50">
              <div>
                <h3 className="text-lg font-bold text-zinc-800 text-left">Pindai QR / Barcode / Foto</h3>
                <p className="text-xs text-zinc-500 text-left mt-1">Arahkan kamera ke kode QR/barcode atau klik Ambil Foto</p>
              </div>
              <button onClick={onClose} className="p-2 bg-zinc-100 rounded-full hover:bg-zinc-200"><Icon name="x" size={16} /></button>
            </div>
            
            <div className="p-6 flex flex-col items-center">
              {cameraError ? (
                <div className="w-full h-64 bg-zinc-50 rounded-2xl flex flex-col items-center justify-center text-zinc-400 border border-dashed border-zinc-200 p-4 mb-4">
                  <Icon name="camera-off" size={48} className="mb-2 text-zinc-300" />
                  <p className="text-xs font-semibold text-center text-zinc-500 leading-normal">{cameraError}</p>
                </div>
              ) : (
                <div className="w-full aspect-square bg-zinc-950 rounded-2xl relative overflow-hidden border-4 border-zinc-900 shadow-inner flex items-center justify-center mb-4">
                  <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover" />
                  <canvas ref={canvasRef} className="hidden" />
                  <div className="absolute inset-0 border-[32px] border-black/45 pointer-events-none">
                    <div className="w-full h-full border border-zinc-700/80 relative">
                      <div className="absolute inset-x-0 top-1/2 h-0.5 bg-zinc-400/80 animate-pulse"></div>
                    </div>
                  </div>
                </div>
              )}
              
              <div className="w-full flex flex-col gap-3">
                <div className="flex gap-3">
                  {!cameraError && (
                    <button 
                      onClick={handleCapture}
                      type="button"
                      className="flex-1 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl font-semibold flex items-center justify-center gap-2 transition"
                    >
                      <Icon name="camera" size={16} /> Ambil Foto
                    </button>
                  )}
                  <button 
                    onClick={onClose} 
                    type="button"
                    className="flex-1 py-2.5 bg-zinc-150 hover:bg-zinc-200 text-zinc-750 rounded-xl font-semibold transition"
                  >
                    Batal
                  </button>
                </div>

                <label className="w-full py-2.5 bg-white border border-zinc-200 hover:bg-zinc-50 text-zinc-700 rounded-xl font-semibold flex items-center justify-center gap-2 cursor-pointer transition active:scale-[0.98] shadow-sm">
                  <Icon name="upload" size={16} />
                  <span>Unggah File Gambar / Bukti Scan</span>
                  <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                </label>
              </div>
            </div>
          </div>
        </div>
      );
    }

                        type="button"
                        onClick={() => {
                          const rand = 'smile_' + Math.random().toString(36).substring(2, 8).toUpperCase();
                          setInputCode(rand);
                          appState.addToast('Kode acak berhasil dibuat!', 'success');
                        }}
                        className="px-4 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 rounded-xl font-bold text-xs border border-zinc-200 transition"
                      >
                        Acak
                      </button>
                    </div>
                  </div>

                  <div className="space-y-2.5">
                    <button 
                      type="submit" 
                      className="w-full py-3.5 bg-zinc-900 hover:bg-zinc-850 text-white rounded-xl font-bold text-sm shadow-md transition flex items-center justify-center gap-2"
                    >
                      <Icon name="cloud" size={16} />
                      Hubungkan Cloud
                    </button>
                    
                    <button 
                      type="button"
                      onClick={() => {
                        appState.setShowSyncModal(false);
                        const scannerBtn = document.querySelector('[title*="Scanner"]');
                        if (scannerBtn) {
                          scannerBtn.click();
                        } else {
                          appState.addToast('Masuk ke halaman POS Kasir untuk memindai QR', 'info');
                        }
                      }}
                      className="w-full py-2.5 bg-sky-50 border border-sky-200 hover:bg-sky-100 text-sky-600 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm"
                    >
                      <Icon name="scan" size={14} /> Pindai QR Perangkat Lain
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==================== COMPONENT: ADMIN WORKSPACE ====================

    function Sidebar() {
      const app = useContext(AppContext);
      const { user, page, sidebar } = app;
      const navigate = (id) => {
        // Update local state first
        app.setPage(id);
        
        // Post message to any pre-loaded child iframes
        const admins = new Set(['admin_workspace', 'products', 'reports', 'users', 'purchases']);
        if (admins.has(id)) {
          const iframeAdmin = document.getElementById('iframe-admin');
          if (iframeAdmin && iframeAdmin.contentWindow) {
            iframeAdmin.contentWindow.postMessage({ type: 'NAVIGATE', page: id }, '*');
          }
        } else if (id === 'owner_dashboard') {
          const iframeOwner = document.getElementById('iframe-owner');
          if (iframeOwner && iframeOwner.contentWindow) {
            iframeOwner.contentWindow.postMessage({ type: 'NAVIGATE', page: id }, '*');
          }
        } else if (id === 'pos') {
          const iframePos = document.getElementById('iframe-pos');
          if (iframePos && iframePos.contentWindow) {
            iframePos.contentWindow.postMessage({ type: 'NAVIGATE', page: id }, '*');
          }
        }
      };
      const menuItems = [];
      if (user?.role === 'owner') {
        menuItems.push({ id: 'owner_dashboard', icon: 'layout-dashboard', label: 'Dashboard Owner' });
      }
      const hasWorkspace = [
        'admin', 'admin_operasional', 'admin_keuangan', 'admin_hr', 'admin_marketing', 'admin_gudang', 
        'keuangan', 'manager', 'supervisor', 'staff', 'dapur'
      ].includes(user?.roleId) || [
        'admin', 'admin_operasional', 'admin_keuangan', 'admin_hr', 'admin_marketing', 'admin_gudang',
        'keuangan', 'manager', 'supervisor', 'staff', 'dapur'
      ].includes(user?.role);

      if (hasWorkspace) {
        let label = 'Workspace Admin';
        const activeRole = user?.roleId || user?.role || '';
        if (activeRole === 'admin') label = 'Workspace Admin (Utama)';
        else if (activeRole === 'admin_operasional') label = 'Workspace Admin Ops';
        else if (activeRole === 'admin_keuangan') label = 'Workspace Admin Finance';
        else if (activeRole === 'admin_hr') label = 'Workspace Admin HR';
        else if (activeRole === 'admin_marketing') label = 'Workspace Admin Marketing';
        else if (activeRole === 'admin_gudang') label = 'Workspace Admin Gudang';
        else if (activeRole === 'keuangan') label = 'Workspace Keuangan';
        else if (activeRole === 'manager') label = 'Workspace Manajer';
        else if (activeRole === 'supervisor') label = 'Workspace Supervisor';
        else if (activeRole === 'staff') label = 'Workspace Staf';
        else if (activeRole === 'dapur') label = 'Workspace Dapur';
        menuItems.push({ id: 'admin_workspace', icon: 'briefcase', label: label });
      }
      if (user?.role !== 'dapur' && user?.roleId !== 'dapur') { menuItems.push({ id: 'pos', icon: 'shopping-cart', label: 'Kasir POS' }); }
      if (['admin', 'owner', 'keuangan', 'manager'].includes(user?.role)) {
        menuItems.push({ id: 'products', icon: 'package', label: 'Produk' });
        menuItems.push({ id: 'reports', icon: 'bar-chart-3', label: 'Laporan' });
      }
      if (['admin', 'owner'].includes(user?.role)) {
        menuItems.push({ id: 'users', icon: 'users', label: 'Pengguna' });
      }
      if (['admin', 'owner', 'keuangan', 'manager'].includes(user?.role)) {
        menuItems.push({ id: 'purchases', icon: 'shopping-bag', label: 'Pengadaan' });
      }

      return (
        <aside className={`${sidebar ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 fixed md:static inset-y-0 left-0 z-40 w-64 bg-zinc-900 text-white transition-transform duration-300 flex flex-col no-print`}>
          <div className="h-16 flex items-center px-6 border-b border-zinc-800 justify-between md:justify-start">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 flex items-center justify-center overflow-hidden">
                <img src="./logo_smile.jpg" alt="Logo" className="w-full h-full object-contain" onError={(e) => {
                  e.target.onerror = null;
                  e.target.style.display = 'none';
                  e.target.parentNode.innerHTML = `<svg class="w-5 h-5 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
                }} />
              </div>
              <span className="font-bold text-lg tracking-wide">SMILE POS</span>
            </div>
            <button onClick={() => app.setSidebar(false)} className="md:hidden text-zinc-400 hover:text-white">
              <Icon name="x" size={24} />
            </button>
          </div>
          
          <div className="flex-1 px-4 py-6 space-y-2 custom-scroll overflow-y-auto text-left">
            {menuItems.map(item => (
              <button
                key={item.id}
                onClick={() => { navigate(item.id); if(window.innerWidth < 768) app.setSidebar(false); }}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-medium text-sm ${page === item.id ? 'bg-indigo-650 text-white font-semibold shadow-[0_4px_12px_rgba(79,70,229,0.25)] ring-1 ring-indigo-500/20' : 'text-zinc-400 hover:bg-zinc-800/60 hover:text-zinc-100 hover:text-white'}`}
              >
                <Icon name={item.icon} size={20} />
                {item.label}
              </button>
            ))}

            {user?.role !== 'admin' && app.activeShift && (
              <button
                onClick={() => app.setShowTutupShiftModal(true)}
                className="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-medium text-sm text-amber-400 hover:bg-amber-500/10"
              >
                <Icon name="key-round" size={20} />
                Tutup Shift (Kas)
              </button>
            )}
          </div>

          <div className="p-4 border-t border-zinc-800 text-left pb-24 md:pb-4">
            <div className="flex items-center gap-3 px-2 py-3 bg-zinc-800/50 rounded-xl mb-3">
              <div className="w-9 h-9 bg-zinc-700 rounded-full flex items-center justify-center font-bold text-sm text-zinc-300">
                {user?.name?.substring(0,2).toUpperCase()}
              </div>
              <div className="flex-1 overflow-hidden">
                <p className="text-sm font-semibold truncate">{user?.name}</p>
                <p className="text-xs text-zinc-500 truncate">{user?.roleLabel || user?.role}</p>
              </div>
            </div>
            <button 
              onClick={() => {
                if (user?.role !== 'admin' && app.activeShift) {
                  app.setShowTutupShiftModal(true);
                } else {
                  app.logout();
                }
              }} 
              className="w-full flex items-center justify-center gap-2 px-3 py-2.5 text-rose-400 hover:bg-rose-500/10 rounded-xl transition text-sm font-medium"
            >
              <Icon name="log-out" size={18} /> Keluar
            </button>
          </div>
        </aside>
      );
    }

    function Header() {
      const app = useContext(AppContext);
      const [showNotif, setShowNotif] = useState(false);
      const [now, setNow] = useState(new Date());
      const titles = { owner_dashboard: 'Dashboard Owner', admin_workspace: 'Workspace Admin', pos: 'Point of Sale', products: 'Produk', reports: 'Laporan', users: 'Pengguna', purchases: 'Manajemen Pengadaan' };
      
      const lowStockItems = useMemo(() => {
        return getDB().products.filter(p => p.active !== false && p.stock <= (p.minStock || 5));
      }, [app.dbVersion]);
      const lowStockCount = lowStockItems.length;
      const [showLowStock, setShowLowStock] = useState(false);
      
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const db = getDB();
      const pendingReqs = db.bypassRequests.filter(r => r.status === 'pending');
      const pendingPurchases = (db.purchases || []).filter(p => p.status === 'pending');
      const securityAlerts = app.user?.role === 'owner' ? (db.ownerNotifications || []) : []; const unreadSecurityCount = securityAlerts.filter(n => n.unread).length; const totalNotifs = pendingReqs.length + (app.user?.role === 'owner' ? (pendingPurchases.length + unreadSecurityCount) : 0);
      const currentDateTime = now.toLocaleDateString('id-ID', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      }) + ', ' + now.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      return (
        <header className="h-16 bg-white border-b border-zinc-200/80 flex items-center px-4 md:px-6 flex-shrink-0 z-30 sticky top-0 no-print">
          <button onClick={() => app.setSidebar(true)} className="md:hidden mr-4 p-2 -ml-2 text-zinc-600 rounded-xl hover:bg-zinc-150/40">
            <Icon name="menu" size={24} />
          </button>
          <h2 className="text-base font-bold text-zinc-800 tracking-tight">{titles[app.page]}</h2>
          
          <div className="ml-auto flex items-center gap-3">
            {/* Indikator Koneksi Internet */}
            <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-semibold shadow-xs transition-all duration-300 ${app.isOnline ? 'bg-emerald-50/60 border-emerald-200/40 text-emerald-800' : 'bg-rose-50/60 border-rose-200/40 text-rose-800'}`}>
              <div className="relative flex h-1.5 w-1.5">
                {app.isOnline && <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>}
                <span className={`relative inline-flex rounded-full h-1.5 w-1.5 ${app.isOnline ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
              </div>
              <span className="hidden md:inline">{app.isOnline ? 'Online' : 'Offline'}</span>
            </div>

            {/* Status Sinkronisasi */}
            <button 
              onClick={() => app.setShowSyncModal(true)} 
              className={`px-3 py-1.5 rounded-full border flex items-center gap-1.5 transition text-xs font-semibold shadow-xs hover:shadow-sm ${app.syncEnabled ? 'bg-indigo-50/40 border-indigo-200/40 text-indigo-755 hover:bg-indigo-50/60' : 'bg-zinc-50 border-zinc-200 text-zinc-500 hover:bg-zinc-100'}`}
              title="Pengaturan Sinkronisasi"
            >
              <Icon name="cloud" size={14} className={`${app.syncStatus === 'syncing' ? 'animate-spin text-indigo-500' : app.syncEnabled ? 'text-indigo-500' : 'text-zinc-400'}`} />
              <span className="hidden sm:inline">{app.syncEnabled ? 'Sync Aktif' : 'Sync Mati'}</span>
            </button>

            {/* Lock Screen */}
            <button 
              onClick={app.lockScreen} 
              className="w-9 h-9 bg-zinc-50 border border-zinc-200/80 text-zinc-600 hover:text-zinc-800 hover:bg-zinc-100 rounded-xl shadow-xs transition flex items-center justify-center flex-shrink-0"
              title="Kunci Layar"
            >
              <Icon name="lock" size={15} />
            </button>

            {/* Notifikasi Stok Rendah untuk Admin/Owner */}
            {['admin', 'owner'].includes(app.user?.role) && (
              <div className="relative">
                <button 
                  onClick={() => setShowLowStock(!showLowStock)} 
                  className={`w-9 h-9 border rounded-xl shadow-xs transition flex items-center justify-center relative ${lowStockCount > 0 ? 'text-rose-600 border-rose-200 bg-rose-50 hover:bg-rose-100/50' : 'text-zinc-555 border-zinc-200 bg-zinc-50 hover:bg-zinc-100'}`}
                  title="Peringatan Stok Rendah"
                >
                  <Icon name="alert-triangle" size={16} />
                  {lowStockCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-rose-600 text-white text-[9px] w-4.5 h-4.5 flex items-center justify-center rounded-full font-bold border-2 border-white shadow-sm">{lowStockCount}</span>
                  )}
                </button>

                {showLowStock && (
                  <div className="absolute right-0 mt-2 w-80 bg-white border border-zinc-200 rounded-2xl shadow-xl z-[100]  overflow-hidden">
                    <div className="p-4 bg-zinc-50 border-b border-zinc-100 flex justify-between items-center text-left">
                      <span className="font-bold text-zinc-800 text-sm">Stok Rendah</span>
                      <span className="text-[10px] bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-bold">{lowStockCount} Peringatan</span>
                    </div>
                    <div className="max-h-64 overflow-y-auto custom-scroll divide-y divide-zinc-100 text-left">
                      {lowStockItems.length === 0 ? (
                        <div className="p-6 text-center text-zinc-450 text-xs font-semibold">Semua stok aman!</div>
                      ) : (
                        lowStockItems.map(p => (
                          <div key={p.id} className="p-3 flex justify-between items-center text-xs">
                            <div>
                              <p className="font-bold text-zinc-800">{p.name}</p>
                              <p className="text-zinc-500 text-[10px] font-mono">{p.sku}</p>
                            </div>
                            <div className="text-right">
                              <span className="font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-lg border border-rose-100">{p.stock} pcs</span>
                              <p className="text-[9px] text-zinc-455 mt-1">Min: {p.minStock || 5}</p>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {['admin', 'owner'].includes(app.user?.role) && (
              <div className="relative">
                <button 
                  onClick={() => setShowNotif(!showNotif)} 
                  className={`w-9 h-9 border rounded-xl shadow-xs transition flex items-center justify-center relative ${totalNotifs > 0 ? 'text-amber-600 border-amber-200 bg-amber-550/10 hover:bg-amber-100/50' : 'text-zinc-555 border-zinc-200 bg-zinc-50 hover:bg-zinc-100'}`}
                  title="Notifikasi Masuk"
                >
                  <Icon name="bell" size={16} />
                  {totalNotifs > 0 && (
                    <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] w-4.5 h-4.5 flex items-center justify-center rounded-full font-bold border-2 border-white shadow-sm">{totalNotifs}</span>
                  )}
                </button>

                {showNotif && (
                  <div className="absolute right-0 mt-2 w-80 bg-white border border-zinc-200 rounded-2xl shadow-xl z-[100]  overflow-hidden">
                    <div className="p-4 bg-zinc-50 border-b border-zinc-100 flex justify-between items-center text-left">
                      <span className="font-bold text-zinc-800 text-sm">Notifikasi Masuk</span>
                      <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">{totalNotifs} Menunggu</span>
                    </div>
                    <div className="max-h-80 overflow-y-auto custom-scroll divide-y divide-zinc-100">
                      {totalNotifs === 0 ? (
                        <div className="p-6 text-center text-zinc-450 text-xs font-semibold">Tidak ada pemberitahuan baru</div>
                      ) : (
                        <>
                          {/* Bypass Requests */}
                          {pendingReqs.map(req => (
                            <div key={req.id} className="p-4 space-y-2 text-xs text-left">
                              <div className="flex justify-between items-start">
                                <div>
                                  <p className="font-bold text-zinc-800 flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                                    <span>Izin Masuk Kasir</span>
                                  </p>
                                  <p className="text-zinc-500 text-[10px] font-semibold mt-0.5">{req.name} ({req.email})</p>
                                </div>
                                <span className="text-[9px] text-zinc-455 font-mono">{new Date(req.time).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})}</span>
                              </div>
                              <div className="text-zinc-550 bg-zinc-50 p-2 rounded-lg font-mono text-[10px]">
                                <div><span className="text-zinc-400">Lokasi:</span> {req.location}</div>
                                <div className="truncate"><span className="text-zinc-400">Device:</span> {req.device}</div>
                              </div>
                              <div className="flex gap-2 pt-1">
                                <button onClick={() => { app.approveBypassRequest(req.id); setShowNotif(false); }} className="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-[10px]">Setujui</button>
                                <button onClick={() => { app.rejectBypassRequest(req.id); setShowNotif(false); }} className="flex-1 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-bold text-[10px]">Tolak</button>
                              </div>
                            </div>
                          ))}
                          
                          {/* Pending Purchase Proposals (Only for Owner) */}
                          {app.user?.role === 'owner' && pendingPurchases.map(p => (
                            <div key={p.id} className="p-4 space-y-2 text-xs text-left">
                              <div className="flex justify-between items-start">
                                <div>
                                  <p className="font-bold text-zinc-800 flex items-center gap-1.5">
                                    <span className="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></span>
                                    <span>Pengajuan Pengadaan</span>
                                  </p>
                                  <p className="text-zinc-500 text-[10px] font-semibold mt-0.5">Oleh: {p.proposedBy} ({p.proposedByRole === 'keuangan' ? 'Keuangan' : p.proposedByRole})</p>
                                </div>
                                <span className="text-[9px] text-zinc-455 font-mono">{new Date(p.date).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})}</span>
                              </div>
                              <div className="text-zinc-550 bg-sky-50/50 p-2.5 rounded-xl border border-sky-100/50 font-mono text-[10px]">
                                <div className="font-bold text-zinc-800">{p.productName}</div>
                                <div className="mt-1"><span className="text-zinc-400">Tipe:</span> <span className="font-bold capitalize">{p.type === 'buy' ? 'Beli Baru' : p.type === 'refund' ? 'Retur' : p.type === 'take' ? 'Ambil' : 'Void'}</span></div>
                                <div><span className="text-zinc-400">Estimasi:</span> <span className="font-bold text-zinc-700">{p.qty} pcs @ Rp {p.cost?.toLocaleString('id-ID')}</span></div>
                              </div>
                              <button 
                                onClick={() => { app.setPage('purchases'); setShowNotif(false); }} 
                                className="w-full py-1.5 bg-zinc-950 hover:bg-zinc-850 text-white rounded-lg font-bold text-[10px] flex items-center justify-center gap-1 transition shadow-sm"
                              >
                                <Icon name="eye" size={12} /> Tinjau Pengadaan
                              </button>

                function AIChatbot({ appState }) {
      const [isOpen, setIsOpen] = useState(false);
      const [expandedThoughts, setExpandedThoughts] = useState({});
      const [showHistory, setShowHistory] = useState(false);
      const [editingMsgId, setEditingMsgId] = useState(null);
      const [editText, setEditText] = useState('');
      const [activeSessionId, setActiveSessionId] = useState(null);
      const [contextMenuMsgId, setContextMenuMsgId] = useState(null);
      
      const welcomeMsg = { id: 1, sender: 'bot', text: 'Halo! Saya AI Asisten Operasional Smile POS. Ada yang bisa saya bantu hari ini seputar penggunaan sistem, troubleshoot printer, atau analitik laporan keuangan?', timestamp: new Date() };
      const [messages, setMessages] = useState([welcomeMsg]);
      const [inputValue, setInputValue] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);
      const [sessions, setSessions] = useState([]);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, isTyping]);

      // Close context menu on outside click
      useEffect(() => {
        if (!contextMenuMsgId) return;
        const handler = () => setContextMenuMsgId(null);
        document.addEventListener('click', handler);
        return () => document.removeEventListener('click', handler);
      }, [contextMenuMsgId]);

      // Load sessions list
      const getChatSessions = () => {
        const db = getDB();
        return (db.chatHistory || []).sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      };

      const loadSessions = useCallback(() => {
        setSessions(getChatSessions());
      }, []);

      // Load sessions when chatbot window is active or switches to history tab
      useEffect(() => {
        if (isOpen || showHistory) {
          loadSessions();
        }
      }, [isOpen, showHistory, loadSessions, appState.dbVersion]);

      // Restore active session on mount
      useEffect(() => {
        if (appState.user) {
          const savedSessionId = localStorage.getItem(`pos_active_chat_session_id_${appState.user.id}`);
          if (savedSessionId) {
            const db = getDB();
            const session = (db.chatHistory || []).find(s => s.id === savedSessionId);
            if (session) {
              const restored = session.messages.map(m => ({ ...m, timestamp: new Date(m.timestamp) }));
              setMessages(restored);
              setActiveSessionId(savedSessionId);
            }
          }
        }
      }, [appState.user]);

      // Sync active session ID to localStorage
      useEffect(() => {
        if (appState.user) {
          if (activeSessionId) {
            localStorage.setItem(`pos_active_chat_session_id_${appState.user.id}`, activeSessionId);
          } else {
            localStorage.removeItem(`pos_active_chat_session_id_${appState.user.id}`);
          }
        }
      }, [activeSessionId, appState.user]);

      const saveCurrentSession = (msgs) => {
        if (!msgs || msgs.length <= 1) return;
        const db = getDB();
        db.chatHistory = db.chatHistory || [];
        const sessionId = activeSessionId || ('chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6));
        const userMsgs = msgs.filter(m => m.sender === 'user');
        const title = userMsgs.length > 0 ? userMsgs[0].text.slice(0, 40) + '...' : 'Sesi Chat Baru';
        const existingIdx = db.chatHistory.findIndex(s => s.id === sessionId);
        const sessionData = {
          id: sessionId,
          title: title,
          messages: msgs.map(m => ({ ...m, timestamp: m.timestamp instanceof Date ? m.timestamp.toISOString() : m.timestamp })),
          createdAt: existingIdx >= 0 ? db.chatHistory[existingIdx].createdAt : new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          messageCount: msgs.length
        };
        if (existingIdx >= 0) {
          db.chatHistory[existingIdx] = sessionData;
        } else {
          db.chatHistory.unshift(sessionData);
        }
        if (db.chatHistory.length > 50) db.chatHistory = db.chatHistory.slice(0, 50);
        saveDB(db);
        if (!activeSessionId) setActiveSessionId(sessionId);
        loadSessions();
        return sessionId;
      };

      const loadSession = (sessionId) => {
        const db = getDB();
        const session = (db.chatHistory || []).find(s => s.id === sessionId);
        if (session) {
          const restored = session.messages.map(m => ({ ...m, timestamp: new Date(m.timestamp) }));
          setMessages(restored);
          setActiveSessionId(sessionId);
          setShowHistory(false);
        }
      };

      const deleteSession = (sessionId) => {
        const db = getDB();
        db.chatHistory = (db.chatHistory || []).filter(s => s.id !== sessionId);
        saveDB(db);
        setSessions(getChatSessions());
        if (activeSessionId === sessionId) {
          setActiveSessionId(null);
          setMessages([welcomeMsg]);
        }
        appState.refreshDB();
      };

      const startNewChat = () => {
        if (messages.length > 1) saveCurrentSession(messages);
        setActiveSessionId(null);
        setMessages([welcomeMsg]);
        setShowHistory(false);
        if (appState.user) {
          localStorage.removeItem(`pos_active_chat_session_id_${appState.user.id}`);
        }
      };

      const deleteMessage = (msgId) => {
        setMessages(prev => {
