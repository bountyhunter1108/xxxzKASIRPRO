                {isThoughtExpanded && (
                  <div className="mt-2.5 pl-3 border-l-2 border-indigo-500/50 whitespace-pre-line text-left leading-relaxed text-zinc-450 font-mono text-[9px] overflow-x-auto hide-scrollbar">
                    {thought}
                  </div>
                )}
              </div>
            )}
            
            {editingMsgId === msgId ? (
              <div className="flex gap-1.5 mt-1">
                <input 
                  type="text" 
                  value={editText} 
                  onChange={e => setEditText(e.target.value)}
                  className="flex-1 px-3 py-1.5 bg-white border border-zinc-200 rounded-lg text-xs outline-none text-zinc-855"
                  onKeyDown={e => { if (e.key === 'Enter') confirmEditMessage(); }}
                />
                <button onClick={confirmEditMessage} className="px-2.5 py-1 bg-zinc-900 text-white rounded-lg text-xs font-bold">Simpan</button>
                <button onClick={() => setEditingMsgId(null)} className="px-2.5 py-1 bg-zinc-100 text-zinc-550 rounded-lg text-xs font-semibold">Batal</button>
              </div>
            ) : (
              <p className="whitespace-pre-line leading-relaxed text-xs">{cleanText}</p>
            )}
          </div>
        );
      };

      const BotAvatar = () => (
        <div className="w-9 h-9 rounded-xl bg-zinc-800 flex items-center justify-center flex-shrink-0 relative border border-zinc-700">
          <div>
            <svg className="w-5 h-5 text-zinc-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 8V4H8"></path>
              <rect width="16" height="12" x="4" y="8" rx="2"></rect>
              <path d="M2 14h2"></path>
              <path d="M20 14h2"></path>
              <path d="M15 13v2"></path>
              <path d="M9 13v2"></path>
            </svg>
          </div>
          <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
      );

      const UserAvatar = () => (
        <div className="w-8 h-8 rounded-full bg-zinc-200 border border-zinc-300 flex items-center justify-center font-bold text-xs text-zinc-650 flex-shrink-0">
          {(appState.user?.name || 'US').substring(0, 2).toUpperCase()}
        </div>
      );

      return (
        <div className="fixed bottom-6 right-6 z-[9999] flex flex-col items-end">
          {/* Chat Window Container */}
          <div 
            style={{ display: isOpen ? 'flex' : 'none' }}
            className="mb-4 w-[calc(100vw-2rem)] max-w-[380px] h-[500px] md:h-[550px] bg-white rounded-[24px] shadow-[0_16px_48px_rgba(0,0,0,0.12)] border border-zinc-200 overflow-hidden flex flex-col text-left font-sans"
          >
            {/* Header */}
            <div className="px-6 py-4 bg-zinc-900 text-white flex items-center justify-between border-b border-zinc-800 flex-shrink-0">
              <div className="flex items-center gap-3">
                <BotAvatar />
                <div>
                  <h4 className="text-xs font-bold tracking-wide text-zinc-100">AI SMILE POS ASSISTANT</h4>
                  <p className="text-[10px] text-zinc-400 font-medium">Asisten Operasional Toko &bull; Online</p>
                </div>
              </div>
              
              <div className="flex items-center gap-1.5">
                <button 
                  onClick={() => {
                    if (showHistory) {
                      setShowHistory(false);
                    } else {
                      if (messages.length > 1) saveCurrentSession(messages);
                      setShowHistory(true);
                    }
                  }} 
                  title="Riwayat Percakapan"
                  className={`p-1.5 rounded-full transition ${showHistory ? 'bg-zinc-800 text-white' : 'hover:bg-zinc-800 text-zinc-400 hover:text-white'}`}
                >
                  <Icon name="clock" size={16} />
                </button>
                <button 
                  onClick={startNewChat}
                  title="Chat Baru"
                  className="p-1.5 hover:bg-zinc-800 rounded-full transition text-zinc-400 hover:text-white"
                >
                  <Icon name="plus" size={16} />
                </button>
                <button 
                  onClick={() => setIsOpen(false)} 
                  title="Tutup"
                  className="p-1.5 hover:bg-zinc-800 rounded-full transition text-zinc-400 hover:text-white"
                >
                  <Icon name="x" size={16} />
                </button>
              </div>
            </div>

            {/* Body */}
            {showHistory ? (
              <div className="flex-1 p-5 overflow-y-auto bg-zinc-50 flex flex-col space-y-3 custom-scroll">
                <div className="flex items-center justify-between mb-2 border-b border-zinc-150 pb-2">
                  <h5 className="text-xs font-bold text-zinc-550 uppercase tracking-wider">Riwayat Percakapan</h5>
                  <button 
                    onClick={() => setShowHistory(false)}
                    className="text-xs text-indigo-600 font-bold hover:underline"
                  >
                    Kembali ke Chat
                  </button>
                </div>
                {sessions.length === 0 ? (
                  <div className="flex-1 flex flex-col items-center justify-center py-20 text-center text-zinc-400">
                    <Icon name="message-square-dashed" size={32} className="text-zinc-300 mb-2" />
                    <p className="text-xs font-semibold">Belum Ada Riwayat Chat</p>
                    <p className="text-[10px] mt-0.5">Sesi chat aktif Anda akan tersimpan di sini</p>
                  </div>
                ) : (
                  sessions.map(s => (
                    <div key={s.id} className="group flex justify-between items-center bg-white border border-zinc-200 rounded-2xl p-4 hover:border-zinc-300 hover:shadow-xs transition text-xs font-medium cursor-pointer" onClick={() => loadSession(s.id)}>
                      <div className="min-w-0 pr-4 flex-1">
                        <p className="font-bold text-zinc-800 truncate" title={s.title}>{s.title}</p>
                        <p className="text-[10px] text-zinc-400 mt-1 flex items-center gap-1">
                          <Icon name="message-circle" size={10} /> {s.messageCount} pesan &bull; {new Date(s.updatedAt).toLocaleDateString('id-ID', {day:'numeric',month:'short'})}
                        </p>
                      </div>
                      <button 
                        onClick={(e) => { e.stopPropagation(); deleteSession(s.id); }}
                        className="p-2 bg-rose-50 border border-rose-100 text-rose-500 rounded-xl hover:bg-rose-100 transition opacity-100 md:opacity-0 group-hover:opacity-100"
                        title="Hapus Sesi"
                      >
                        <Icon name="trash-2" size={12} />
                      </button>
                    </div>
                  ))
                )}
              </div>
            ) : (
              <>
                <div className="flex-1 p-5 overflow-y-auto bg-zinc-50 flex flex-col space-y-4 custom-scroll text-xs">
                  {messages.map((msg) => {
                    const isBot = msg.sender === 'bot';
                    const msgId = msg.id;
                    return (
                      <div 
                        key={msgId} 
                        className={`flex gap-3 max-w-full ${isBot ? 'items-start' : 'items-start flex-row-reverse'}`}
                      >
                        {isBot ? <BotAvatar /> : <UserAvatar />}
                        <div 
                          className={`relative group flex flex-col ${isBot ? 'items-start' : 'items-end'}`}
                        >
                          <div 
                            className={`p-3.5 rounded-2xl ${
                              isBot 
                                ? 'bg-white border border-zinc-200 text-zinc-850 rounded-2xl rounded-tl-none shadow-2xs' 
                                : 'bg-indigo-650 text-white rounded-2xl rounded-tr-none'
                            }`}
                          >
                            {renderMessageContent(msg)}
                          </div>
                          
                          {/* Message Context Action Trigger */}
                          <div className={`absolute top-2.5 ${isBot ? '-right-14' : '-left-14'} flex gap-1 bg-white border border-zinc-200 rounded-lg shadow-sm p-1 opacity-0 group-hover:opacity-100 transition duration-200 z-10`}>
                            <button 
                              onClick={() => startEditMessage(msg)}
                              className="p-1 hover:bg-zinc-50 text-zinc-400 hover:text-zinc-750 rounded"
                              title="Edit"
                            >
                              <Icon name="pencil" size={10} />
                            </button>
                            <button 
                              onClick={() => deleteMessage(msgId)}
                              className="p-1 hover:bg-rose-50 text-zinc-400 hover:text-rose-600 rounded"
                              title="Hapus"
                            >
                              <Icon name="trash-2" size={10} />
                            </button>
                          </div>
                          
                          <span className="text-[9px] text-zinc-400 mt-1 font-semibold block px-1">
                            {new Date(msg.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}
                            {msg.edited && ' (diedit)'}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                  {isTyping && (
                    <div className="flex gap-3 items-start">
                      <BotAvatar />
                      <div className="bg-white border border-zinc-150 p-4 rounded-2xl rounded-tl-sm shadow-xs flex items-center gap-1">
                        <span className="w-1.5 h-1.5 bg-zinc-450 rounded-full animate-bounce"></span>
                        <span className="w-1.5 h-1.5 bg-zinc-450 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span className="w-1.5 h-1.5 bg-zinc-450 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                      </div>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {/* Quick Questions Helper */}
                {messages.length === 1 && (
                  <div className="px-5 py-3.5 bg-zinc-50 border-t border-zinc-150 flex flex-wrap gap-1.5 max-h-36 overflow-y-auto custom-scroll text-left">
                    {quickQuestions.map((q, idx) => (
                      <button 
                        key={idx}
                        onClick={() => {
                          setInputValue(q);
                          setTimeout(() => handleSendMessage(), 50);
                        }}
                        className="px-3 py-1.5 bg-white border border-zinc-200 hover:border-zinc-300 text-zinc-650 hover:text-zinc-800 rounded-xl text-[10px] font-bold shadow-2xs transition"
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                )}

                {/* Footer Input Bar */}
                <form onSubmit={handleSendMessage} className="p-4 bg-white border-t border-zinc-150 flex gap-2 items-center flex-shrink-0">
                  <input 
                    type="text" 
                    value={inputValue}
                    onChange={e => setInputValue(e.target.value)}
                    placeholder="Tulis pesan Anda..."
                    className="flex-1 px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white focus:border-indigo-500 text-xs font-semibold text-zinc-850 focus:ring-1 focus:ring-indigo-100 transition-all"
                  />
                  <button 
                    type="submit"
                    disabled={!inputValue.trim()}
                    className="w-8 h-8 rounded-full bg-indigo-600 disabled:bg-zinc-200 text-white flex items-center justify-center shadow-md shadow-indigo-600/10 hover:bg-indigo-700 active:scale-95 disabled:scale-100 disabled:shadow-none transition"
                  >
                    <svg className="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                    </svg>
                  </button>
                </form>
              </>
            )}
          </div>

          {/* Chat Float Toggle Trigger */}
          <div className="relative">
            <button 
              onClick={() => setIsOpen(!isOpen)} 
              className={`w-12 h-12 rounded-full flex items-center justify-center transition-all duration-200 active:scale-95 relative group ${isOpen ? 'bg-zinc-800 text-white shadow-md border border-zinc-700' : 'bg-zinc-900 text-white shadow-md hover:bg-zinc-800 border border-zinc-855'}`}
              title="Chat Asisten"
            >
              <div className={`transition-all duration-200 ${isOpen ? 'rotate-90 scale-95' : 'rotate-0 scale-100'}`}>
                {isOpen ? <Icon name="x" size={20} className="text-zinc-200" /> : (
                  <svg className="w-6 h-6 text-zinc-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 2a8 8 0 0 0-8 8v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4a8 8 0 0 0-8-8z"></path>
                    <line x1="12" y1="2" x2="12" y2="1"></line>
                    <circle cx="12" cy="1" r="0.5" fill="currentColor"></circle>
                    <circle cx="9" cy="10" r="1" fill="currentColor"></circle>
                    <circle cx="15" cy="10" r="1" fill="currentColor"></circle>
                    <path d="M9 13.5h6"></path>
                    <path d="M6 10.5h.01M18 10.5h.01" strokeWidth="3"></path>
                  </svg>
                )}
              </div>
              {!isOpen && (
                <span className="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-zinc-900 rounded-full"></span>
              )}
              {!isOpen && (
                <div className="absolute right-16 top-1/2 -translate-y-1/2 bg-zinc-900 text-white text-[10.5px] font-extrabold rounded-2xl shadow-xl opacity-0 group-hover:opacity-100 transition-all duration-200 pointer-events-none whitespace-nowrap border border-zinc-850 p-2 flex items-center gap-2.5 scale-95 group-hover:scale-100 transform origin-right">
                  <div className="w-5 h-5 rounded-lg bg-zinc-800 flex items-center justify-center border border-zinc-700 shadow-sm">
                    <svg className="w-3.5 h-3.5 text-zinc-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <rect x="3" y="11" width="18" height="10" rx="2" />
                      <circle cx="12" cy="5" r="2" />
                      <path d="M12 7v4" />
                      <line x1="8" y1="16" x2="8.01" y2="16" strokeWidth="3" />
                      <line x1="16" y1="16" x2="16.01" y2="16" strokeWidth="3" />
                    </svg>
                  </div>
                  <span className="pr-1.5 tracking-wide">AI Asisten Smile POS</span>
                </div>
              )}
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const appState = useAppState();
      const isOwnerLoaded = React.useRef(false);
      const isAdminLoaded = React.useRef(false);
      const { page } = appState;
      if (page === 'owner_dashboard') isOwnerLoaded.current = true;
      if (['admin_workspace', 'products', 'reports', 'users', 'purchases'].includes(page)) isAdminLoaded.current = true;

      // SPA shell postMessage & storage synchronization listeners
      useEffect(() => {
        const handleMessage = (e) => {
          if (e.data && e.data.type === 'NAVIGATE') {
            appState.setPage(e.data.page);
          } else if (e.data && e.data.type === 'REDIRECT') {
            const url = e.data.url;
            if (url.includes('owner.html')) {
              appState.setPage('owner_dashboard');
            } else if (url.includes('kasir.html')) {
              appState.setPage('pos');
            } else if (url.includes('admin.html')) {
              const match = url.match(/page=([^&]+)/);
              const targetPage = match ? match[1] : 'admin_workspace';
              appState.setPage(targetPage);
            } else if (url.includes('index.html')) {
              window.location.href = 'index.html';
            } else {
              window.location.href = url;
            }
          }
        };
        const handleStorage = (e) => {
          if (e.key === 'pos_db_v3') {
            appState.refreshDB();
          }
        };
        window.addEventListener('message', handleMessage);
        window.addEventListener('storage', handleStorage);
        return () => {
          window.removeEventListener('message', handleMessage);
          window.removeEventListener('storage', handleStorage);
        };
      }, [appState.refreshDB]);



      // Security check: Redirect to pos.html if not logged in, or redirect kitchen staff to dapur.html
      useEffect(() => {
        if (!appState.user) {
          sessionStorage.removeItem('pos_redirect_ts');
          window.location.replace('pos.html');
        } else {
          const role = appState.user.role;
          const roleId = appState.user.roleId || role;
          if (role === 'dapur' || roleId === 'dapur') {
            window.location.replace('dapur.html');
          }
        }
      }, [appState.user]);

      if (!appState.user) return null;

      const isOutsideHours = isOutsideOperationalHours();
      const showHoursBlock = appState.user && !['admin', 'owner'].includes(appState.user.role) && isOutsideHours && !appState.bypassApproved;

      return (
        <AppContext.Provider value={appState}>
          <div className="flex h-screen overflow-hidden bg-zinc-50">
            <Sidebar />
            {appState.sidebar && (
              <div onClick={() => appState.setSidebar(false)} className="md:hidden fixed inset-0 bg-black/50 z-30 "></div>
            )}
            
            <div className="flex-1 flex flex-col overflow-hidden relative">
              <div className="no-print"><Header /></div>
              <main className="flex-1 overflow-hidden relative flex flex-col">
                {/* Local page view */}
                <div className={`flex-1 overflow-y-scroll p-4 md:p-6 custom-scroll ${page === 'pos' ? 'block' : 'hidden'}`}>
                  <div className="w-full max-w-[1600px] mx-auto h-full px-2 sm:px-4">
                    {!['admin', 'owner'].includes(appState.user?.role) ? (appState.activeShift ? <POSPage /> : <BukaShiftPage />) : <POSPage />}
                  </div>
                </div>

                {/* Pre-loaded IFrame for Owner Dashboard */}
                {isOwnerLoaded.current && (
                  <iframe 
                    src="owner.html?iframe=true" 
                    className={`w-full h-full border-none flex-1 ${page === 'owner_dashboard' ? 'block' : 'hidden'}`}
                    id="iframe-owner"
                  />
                )}

                {/* Pre-loaded IFrame for Admin Workspace / Products / Reports / Users / Purchases */}
                {isAdminLoaded.current && (
                  <iframe 
                    src={`admin.html?page=${page}&iframe=true`}
                    className={`w-full h-full border-none flex-1 ${['admin_workspace', 'products', 'reports', 'users', 'purchases'].includes(page) ? 'block' : 'hidden'}`}
                    id="iframe-admin"
                  />
                )}
              </main>
              <div className="no-print"><BottomNav /></div>
            </div>
          </div>
          
          {appState.isLocked && appState.user && (
            <LockScreenOverlay appState={appState} />
          )}

          {showHoursBlock && (
            <OperationalHoursOverlay appState={appState} />
          )}

          {appState.showTutupShiftModal && (
            <TutupShiftModal appState={appState} />
          )}

          {appState.showSyncModal && (
            <SyncModal appState={appState} />
          )}

          {appState.showSuccessModal && appState.lastTransaction && (
            <TransactionSuccessModal 
              transaction={appState.lastTransaction} 
              onClose={() => {
                appState.setShowSuccessModal(false);
                appState.setLastTransaction(null);
              }}
            />
          )}

          {/* Hidden Printable Receipt */}
          {appState.lastTransaction && (
            <div className="print-receipt print-only">
              <div className="text-center font-bold mb-2">
                <h3 className="text-base font-bold">SMILE POS</h3>
                <p className="text-[9px]">Sistem Kasir Pintar</p>
                <p className="text-[9px] border-b border-dashed border-zinc-400 pb-1">Jl. POS Sejahtera No. 88</p>
              </div>
              
              <div className="text-[9px] mb-2 font-mono">
                <div>No. Nota: {appState.lastTransaction.id}</div>
                <div>Tanggal : {new Date(appState.lastTransaction.date).toLocaleString('id-ID')}</div>
                <div>Kasir   : {appState.lastTransaction.change}</div>
                {appState.lastTransaction.memberName && <div>Pelanggan: {appState.lastTransaction.memberName}</div>}
                <div className="border-b border-dashed border-zinc-400 my-1"></div>
              </div>
              
              <div className="text-[9px] font-mono space-y-1">
                {appState.lastTransaction.items.map(item => (
                   <div key={item.id}>
                      <div className="font-semibold">{item.name}</div>
                      <div className="flex justify-between pl-2">
                        <span>{item.qty} x Rp {item.effectivePrice.toLocaleString('id-ID')}</span>
                        <span>Rp {(item.qty * item.effectivePrice).toLocaleString('id-ID')}</span>
                      </div>
                   </div>
                ))}
                <div className="border-b border-dashed border-zinc-400 my-1"></div>
              </div>
              
              <div className="text-[9px] font-mono space-y-0.5 text-right pl-6">
                <div className="flex justify-between font-mono">
                  <span>Subtotal:</span>
                  <span>Rp {appState.lastTransaction.subtotal.toLocaleString('id-ID')}</span>
                </div>
                {appState.lastTransaction.tax > 0 && (
                  <div className="flex justify-between font-mono">
                    <span>PPN (10%):</span>
                    <span>Rp {appState.lastTransaction.tax.toLocaleString('id-ID')}</span>
                  </div>
                )}
                {appState.lastTransaction.discount > 0 && (
                  <div className="flex justify-between font-mono text-rose-600">
                    <span>Diskon:</span>
                    <span>-Rp {appState.lastTransaction.discount.toLocaleString('id-ID')}</span>
                  </div>
                )}
                {appState.lastTransaction.rounding !== 0 && (
                  <div className="flex justify-between font-mono">
                    <span>Pembulatan:</span>
                    <span>Rp {appState.lastTransaction.rounding.toLocaleString('id-ID')}</span>
                  </div>
                )}
                <div className="border-t border-double border-zinc-400 pt-1 flex justify-between font-bold">
                  <span>TOTAL:</span>
                  <span>Rp {appState.lastTransaction.total.toLocaleString('id-ID')}</span>
                </div>
                <div className="flex justify-between font-mono">
                  <span>Bayar ({appState.lastTransaction.method.toUpperCase()}):</span>
                  <span>Rp {appState.lastTransaction.payment.toLocaleString('id-ID')}</span>
                </div>
                <div className="flex justify-between font-mono">
                  <span>Kembali:</span>
                  <span>Rp {appState.lastTransaction.change.toLocaleString('id-ID')}</span>
                </div>
              </div>
              
              <div className="text-center font-mono text-[8px] mt-4 border-t border-dashed border-zinc-400 pt-2">
                <p>Terima Kasih atas Kunjungan Anda</p>
                <p>Smile POS - Layanan POS Pintar</p>
              </div>
            </div>
          )}

          <div className="fixed top-4 right-4 md:top-6 md:right-6 z-[9999] flex flex-col items-end pointer-events-none">
            {appState.toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto">
                <Toast toast={toast} onClose={(id) => {
                  appState.setToasts(prev => prev.filter(t => t.id !== id));
                }} />
              </div>
            ))}
          </div>

          {appState.customAlert && (
            <CustomAlertModal customAlert={appState.customAlert} onClose={() => appState.setCustomAlert(null)} />
          )}
          {appState.user && (
            <AIChatbot appState={appState} />
          )}
        </AppContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>

  <script>
    (function() {
      function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          const char = str.charCodeAt(i);
          hash = (hash << 5) - hash + char;
          hash &= hash;
        }
        return hash.toString();
      }

      const jsxEl = document.getElementById('main-app-jsx');
      if (!jsxEl) return;
      const sourceCode = jsxEl.textContent;
      const currentHash = hashString(sourceCode);

      const cachedCode = localStorage.getItem('kasir_compiled_js');
      const cachedHash = localStorage.getItem('kasir_compiled_js_hash');

      if (cachedCode && cachedHash === currentHash) {
        console.log('[Cache] Loading compiled JS from cache (Instant Load)');
        const script = document.createElement('script');
        script.text = cachedCode;
        document.body.appendChild(script);
      } else {
        console.log('[Cache] No valid compiled cache found. Compiling with Babel...');

        setTimeout(() => {
          try {
            const start = performance.now();
            const compiled = Babel.transform(sourceCode, {
              presets: ['react']
            }).code;
            const duration = performance.now() - start;
            console.log('[Babel] Compilation finished in ' + duration.toFixed(1) + 'ms');

            localStorage.setItem('kasir_compiled_js', compiled);
            localStorage.setItem('kasir_compiled_js_hash', currentHash);

            const script = document.createElement('script');
            script.text = compiled;
            document.body.appendChild(script);
          } catch (err) {
            console.error('[Babel Compilation Error]:', err);
            const script = document.createElement('script');
            script.type = 'text/babel';
            script.text = sourceCode;
            document.body.appendChild(script);
          }
        }, 1);
      }
    })();
  </script>
</body>
</html>
