    (function() {
      function showDiagnostics(msg, type) {
        var errorDiv = document.getElementById('debug-error-box');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error-box';
          errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:white;color:black;padding:20px;z-index:99999;font-family:monospace;font-size:14px;overflow:auto;border: 5px solid red;';
          if (document.body) {
            document.body.appendChild(errorDiv);
          } else {
            document.documentElement.appendChild(errorDiv);
          }
        }
        errorDiv.innerHTML += '<h3>[' + type + ']</h3><pre style="color:red;white-space:pre-wrap;">' + msg + '</pre><hr>';
      }
      window.addEventListener('error', function(e) {
        try {
          localStorage.removeItem('kasir_compiled_js');
          localStorage.removeItem('kasir_compiled_js_hash');
        } catch(err) {}
        if (e.message === 'Script error.' && !e.filename) {
          return;
        }
        showDiagnostics(e.message + '\\nat ' + e.filename + ':' + e.lineno + ':' + e.colno + '\\n' + (e.error ? e.error.stack : ''), 'Window Error');
      });
      window.addEventListener('unhandledrejection', function(e) {
        try {
          localStorage.removeItem('kasir_compiled_js');
          localStorage.removeItem('kasir_compiled_js_hash');
        } catch(err) {}
        showDiagnostics(e.reason, 'Unhandled Rejection');
      });
      var originalError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        originalError.apply(console, args);
        var msg = args.join(' ');
        if (
          msg.indexOf('deoptimised') !== -1 || 
          msg.indexOf('500KB') !== -1 ||
          msg.indexOf('service worker') !== -1 ||
          msg.indexOf('ServiceWorker') !== -1 ||
          msg.indexOf('Unsafe attempt to load URL') !== -1
        ) {
          return;
        }
        showDiagnostics(msg, 'Console Error');
      };
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      }).catch(err => console.warn('Error clearing service workers:', err));
    }

    let __db_cache = null;

    function getDB() {
      if (__db_cache) {
        return __db_cache;
      }
      try {
        const data = localStorage.getItem(DB_KEY);
        let parsed = data ? JSON.parse(data) : null;
        if (!parsed) parsed = defaultData;
        
        // Ensure keys exist
        parsed.users = parsed.users || defaultData.users;
        parsed.products = parsed.products || defaultData.products;
        parsed.transactions = parsed.transactions || defaultData.transactions;

          parsed.users = parsed.users.filter(u => !deletedSet.has(u.id));

        // Migrate products with timestamps and active status

            if (!existing.name) { existing.name = role.name; migrated = true; }
            if (!existing.baseRole) { existing.baseRole = role.baseRole; migrated = true; }
            if (existing.locked !== true) { existing.locked = true; migrated = true; }
            if (!existing.createdAt) { existing.createdAt = nowStr; migrated = true; }
            if (!existing.updatedAt) { existing.updatedAt = nowStr; migrated = true; }
          }
        });
        parsed.products = parsed.products.map(p => {

    function saveDB(data) {
      // Flush activity logs inline if any are queued, to keep transactions & logs in sync
      if (typeof activityQueue !== 'undefined' && activityQueue.length > 0) {
        try {
          const activeUserStr = sessionStorage.getItem('pos_user');
          if (activeUserStr) {
            const activeUser = JSON.parse(activeUserStr);
            if (activeUser.role !== 'owner') {
              data.activityLogs = data.activityLogs || [];
              activityQueue.forEach(log => {
                log.role = getRoleName(activeUser.role, data);
                data.activityLogs.unshift(log);
              });
              if (data.activityLogs.length > 1000) {
                data.activityLogs = data.activityLogs.slice(0, 1000);
              }
              activityQueue = [];
            }
          }
        } catch(e) {}
      }

      __db_cache = data;
      localStorage.setItem(DB_KEY, JSON.stringify(data));
      // Auto-push to Supabase in background (non-blocking)
      sbPush(data);
    }

    function logAuditAction(action, details, user) {
      if (!user) return;
      try {
        const db = getDB();
        db.auditLogs = db.auditLogs || [];
        db.auditLogs.unshift({
          id: 'AL' + Date.now() + Math.random().toString().slice(-3),
          user: user.name || user.email,
          email: user.email,
          role: user.roleLabel || user.role,
          action: action,
          details: details,
          timestamp: new Date().toISOString()
        });
        if (db.auditLogs.length > 200) {
          db.auditLogs = db.auditLogs.slice(0, 200);
        }

        // Duplikat log mutasi data secara tak terlihat ke tracker aktivitas karyawan (non-owner)
        if (user.role !== 'owner') {
          db.activityLogs = db.activityLogs || [];
          db.activityLogs.unshift({
            id: 'ACT' + Date.now() + Math.random().toString().slice(-3),
            user: user.name || user.email,
            email: user.email,
            role: user.roleLabel || user.role,
            type: 'data_mutasi',
            details: `[${action}] ${details}`,
            timestamp: new Date().toISOString()
          });
          if (db.activityLogs.length > 1000) {
            db.activityLogs = db.activityLogs.slice(0, 1000);
          }
        }

        saveDB(db);
      } catch (err) {
        console.error("Gagal mencatat log audit:", err);
      }
    }

    function getRoleConfig(roleId, db = getDB()) {
      const role = (db.roles || defaultData.roles).find(r => r.id === roleId);
      if (role) return role;
      
      // Tentukan baseRole berdasarkan kata kunci di roleId kustom
      let baseRole = 'cashier'; // Default fallback
      const idLower = (roleId || '').toLowerCase();
      if (idLower.includes('admin')) {
        baseRole = 'admin';
      } else if (idLower.includes('supervisor') || idLower.includes('spv')) {
        baseRole = 'supervisor';
      } else if (idLower.includes('manager') || idLower.includes('manajer')) {
        baseRole = 'manager';
      } else if (idLower.includes('keuangan') || idLower.includes('finance') || idLower.includes('akuntan')) {
        baseRole = 'keuangan';
      } else if (idLower.includes('staff') || idLower.includes('staf') || idLower.includes('pegawai') || idLower.includes('karyawan')) {
        baseRole = 'staff';
      } else if (idLower.includes('dapur') || idLower.includes('kitchen')) {
        baseRole = 'dapur';
      } else if (idLower.includes('kasir') || idLower.includes('cashier')) {
        baseRole = 'cashier';
      }

      return {
        id: roleId,
        name: roleId ? (roleId.charAt(0).toUpperCase() + roleId.slice(1)) : 'Kasir',
        baseRole: baseRole,
        locked: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function getRoleBase(roleId, db = getDB()) {
      return getRoleConfig(roleId, db)?.baseRole || 'cashier';
    }

    function getRoleName(roleId, db = getDB()) {
      return getRoleConfig(roleId, db)?.name || 'Kasir';
    }

    function makeSafeUser(user, db = getDB()) {
      const { password: _, ...safeUser } = user;
      const roleConfig = getRoleConfig(user.role, db);
      return {
        ...safeUser,
        roleId: user.role,
        role: roleConfig.baseRole,
        roleLabel: roleConfig.name
      };
    }
      
    // Time Ago Formatter
    function formatTimeAgo(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return 'Baru saja';
      if (diffMins < 60) return `${diffMins} menit lalu`;
      if (diffHours < 24) return `${diffHours} jam lalu`;
      if (diffDays === 1) return 'Kemarin';
      if (diffDays < 7) return `${diffDays} hari lalu`;
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // QR Code Generator
    function generateQRCode(text) {
      const canvas = document.createElement('canvas');
      QRCode.toCanvas(canvas, text, { width: 300 }, function(error) {
        if (error) console.error(error);
      });
      return canvas.toDataURL('image/png');
    }

    // Camera Utils
    async function captureFromCamera() {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        const video = document.createElement('video');
        const constraints = { video: { facingMode: 'environment' } };
        
        navigator.mediaDevices.getUserMedia(constraints)
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play();
              setTimeout(() => {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                stream.getTracks().forEach(track => track.stop());
                resolve(canvas.toDataURL('image/png'));
              }, 500);
            };
          })
          .catch(reject);
      });
    }

    // Merge databases using Last-Write-Wins (LWW) with tombstone deletion tracking
    function mergeDB(local, cloud) {
      if (!cloud) return local;
      
      // Merge deletedUserIds tombstone - union of both sides so deletions propagate
      const localDeleted = new Set(local.deletedUserIds || []);
      const cloudDeleted = new Set(cloud.deletedUserIds || []);
      const mergedDeletedIds = [...new Set([...localDeleted, ...cloudDeleted])];

      const mergeList = (localList = [], cloudList = []) => {
        const map = new Map();
        localList.forEach(item => {
          map.set(item.id, item);
        });
        cloudList.forEach(item => {
          const localItem = map.get(item.id);
          if (!localItem) {
            map.set(item.id, item);
          } else {
            const localTime = new Date(localItem.updatedAt || 0).getTime();
            const cloudTime = new Date(item.updatedAt || 0).getTime();
            if (cloudTime > localTime) {
              map.set(item.id, item);
            }
          }
        });
        return Array.from(map.values());
      };

      // Filter out permanently deleted users from merged list
      const mergedDeletedSet = new Set(mergedDeletedIds);
      const mergedUsers = mergeList(local.users, cloud.users).filter(u => !mergedDeletedSet.has(u.id));

      return {
        // Preserve migration flags from local (local is authoritative for migrations)
        userCleanupV4: local.userCleanupV4 || cloud.userCleanupV4 || false,
        deletedUserIds: mergedDeletedIds,
        users: mergedUsers,
        products: mergeList(local.products, cloud.products),
        transactions: mergeList(local.transactions, cloud.transactions),
        categories: cloud.categories || local.categories || defaultData.categories,
        shifts: mergeList(local.shifts, cloud.shifts),
        bypassRequests: mergeList(local.bypassRequests, cloud.bypassRequests),
        approvedBypasses: mergeList(local.approvedBypasses, cloud.approvedBypasses),
        scans: mergeList(local.scans, cloud.scans),
        productProposals: mergeList(local.productProposals, cloud.productProposals),
        adminApprovals: mergeList(local.adminApprovals, cloud.adminApprovals),
        members: mergeList(local.members, cloud.members),
        cashierReports: mergeList(local.cashierReports, cloud.cashierReports),
        auditLogs: mergeList(local.auditLogs, cloud.auditLogs),
        purchases: mergeList(local.purchases, cloud.purchases),
        officeSupplies: mergeList(local.officeSupplies, cloud.officeSupplies),
        schedules: mergeList(local.schedules, cloud.schedules),
        officeTasks: mergeList(local.officeTasks, cloud.officeTasks),
        invoices: mergeList(local.invoices, cloud.invoices),
        expenses: mergeList(local.expenses, cloud.expenses),
        paymentVerifications: mergeList(local.paymentVerifications, cloud.paymentVerifications),
        attendance: mergeList(local.attendance, cloud.attendance),
        leaveRequests: mergeList(local.leaveRequests, cloud.leaveRequests),
        payrollSlips: mergeList(local.payrollSlips, cloud.payrollSlips),
        crmLeads: mergeList(local.crmLeads, cloud.crmLeads),
        promoCoupons: mergeList(local.promoCoupons, cloud.promoCoupons),
        stockLedger: mergeList(local.stockLedger, cloud.stockLedger),
        damagedGoods: mergeList(local.damagedGoods, cloud.damagedGoods),
        productBundles: mergeList(local.productBundles || [], cloud.productBundles || []),
        goodsReceipts: mergeList(local.goodsReceipts || [], cloud.goodsReceipts || []),
        shopIncidents: mergeList(local.shopIncidents || [], cloud.shopIncidents || []),
        handovers: mergeList(local.handovers || [], cloud.handovers || []),
        pettyCash: mergeList(local.pettyCash || [], cloud.pettyCash || []),
        taxRecords: mergeList(local.taxRecords || [], cloud.taxRecords || []),
        staffKPI: mergeList(local.staffKPI || [], cloud.staffKPI || []),
        deviceSessions: mergeList(local.deviceSessions || [], cloud.deviceSessions || []),
        salesTargets: cloud.salesTargets || local.salesTargets || { target: 50000000, month: new Date().toISOString().slice(0, 7) }
      };
    }

    // ==================== SIMULATED BACKEND VALIDATION LAYER ====================
    function validateProductData(data, editProductId = null) {
      const price = parseFloat(data.price);
      const cost = parseFloat(data.cost);
      const stock = parseFloat(data.stock);
      const wholesalePrice = parseFloat(data.wholesalePrice || 0);
      const wholesaleMinQty = parseFloat(data.wholesaleMinQty || 0);

      if (isNaN(price) || price < 0) {
        return "Harga jual tidak boleh bernilai negatif atau kosong.";
      }
      if (isNaN(cost) || cost < 0) {
        return "Modal / harga beli tidak boleh kosong atau bernilai negatif.";
      }
      if (isNaN(stock) || stock < 0) {
        return "Stok tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesalePrice) || wholesalePrice < 0) {
        return "Harga grosir tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesaleMinQty) || wholesaleMinQty < 0) {
        return "Jumlah minimal grosir tidak boleh bernilai negatif.";
      }
      const minStock = parseFloat(data.minStock || 0);
      if (isNaN(minStock) || minStock < 0) {
        return "Batas minimum stok tidak boleh bernilai negatif.";
      }

      // Check SKU uniqueness
      const db = getDB();
      const skuExists = db.products.some(p => p.sku === data.sku && p.id !== editProductId && p.active !== false);
      if (skuExists && data.sku) {
        return `Kode barang "${data.sku}" sudah digunakan oleh produk lain.`;
      }

      return null; // Valid
    }

    function validateUserData(data, editUserId = null) {
      if (!data.name || !data.name.trim()) {
        return "Nama pengguna wajib diisi.";
      }
      
      const email = data.email ? data.email.trim() : '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        return "Email tidak valid. Pastikan format email benar (contoh: user@mail.com).";
      }

      const db = getDB();
      const emailExists = db.users.some(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== editUserId);
      if (emailExists) {
        return `Email "${email}" sudah terdaftar pada pengguna lain.`;
      }

      // Password check for new users
      if (!editUserId && (!data.password || data.password.length < 4)) {
        return "Kata sandi wajib diisi dan minimal terdiri dari 4 karakter.";
      }

      // Keamanan Akun Pemilik & Peran Kustom
      const currentSessionUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
      
      // 1. Staf lain tidak boleh mengubah akun Pemilik
      const targetUser = db.users.find(u => u.id === editUserId);
      if (targetUser && targetUser.role === 'owner') {
        if (!currentSessionUser || currentSessionUser.role !== 'owner') {
          return "Akses Ditolak: Anda tidak memiliki akses untuk mengubah akun Pemilik!";
        }
      }

      // 2. Staf lain tidak boleh menyetel role ke owner/pemilik (kustom maupun standar)
      const cleanRole = (data.role || '').toLowerCase().replace(/[^a-z]/g, '');
      const isOwnerRole = cleanRole === 'owner' || cleanRole === 'pemilik' || cleanRole.includes('owner') || cleanRole.includes('pemilik');
      if (isOwnerRole && (!currentSessionUser || currentSessionUser.role !== 'owner')) {
        return "Akses Ditolak: Anda tidak diizinkan membuat atau menetapkan role Pemilik/Owner!";
      }

      return null; // Valid
    }

            const openShift = db.shifts.find(s => s.cashierId === user.id && s.status === 'open');

          }

          setBypassApproved(false);
        }

      useEffect(() => {

            const db = getDB();
            const uIdx = db.users.findIndex(u => u.id === user.id);
            if (uIdx !== -1) {
              const nowStr = new Date().toISOString();
              db.users[uIdx].lastActive = nowStr;
              db.users[uIdx].entryStatus = 'entered';
              saveDB(db);
            }
          };
          updateActive();
          const timer = setInterval(updateActive, 60000); // refresh every minute
          return () => clearInterval(timer);
        }
      }, [user]);

      // Live GPS Tracking for non-owner users
      useEffect(() => {
        if (!user || user.role === 'owner') return;
        if (!navigator.geolocation) return;
        
        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const db = getDB();
            const uIdx = db.users.findIndex(u => u.id === user.id);
            if (uIdx !== -1) {
              db.users[uIdx].liveLocation = {
                lat: pos.coords.latitude,

              };
              saveDB(db);
            }
          },
          (err) => { console.warn('[GPS Watch] Error:', err.message); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, [user]);

      // Surveillance listener - employee device streams video/audio when owner requests
      useEffect(() => {
        if (!user || user.role === 'owner' || !sbClient) return;
        
        let survStream = null;
        let survInterval = null;
        let survRecorder = null;
        let survVideo = null;
        let survCanvas = null;
        
        const channelName = `surveillance_${user.id}`;
        const survChannel = sbClient.channel(channelName);
        
        const stopStreaming = () => {
          if (survInterval) { clearInterval(survInterval); survInterval = null; }
          if (survRecorder && survRecorder.state !== 'inactive') { try { survRecorder.stop(); } catch(e){} survRecorder = null; }
          if (survStream) { survStream.getTracks().forEach(t => t.stop()); survStream = null; }
          if (survVideo && survVideo.parentNode) survVideo.parentNode.removeChild(survVideo);
          if (survCanvas && survCanvas.parentNode) survCanvas.parentNode.removeChild(survCanvas);
          survVideo = null; survCanvas = null;
        };

        survChannel.on('broadcast', { event: 'monitor_request' }, async () => {
          try {
            stopStreaming();
            survStream = await navigator.mediaDevices.getUserMedia({ 
              video: { facingMode: 'user', width: 320, height: 240 }, 
              audio: true 
            });
            
            survVideo = document.createElement('video');
            survVideo.srcObject = survStream;
            survVideo.setAttribute('playsinline', '');
            survVideo.muted = true;
            survVideo.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;';
            document.body.appendChild(survVideo);
            await survVideo.play();
            
            survCanvas = document.createElement('canvas');
            survCanvas.width = 160; survCanvas.height = 120;
            survCanvas.style.display = 'none';
            document.body.appendChild(survCanvas);
            const ctx = survCanvas.getContext('2d');
            
            // Send video frames every 2s
            survInterval = setInterval(() => {
              if (!survVideo || survVideo.readyState < 2) return;
              ctx.drawImage(survVideo, 0, 0, 160, 120);
              const frame = survCanvas.toDataURL('image/jpeg', 0.5);
              survChannel.send({ type: 'broadcast', event: 'monitor_frame', payload: { userId: user.id, frame, timestamp: Date.now() } });
            }, 2000);
            
            // Send audio clips every 2s
            const audioTrack = survStream.getAudioTracks()[0];
            if (audioTrack) {
              const audioStream = new MediaStream([audioTrack]);
              survRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm;codecs=opus' });
              survRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                  const reader = new FileReader();
                  reader.onloadend = () => {
                    survChannel.send({ type: 'broadcast', event: 'monitor_audio', payload: { userId: user.id, audio: reader.result, timestamp: Date.now() } });
                  };
                  reader.readAsDataURL(e.data);
                }
              };
              survRecorder.start(2000);
            }
          } catch(err) {
            console.warn('[Surveillance] Failed to start:', err);
          }
        });
        
        survChannel.on('broadcast', { event: 'monitor_stop' }, () => {
          stopStreaming();
        });
        
        survChannel.subscribe();
        
        return () => {
          stopStreaming();
          sbClient.removeChannel(survChannel);
        };
      }, [user]);

            .filter(t => t.cashier === user.name && new Date(t.date) >= new Date(shift.startTime) && t.method === 'cash' && !t.deleted)
            .reduce((sum, t) => sum + t.total, 0);

          const expectedCash = shift.startCash + cashSales;
          const diff = actualCash - expectedCash;

          shift.endTime = new Date().toISOString();
          shift.expectedCash = expectedCash;
          shift.actualCash = actualCash;
          shift.difference = diff;
          shift.status = 'closed';
          shift.updatedAt = new Date().toISOString();

          db.shifts[shiftIdx] = shift;
          saveDB(db);
          refreshDB();
          
          if (diff === 0) {
            addToast('Shift ditutup. Uang laci pas!', 'success');
          } else if (diff > 0) {
            addToast(`Shift ditutup. Selisih lebih: +Rp ${diff.toLocaleString('id-ID')}`, 'info');
          } else {
            addToast(`Shift ditutup. Selisih kurang: -Rp ${Math.abs(diff).toLocaleString('id-ID')}`, 'error');
          }
          
          logout();
        }
      };

      // Cloud Sync Actions
      const enableSync = async (code) => {
        let activeCode = code;
        setSyncStatus('syncing');
        if (!activeCode) {
          activeCode = await createNewCloudBucket();
          if (!activeCode) {
            setSyncStatus('error');
            addToast('Gagal membuat kode sinkronisasi cloud', 'error');
            return;
          }
        }
        localStorage.setItem('pos_sync_enabled', 'true');
        localStorage.setItem('pos_sync_code', activeCode);
        setSyncEnabled(true);
        setSyncCode(activeCode);
        await triggerSync(activeCode);
      };

      const disableSync = () => {
        localStorage.setItem('pos_sync_enabled', 'false');
        localStorage.removeItem('pos_sync_code');
        setSyncEnabled(false);
        setSyncCode('');
        setSyncStatus('idle');
        addToast('Sinkronisasi cloud dinonaktifkan', 'info');
      };

      const triggerSync = async (codeToUse = syncCode) => {
        if (!codeToUse) return;
        setSyncStatus('syncing');
        const cloudData = await fetchCloudData(codeToUse);
        const localData = getDB();
        
        if (cloudData) {
          const merged = mergeDB(localData, cloudData);
          saveDB(merged);
          await pushCloudData(codeToUse, merged);
          refreshDB();
          setSyncStatus('success');
          addToast('Sinkronisasi cloud berhasil', 'success');
        } else {
          const success = await pushCloudData(codeToUse, localData);
          if (success) {
            setSyncStatus('success');
            addToast('Data lokal diunggah ke cloud', 'success');
          } else {
            setSyncStatus('error');
            addToast('Koneksi ke cloud gagal', 'error');
          }
        }
      };

      // ==================== SUPABASE SYNC ====================
      // Pull from Supabase once on mount, then subscribe to realtime changes
      useEffect(() => {
        let channel = null;

        const initSupabase = async () => {
          // 1. Fetch latest from Supabase and merge with local
          const cloudData = await sbFetch();
          if (cloudData) {
            const localData = getDB();
            const merged = mergeDB(localData, cloudData);
            if (JSON.stringify(merged) !== JSON.stringify(localData)) {
              __db_cache = merged;
              localStorage.setItem(DB_KEY, JSON.stringify(merged));
              setDbVersion(v => v + 1);
              
              // Logout if current user is deleted or deactivated
              const currentUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
              if (currentUser) {
                const stillExists = merged.users.some(u => u.id === currentUser.id && u.active);
                if (!stillExists) {
                  sessionStorage.removeItem('pos_user');
                  sessionStorage.removeItem('pos_locked');
                  setUser(null);
                  setPage('pos');
                  addToast('Akun Anda telah dinonaktifkan atau dihapus.', 'error');
                }
              }
            }
          } else {
            // First device: push local data to Supabase
            sbPush(getDB());
          }

          // 2. Subscribe to realtime changes so other devices auto-sync
          if (sbClient) {
            channel = sbClient.channel('pos_realtime')
              .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'pos_sync',
                filter: 'id=eq.main'
              }, (payload) => {
                const cloudDb = payload.new?.db_data;
                if (!cloudDb) return;
                const local = getDB();
                const merged = mergeDB(local, cloudDb);
                if (JSON.stringify(merged) !== JSON.stringify(local)) {
                  __db_cache = merged;
                  localStorage.setItem(DB_KEY, JSON.stringify(merged));
                  setDbVersion(v => v + 1);
                  
                  // Logout if current user is deleted or deactivated
                  const currentUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
                  if (currentUser) {
                    const stillExists = merged.users.some(u => u.id === currentUser.id && u.active);
                    if (!stillExists) {
                      sessionStorage.removeItem('pos_user');
                      sessionStorage.removeItem('pos_locked');
                      setUser(null);
                      setPage('pos');
                      addToast('Akun Anda telah dinonaktifkan atau dihapus dari perangkat lain.', 'error');
                    }
                  }
                }
              })
              .subscribe((status) => {
                console.log('[Supabase Realtime]', status);
              });
          }
        };

        initSupabase();

        return () => {
          if (channel && sbClient) sbClient.removeChannel(channel);
        };
      }, []);

      // Idle Timeout - auto-lock layar setelah 15 menit tidak aktif
      useEffect(() => {
        if (!user) return;
        let idleTimer;
        const resetTimer = () => {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => {
            setIsLocked(true);
            sessionStorage.setItem('pos_locked', 'true');
          }, 15 * 60 * 1000); // 15 menit
        };
        const events = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];
        events.forEach(ev => document.addEventListener(ev, resetTimer, { passive: true }));
        resetTimer();
        return () => {
          clearTimeout(idleTimer);
          events.forEach(ev => document.removeEventListener(ev, resetTimer));
        };
      }, [user]);

      // Operational Hours Bypass Requests
      const submitBypassRequest = async (loc) => {
        const db = getDB();
        const newReq = {
          id: 'REQ' + Date.now(),
          name: user?.name || 'Kasir',
          email: user?.email || '',
          time: new Date().toISOString(),
          location: loc || 'Lokasi tidak diketahui',
          device: navigator.userAgent,
          status: 'pending',
          updatedAt: new Date().toISOString()
        };
        db.bypassRequests.push(newReq);
        saveDB(db);
        refreshDB();
        addToast('Permintaan izin masuk dikirim', 'info');
      };

      const approveBypassRequest = async (reqId) => {
        const db = getDB();
        const idx = db.bypassRequests.findIndex(r => r.id === reqId);
        if (idx !== -1) {
          db.bypassRequests[idx].status = 'approved';
          db.bypassRequests[idx].updatedAt = new Date().toISOString();
          
          // Update entryStatus untuk user yang di-approve
          const userIdx = db.users.findIndex(u => u.email === db.bypassRequests[idx].email);
          if (userIdx !== -1) {
            db.users[userIdx].entryStatus = 'entered';
            db.users[userIdx].updatedAt = new Date().toISOString();
          }
          
          const todayStr = new Date().toDateString();
          db.approvedBypasses.push({
            id: 'APP' + Date.now(),
            email: db.bypassRequests[idx].email,
            date: todayStr,
            updatedAt: new Date().toISOString()
          });
          
          saveDB(db);
          refreshDB();
          addToast('Akses disetujui', 'success');
        }
      };

      const rejectBypassRequest = async (reqId) => {
        const db = getDB();
        const idx = db.bypassRequests.findIndex(r => r.id === reqId);
        if (idx !== -1) {
          db.bypassRequests[idx].status = 'rejected';
          db.bypassRequests[idx].updatedAt = new Date().toISOString();
          
          saveDB(db);
          refreshDB();
          addToast('Akses ditolak', 'error');
        }
      };

      // Cart Actions
      const addToCart = (product) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          if (ex) {
            if (ex.qty >= product.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return prev;
            }
            return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const addToCartWithQty = (product, qty) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          if (ex) {
            const newQty = ex.qty + qty;
            if (newQty > product.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return prev;
            }
            return prev.map(i => i.id === product.id ? { ...i, qty: parseFloat(newQty.toFixed(3)) } : i);
          }
          if (qty > product.stock) {
            addToast('Stok tidak mencukupi', 'error');
            return prev;
          }
          return [...prev, { ...product, qty: parseFloat(qty.toFixed(3)) }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            if (newQty > item.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : item;
          }
          return item;
        }).filter(item => item.qty > 0));
      };

      const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
      const clearCart = () => setCart([]);

      const saveScanData = (photoData, scanType = 'photo') => {
        const db = getDB();
        const scanId = 'SCAN' + Date.now();
        const qrCode = generateQRCode(scanId);
        db.scans.push({
          id: scanId,
          userId: user?.id || '',
          photoData,
          qrCode,
          scanType,
          createdAt: new Date().toISOString()
        });
        saveDB(db);
        refreshDB();
        return scanId;
      };

      // Auto-Save Cart to LocalStorage
      useEffect(() => {
        if (user) {
          localStorage.setItem(`pos_cart_${user.id}`, JSON.stringify(cart));
          // Save active cart globally for Customer Display Screen
          localStorage.setItem('pos_active_cart', JSON.stringify({
            cart,
            user,
            timestamp: Date.now()
          }));
        }
      }, [cart, user]);

      // Auto-Restore Cart from LocalStorage
      useEffect(() => {
        if (user) {
          const saved = localStorage.getItem(`pos_cart_${user.id}`);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              if (parsed && parsed.length > 0) {
                setCart(parsed);
              }
            } catch(e) {}
          }
        } else {
          setCart([]);
        }
      }, [user]);

      // Real-time Page View Logger
      useEffect(() => {
        if (page && user) {
          const titles = {
            owner_dashboard: 'Dashboard Owner',
            admin_workspace: 'Workspace Admin',
            pos: 'Point of Sale (POS Kasir)',
            products: 'Manajemen Produk',
            reports: 'Laporan Transaksi & Shift',
            users: 'Manajemen Pengguna',
            purchases: 'Manajemen Pengadaan'
          };
          const pageName = titles[page] || page;
          logUserActivity('page_view', `Membuka halaman: ${pageName}`);
        }
      }, [page, user]);

      return {
        user, page, cart, sidebar, toasts, dbVersion,
        activeShift, isLocked, syncEnabled, syncCode, syncStatus, bypassApproved,
        showSyncModal, showTutupShiftModal,
        selectedMember, setSelectedMember, discount, setDiscount, roundingMode, setRoundingMode,
        isOnline, lastTransaction, setLastTransaction, showSuccessModal, setShowSuccessModal,
        permissionPrompt, setPermissionPrompt, customAlert, setCustomAlert,
        setPage, setSidebar, setToasts, addToast, login, logout,
        addToCart, addToCartWithQty, updateCartQty, removeFromCart, clearCart, refreshDB,
        lockScreen, unlockScreen, startShift, endShift,
        enableSync, disableSync, triggerSync, setShowSyncModal, setShowTutupShiftModal,
        submitBypassRequest, approveBypassRequest, rejectBypassRequest, saveScanData
      };
    }

    // ==================== COMPONENTS ====================
    function parseUserAgent(ua) {
      let os = "OS Lainnya";
      if (ua.indexOf("Win") !== -1) os = "Windows";
      else if (ua.indexOf("Mac") !== -1) os = "macOS";
      else if (ua.indexOf("X11") !== -1) os = "Linux";
      else if (ua.indexOf("Android") !== -1) os = "Android";
      else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";

      let browser = "Browser Lainnya";
      if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
      else if (ua.indexOf("Safari") !== -1) browser = "Safari";
      else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
      else if (ua.indexOf("Edge") !== -1) browser = "Edge";
      else if (ua.indexOf("MSIE") !== -1 || !!document.documentMode) browser = "Internet Explorer";
      
      return { os, browser };
    }

            <div className={`w-14 h-14 ${iconColor} rounded-full flex items-center justify-center mb-4 shadow-inner`}>

            <button

    // 1. LOGIN PAGE
    function DynamicQRCode({ text, width = 170 }) {
      const canvasRef = useRef(null);
      const [error, setError] = useState(false);

      useEffect(() => {
        setError(false);
        if (canvasRef.current && text) {
          if (typeof QRCode !== 'undefined') {
            QRCode.toCanvas(canvasRef.current, text, { width: width, margin: 1 }, function(err) {
              if (err) {
                console.error(err);
                setError(true);
              }
            });
          } else {
            setError(true);
          }
        }
      }, [text, width]);

      if (error) {
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${width}x${width}&data=${encodeURIComponent(text)}`;
        return <img src={qrUrl} alt="QR Code" className="mx-auto border border-zinc-200 rounded-xl" style={{ width: `${width}px`, height: `${width}px` }} />;
      }

      return <canvas ref={canvasRef} className="mx-auto border border-zinc-200 rounded-xl" />;
    }

              <label className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2">Tipe Koneksi Printer</label>
              <div className="flex bg-zinc-200/50 p-1 rounded-xl text-xs font-semibold">
                <button type="button" onClick={() => { setPrinterType('bluetooth'); disconnectPrinter(); }} className={`flex-1 py-2 rounded-lg transition ${printerType === 'bluetooth' ? 'bg-white shadow-xs text-zinc-900' : 'text-zinc-500 hover:text-zinc-700'}`}>Bluetooth</button>
                <button type="button" onClick={() => { setPrinterType('usb'); disconnectPrinter(); }} className={`flex-1 py-2 rounded-lg transition ${printerType === 'usb' ? 'bg-white shadow-xs text-zinc-900' : 'text-zinc-500 hover:text-zinc-700'}`}>USB (Kabel)</button>
                <button type="button" onClick={() => { setPrinterType('network'); disconnectPrinter(); }} className={`flex-1 py-2 rounded-lg transition ${printerType === 'network' ? 'bg-white shadow-xs text-zinc-900' : 'text-zinc-500 hover:text-zinc-700'}`}>LAN / Wi-Fi</button>
              </div>
            </div>

            {/* Connection logic rendering */}
            {printerConnected ? (
              <div className="bg-white border border-zinc-150 rounded-xl p-3.5 flex items-center justify-between shadow-2xs">
                <div className="min-w-0 flex-1">
                  <p className="text-xs font-bold text-zinc-800 truncate">{connectedPrinterName}</p>
                  <p className="text-[10px] text-zinc-400 font-medium">Tipe: {printerType.toUpperCase()}</p>
                </div>
                <div className="flex gap-2 shrink-0">
                  <button type="button" onClick={handleTestPrint} className="px-2.5 py-1.5 bg-sky-50 text-sky-600 hover:bg-sky-100 rounded-lg text-[10px] font-bold transition flex items-center gap-1">
                    <Icon name="file-text" size={12} /> Test Print
                  </button>
                  <button type="button" onClick={disconnectPrinter} className="px-2.5 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-[10px] font-bold transition">
                    Putuskan
                  </button>
                </div>
              </div>
            ) : (
              <div className="space-y-3">
                {printerType === 'bluetooth' && (
                  <div className="space-y-3">
                    <button type="button" onClick={startScanPrinters} disabled={scanningPrinters || connecting} className="w-full py-2.5 bg-sky-600 hover:bg-sky-700 disabled:bg-zinc-300 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                      {scanningPrinters ? <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <Icon name="search" size={14} />}
                      {scanningPrinters ? 'Mencari Printer Bluetooth...' : 'Cari Perangkat Bluetooth'}
                    </button>
                    {discoveredPrinters.length > 0 && (
                      <div className="border border-zinc-200 rounded-xl bg-white divide-y divide-zinc-100 overflow-hidden shadow-2xs">
                        {discoveredPrinters.map(p => (
                          <div key={p.id} className="p-3 flex items-center justify-between hover:bg-zinc-50/50 transition">
                            <span className="text-xs font-semibold text-zinc-700">{p.name}</span>
                            <button type="button" onClick={() => connectPrinter(p.name)} disabled={connecting} className="px-3 py-1 bg-sky-50 text-sky-600 hover:bg-sky-100 rounded-lg text-[10px] font-bold transition">
                              Hubungkan
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {printerType === 'usb' && (
                  <div className="space-y-2">
                    <select 
                      id="usbPrinterSelect"
                      className="w-full px-3 py-2 bg-white border border-zinc-200 rounded-xl text-xs font-semibold text-zinc-700 outline-none focus:border-sky-500 shadow-2xs"
                    >
                      <option value="Thermal Printer (Vendor ID: 0x0fe9)">Thermal Printer (Vendor ID: 0x0fe9)</option>
                      <option value="Zebra GK420t (Vendor ID: 0x0a1b)">Zebra GK420t (Vendor ID: 0x0a1b)</option>
                    </select>
                    <button type="button" onClick={() => connectPrinter(document.getElementById('usbPrinterSelect').value)} className="w-full py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl text-xs font-bold transition">
                      Hubungkan USB Printer
                    </button>
                  </div>
                )}

                {printerType === 'network' && (
                  <div className="space-y-3">
                    <div className="grid grid-cols-3 gap-2">
                      <div className="col-span-2">
                        <label className="block text-[9px] font-bold text-zinc-400 uppercase mb-1">IP Address</label>
                        <input type="text" value={networkIp} onChange={e => setNetworkIp(e.target.value)} className="w-full px-3 py-2 bg-white border border-zinc-200 rounded-xl text-xs font-semibold text-zinc-700 outline-none focus:border-sky-500 shadow-2xs" />
                      </div>
                      <div>
                        <label className="block text-[9px] font-bold text-zinc-400 uppercase mb-1">Port</label>
                        <input type="text" value={networkPort} onChange={e => setNetworkPort(e.target.value)} className="w-full px-3 py-2 bg-white border border-zinc-200 rounded-xl text-xs font-semibold text-zinc-700 outline-none focus:border-sky-500 shadow-2xs" />
                      </div>
                    </div>
                    <button type="button" onClick={() => connectPrinter(`NetPrinter (${networkIp}:${networkPort})`)} className="w-full py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl text-xs font-bold transition">
                      Hubungkan Network Printer
                    </button>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* BARCODE SCANNER SECTION */}
          <div className="border border-zinc-150 rounded-2xl p-4 bg-zinc-50/50 space-y-4">
            <div className="flex justify-between items-center">
              <h4 className="text-sm font-bold text-zinc-900 flex items-center gap-1.5">
                <Icon name="scan-line" size={16} className="text-sky-600" />
                Barcode Scanner
              </h4>
              <span className={`px-2 py-0.5 rounded-full text-[9px] font-bold border ${scannerConnected || scannerType === 'camera' ? 'bg-emerald-50 border-emerald-100 text-emerald-700' : 'bg-rose-50 border-rose-100 text-rose-700'}`}>
                {scannerConnected || scannerType === 'camera' ? 'Aktif' : 'Terputus'}
              </span>
            </div>

            <div>
              <label className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider mb-2">Tipe Scanner</label>
              <div className="flex bg-zinc-200/50 p-1 rounded-xl text-xs font-semibold">
                <button type="button" onClick={() => { setScannerType('camera'); disconnectScanner(); }} className={`flex-1 py-2 rounded-lg transition ${scannerType === 'camera' ? 'bg-white shadow-xs text-zinc-900' : 'text-zinc-500 hover:text-zinc-700'}`}>Kamera HP/Webcam</button>
                <button type="button" onClick={() => { setScannerType('usb'); disconnectScanner(); }} className={`flex-1 py-2 rounded-lg transition ${scannerType === 'usb' ? 'bg-white shadow-xs text-zinc-900' : 'text-zinc-500 hover:text-zinc-700'}`}>USB (Kabel/Dongle)</button>
                <button type="button" onClick={() => { setScannerType('bluetooth'); disconnectScanner(); }} className={`flex-1 py-2 rounded-lg transition ${scannerType === 'bluetooth' ? 'bg-white shadow-xs text-zinc-900' : 'text-zinc-500 hover:text-zinc-700'}`}>Bluetooth</button>
              </div>
            </div>

            {scannerType === 'camera' && (
              <div className="bg-emerald-50/50 border border-emerald-100 text-emerald-800 rounded-xl p-3.5 text-xs font-semibold leading-relaxed">
                Kamera POS-Smile siap digunakan secara langsung melalui menu checkout/search tanpa pengaturan tambahan.
              </div>
            )}

            {scannerType === 'usb' && (
              <div className="bg-white border border-zinc-150 rounded-xl p-3.5 shadow-2xs space-y-2">
                <p className="text-xs font-bold text-zinc-800">USB HID Emulation Mode</p>
                <p className="text-[10px] text-zinc-400 font-medium leading-relaxed">
                  Barcode scanner USB Anda bertindak sebagai keyboard input emulator. Input dari scanner akan otomatis tertangkap saat kursor aktif di kolom pencarian produk.
                </p>
              </div>
            )}

            {scannerType === 'bluetooth' && (
              scannerConnected ? (
                <div className="bg-white border border-zinc-150 rounded-xl p-3.5 flex items-center justify-between shadow-2xs">
                  <div className="min-w-0 flex-1">
                    <p className="text-xs font-bold text-zinc-800 truncate">{connectedScannerName}</p>
                    <p className="text-[10px] text-zinc-400 font-medium">Koneksi: Bluetooth BLE</p>
                  </div>
                  <button type="button" onClick={disconnectScanner} className="px-2.5 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-[10px] font-bold transition">
                    Putuskan
                  </button>
                </div>
              ) : (
                <div className="space-y-3">
                  <button type="button" onClick={startScanScanners} disabled={scanningScanners || connecting} className="w-full py-2.5 bg-sky-600 hover:bg-sky-700 disabled:bg-zinc-300 text-white rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                    {scanningScanners ? <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <Icon name="search" size={14} />}
                    {scanningScanners ? 'Mencari Scanner Bluetooth...' : 'Cari Perangkat Scanner'}
                  </button>
                  {discoveredScanners.length > 0 && (
                    <div className="border border-zinc-200 rounded-xl bg-white divide-y divide-zinc-100 overflow-hidden shadow-2xs">
                      {discoveredScanners.map(s => (
                        <div key={s.id} className="p-3 flex items-center justify-between hover:bg-zinc-50/50 transition">
                          <span className="text-xs font-semibold text-zinc-700">{s.name}</span>
                          <button type="button" onClick={() => connectScanner(s.name)} disabled={connecting} className="px-3 py-1 bg-sky-50 text-sky-600 hover:bg-sky-100 rounded-lg text-[10px] font-bold transition">
                            Hubungkan
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )
            )}
          </div>
        </div>
      );
    }

    // 1b. OWNER DASHBOARD
    function POSPage() {
      const app = useContext(AppContext);
      const { selectedMember, setSelectedMember, discount, setDiscount, roundingMode, setRoundingMode } = app;
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('All');
      const [visibleCount, setVisibleCount] = useState(32);

      useEffect(() => {
        setVisibleCount(32);
      }, [search, category]);

      const [showDiscountModal, setShowDiscountModal] = useState(false);
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [payMethod, setPayMethod] = useState('cash'); // cash or qris
      const [paymentAmount, setPaymentAmount] = useState('');
      const [processing, setProcessing] = useState(false);
      const [mobileView, setMobileView] = useState(() => window.innerWidth < 768 ? 'cart' : 'products'); // 'products' or 'cart' (untuk layar kecil)
      const [qrisZoom, setQrisZoom] = useState(false);

      // New state variables
      const [showPOSScanner, setShowPOSScanner] = useState(false);
      const [showOpenPriceModal, setShowOpenPriceModal] = useState(false);
      const [selectedOpenPriceProduct, setSelectedOpenPriceProduct] = useState(null);
      const [manualPriceInput, setManualPriceInput] = useState('');
      const [memberSearchQuery, setMemberSearchQuery] = useState('');
      const [isSplitPayment, setIsSplitPayment] = useState(false);
      const [splitCashAmount, setSplitCashAmount] = useState('');
      const [splitQrisAmount, setSplitQrisAmount] = useState('');
      const [orderNotes, setOrderNotes] = useState('');
      const [qrisMode, setQrisMode] = useState('shop'); // 'shop', 'dynamic', 'saved'
      const [selectedSavedScanId, setSelectedSavedScanId] = useState('');
      const [debtNotes, setDebtNotes] = useState('');
      const [showHardwareModal, setShowHardwareModal] = useState(false);

      // CRM Member states & functions
      const [showMemberModal, setShowMemberModal] = useState(null); // null, { mode: 'add' }, { mode: 'edit', member }
      const [memberInputName, setMemberInputName] = useState('');
      const [memberInputPhone, setMemberInputPhone] = useState('');
      const [memberInputDiscount, setMemberInputDiscount] = useState('0');

      useEffect(() => {
        if (showMemberModal) {
          if (showMemberModal.mode === 'edit' && showMemberModal.member) {
            setMemberInputName(showMemberModal.member.name || '');
            setMemberInputPhone(showMemberModal.member.phone || '');
            setMemberInputDiscount(String(showMemberModal.member.discount || '0'));
          } else {
            setMemberInputName('');
            setMemberInputPhone('');
            setMemberInputDiscount('0');
          }
        }
      }, [showMemberModal]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'F2') {
            e.preventDefault();
            const searchInput = document.querySelector('input[placeholder*="Cari menu"]');
            if (searchInput) searchInput.focus();
          } else if (e.key === 'F4') {
            e.preventDefault();
            setShowDiscountModal(true);
          } else if (e.key === 'F7') {
            e.preventDefault();
            if (app.cart.length > 0) {
              setShowPaymentModal(true);
            } else {
              app.addToast('Keranjang belanja kosong', 'info');
            }
          } else if (e.key === 'F9') {
            e.preventDefault();
            const memberInput = document.querySelector('input[placeholder*="Cari pelanggan"]');
            if (memberInput) memberInput.focus();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [app.cart]);

      const handleSaveMember = (e) => {
        e.preventDefault();
        if (!memberInputName.trim()) {
          app.addToast('Nama pelanggan wajib diisi', 'error');
          return;
        }
        
        const discVal = parseFloat(memberInputDiscount) || 0;
        if (discVal < 0 || discVal > 100) {
          app.addToast('Diskon harus berkisar antara 0 - 100%', 'error');
          return;
        }

        const db = getDB();
        
        if (showMemberModal.mode === 'add') {
          const phoneExists = db.members.some(m => m.phone === memberInputPhone.trim() && memberInputPhone.trim() !== '');
          if (phoneExists) {
            app.addToast('Nomor telepon sudah terdaftar', 'error');
            return;
          }

          const newMember = {
            id: 'm_' + Date.now(),
            name: memberInputName.trim(),
            phone: memberInputPhone.trim(),
            points: 0,
            discount: discVal,
            createdAt: new Date().toISOString()
          };
          db.members.push(newMember);
          saveDB(db);
          app.refreshDB();
          setSelectedMember(newMember); // Auto select the newly added member
          app.addToast(`Pelanggan ${newMember.name} berhasil ditambahkan!`, 'success');
        } else {
          const memberId = showMemberModal.member.id;
          const idx = db.members.findIndex(m => m.id === memberId);
          if (idx !== -1) {
            db.members[idx].name = memberInputName.trim();
            db.members[idx].phone = memberInputPhone.trim();
            db.members[idx].discount = discVal;
            saveDB(db);
            app.refreshDB();
            
            const updated = db.members[idx];
            setSelectedMember(updated); // Update selected member state
            app.addToast(`Data pelanggan ${updated.name} berhasil diperbarui!`, 'success');
          }
        }
        setShowMemberModal(null);
      };

      const handleDeleteMember = (memberId) => {
        if (confirm('Apakah Anda yakin ingin menghapus pelanggan ini dari CRM?')) {
          const db = getDB();
          const idx = db.members.findIndex(m => m.id === memberId);
          if (idx !== -1) {
            const memberName = db.members[idx].name;
            db.members.splice(idx, 1);
            saveDB(db);
            app.refreshDB();
            setSelectedMember(null);
            app.addToast(`Pelanggan ${memberName} berhasil dihapus.`, 'info');
          }
        }
      };

      const db = getDB();
      const members = useMemo(() => db.members || [], [db.members]);
      const filteredMembers = useMemo(() => {
        const q = memberSearchQuery.trim().toLowerCase();
        if (!q) return members;
        return members.filter(m => `${m.name || ''} ${m.phone || ''}`.toLowerCase().includes(q));
      }, [members, memberSearchQuery]);

      // Memoize active sorted products using string comparison for date values to prevent Date allocation overhead
      const activeSortedProducts = useMemo(() => {
        return (db.products || [])
          .filter(p => p.active !== false)
          .sort((a, b) => {
            const dateA = a.updatedAt || '';
            const dateB = b.updatedAt || '';
            return dateB.localeCompare(dateA);
          });
      }, [db.products]);

      // Load categories dynamically from db
      const categories = useMemo(() => ['All', ...(db.categories || [])], [db.categories]);

      // Filter products dynamically based on selected category and text search query
      const products = useMemo(() => {
        let list = activeSortedProducts;
        if (category !== 'All') {
          list = list.filter(p => p.category === category);
        }
        if (search) {
          const q = search.toLowerCase();
          list = list.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
        }
        return list;
      }, [activeSortedProducts, category, search]);

      // GS1 Barcode Weight Parser helper
      const parseGS1Barcode = (barcode, prodList) => {
        if (!barcode || barcode.length < 12 || !barcode.startsWith('21')) {
          return null;
        }
        // Try 5-digit SKU (digits 2-7)
        let skuPart = barcode.slice(2, 7); // e.g. "00055"
        let weightPart = barcode.slice(7, 12); // e.g. "01250"
        let weightKg = parseFloat(weightPart) / 1000;
        
        let product = prodList.find(p => p.sku.toLowerCase().includes(skuPart.toLowerCase()) || skuPart.toLowerCase().includes(p.sku.toLowerCase()));
        if (!product) {
          // Try 4-digit SKU (digits 2-6)
          skuPart = barcode.slice(2, 6); // e.g. "0055"
          weightPart = barcode.slice(6, 11); // e.g. "01250"
          weightKg = parseFloat(weightPart) / 1000;
          product = prodList.find(p => p.sku.toLowerCase().includes(skuPart.toLowerCase()) || skuPart.toLowerCase().includes(p.sku.toLowerCase()));
        }

        if (product) {
          return { product, weight: weightKg };
        }
        return null;
      };

      const getEffectivePrice = (item) => {
        if (item.wholesaleMinQty > 0 && item.wholesalePrice > 0 && item.qty >= item.wholesaleMinQty) {
          return item.wholesalePrice;
        }
        return item.price;
      };

      const cartDetails = useMemo(() => {
        let baseSubtotal = 0;
        let taxTotal = 0;
        app.cart.forEach(item => {
          const effPrice = getEffectivePrice(item);
          if (item.taxIncluded) {
            const base = (effPrice / 1.1) * item.qty;
            const tax = (effPrice * 0.1 / 1.1) * item.qty;
            baseSubtotal += base;
            taxTotal += tax;
          } else {
            const base = effPrice * item.qty;
            const tax = (effPrice * 0.1) * item.qty;
            baseSubtotal += base;
            taxTotal += tax;
          }
        });

        // Member discount
        let memberDiscountAmount = 0;
        if (selectedMember && selectedMember.discount > 0) {
          memberDiscountAmount = (baseSubtotal + taxTotal) * (selectedMember.discount / 100);
        }

        const totalBeforeDiscount = baseSubtotal + taxTotal;
        const totalDiscount = discount + memberDiscountAmount;
        let finalTotal = Math.max(0, totalBeforeDiscount - totalDiscount);

        // Rounding
        let roundingDiff = 0;
        if (payMethod === 'cash' && roundingMode !== 'off') {
          const roundVal = parseInt(roundingMode);
          const roundedTotal = Math.round(finalTotal / roundVal) * roundVal;
          roundingDiff = roundedTotal - finalTotal;
          finalTotal = roundedTotal;
        }

        return {
          subtotal: baseSubtotal,
          tax: taxTotal,
          memberDiscount: memberDiscountAmount,
          discount: totalDiscount,
          total: finalTotal,
          rounding: roundingDiff
        };
      }, [app.cart, discount, selectedMember, payMethod, roundingMode]);

      const subtotal = cartDetails.subtotal;
      const tax = cartDetails.tax;
      const total = cartDetails.total;

      // Fitur Quick Actions Scanner (Live Camera)
      const handleScan = () => {
        setShowPOSScanner(true);
      };

      const handleScanSuccess = (code) => {
        app.addToast(`Scan Berhasil: ${code}`, 'success');
        setShowPOSScanner(false);
        const scanId = app.saveScanData(code, 'barcode');
        
        if (showPaymentModal) {
          setQrisMode('saved');
          setSelectedSavedScanId(scanId);
          return;
        }

        const dbProducts = getDB().products.filter(p => p.active !== false);
        
        // 1. Check GS1 barcode
        const gs1 = parseGS1Barcode(code, dbProducts);
        if (gs1) {
          if (gs1.product.openPrice) {
            setSelectedOpenPriceProduct(gs1.product);
            setManualPriceInput('');
            setShowOpenPriceModal(true);
          } else {
            app.addToCartWithQty(gs1.product, gs1.weight);
            app.addToast(`Ditambahkan: ${gs1.product.name} (${gs1.weight} kg)`, 'success');
          }
          return;
        }

        // 2. Check exact SKU match
        const matched = dbProducts.find(p => p.sku.toLowerCase() === code.trim().toLowerCase());
        if (matched) {
          if (matched.openPrice) {
            setSelectedOpenPriceProduct(matched);
            setManualPriceInput('');
            setShowOpenPriceModal(true);
          } else {
            app.addToCart(matched);
            app.addToast(`Ditambahkan: ${matched.name}`, 'success');
          }
        } else {
          setSearch(code);
        }
      };

      const handlePhotoCapture = (photoData) => {
        const scanId = app.saveScanData(photoData, 'photo');
        app.addToast('Foto berhasil ditangkap & disimpan ke log scans', 'success');
        setShowPOSScanner(false);
        if (showPaymentModal) {
          setQrisMode('saved');
          setSelectedSavedScanId(scanId);
        }
      };

      const handleCheckout = async (e) => {
        e?.preventDefault();
        
        let finalPayMethod = payMethod;
        let amtPaid = parseFloat(paymentAmount) || 0;
        let qrisPaid = total;
        let cashChange = 0;
        let splitDetails = null;

        if (isSplitPayment) {
          finalPayMethod = 'split';
          const cashAmt = parseFloat(splitCashAmount) || 0;
          const qrisAmt = parseFloat(splitQrisAmount) || 0;
          if (cashAmt + qrisAmt < total) {
            app.addToast('Total split payment kurang dari jumlah tagihan', 'error');
            return;
          }
          amtPaid = cashAmt + qrisAmt;
          qrisPaid = qrisAmt;
          cashChange = Math.max(0, (cashAmt + qrisAmt) - total);
          splitDetails = { cash: cashAmt, qris: qrisAmt };
        } else {
          if (payMethod === 'cash') {
            if (amtPaid < total) {
              app.addToast('Uang pembayaran kurang', 'error');
              return;
            }
            cashChange = amtPaid - total;
          } else if (payMethod === 'debt') {
            if (!debtNotes.trim()) {
              app.addToast('Harap isi keterangan hutang (Nama & Kontak)', 'error');
              return;
            }
            amtPaid = 0;
            cashChange = 0;
          } else {
            amtPaid = total;
            cashChange = 0;
          }
        }

        setProcessing(true);
        try {
          await new Promise(r => setTimeout(r, 800)); // Simulasi
          
          const txId = 'TX' + Date.now();
          const tx = {
            id: txId,
            date: new Date().toISOString(),
            cashier: app.user.name,
            cashierId: app.user.id,
            items: app.cart.map(item => ({
              ...item,
              effectivePrice: getEffectivePrice(item)
            })),
            subtotal: cartDetails.subtotal,
            tax: cartDetails.tax,
            memberDiscount: cartDetails.memberDiscount,
            discount: cartDetails.discount,
            rounding: cartDetails.rounding,
            total: total,
            method: finalPayMethod,
            payment: amtPaid,
            change: cashChange,
            splitDetails: splitDetails,
            notes: orderNotes,
            debtNotes: finalPayMethod === 'debt' ? debtNotes : null,
            memberId: selectedMember ? selectedMember.id : null,
            memberName: selectedMember ? selectedMember.name : null,
            kitchenStatus: app.cart.some(item => ['Makanan', 'Minuman'].includes(item.category)) ? 'cooking' : 'none',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };

          // Strict check inside simulated backend layer for prices and stocks
          tx.items.forEach(item => {
            if (item.effectivePrice < 0) throw new Error("Harga tidak boleh minus");
            if (item.qty <= 0) throw new Error("Jumlah item tidak boleh nol atau negatif");
          });

          let rpcSuccess = false;
          if (sbClient && app.isOnline) {
            try {
              const { data: newCloudDb, error: rpcError } = await sbClient.rpc('process_checkout', { p_transaction: tx });
              if (!rpcError && newCloudDb) {
                __db_cache = newCloudDb;
                localStorage.setItem(DB_KEY, JSON.stringify(newCloudDb));
                rpcSuccess = true;
                console.log('[Supabase RPC] Checkout sukses atomik di server');
              } else {
                console.warn('[Supabase RPC] Gagal, fallback ke lokal:', rpcError);
              }
            } catch (rpcExc) {
              console.warn('[Supabase RPC] Exception, fallback ke lokal:', rpcExc);
            }
          }

          if (!rpcSuccess) {
            const newDb = getDB();
            newDb.transactions.unshift(tx);
            
            // Deduct stock and validate locally
            app.cart.forEach(item => {
              const p = newDb.products.find(x => x.id === item.id);
              if (p) {
                const newStock = parseFloat((p.stock - item.qty).toFixed(3));
                if (newStock < 0) {
                  throw new Error(`Stok produk "${p.name}" tidak mencukupi untuk transaksi ini.`);
                }
                p.stock = newStock;
                p.updatedAt = new Date().toISOString();
              }
            });

            // Award Member points
            if (selectedMember) {
              const pointsEarned = Math.floor(total / 10000);
              const memberIdx = newDb.members.findIndex(m => m.id === selectedMember.id);
              if (memberIdx !== -1) {
                newDb.members[memberIdx].points += pointsEarned;
              }
            }

            saveDB(newDb);
          }

          // Catat audit log untuk transaksi dan manual discount di client
          logAuditAction('Penjualan', `Melakukan transaksi penjualan dengan ID ${tx.id} senilai Rp ${tx.total.toLocaleString('id-ID')}`, app.user);
          logUserActivity('data_mutasi', `Melakukan checkout transaksi ${tx.id} senilai Rp ${tx.total.toLocaleString('id-ID')}`);
          if (tx.discount > 0) {
            logAuditAction('Diskon Manual', `Memberikan diskon senilai Rp ${tx.discount.toLocaleString('id-ID')} pada transaksi ${tx.id}`, app.user);
            logUserActivity('data_mutasi', `Memberikan diskon manual Rp ${tx.discount.toLocaleString('id-ID')} pada transaksi ${tx.id}`);
          }

          app.setLastTransaction(tx);
          app.setShowSuccessModal(true);

          app.refreshDB();
          app.clearCart();
          setDiscount(0);
          setOrderNotes('');
          setDebtNotes('');
          setSelectedMember(null);
          setIsSplitPayment(false);
          setSplitCashAmount('');
          setSplitQrisAmount('');
          setShowPaymentModal(false);
          setProcessing(false);
          if(window.innerWidth < 768) setMobileView('products');
          
          app.addToast(`Pembayaran sukses. Kembalian: Rp ${cashChange.toLocaleString('id-ID')}`, 'success');
        } catch (error) {
          setProcessing(false);
          console.error("Checkout error:", error);
          app.addToast(`Gagal menyimpan transaksi: ${error.message}. Tenang, data Anda aman di memori lokal dan akan dicoba kirim ulang otomatis.`, 'error');
        }
      };

      return (
        <div className="h-full flex flex-col md:flex-row gap-6 relative">
          {/* BAGIAN KIRI: PRODUK (Disembunyikan di mobile jika melihat keranjang) */}
          <div className={`flex-1 flex-col overflow-hidden ${mobileView === 'cart' ? 'hidden' : 'flex'}`}>
            <div className="flex flex-col sm:flex-row gap-3 mb-4">
              <div className="relative flex-1">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                  <Icon name="search" size={18} className="text-zinc-400" />
                </div>
                <input 
                  type="text" 
                  placeholder="Cari menu atau kode barang (F2)..." 
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === 'Enter') {
                      e.preventDefault();
                      const query = search.trim();
                      if (!query) return;
                      const dbProducts = getDB().products.filter(p => p.active !== false);
                      
                      // 1. GS1 Barcode
                      const gs1 = parseGS1Barcode(query, dbProducts);
                      if (gs1) {
                        if (gs1.product.openPrice) {
                          setSelectedOpenPriceProduct(gs1.product);
                          setManualPriceInput('');
                          setShowOpenPriceModal(true);
                        } else {
                          app.addToCartWithQty(gs1.product, gs1.weight);
                          app.addToast(`Ditambahkan: ${gs1.product.name} (${gs1.weight} kg)`, 'success');
                        }
                        setSearch('');
                        return;
                      }

                      // 2. Exact match
                      const matched = dbProducts.find(p => p.sku.toLowerCase() === query.toLowerCase() || p.name.toLowerCase() === query.toLowerCase());
                      if (matched) {
                        if (matched.openPrice) {
                          setSelectedOpenPriceProduct(matched);
                          setManualPriceInput('');
                          setShowOpenPriceModal(true);
                        } else {
                          app.addToCart(matched);
                          app.addToast(`Ditambahkan: ${matched.name}`, 'success');
                        }
                        setSearch('');
                      } else {
                        app.addToast('Produk tidak ditemukan', 'error');
                      }
                    }
                  }}
                  className="w-full pl-10 pr-20 py-3 bg-white border border-zinc-200 rounded-xl focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none shadow-sm"
                />
                <button onClick={() => setShowHardwareModal(true)} className="absolute inset-y-0 right-10 flex items-center p-2 text-zinc-400 hover:text-sky-600 border-r border-zinc-150 pr-3.5" title="Pengaturan Printer & Scanner Hardware">
                  <Icon name="settings-2" size={18} />
                </button>
                <button onClick={handleScan} className="absolute inset-y-0 right-2 flex items-center p-2 text-zinc-400 hover:text-sky-600 pl-3.5" title="Buka Kamera Scanner">
                  <Icon name="scan-line" size={20} />
                </button>
              </div>
              <div className="overflow-x-auto hide-scrollbar flex gap-1.5 pb-1">
                {categories.map(c => (
                  <button 
                    key={c}
                    onClick={() => setCategory(c)}
                    className={`whitespace-nowrap px-3 py-1.5 text-sm rounded-lg font-medium transition ${category === c ? 'bg-sky-600 text-white shadow-md' : 'bg-white text-zinc-600 border border-zinc-200 hover:bg-zinc-50'}`}
                  >
                    {c}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex-1 overflow-y-auto custom-scroll pb-24 md:pb-4">
              <div className="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4">
                {products.slice(0, visibleCount).map(p => (
                  <div 
                    key={p.id}
                    onClick={() => {
                      if (p.stock <= 0) return;
                      if (p.openPrice) {
                        setSelectedOpenPriceProduct(p);
                        setManualPriceInput('');
                        setShowOpenPriceModal(true);
                      } else {
                        app.addToCart(p);
                      }
                    }}
                    className={`bg-white rounded-2xl border border-zinc-200 overflow-hidden cursor-pointer transition ${p.stock === 0 ? 'grayscale opacity-50' : 'hover:shadow-lg hover:border-sky-400 active:scale-[0.98]'}`}
                  >
                    <div className="aspect-square bg-zinc-100 flex items-center justify-center relative">
                      {p.image ? (
                        <img src={p.image} className="w-full h-full object-cover" alt={p.name} />
                      ) : (
                        <span className="text-4xl font-bold text-zinc-300">{p.name.substring(0,2).toUpperCase()}</span>
                      )}
                      {p.stock === 0 && (
                        <div className="absolute inset-0 bg-black/40 flex items-center justify-center">
                          <span className="bg-rose-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-lg">HABIS</span>
                        </div>
                      )}
                      {p.stock > 0 && p.stock <= 5 && (
                        <div className="absolute top-2 right-2 bg-orange-500 text-white text-[10px] font-bold px-2 py-1 rounded-md">
                          Sisa {p.stock}
                        </div>
                      )}
                    </div>
                    <div className="p-3 md:p-4 text-left">
                      <p className="text-xs text-zinc-500 font-medium mb-1">{p.category}</p>
                      <h4 className="font-semibold text-zinc-850 text-sm md:text-base leading-tight mb-1.5 line-clamp-2">{p.name}</h4>
                      <div className="flex items-center justify-between flex-wrap gap-1">
                        <div className="font-bold text-sky-600">
                           {p.openPrice ? 'Harga Dinamis' : `Rp ${p.price.toLocaleString('id-ID')}`}
                        </div>
                        {p.wholesalePrice > 0 && (
                          <span className="bg-emerald-50 text-emerald-700 text-[9px] font-bold px-1.5 py-0.5 rounded-md border border-emerald-250" title={`Beli min ${p.wholesaleMinQty} dapat harga Rp ${p.wholesalePrice.toLocaleString('id-ID')}`}>
                            Grosir
                          </span>
                        )}
                      </div>
                      <div className="text-[10px] text-zinc-400 mt-2 flex items-center gap-1 font-medium bg-zinc-50 py-1 px-2 rounded-md w-fit">
                        <Icon name="clock" size={10} />
                        <span>Update: {formatTimeAgo(p.updatedAt)}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {products.length > visibleCount && (
                <div className="flex justify-center mt-6 mb-4">
                  <button 
                    onClick={() => setVisibleCount(prev => prev + 32)}
                    className="px-6 py-2.5 bg-zinc-50 border border-zinc-200 text-zinc-700 font-extrabold text-xs rounded-xl hover:bg-zinc-100 hover:border-zinc-300 transition active:scale-[0.98] shadow-sm flex items-center gap-1.5"
                  >
                    <Icon name="chevron-down" size={14} />
                    Tampilkan Lebih Banyak ({products.length - visibleCount} produk lainnya)
                  </button>
                </div>
              )}
            </div>

          </div>

          {/* Floating Cart Button (Mobile Only) */}
          {mobileView === 'products' && (
            <div className="md:hidden fixed bottom-20 left-4 right-4 z-30 animate-[slideUp_0.3s_ease-out]">
              <button 
                onClick={() => setMobileView('cart')} 
                className="w-full bg-zinc-900 text-white rounded-2xl shadow-xl p-4 flex justify-between items-center"
              >
                <div className="flex items-center gap-3">
                  <div className="relative">
                    <Icon name="shopping-bag" size={24} />
                    <span className="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">{app.cart.reduce((a,b)=>a+b.qty,0)}</span>
                  </div>
                  <span className="font-semibold text-sm">{app.cart.length > 0 ? 'Lihat Pesanan' : 'Pesanan / Pelanggan'}</span>
