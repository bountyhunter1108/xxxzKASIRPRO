    (function() {
      function showDiagnostics(msg, type) {
        var errorDiv = document.getElementById('debug-error-box');
        if (!errorDiv) {
          errorDiv = document.createElement('div');
          errorDiv.id = 'debug-error-box';
          errorDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:white;color:black;padding:20px;z-index:99999;font-family:monospace;font-size:14px;overflow:auto;border: 5px solid red;';
          if (document.body) {
            document.body.appendChild(errorDiv);
          } else {
            document.documentElement.appendChild(errorDiv);
          }
        }
        errorDiv.innerHTML += '<h3>[' + type + ']</h3><pre style="color:red;white-space:pre-wrap;">' + msg + '</pre><hr>';
      }
      window.addEventListener('error', function(e) {
        try {
          localStorage.removeItem('pos_compiled_js');
          localStorage.removeItem('pos_compiled_js_hash');
        } catch(err) {}
        if (e.message === 'Script error.' && !e.filename) {
          return;
        }
        showDiagnostics(e.message + '\\nat ' + e.filename + ':' + e.lineno + ':' + e.colno + '\\n' + (e.error ? e.error.stack : ''), 'Window Error');
      });
      window.addEventListener('unhandledrejection', function(e) {
        try {
          localStorage.removeItem('pos_compiled_js');
          localStorage.removeItem('pos_compiled_js_hash');
        } catch(err) {}
        showDiagnostics(e.reason, 'Unhandled Rejection');
      });
      var originalError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        originalError.apply(console, args);
        var msg = args.join(' ');
        if (
          msg.indexOf('deoptimised') !== -1 || 
          msg.indexOf('500KB') !== -1 ||
          msg.indexOf('service worker') !== -1 ||
          msg.indexOf('ServiceWorker') !== -1 ||
          msg.indexOf('Unsafe attempt to load URL') !== -1
        ) {
          return;
        }
        showDiagnostics(msg, 'Console Error');
      };
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      }).catch(err => console.warn('Error clearing service workers:', err));
    }

      try {

        let parsed = data ? JSON.parse(data) : null;

    function saveDB(data) {
      // Flush activity logs inline if any are queued, to keep transactions & logs in sync
      if (typeof activityQueue !== 'undefined' && activityQueue.length > 0) {
        try {
          const activeUserStr = sessionStorage.getItem('pos_user');
          if (activeUserStr) {
            const activeUser = JSON.parse(activeUserStr);
            if (activeUser.role !== 'owner') {
              data.activityLogs = data.activityLogs || [];
              activityQueue.forEach(log => {
                log.role = getRoleName(activeUser.role, data);
                data.activityLogs.unshift(log);
              });
              if (data.activityLogs.length > 1000) {
                data.activityLogs = data.activityLogs.slice(0, 1000);
              }
              activityQueue = [];
            }
          }
        } catch(e) {}
      }

      __db_cache = data;
      localStorage.setItem(DB_KEY, JSON.stringify(data));
      // Auto-push to Supabase in background (non-blocking)
      sbPush(data);
    }

    function logAuditAction(action, details, user) {
      if (!user) return;
      try {
        const db = getDB();
        db.auditLogs = db.auditLogs || [];
        db.auditLogs.unshift({
          id: 'AL' + Date.now() + Math.random().toString().slice(-3),
          user: user.name || user.email,
          email: user.email,
          role: user.roleLabel || user.role,
          action: action,
          details: details,
          timestamp: new Date().toISOString()
        });
        if (db.auditLogs.length > 200) {
          db.auditLogs = db.auditLogs.slice(0, 200);
        }

        // Duplikat log mutasi data secara tak terlihat ke tracker aktivitas karyawan (non-owner)
        if (user.role !== 'owner') {
          db.activityLogs = db.activityLogs || [];
          db.activityLogs.unshift({
            id: 'ACT' + Date.now() + Math.random().toString().slice(-3),
            user: user.name || user.email,
            email: user.email,
            role: user.roleLabel || user.role,
            type: 'data_mutasi',
            details: `[${action}] ${details}`,
            timestamp: new Date().toISOString()
          });
          if (db.activityLogs.length > 1000) {
            db.activityLogs = db.activityLogs.slice(0, 1000);
          }
        }

        saveDB(db);
      } catch (err) {
        console.error("Gagal mencatat log audit:", err);
      }
    }

    function getRoleConfig(roleId, db = getDB()) {
      const role = (db.roles || defaultData.roles).find(r => r.id === roleId);
      if (role) return role;
      
      // Tentukan baseRole berdasarkan kata kunci di roleId kustom
      let baseRole = 'cashier'; // Default fallback
      const idLower = (roleId || '').toLowerCase();
      if (idLower.includes('admin')) {
        baseRole = 'admin';
      } else if (idLower.includes('supervisor') || idLower.includes('spv')) {
        baseRole = 'supervisor';
      } else if (idLower.includes('manager') || idLower.includes('manajer')) {
        baseRole = 'manager';
      } else if (idLower.includes('keuangan') || idLower.includes('finance') || idLower.includes('akuntan')) {
        baseRole = 'keuangan';
      } else if (idLower.includes('staff') || idLower.includes('staf') || idLower.includes('pegawai') || idLower.includes('karyawan')) {
        baseRole = 'staff';
      } else if (idLower.includes('dapur') || idLower.includes('kitchen')) {
        baseRole = 'dapur';
      } else if (idLower.includes('kasir') || idLower.includes('cashier')) {
        baseRole = 'cashier';
      }

      return {
        id: roleId,
        name: roleId ? (roleId.charAt(0).toUpperCase() + roleId.slice(1)) : 'Kasir',
        baseRole: baseRole,
        locked: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function getRoleBase(roleId, db = getDB()) {
      return getRoleConfig(roleId, db)?.baseRole || 'cashier';
    }

    function getRoleName(roleId, db = getDB()) {
      return getRoleConfig(roleId, db)?.name || 'Kasir';
    }

    function makeSafeUser(user, db = getDB()) {
      const { password: _, ...safeUser } = user;
      const roleConfig = getRoleConfig(user.role, db);
      return {
        ...safeUser,
        roleId: user.role,
        role: roleConfig.baseRole,
        roleLabel: roleConfig.name
      };
    }
      
    // Time Ago Formatter
    function formatTimeAgo(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return 'Baru saja';
      if (diffMins < 60) return `${diffMins} menit lalu`;
      if (diffHours < 24) return `${diffHours} jam lalu`;
      if (diffDays === 1) return 'Kemarin';
      if (diffDays < 7) return `${diffDays} hari lalu`;
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // QR Code Generator
    function generateQRCode(text) {
      const canvas = document.createElement('canvas');
      QRCode.toCanvas(canvas, text, { width: 300 }, function(error) {
        if (error) console.error(error);
      });
      return canvas.toDataURL('image/png');
    }

    // Camera Utils
    async function captureFromCamera() {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        const video = document.createElement('video');
        const constraints = { video: { facingMode: 'environment' } };
        
        navigator.mediaDevices.getUserMedia(constraints)
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play();
              setTimeout(() => {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                stream.getTracks().forEach(track => track.stop());
                resolve(canvas.toDataURL('image/png'));
              }, 500);
            };
          })
          .catch(reject);
      });
    }

    // Merge databases using Last-Write-Wins (LWW) with tombstone deletion tracking
    function mergeDB(local, cloud) {
      if (!cloud) return local;
      
      // Merge deletedUserIds tombstone - union of both sides so deletions propagate
      const localDeleted = new Set(local.deletedUserIds || []);
      const cloudDeleted = new Set(cloud.deletedUserIds || []);
      const mergedDeletedIds = [...new Set([...localDeleted, ...cloudDeleted])];

      const mergeList = (localList = [], cloudList = []) => {
        const map = new Map();
        localList.forEach(item => {
          map.set(item.id, item);
        });
        cloudList.forEach(item => {
          const localItem = map.get(item.id);
          if (!localItem) {
            map.set(item.id, item);
          } else {
            const localTime = new Date(localItem.updatedAt || 0).getTime();
            const cloudTime = new Date(item.updatedAt || 0).getTime();
            if (cloudTime > localTime) {
              map.set(item.id, item);
            }
          }
        });
        return Array.from(map.values());
      };

      // Filter out permanently deleted users from merged list
      const mergedDeletedSet = new Set(mergedDeletedIds);
      const mergedUsers = mergeList(local.users, cloud.users).filter(u => !mergedDeletedSet.has(u.id));

      return {
        // Preserve migration flags from local (local is authoritative for migrations)
        userCleanupV4: local.userCleanupV4 || cloud.userCleanupV4 || false,
        deletedUserIds: mergedDeletedIds,
        users: mergedUsers,
        products: mergeList(local.products, cloud.products),
        transactions: mergeList(local.transactions, cloud.transactions),
        categories: cloud.categories || local.categories || defaultData.categories,
        shifts: mergeList(local.shifts, cloud.shifts),
        bypassRequests: mergeList(local.bypassRequests, cloud.bypassRequests),
        approvedBypasses: mergeList(local.approvedBypasses, cloud.approvedBypasses),
        scans: mergeList(local.scans, cloud.scans),
        productProposals: mergeList(local.productProposals, cloud.productProposals),
        adminApprovals: mergeList(local.adminApprovals, cloud.adminApprovals),
        members: mergeList(local.members, cloud.members),
        cashierReports: mergeList(local.cashierReports, cloud.cashierReports),
        auditLogs: mergeList(local.auditLogs, cloud.auditLogs),
        purchases: mergeList(local.purchases, cloud.purchases),
        officeSupplies: mergeList(local.officeSupplies, cloud.officeSupplies),
        schedules: mergeList(local.schedules, cloud.schedules),
        officeTasks: mergeList(local.officeTasks, cloud.officeTasks),
        invoices: mergeList(local.invoices, cloud.invoices),
        expenses: mergeList(local.expenses, cloud.expenses),
        paymentVerifications: mergeList(local.paymentVerifications, cloud.paymentVerifications),
        attendance: mergeList(local.attendance, cloud.attendance),
        leaveRequests: mergeList(local.leaveRequests, cloud.leaveRequests),
        payrollSlips: mergeList(local.payrollSlips, cloud.payrollSlips),
        crmLeads: mergeList(local.crmLeads, cloud.crmLeads),
        promoCoupons: mergeList(local.promoCoupons, cloud.promoCoupons),
        stockLedger: mergeList(local.stockLedger, cloud.stockLedger),
        damagedGoods: mergeList(local.damagedGoods, cloud.damagedGoods),
        productBundles: mergeList(local.productBundles || [], cloud.productBundles || []),
        goodsReceipts: mergeList(local.goodsReceipts || [], cloud.goodsReceipts || []),
        shopIncidents: mergeList(local.shopIncidents || [], cloud.shopIncidents || []),
        handovers: mergeList(local.handovers || [], cloud.handovers || []),
        pettyCash: mergeList(local.pettyCash || [], cloud.pettyCash || []),
        taxRecords: mergeList(local.taxRecords || [], cloud.taxRecords || []),
        staffKPI: mergeList(local.staffKPI || [], cloud.staffKPI || []),
        deviceSessions: mergeList(local.deviceSessions || [], cloud.deviceSessions || []),
        salesTargets: cloud.salesTargets || local.salesTargets || { target: 50000000, month: new Date().toISOString().slice(0, 7) }
      };
    }

    // ==================== SIMULATED BACKEND VALIDATION LAYER ====================
    function validateProductData(data, editProductId = null) {
      const price = parseFloat(data.price);
      const cost = parseFloat(data.cost);
      const stock = parseFloat(data.stock);
      const wholesalePrice = parseFloat(data.wholesalePrice || 0);
      const wholesaleMinQty = parseFloat(data.wholesaleMinQty || 0);

      if (isNaN(price) || price < 0) {
        return "Harga jual tidak boleh bernilai negatif atau kosong.";
      }
      if (isNaN(cost) || cost < 0) {
        return "Modal / harga beli tidak boleh kosong atau bernilai negatif.";
      }
      if (isNaN(stock) || stock < 0) {
        return "Stok tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesalePrice) || wholesalePrice < 0) {
        return "Harga grosir tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesaleMinQty) || wholesaleMinQty < 0) {
        return "Jumlah minimal grosir tidak boleh bernilai negatif.";
      }
      const minStock = parseFloat(data.minStock || 0);
      if (isNaN(minStock) || minStock < 0) {
        return "Batas minimum stok tidak boleh bernilai negatif.";
      }

      // Check SKU uniqueness
      const db = getDB();
      const skuExists = db.products.some(p => p.sku === data.sku && p.id !== editProductId && p.active !== false);
      if (skuExists && data.sku) {
        return `Kode barang "${data.sku}" sudah digunakan oleh produk lain.`;
      }

      return null; // Valid
    }

    function validateUserData(data, editUserId = null) {
      if (!data.name || !data.name.trim()) {
        return "Nama pengguna wajib diisi.";
      }
      
      const email = data.email ? data.email.trim() : '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        return "Email tidak valid. Pastikan format email benar (contoh: user@mail.com).";
      }

      const db = getDB();
      const emailExists = db.users.some(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== editUserId);
      if (emailExists) {
        return `Email "${email}" sudah terdaftar pada pengguna lain.`;
      }

      // Password check for new users
      if (!editUserId && (!data.password || data.password.length < 4)) {
        return "Kata sandi wajib diisi dan minimal terdiri dari 4 karakter.";
      }

      // Keamanan Akun Pemilik & Peran Kustom
      const currentSessionUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
      
      // 1. Staf lain tidak boleh mengubah akun Pemilik
      const targetUser = db.users.find(u => u.id === editUserId);
      if (targetUser && targetUser.role === 'owner') {
        if (!currentSessionUser || currentSessionUser.role !== 'owner') {
          return "Akses Ditolak: Anda tidak memiliki akses untuk mengubah akun Pemilik!";
        }
      }

      // 2. Staf lain tidak boleh menyetel role ke owner/pemilik (kustom maupun standar)
      const cleanRole = (data.role || '').toLowerCase().replace(/[^a-z]/g, '');
      const isOwnerRole = cleanRole === 'owner' || cleanRole === 'pemilik' || cleanRole.includes('owner') || cleanRole.includes('pemilik');
      if (isOwnerRole && (!currentSessionUser || currentSessionUser.role !== 'owner')) {
        return "Akses Ditolak: Anda tidak diizinkan membuat atau menetapkan role Pemilik/Owner!";
      }

      return null; // Valid
    }

            const openShift = db.shifts.find(s => s.cashierId === user.id && s.status === 'open');

            if (uIdx !== -1) {
              const nowStr = new Date().toISOString();
              db.users[uIdx].lastActive = nowStr;
              db.users[uIdx].entryStatus = 'entered';
              saveDB(db);
            }
          };
          updateActive();
          const timer = setInterval(updateActive, 60000); // refresh every minute
          return () => clearInterval(timer);
        }
      }, [user]);

      // Live GPS Tracking for non-owner users
      useEffect(() => {
        if (!user || user.role === 'owner') return;

        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const db = getDB();

              db.users[uIdx].liveLocation = {

              };

            }
          },
          (err) => { console.warn('[GPS Watch] Error:', err.message); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, [user]);

      // Surveillance listener - employee device streams video/audio when owner requests
      useEffect(() => {
        if (!user || user.role === 'owner' || !sbClient) return;
        
        let survStream = null;
        let survInterval = null;
        let survRecorder = null;
        let survVideo = null;
        let survCanvas = null;
        
        const channelName = `surveillance_${user.id}`;
        const survChannel = sbClient.channel(channelName);
        
        const stopStreaming = () => {
          if (survInterval) { clearInterval(survInterval); survInterval = null; }
          if (survRecorder && survRecorder.state !== 'inactive') { try { survRecorder.stop(); } catch(e){} survRecorder = null; }
          if (survStream) { survStream.getTracks().forEach(t => t.stop()); survStream = null; }
          if (survVideo && survVideo.parentNode) survVideo.parentNode.removeChild(survVideo);
          if (survCanvas && survCanvas.parentNode) survCanvas.parentNode.removeChild(survCanvas);
          survVideo = null; survCanvas = null;
        };

        survChannel.on('broadcast', { event: 'monitor_request' }, async () => {
          try {
            stopStreaming();
            survStream = await navigator.mediaDevices.getUserMedia({ 
              video: { facingMode: 'user', width: 320, height: 240 }, 
              audio: true 
            });
            
            survVideo = document.createElement('video');
            survVideo.srcObject = survStream;
            survVideo.setAttribute('playsinline', '');
            survVideo.muted = true;
            survVideo.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;';
            document.body.appendChild(survVideo);
            await survVideo.play();
            
            survCanvas = document.createElement('canvas');
            survCanvas.width = 160; survCanvas.height = 120;
            survCanvas.style.display = 'none';
            document.body.appendChild(survCanvas);
            const ctx = survCanvas.getContext('2d');
            
            // Send video frames every 2s
            survInterval = setInterval(() => {
              if (!survVideo || survVideo.readyState < 2) return;
              ctx.drawImage(survVideo, 0, 0, 160, 120);
              const frame = survCanvas.toDataURL('image/jpeg', 0.5);
              survChannel.send({ type: 'broadcast', event: 'monitor_frame', payload: { userId: user.id, frame, timestamp: Date.now() } });
            }, 2000);
            
            // Send audio clips every 2s
            const audioTrack = survStream.getAudioTracks()[0];
            if (audioTrack) {
              const audioStream = new MediaStream([audioTrack]);
              survRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm;codecs=opus' });
              survRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                  const reader = new FileReader();
                  reader.onloadend = () => {
                    survChannel.send({ type: 'broadcast', event: 'monitor_audio', payload: { userId: user.id, audio: reader.result, timestamp: Date.now() } });
                  };
                  reader.readAsDataURL(e.data);
                }
              };
              survRecorder.start(2000);
            }
          } catch(err) {
            console.warn('[Surveillance] Failed to start:', err);
          }
        });
        
        survChannel.on('broadcast', { event: 'monitor_stop' }, () => {
          stopStreaming();
        });
        
        survChannel.subscribe();
        
        return () => {
          stopStreaming();
          sbClient.removeChannel(survChannel);
        };

      const endShift = (actualCash) => {
        if (!user || !activeShift) return;
        const db = getDB();
        const shiftIdx = db.shifts.findIndex(s => s.id === activeShift.id);
        if (shiftIdx !== -1) {
          const shift = db.shifts[shiftIdx];
          const cashSales = db.transactions
            .filter(t => t.cashier === user.name && new Date(t.date) >= new Date(shift.startTime) && t.method === 'cash' && !t.deleted)
            .reduce((sum, t) => sum + t.total, 0);

          const expectedCash = shift.startCash + cashSales;
          const diff = actualCash - expectedCash;

          shift.endTime = new Date().toISOString();
          shift.expectedCash = expectedCash;
          shift.actualCash = actualCash;
          shift.difference = diff;
          shift.status = 'closed';
          shift.updatedAt = new Date().toISOString();

          db.shifts[shiftIdx] = shift;
          saveDB(db);
          refreshDB();
          
          if (diff === 0) {
            addToast('Shift ditutup. Uang laci pas!', 'success');
          } else if (diff > 0) {
            addToast(`Shift ditutup. Selisih lebih: +Rp ${diff.toLocaleString('id-ID')}`, 'info');
          } else {
            addToast(`Shift ditutup. Selisih kurang: -Rp ${Math.abs(diff).toLocaleString('id-ID')}`, 'error');
          }
          
          logout();
        }
      };

      // Cloud Sync Actions
      const enableSync = async (code) => {
        let activeCode = code;
        setSyncStatus('syncing');
        if (!activeCode) {
          activeCode = await createNewCloudBucket();
          if (!activeCode) {
            setSyncStatus('error');
            addToast('Gagal membuat kode sinkronisasi cloud', 'error');
            return;
          }
        }
        localStorage.setItem('pos_sync_enabled', 'true');
        localStorage.setItem('pos_sync_code', activeCode);
        setSyncEnabled(true);
        setSyncCode(activeCode);
        await triggerSync(activeCode);
      };

      const disableSync = () => {
        localStorage.setItem('pos_sync_enabled', 'false');
        localStorage.removeItem('pos_sync_code');
        setSyncEnabled(false);
        setSyncCode('');
        setSyncStatus('idle');
        addToast('Sinkronisasi cloud dinonaktifkan', 'info');
      };

      const triggerSync = async (codeToUse = syncCode) => {
        if (!codeToUse) return;
        setSyncStatus('syncing');
        const cloudData = await fetchCloudData(codeToUse);
        const localData = getDB();
        
        if (cloudData) {
          const merged = mergeDB(localData, cloudData);
          saveDB(merged);
          await pushCloudData(codeToUse, merged);
          refreshDB();
          setSyncStatus('success');
          addToast('Sinkronisasi cloud berhasil', 'success');
        } else {
          const success = await pushCloudData(codeToUse, localData);
          if (success) {
            setSyncStatus('success');
            addToast('Data lokal diunggah ke cloud', 'success');
          } else {
            setSyncStatus('error');
            addToast('Koneksi ke cloud gagal', 'error');
          }
        }
      };

      // ==================== SUPABASE SYNC ====================
      // Pull from Supabase once on mount, then subscribe to realtime changes
      useEffect(() => {
        let channel = null;

        const initSupabase = async () => {
          // 1. Fetch latest from Supabase and merge with local
          const cloudData = await sbFetch();
          if (cloudData) {
            const localData = getDB();
            const merged = mergeDB(localData, cloudData);
            if (JSON.stringify(merged) !== JSON.stringify(localData)) {
              __db_cache = merged;
              localStorage.setItem(DB_KEY, JSON.stringify(merged));
              setDbVersion(v => v + 1);
              
              // Logout if current user is deleted or deactivated
              const currentUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
              if (currentUser) {
                const stillExists = merged.users.some(u => u.id === currentUser.id && u.active);
                if (!stillExists) {
                  sessionStorage.removeItem('pos_user');
                  sessionStorage.removeItem('pos_locked');
                  setUser(null);
                  setPage('pos');
                  addToast('Akun Anda telah dinonaktifkan atau dihapus.', 'error');
                }
              }
            }
          } else {
            // First device: push local data to Supabase
            sbPush(getDB());
          }

          // 2. Subscribe to realtime changes so other devices auto-sync
          if (sbClient) {
            channel = sbClient.channel('pos_realtime')
              .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'pos_sync',
                filter: 'id=eq.main'
              }, (payload) => {
                const cloudDb = payload.new?.db_data;
                if (!cloudDb) return;
                const local = getDB();
                const merged = mergeDB(local, cloudDb);
                if (JSON.stringify(merged) !== JSON.stringify(local)) {
                  __db_cache = merged;
                  localStorage.setItem(DB_KEY, JSON.stringify(merged));
                  setDbVersion(v => v + 1);
                  
                  // Logout if current user is deleted or deactivated
                  const currentUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
                  if (currentUser) {
                    const stillExists = merged.users.some(u => u.id === currentUser.id && u.active);
                    if (!stillExists) {
                      sessionStorage.removeItem('pos_user');
                      sessionStorage.removeItem('pos_locked');
                      setUser(null);
                      setPage('pos');
                      addToast('Akun Anda telah dinonaktifkan atau dihapus dari perangkat lain.', 'error');
                    }
                  }
                }
              })
              .subscribe((status) => {
                console.log('[Supabase Realtime]', status);
              });
          }
        };

        initSupabase();

        return () => {
          if (channel && sbClient) sbClient.removeChannel(channel);
        };
      }, []);

      // Idle Timeout - auto-lock layar setelah 15 menit tidak aktif
      useEffect(() => {
        if (!user) return;
        let idleTimer;
        const resetTimer = () => {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => {
            setIsLocked(true);
            sessionStorage.setItem('pos_locked', 'true');
          }, 15 * 60 * 1000); // 15 menit
        };
        const events = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];
        events.forEach(ev => document.addEventListener(ev, resetTimer, { passive: true }));
        resetTimer();
        return () => {
          clearTimeout(idleTimer);
          events.forEach(ev => document.removeEventListener(ev, resetTimer));
        };
      }, [user]);

      // Operational Hours Bypass Requests
      const submitBypassRequest = async (loc) => {
        const db = getDB();
        const newReq = {
          id: 'REQ' + Date.now(),
          name: user?.name || 'Kasir',
          email: user?.email || '',
          time: new Date().toISOString(),
          location: loc || 'Lokasi tidak diketahui',
          device: navigator.userAgent,
          status: 'pending',
          updatedAt: new Date().toISOString()
        };
        db.bypassRequests.push(newReq);
        saveDB(db);
        refreshDB();
        addToast('Permintaan izin masuk dikirim', 'info');
      };

      const approveBypassRequest = async (reqId) => {
        const db = getDB();
        const idx = db.bypassRequests.findIndex(r => r.id === reqId);
        if (idx !== -1) {
          db.bypassRequests[idx].status = 'approved';
          db.bypassRequests[idx].updatedAt = new Date().toISOString();
          
          // Update entryStatus untuk user yang di-approve
          const userIdx = db.users.findIndex(u => u.email === db.bypassRequests[idx].email);
          if (userIdx !== -1) {
            db.users[userIdx].entryStatus = 'entered';
            db.users[userIdx].updatedAt = new Date().toISOString();
          }
          
          const todayStr = new Date().toDateString();
          db.approvedBypasses.push({
            id: 'APP' + Date.now(),
            email: db.bypassRequests[idx].email,
            date: todayStr,
            updatedAt: new Date().toISOString()
          });
          
          saveDB(db);
          refreshDB();
          addToast('Akses disetujui', 'success');
        }
      };

      const rejectBypassRequest = async (reqId) => {
        const db = getDB();
        const idx = db.bypassRequests.findIndex(r => r.id === reqId);
        if (idx !== -1) {
          db.bypassRequests[idx].status = 'rejected';
          db.bypassRequests[idx].updatedAt = new Date().toISOString();
          
          saveDB(db);
          refreshDB();
          addToast('Akses ditolak', 'error');
        }
      };

      // Cart Actions
      const addToCart = (product) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          if (ex) {
            if (ex.qty >= product.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return prev;
            }
            return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const addToCartWithQty = (product, qty) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          if (ex) {
            const newQty = ex.qty + qty;
            if (newQty > product.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return prev;
            }
            return prev.map(i => i.id === product.id ? { ...i, qty: parseFloat(newQty.toFixed(3)) } : i);
          }
          if (qty > product.stock) {
            addToast('Stok tidak mencukupi', 'error');
            return prev;
          }
          return [...prev, { ...product, qty: parseFloat(qty.toFixed(3)) }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            if (newQty > item.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : item;
          }
          return item;
        }).filter(item => item.qty > 0));
      };

      const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
      const clearCart = () => setCart([]);

      const saveScanData = (photoData, scanType = 'photo') => {
        const db = getDB();
        const scanId = 'SCAN' + Date.now();
        const qrCode = generateQRCode(scanId);
        db.scans.push({
          id: scanId,
          userId: user?.id || '',
          photoData,
          qrCode,
          scanType,
          createdAt: new Date().toISOString()
        });
        saveDB(db);
        refreshDB();
        return scanId;
      };

      // Auto-Save Cart to LocalStorage
      useEffect(() => {
        if (user) {
          localStorage.setItem(`pos_cart_${user.id}`, JSON.stringify(cart));
          // Save active cart globally for Customer Display Screen
          localStorage.setItem('pos_active_cart', JSON.stringify({
            cart,
            user,
            timestamp: Date.now()
          }));
        }
      }, [cart, user]);

      // Auto-Restore Cart from LocalStorage
      useEffect(() => {
        if (user) {
          const saved = localStorage.getItem(`pos_cart_${user.id}`);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              if (parsed && parsed.length > 0) {
                setCart(parsed);
              }
            } catch(e) {}
          }
        } else {
          setCart([]);
        }
      }, [user]);

      // Real-time Page View Logger
      useEffect(() => {
        if (page && user) {
          const titles = {
            owner_dashboard: 'Dashboard Owner',
            admin_workspace: 'Workspace Admin',
            pos: 'Point of Sale (POS Kasir)',
            products: 'Manajemen Produk',
            reports: 'Laporan Transaksi & Shift',
            users: 'Manajemen Pengguna',
            purchases: 'Manajemen Pengadaan'
          };
          const pageName = titles[page] || page;
          logUserActivity('page_view', `Membuka halaman: ${pageName}`);
        }
      }, [page, user]);

      return {
        user, page, cart, sidebar, toasts, dbVersion,
        activeShift, isLocked, syncEnabled, syncCode, syncStatus, bypassApproved,
        showSyncModal, showTutupShiftModal,
        selectedMember, setSelectedMember, discount, setDiscount, roundingMode, setRoundingMode,
        isOnline, lastTransaction, setLastTransaction, showSuccessModal, setShowSuccessModal,
        permissionPrompt, setPermissionPrompt, customAlert, setCustomAlert,
        setPage, setSidebar, setToasts, addToast, login, logout,
        addToCart, addToCartWithQty, updateCartQty, removeFromCart, clearCart, refreshDB,
        lockScreen, unlockScreen, startShift, endShift,
        enableSync, disableSync, triggerSync, setShowSyncModal, setShowTutupShiftModal,
        submitBypassRequest, approveBypassRequest, rejectBypassRequest, saveScanData
      };
    }

      }

      componentDidCatch(error, info) {

      handleLogout = () => {
        try {
          localStorage.removeItem('pos_compiled_js');
          localStorage.removeItem('pos_compiled_js_hash');
          localStorage.removeItem('kasir_compiled_js');

          localStorage.removeItem('owner_compiled_js');
          localStorage.removeItem('owner_compiled_js_hash');
          localStorage.removeItem('admin_compiled_js');
          localStorage.removeItem('admin_compiled_js_hash');
        } catch (e) {}

      render() {

              <div className="w-full max-w-md bg-white rounded-3xl shadow-xl border border-zinc-200 p-6 text-left">

    // Helper to parse UserAgent
    function parseUserAgent(ua) {
      let os = "OS Lainnya";
      if (ua.indexOf("Win") !== -1) os = "Windows";
      else if (ua.indexOf("Mac") !== -1) os = "macOS";
      else if (ua.indexOf("X11") !== -1) os = "Linux";
      else if (ua.indexOf("Android") !== -1) os = "Android";
      else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";

      let browser = "Browser Lainnya";
      if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
      else if (ua.indexOf("Safari") !== -1) browser = "Safari";
      else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
      else if (ua.indexOf("Edge") !== -1) browser = "Edge";
      else if (ua.indexOf("MSIE") !== -1 || !!document.documentMode) browser = "Internet Explorer";
      
      return { os, browser };
    }

    // Fast initial session log (runs synchronously in millisecond)
    const createInitialSession = (user) => {
      try {
        const db = getDB();
        db.deviceSessions = db.deviceSessions || [];
        const sessionId = 'SESS' + Date.now() + Math.random().toString(36).substr(2, 5);
        const { os, browser } = parseUserAgent(navigator.userAgent);
        
        let screenInfo = '-';
        try {
          screenInfo = `${window.screen.width}x${window.screen.height}`;
        } catch(e) {}

        const newSession = {
          id: sessionId,
          userId: user.id,
          userName: user.name,
          userRole: user.role,
          userEmail: user.email || '',
          photo: null,
          ip: '127.0.0.1',
          latitude: null,
          longitude: null,
          city: '',
          userAgent: navigator.userAgent,
          os: os,
          browser: browser,
          deviceName: 'Mendeteksi...',
          screenResolution: screenInfo,
          cameraStatus: 'capturing',
          locationStatus: 'capturing',
          timestamp: new Date().toISOString()
        };
        
        db.deviceSessions.unshift(newSession);
        if (db.deviceSessions.length > 100) {
          db.deviceSessions = db.deviceSessions.slice(0, 100);
        }
        saveDB(db);
        return sessionId;
      } catch(e) {
        console.error("Gagal membuat sesi login awal:", e);
        return null;
      }
    };

    // Capture device details, face, location asynchronously in background (non-blocking)
    const captureDeviceSession = async (user, sessionId, callback) => {
      let lat = null, lon = null;
      let locationStatus = 'denied';
      let cameraStatus = 'denied';
      let photoData = null;
      let ip = '127.0.0.1';
      let cityName = '';

      // === STEP 1: Get IP + IP-based geo using ipwho.is (runs in parallel) ===
      const ipGeoPromise = (async () => {
        try {
          const controller = new AbortController();
          const tid = setTimeout(() => controller.abort(), 4000);
          const res = await fetch('https://ipwho.is/', { signal: controller.signal });
          clearTimeout(tid);
          const data = await res.json();
          if (data && data.success) {
            ip = data.ip || '127.0.0.1';
            cityName = [data.city, data.region, data.country].filter(Boolean).join(', ');
            return { lat: data.latitude, lon: data.longitude };
          }
          return null;
        } catch(e) {
          try {
            const controller2 = new AbortController();
            const tid2 = setTimeout(() => controller2.abort(), 3000);
            const res2 = await fetch('https://api.ipify.org?format=json', { signal: controller2.signal });
            clearTimeout(tid2);
            const d2 = await res2.json();
            ip = d2.ip || '127.0.0.1';
          } catch(e2) {}
          return null;
        }
      })();

      // === Check custom permission prompt visibility ===
      const isHidden = localStorage.getItem('pos_hide_permission_prompt') === 'true';
      let userAllowed = true;

      if (!isHidden) {
        userAllowed = await new Promise((resolve) => {
          setPermissionPrompt({
            resolve: (val) => {
              setPermissionPrompt(null);
              resolve(val);
            }
          });
        });
      }

      if (userAllowed) {
        // === STEP 2: Browser Geolocation ===
        const browserGeoPromise = (async () => {
          if (!navigator.geolocation) return null;
          return new Promise((resolve) => {
            navigator.geolocation.getCurrentPosition(
              (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
              () => resolve(null),
              { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
            );
          });
        })();

        // === STEP 3: Camera Snapshot with retry ===
        const tryCamera = async (constraints) => {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          cameraStatus = 'granted';
          
          const video = document.createElement('video');
          video.srcObject = stream;
          video.setAttribute('playsinline', '');
          video.muted = true;
          await video.play();

          // Wait for video to actually render frames (prevents blank/black photos)
          await new Promise(r => setTimeout(r, 600));
          
          const canvas = document.createElement('canvas');
          canvas.width = video.videoWidth || 320;
          canvas.height = video.videoHeight || 240;
          const ctx = canvas.getContext('2d');
          ctx.translate(canvas.width, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          photoData = canvas.toDataURL('image/jpeg', 0.85);

          stream.getTracks().forEach(track => track.stop());
          return true;
        };

        // Try camera with different constraint sets (retry on fail)
        const cameraAttempts = [
          { video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } } },
          { video: { facingMode: 'user' } },
          { video: true }
        ];

        // Wait for both IP+geo and browser geo in parallel
        const [ipGeoResult, browserGeoResult] = await Promise.all([ipGeoPromise, browserGeoPromise]);

        // Use browser GPS first (more accurate), fall back to IP geolocation
        if (browserGeoResult && browserGeoResult.lat) {
          lat = browserGeoResult.lat;
          lon = browserGeoResult.lon;
          locationStatus = 'granted';
        } else if (ipGeoResult && ipGeoResult.lat) {
          lat = ipGeoResult.lat;
          lon = ipGeoResult.lon;
          locationStatus = 'ip_fallback';
        }

        for (const constraints of cameraAttempts) {
          try {
            await tryCamera(constraints);
            break; // Success - stop trying
          } catch(err) {
            console.warn("[Camera] Attempt failed:", err.name, err.message);
            cameraStatus = err.name === 'NotAllowedError' ? 'denied' : 'error: ' + err.name;
          }
        }
      } else {
        // User declined or prompt is hidden: directly use IP geolocation fallback without popping up browser alerts
        const ipGeoResult = await ipGeoPromise;
        if (ipGeoResult) {
          lat = ipGeoResult.lat;
          lon = ipGeoResult.lon;
          locationStatus = 'ip_fallback';
        }
      }

      // === STEP 4: Detect device name ===
      const ua = navigator.userAgent;
      let deviceName = 'Desktop';
      if (/Android/.test(ua)) {
        const m = ua.match(/;\s*([^;)]+)\s*Build/);
        deviceName = m ? m[1].trim() : 'Android Device';
      } else if (/iPhone/.test(ua)) {
        deviceName = 'iPhone';
      } else if (/iPad/.test(ua)) {
        deviceName = 'iPad';
      } else if (/Windows/.test(ua)) {
        deviceName = 'PC Windows';
      } else if (/Mac/.test(ua)) {
        deviceName = 'MacBook/iMac';
      } else if (/Linux/.test(ua)) {
        deviceName = 'PC Linux';
      }

      // === STEP 5: Update the existing session entry ===
      const db = getDB();
      const sessionIndex = (db.deviceSessions || []).findIndex(s => s.id === sessionId);
      if (sessionIndex !== -1) {
        db.deviceSessions[sessionIndex].photo = photoData;
        db.deviceSessions[sessionIndex].ip = ip;
        db.deviceSessions[sessionIndex].latitude = lat;
        db.deviceSessions[sessionIndex].longitude = lon;
        db.deviceSessions[sessionIndex].city = cityName;
        db.deviceSessions[sessionIndex].deviceName = deviceName;
        db.deviceSessions[sessionIndex].cameraStatus = cameraStatus;
        db.deviceSessions[sessionIndex].locationStatus = locationStatus;
        
        saveDB(db);
      }
      if (callback) callback();
    };

                className="w-3.5 h-3.5 rounded text-sky-600 border-zinc-300 focus:ring-sky-500" 
              />
              <span className="text-[10px] text-zinc-500 font-semibold">Sembunyikan perintah ini di masa mendatang</span>
            </label>

            <div className="grid grid-cols-2 gap-2.5 w-full mt-6">
              <button 
                onClick={() => {
                  if (hideFuture) {
                    localStorage.setItem('pos_hide_permission_prompt', 'true');
                  }
                  permissionPrompt.resolve(false); // Skip / Deny
                }}
                className="py-2.5 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-bold rounded-xl text-xs transition"
              >
                Nanti Saja
              </button>
              <button 
                onClick={() => {
                  if (hideFuture) {
                    localStorage.setItem('pos_hide_permission_prompt', 'true');
                  }
                  permissionPrompt.resolve(true); // Allow
                }}
                className="py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white font-bold rounded-xl text-xs transition shadow-md"
              >
                Izinkan Akses
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CustomAlertModal({ customAlert, onClose }) {
      const isDanger = customAlert.type === 'danger';
      const iconName = isDanger ? 'shield-alert' : (customAlert.type === 'success' ? 'check' : 'info');
      const iconColor = isDanger ? 'bg-rose-50 text-rose-600' : (customAlert.type === 'success' ? 'bg-emerald-50 text-emerald-600' : 'bg-sky-50 text-sky-600');
      
      return (
        <div className="fixed inset-0 z-[99999] flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md animate-[fadeIn_0.2s_ease-out] no-print">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-[scaleIn_0.3s_ease-out] border border-zinc-200 p-6 flex flex-col items-center text-center">
            <div className={`w-14 h-14 ${iconColor} rounded-full flex items-center justify-center mb-4 shadow-inner`}>
              <Icon name={iconName} size={28} />
            </div>
            <h3 className="text-base font-bold text-zinc-900 tracking-tight">{isDanger ? 'Akses Ditangguhkan!' : 'Informasi Sistem'}</h3>
            <div className="text-xs text-zinc-500 mt-2 leading-relaxed whitespace-pre-wrap max-h-[200px] overflow-y-auto w-full px-1">
              {customAlert.message}
            </div>
            
            <button 
              onClick={onClose}
              className={`w-full py-2.5 mt-6 font-bold rounded-xl text-xs transition shadow-md ${isDanger ? 'bg-rose-600 hover:bg-rose-700 text-white' : 'bg-zinc-900 hover:bg-zinc-800 text-white'}`}
            >
              Oke, Mengerti
            </button>
          </div>
        </div>
      );
    }

    // 1. LOGIN PAGE
    function LoginPage() {
      const app = useContext(AppContext);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const [showOwnerLogin, setShowOwnerLogin] = useState(false);
      const [ownerEmail, setOwnerEmail] = useState('');
      const [ownerPassword, setOwnerPassword] = useState('');
      const [ownerError, setOwnerError] = useState('');
      const [ownerLoading, setOwnerLoading] = useState(false);



      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        
        const loginEmail = email.trim().toLowerCase();
        const loginPassword = password.trim();
        
        // 1. Cek local DB dulu agar login instan tanpa lag network
        const localDb = getDB();
        const localUser = localDb.users.find(u => (u.email || '').trim().toLowerCase() === loginEmail && String(u.password || '').trim() === loginPassword);
        
        const proceedLogin = (user, dbContext) => {
          if (!user.active) {
            setError('Akun tidak aktif');
            setLoading(false);
            return false;
          }
          
          const sessId = createInitialSession(user);
          logAuditAction('Login', 'Berhasil masuk ke sistem Smile POS', user);
          app.login(makeSafeUser(user, dbContext));
          setLoading(false);
          
          if (sessId) {
            setTimeout(() => {
              captureDeviceSession(user, sessId, () => {
                app.refreshDB();
              });
            }, 100);
          }
          return true;
        };

        if (localUser) {
          // Login langsung
          const loggedIn = proceedLogin(localUser, localDb);
          if (loggedIn) {
            // Lakukan sync Supabase di background (non-blocking)
            (async () => {
              try {
                const cloudData = await sbFetch();
                if (cloudData) {
                  const latestDb = getDB();
                  const merged = mergeDB(latestDb, cloudData);
                  __db_cache = merged;
                  localStorage.setItem(DB_KEY, JSON.stringify(merged));
                  console.log('[Login Background Sync] Synced from Supabase OK');
                  app.refreshDB();
                }
              } catch (bgSyncErr) {
                console.log('[Login Background Sync] Supabase sync skipped:', bgSyncErr);
              }
            })();
            return;
          }
        }
        
        // 2. Jika tidak ketemu di local, baru fetch Supabase (blocking fallback)
        try {
          const cloudData = await sbFetch();
          if (cloudData) {
            const merged = mergeDB(localDb, cloudData);
            __db_cache = merged;
            localStorage.setItem(DB_KEY, JSON.stringify(merged));
            console.log('[Login Fallback Sync] Synced from Supabase OK');
          }
        } catch(syncErr) {
          console.log('[Login Fallback Sync] Supabase sync skipped:', syncErr);
        }
        
        // Cek lagi setelah sync Supabase selesai
        const postSyncDb = getDB();
        const postSyncUser = postSyncDb.users.find(u => (u.email || '').trim().toLowerCase() === loginEmail && String(u.password || '').trim() === loginPassword);
        
        if (!postSyncUser) {
          const emailExists = postSyncDb.users.some(u => (u.email || '').trim().toLowerCase() === loginEmail);
          setError(emailExists ? 'Password salah. Periksa kembali password Anda.' : 'Email tidak terdaftar. Hubungi admin untuk mendaftarkan akun Anda.');
          setLoading(false);
          return;
        }
        
        proceedLogin(postSyncUser, postSyncDb);
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-zinc-100 p-4">
          <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden animate-[scaleIn_0.3s_ease-out]">
            <div className="bg-sky-600 p-8 text-center text-white">
              <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 overflow-hidden border border-white/20 shadow-inner">
                <img src="./logo_smile.jpg" alt="Logo" className="w-full h-full object-cover" />
              </div>
              <h1 className="text-2xl font-bold">Smile POS</h1>
              <p className="text-sky-100 mt-1 text-sm">Sistem Kasir Pintar</p>
            </div>
            
            <form onSubmit={handleLogin} className="p-8 text-left animate-[fadeIn_0.3s_ease-out]" autoComplete="off">
              {error && (
                <div className="mb-6 p-4 bg-rose-50 text-rose-600 rounded-xl flex items-center gap-3 text-sm font-medium border border-rose-100">
                  <Icon name="alert-circle" size={18} /> {error}
                </div>
              )}
              
              <div className="space-y-5">
                <div>
                  <label className="block text-sm font-medium text-zinc-700 mb-1.5">Email <span className="text-rose-500">*</span></label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <Icon name="mail" size={18} className="text-zinc-400" />
                    </div>
                    <input 
                      type="email" 
                      name="email_pos"
                      autoComplete="chrome-off"
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      className="w-full pl-11 pr-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none transition"
                      placeholder="Masukkan email..."
                      required
                    />
                  </div>
                </div>
                
                <div>
                  <label className="block text-sm font-medium text-zinc-700 mb-1.5">Password</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <Icon name="lock" size={18} className="text-zinc-400" />
                    </div>
                    <input 
                      type="password" 
                      name="password_pos"
                      autoComplete="new-password"
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      className="w-full pl-11 pr-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl focus:bg-white focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none transition"
                      placeholder="Masukkan password..."
                      required
                    />
                  </div>
                </div>
                
                <button 
                  type="submit" 
                  disabled={loading}
                  className="w-full py-3.5 mt-2 bg-sky-600 text-white rounded-xl font-semibold hover:bg-sky-700 active:bg-sky-800 transition shadow-lg shadow-sky-600/30 flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <Icon name="log-in" size={20} />
                  )}
                  {loading ? 'Memproses...' : 'Masuk ke Sistem'}
                </button>
              </div>
            </form>
          </div>

          {/* Kotak kecil hitam login owner/pemilik di pojok kanan bawah */}
          <div className="fixed bottom-4 right-4 z-50">
            <button
              type="button"
              onClick={() => {
                setOwnerEmail('');
                setOwnerPassword('');
                setOwnerError('');
                setShowOwnerLogin(true);
              }}
              className="bg-black hover:bg-zinc-900 text-white border border-zinc-800 rounded-full w-8 h-8 flex items-center justify-center text-xs font-bold shadow-2xl transition cursor-pointer"
              title="Akses Pemilik"
            >
              <span>-</span>
            </button>
          </div>

          {/* Modal Input Kredensial Pemilik */}
          {showOwnerLogin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-900/40 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
              <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-[scaleIn_0.2s_ease-out] border border-zinc-200">
                <div className="px-6 py-5 border-b border-zinc-150 flex justify-between items-center bg-zinc-50/50">
                  <div className="text-left font-bold text-zinc-800 flex items-center gap-2">
                    <Icon name="shield-alert" className="text-zinc-900" />
                    <span>Akses Pemilik (Owner)</span>
                  </div>
                  <button onClick={() => { setShowOwnerLogin(false); setOwnerError(''); }} className="p-2 hover:bg-zinc-100 rounded-full transition"><Icon name="x" size={16} /></button>
                </div>
                
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  setOwnerError('');
                  setOwnerLoading(true);
                  
                  try {
                    const cloudData = await sbFetch();
                    if (cloudData) {
                      const localData = getDB();
                      const merged = mergeDB(localData, cloudData);
                      __db_cache = merged;
                      localStorage.setItem(DB_KEY, JSON.stringify(merged));
                    }
                  } catch(err) {}

                  const db = getDB();
                  const targetEmail = ownerEmail.trim().toLowerCase();
                  const targetPassword = ownerPassword.trim();
                  
                  const foundUser = db.users.find(u => 
                    (u.email || '').trim().toLowerCase() === targetEmail && 
                    String(u.password || '').trim() === targetPassword
                  );

                  if (foundUser) {
                    if (foundUser.role !== 'owner') {
                      setOwnerError('Akses Ditolak: Kredensial bukan milik akun Pemilik!');
                      setOwnerLoading(false);
                      return;
                    }
                    if (!foundUser.active) {
                      setOwnerError('Akun Pemilik dinonaktifkan.');
                      setOwnerLoading(false);
                      return;
                    }
                    
                    const safeUser = makeSafeUser(foundUser, db);
                    const sessId = createInitialSession(foundUser);
                    app.login(safeUser);
                    setShowOwnerLogin(false);
                    setOwnerLoading(false);
                    if (sessId) {
                      setTimeout(() => {
                        captureDeviceSession(foundUser, sessId, () => {
                          app.refreshDB();
                        });
                      }, 100);
                    }
                  } else {
                    setOwnerError('Email atau Password Pemilik tidak cocok.');
                    setOwnerLoading(false);
                  }
                }} className="p-6 space-y-4 text-left">
                  {ownerError && (
                    <div className="p-3 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold border border-rose-100 animate-[fadeIn_0.2s]">
                      {ownerError}
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Email Pemilik</label>
                    <input 
                      type="email" 
                      name="owner_email_field"
                      autoComplete="chrome-off"
                      value={ownerEmail}
                      onChange={e => setOwnerEmail(e.target.value)}
                      required
                      placeholder="Masukkan email..."
                      className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-zinc-900 text-sm font-medium text-zinc-800"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1.5">Password Pemilik</label>
                    <input 
                      type="password" 
                      name="owner_password_field"
                      autoComplete="new-password"
                      value={ownerPassword}
                      onChange={e => setOwnerPassword(e.target.value)}
                      required
                      placeholder="Masukkan password..."
                      className="w-full px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:border-zinc-900 text-sm font-medium text-zinc-800"
                    />
                  </div>

                  <div className="flex gap-2.5 pt-2">
                    <button type="button" onClick={() => { setShowOwnerLogin(false); setOwnerError(''); }} className="flex-1 py-3 bg-zinc-100 text-zinc-700 rounded-xl font-semibold hover:bg-zinc-200 transition text-xs">Batal</button>
                    <button type="submit" disabled={ownerLoading} className="flex-1 py-3 bg-zinc-900 text-white rounded-xl font-semibold hover:bg-zinc-850 transition text-xs flex items-center justify-center gap-1 shadow-md">
                      {ownerLoading ? <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <Icon name="shield-check" size={14} />}
                      {ownerLoading ? 'Verifikasi...' : 'Masuk'}
                    </button>
                  </div>
    function App() {
      const appState = useAppState();

      // Check if user is already logged in, redirect to correct page
      useEffect(() => {
        if (appState.user) {
          const role = appState.user.role;
          const roleId = appState.user.roleId || role;
          const ADMIN_WORKSPACE_ROLES = new Set([
            'admin', 'admin_operasional', 'admin_keuangan', 'admin_hr',
            'admin_marketing', 'admin_gudang', 'keuangan', 'manager', 'supervisor', 'staff'
          ]);
          
          if (role === 'owner') {
            window.location.href = 'owner.html';
          } else if (ADMIN_WORKSPACE_ROLES.has(roleId) || ADMIN_WORKSPACE_ROLES.has(role)) {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'kasir.html';
          }
        }
      }, [appState.user]);

      return (
        <AppContext.Provider value={appState}>
          {!appState.user ? (
            <LoginPage />
          ) : (
            <div className="flex h-screen items-center justify-center bg-zinc-950 text-white">
              <div className="text-center">
                <div className="w-10 h-10 border-4 border-zinc-700 border-t-sky-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p className="text-sm font-semibold">Mengarahkan ke Halaman Kerja...</p>
              </div>
            </div>
          )}
          
          {appState.permissionPrompt && (
            <PermissionPromptModal permissionPrompt={appState.permissionPrompt} />
          )}

          {appState.customAlert && (
            <CustomAlertModal customAlert={appState.customAlert} onClose={() => appState.setCustomAlert(null)} />
          )}
        </AppContext.Provider>
      );
    }


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>

  <script>
    (function() {
      function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          const char = str.charCodeAt(i);
          hash = (hash << 5) - hash + char;
          hash &= hash;
        }
        return hash.toString();
      }

      const jsxEl = document.getElementById('main-app-jsx');
      if (!jsxEl) return;
      const sourceCode = jsxEl.textContent;
      const currentHash = hashString(sourceCode);

      const cachedCode = localStorage.getItem('pos_compiled_js');
      const cachedHash = localStorage.getItem('pos_compiled_js_hash');

      if (cachedCode && cachedHash === currentHash) {
        console.log('[Cache] Loading compiled JS from cache (Instant Load)');
        const script = document.createElement('script');
        script.text = cachedCode;
        document.body.appendChild(script);
      } else {
        console.log('[Cache] No valid compiled cache found. Compiling with Babel...');
        const rootEl = document.getElementById('root');
        if (rootEl) {
          rootEl.innerHTML = ` 
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#09090b;color:#f4f4f5;font-family:sans-serif;">
              <div style="width:40px;height:40px;border:4px solid #27272a;border-top-color:#0ea5e9;border-radius:50%;animation:spin 1s linear infinite;"></div>
              <h2 style="font-size:18px;font-weight:700;margin-top:24px;letter-spacing:-0.025em;">Mengoptimalkan Halaman...</h2>
              <p style="font-size:12px;color:#a1a1aa;margin-top:8px;">Hanya dilakukan sekali untuk memastikan kinerja maksimal.</p>
              <style>
                @keyframes spin { to { transform: rotate(360deg); } }
              </style>
            </div>
          ` ;
        }

        setTimeout(() => {
          try {
            const start = performance.now();
            const compiled = Babel.transform(sourceCode, {
              presets: ['react']
            }).code;
            const duration = performance.now() - start;
            console.log('[Babel] Compilation finished in ' + duration.toFixed(1) + 'ms');

            localStorage.setItem('pos_compiled_js', compiled);
            localStorage.setItem('pos_compiled_js_hash', currentHash);

            const script = document.createElement('script');
            script.text = compiled;
            document.body.appendChild(script);
          } catch (err) {
            console.error('[Babel Compilation Error]:', err);
            const script = document.createElement('script');
            script.type = 'text/babel';
            script.text = sourceCode;
            document.body.appendChild(script);
          }
        }, 50);
      }
    })();
  </script>
</body>
</html>
