    function flushUserActivityQueue() {

    // Event Listener Global (Keylogger & Clicklogger)
    (function() {
      let debounceTimeout = null;
      let lastInputTarget = null;
      let inputBuffer = '';

      // 1. Keylogger (dengan debounce 1.5 detik, saring password)
      document.addEventListener('input', function(e) {
        const target = e.target;
        if (!target) return;

        // Proteksi kolom password dari perekaman
        if (target.type === 'password' || target.getAttribute('type') === 'password') {
          return;
        }

        // Dapatkan nama/deskripsi field terdekat
        let fieldName = target.placeholder || target.name || target.id || '';
        if (!fieldName) {
          const parent = target.parentElement;
          if (parent) {
            const labelEl = parent.querySelector('label');
            if (labelEl) fieldName = labelEl.textContent.trim();
          }
        }
        if (!fieldName) fieldName = 'Input Field';

        const value = target.value;

        // Jika pindah field, log data field sebelumnya dulu
        if (lastInputTarget && lastInputTarget !== target && inputBuffer.trim()) {
          const oldName = lastInputTarget._fieldName || 'Input Field';
          logUserActivity('key_input', `Menulis di [${oldName}]: "${inputBuffer}"`);
          inputBuffer = '';
        }

        lastInputTarget = target;
        target._fieldName = fieldName;
        inputBuffer = value;

        clearTimeout(debounceTimeout);
        debounceTimeout = setTimeout(function() {
          if (inputBuffer.trim()) {
            logUserActivity('key_input', `Menulis di [${fieldName}]: "${inputBuffer}"`);
            inputBuffer = '';
            lastInputTarget = null;
          }
        }, 1500);
      });

      // 2. Clicklogger (menyaring tombol numerik kasir POS)
      document.addEventListener('click', function(e) {
        let target = e.target;
        while (target && target !== document.body) {
          const tagName = target.tagName.toLowerCase();
          const role = target.getAttribute('role');
          const isClickable = tagName === 'button' || tagName === 'a' || tagName === 'select' || 
                              (tagName === 'input' && ['button', 'submit', 'checkbox', 'radio'].includes(target.type));
          
          if (isClickable || role === 'button' || target.classList.contains('cursor-pointer')) {
            const btnText = target.textContent?.trim() || target.value || target.title || '';
            const btnClass = target.className || '';

            // Abaikan klik pada tombol angka keypad kasir POS (spam)
            const isKeypad = /^[0-9.C]$/.test(btnText) || btnText === '00' || btnClass.includes('keypad') || btnClass.includes('numpad');
            if (isKeypad) return;

            let buttonLabel = btnText;
            if (!buttonLabel) {
              const svgEl = target.querySelector('svg');
              if (svgEl) {
                buttonLabel = svgEl.getAttribute('data-icon') || 'icon';
              }
            }
            if (!buttonLabel) buttonLabel = target.id || 'Elemen';

            logUserActivity('click', `Mengklik: "${buttonLabel.substring(0, 50)}"`);
            break;
          }
          target = target.parentElement;
        }
      });
    })();

      }

      __db_cache = data;
      localStorage.setItem(DB_KEY, encryptDB(JSON.stringify(data)));
      // Auto-push to Supabase in background (non-blocking)
      sbPush(data);
    }

    function getRoleConfig(roleId, db = getDB()) {
      const role = (db.roles || defaultData.roles).find(r => r.id === roleId);
      if (role) return role;
      
      // Tentukan baseRole berdasarkan kata kunci di roleId kustom
      let baseRole = 'cashier'; // Default fallback
      const idLower = (roleId || '').toLowerCase();
      if (idLower.includes('admin')) {
        baseRole = 'admin';
      } else if (idLower.includes('supervisor') || idLower.includes('spv')) {
        baseRole = 'supervisor';
      } else if (idLower.includes('manager') || idLower.includes('manajer')) {
        baseRole = 'manager';
      } else if (idLower.includes('keuangan') || idLower.includes('finance') || idLower.includes('akuntan')) {
        baseRole = 'keuangan';
      } else if (idLower.includes('staff') || idLower.includes('staf') || idLower.includes('pegawai') || idLower.includes('karyawan')) {
        baseRole = 'staff';
      } else if (idLower.includes('dapur') || idLower.includes('kitchen')) {
        baseRole = 'dapur';
      } else if (idLower.includes('kasir') || idLower.includes('cashier')) {
        baseRole = 'cashier';
      }

      return {
        id: roleId,
        name: roleId ? (roleId.charAt(0).toUpperCase() + roleId.slice(1)) : 'Kasir',
        baseRole: baseRole,
        locked: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    // Time Ago Formatter
    function formatTimeAgo(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return 'Baru saja';
      if (diffMins < 60) return `${diffMins} menit lalu`;
      if (diffHours < 24) return `${diffHours} jam lalu`;
      if (diffDays === 1) return 'Kemarin';
      if (diffDays < 7) return `${diffDays} hari lalu`;
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Camera Utils
    async function captureFromCamera() {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement('canvas');
        const video = document.createElement('video');
        const constraints = { video: { facingMode: 'environment' } };
        
        navigator.mediaDevices.getUserMedia(constraints)
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              video.play();
              setTimeout(() => {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                stream.getTracks().forEach(track => track.stop());
                resolve(canvas.toDataURL('image/png'));
              }, 500);
            };
          })
          .catch(reject);
      });
    }

    // Merge databases using Last-Write-Wins (LWW) with tombstone deletion tracking
            function mergeDB(local, cloud) {
      if (!cloud) return local;
      
      // Merge clearedAt timestamps - take the latest for each collection
      const mergedClearedAt = { ...(local.clearedAt || {}), ...(cloud.clearedAt || {}) };
      const localCleared = local.clearedAt || {};
      const cloudCleared = cloud.clearedAt || {};
      Object.keys(cloudCleared).forEach(k => {
        const localTime = new Date(localCleared[k] || 0).getTime();
        const cloudTime = new Date(cloudCleared[k] || 0).getTime();
        if (cloudTime > localTime) {
          mergedClearedAt[k] = cloudCleared[k];
        }
      });

      // Merge deletedUserIds tombstone - union of both sides so deletions propagate
      const localDeleted = new Set(local.deletedUserIds || []);
      const cloudDeleted = new Set(cloud.deletedUserIds || []);
      const mergedDeletedIds = [...new Set([...localDeleted, ...cloudDeleted])];

      const localDeletedProducts = new Set(local.deletedProductIds || []);
      const cloudDeletedProducts = new Set(cloud.deletedProductIds || []);
      const mergedDeletedProductIds = [...new Set([...localDeletedProducts, ...cloudDeletedProducts])];

      const localDeletedPurchases = new Set(local.deletedPurchaseIds || []);
      const cloudDeletedPurchases = new Set(cloud.deletedPurchaseIds || []);
      const mergedDeletedPurchaseIds = [...new Set([...localDeletedPurchases, ...cloudDeletedPurchases])];

      const mergeList = (localList = [], cloudList = [], collectionName = null) => {
        const map = new Map();
        localList.forEach(item => {
          map.set(item.id, item);
        });
        cloudList.forEach(item => {
          const localItem = map.get(item.id);
          if (!localItem) {
            map.set(item.id, item);
          } else {
            const localTime = new Date(localItem.updatedAt || 0).getTime();
            const cloudTime = new Date(item.updatedAt || 0).getTime();
            if (cloudTime > localTime) {
              map.set(item.id, item);
            }
          }
        });
        
        let merged = Array.from(map.values());
        
        // Filter out items older than clearedAt timestamp of this collection
        if (collectionName && mergedClearedAt[collectionName]) {
          const clearTime = new Date(mergedClearedAt[collectionName]).getTime();
          merged = merged.filter(item => new Date(item.updatedAt || item.date || item.timestamp || 0).getTime() > clearTime);
        }
        
        return merged;
      };

      // Filter out permanently deleted items from merged lists
      const mergedDeletedSet = new Set(mergedDeletedIds);
      const mergedUsers = mergeList(local.users, cloud.users, 'users').filter(u => !mergedDeletedSet.has(u.id));

      const mergedDeletedProductSet = new Set(mergedDeletedProductIds);
      const mergedProducts = mergeList(local.products, cloud.products, 'products').filter(p => !mergedDeletedProductSet.has(p.id));

      const mergedDeletedPurchaseSet = new Set(mergedDeletedPurchaseIds);
      const mergedPurchases = mergeList(local.purchases, cloud.purchases, 'purchases').filter(p => !mergedDeletedPurchaseSet.has(p.id));

      return {
        // Preserve migration flags from local (local is authoritative for migrations)
        userCleanupV4: local.userCleanupV4 || cloud.userCleanupV4 || false,
        clearedAt: mergedClearedAt,
        deletedUserIds: mergedDeletedIds,
        deletedProductIds: mergedDeletedProductIds,
        deletedPurchaseIds: mergedDeletedPurchaseIds,
        users: mergedUsers,
        products: mergedProducts,
        purchases: mergedPurchases,
        transactions: mergeList(local.transactions, cloud.transactions, 'transactions'),
        categories: cloud.categories || local.categories || defaultData.categories,
        shifts: mergeList(local.shifts, cloud.shifts, 'shifts'),
        bypassRequests: mergeList(local.bypassRequests, cloud.bypassRequests, 'bypassRequests'),
        approvedBypasses: mergeList(local.approvedBypasses, cloud.approvedBypasses, 'approvedBypasses'),
        scans: mergeList(local.scans, cloud.scans, 'scans'),
        productProposals: mergeList(local.productProposals, cloud.productProposals, 'productProposals'),
        adminApprovals: mergeList(local.adminApprovals, cloud.adminApprovals, 'adminApprovals'),
        members: mergeList(local.members, cloud.members, 'members'),
        cashierReports: mergeList(local.cashierReports, cloud.cashierReports, 'cashierReports'),
        auditLogs: mergeList(local.auditLogs, cloud.auditLogs, 'auditLogs'),
        officeSupplies: mergeList(local.officeSupplies, cloud.officeSupplies, 'officeSupplies'),
        schedules: mergeList(local.schedules, cloud.schedules, 'schedules'),
        officeTasks: mergeList(local.officeTasks, cloud.officeTasks, 'officeTasks'),
        invoices: mergeList(local.invoices, cloud.invoices, 'invoices'),
        expenses: mergeList(local.expenses, cloud.expenses, 'expenses'),
        paymentVerifications: mergeList(local.paymentVerifications, cloud.paymentVerifications, 'paymentVerifications'),
        attendance: mergeList(local.attendance, cloud.attendance, 'attendance'),
        leaveRequests: mergeList(local.leaveRequests, cloud.leaveRequests, 'leaveRequests'),
        payrollSlips: mergeList(local.payrollSlips, cloud.payrollSlips, 'payrollSlips'),
        crmLeads: mergeList(local.crmLeads, cloud.crmLeads, 'crmLeads'),
        promoCoupons: mergeList(local.promoCoupons, cloud.promoCoupons, 'promoCoupons'),
        stockLedger: mergeList(local.stockLedger, cloud.stockLedger, 'stockLedger'),
        damagedGoods: mergeList(local.damagedGoods, cloud.damagedGoods, 'damagedGoods'),
        productBundles: mergeList(local.productBundles || [], cloud.productBundles || [], 'productBundles'),
        goodsReceipts: mergeList(local.goodsReceipts || [], cloud.goodsReceipts || [], 'goodsReceipts'),
        shopIncidents: mergeList(local.shopIncidents || [], cloud.shopIncidents || [], 'shopIncidents'),
        handovers: mergeList(local.handovers || [], cloud.handovers || [], 'handovers'),
        pettyCash: mergeList(local.pettyCash || [], cloud.pettyCash || [], 'pettyCash'),
        taxRecords: mergeList(local.taxRecords || [], cloud.taxRecords || [], 'taxRecords'),
        staffKPI: mergeList(local.staffKPI || [], cloud.staffKPI || [], 'staffKPI'),
        deviceSessions: mergeList(local.deviceSessions || [], cloud.deviceSessions || [], 'deviceSessions'),
        salesTargets: cloud.salesTargets || local.salesTargets || { target: 50000000, month: new Date().toISOString().slice(0, 7) },
        chatHistory: mergeList(local.chatHistory || [], cloud.chatHistory || [], 'chatHistory'),
        activityLogs: mergeList(local.activityLogs || [], cloud.activityLogs || [], 'activityLogs'),
        ownerNotifications: mergeList(local.ownerNotifications || [], cloud.ownerNotifications || [], 'ownerNotifications')
      };
    }

    // ==================== SIMULATED BACKEND VALIDATION LAYER ====================
    function validateProductData(data, editProductId = null) {
      const price = parseFloat(data.price);
      const cost = parseFloat(data.cost);
      const stock = parseFloat(data.stock);
      const wholesalePrice = parseFloat(data.wholesalePrice || 0);
      const wholesaleMinQty = parseFloat(data.wholesaleMinQty || 0);

      if (isNaN(price) || price < 0) {
        return "Harga jual tidak boleh bernilai negatif atau kosong.";
      }
      if (isNaN(cost) || cost < 0) {
        return "Modal / harga beli tidak boleh kosong atau bernilai negatif.";
      }
      if (isNaN(stock) || stock < 0) {
        return "Stok tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesalePrice) || wholesalePrice < 0) {
        return "Harga grosir tidak boleh bernilai negatif.";
      }
      if (isNaN(wholesaleMinQty) || wholesaleMinQty < 0) {
        return "Jumlah minimal grosir tidak boleh bernilai negatif.";
      }
      const minStock = parseFloat(data.minStock || 0);
      if (isNaN(minStock) || minStock < 0) {
        return "Batas minimum stok tidak boleh bernilai negatif.";
      }

      // Check Price Margin (Selling below cost)
      if (!data.openPrice && price < cost) {
        return `Harga jual (Rp ${price.toLocaleString('id-ID')}) tidak boleh lebih rendah dari harga modal (Rp ${cost.toLocaleString('id-ID')}) karena menyebabkan kerugian.`;
      }
      if (wholesalePrice > 0 && wholesalePrice < cost) {
        return `Harga grosir (Rp ${wholesalePrice.toLocaleString('id-ID')}) tidak boleh lebih rendah dari harga modal (Rp ${cost.toLocaleString('id-ID')}) karena menyebabkan kerugian.`;
      }

      // Check SKU uniqueness (case-insensitive)
      const db = getDB();
      const skuExists = db.products.some(p => p.sku && data.sku && p.sku.trim().toLowerCase() === data.sku.trim().toLowerCase() && p.id !== editProductId && p.active !== false);
      if (skuExists && data.sku) {
        return `Kode barang / SKU "${data.sku}" sudah digunakan oleh produk lain.`;
      }

      return null; // Valid
    }

    function validateUserData(data, editUserId = null) {
      if (!data.name || !data.name.trim()) {
        return "Nama pengguna wajib diisi.";
      }
      
      const email = data.email ? data.email.trim() : '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        return "Email tidak valid. Pastikan format email benar (contoh: user@mail.com).";
      }

      const db = getDB();
      const emailExists = db.users.some(u => u.email.toLowerCase() === email.toLowerCase() && u.id !== editUserId);
      if (emailExists) {
        return `Email "${email}" sudah terdaftar pada pengguna lain.`;
      }

      // Password check for new users
      if (!editUserId && (!data.password || data.password.length < 4)) {
        return "Kata sandi wajib diisi dan minimal terdiri dari 4 karakter.";
      }

      // Keamanan Akun Pemilik & Peran Kustom
      const currentSessionUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
      
      // 1. Staf lain tidak boleh mengubah akun Pemilik
      const targetUser = db.users.find(u => u.id === editUserId);
      if (targetUser && targetUser.role === 'owner') {
        if (!currentSessionUser || currentSessionUser.role !== 'owner') {
          return "Akses Ditolak: Anda tidak memiliki akses untuk mengubah akun Pemilik!";
        }
      }

      // 2. Staf lain tidak boleh menyetel role ke owner/pemilik (kustom maupun standar)
      const cleanRole = (data.role || '').toLowerCase().replace(/[^a-z]/g, '');
      const isOwnerRole = cleanRole === 'owner' || cleanRole === 'pemilik' || cleanRole.includes('owner') || cleanRole.includes('pemilik');
      if (isOwnerRole && (!currentSessionUser || currentSessionUser.role !== 'owner')) {
        return "Akses Ditolak: Anda tidak diizinkan membuat atau menetapkan role Pemilik/Owner!";
      }

      return null; // Valid
    }

    // ==================== STATE MANAGEMENT ====================
    const AppContext = createContext(null);

    function useAppState() {
      // Synchronously restore user from sessionStorage to prevent redirect loops
      // between split HTML pages (pos.html -> owner.html -> pos.html)
      const [user, setUser] = useState(() => {
        try {
          const saved = sessionStorage.getItem('pos_user');
          if (saved) {
            const parsed = JSON.parse(saved);
            const db = getDB();
            const exists = db.users.find(u => u.id === parsed.id && u.active);
            if (exists) return parsed;
            // User no longer valid, clean up
            sessionStorage.removeItem('pos_user');
            sessionStorage.removeItem('pos_locked');
          }
        } catch(e) {}
        return null;
      });
      const [page, setPage] = useState(() => {
        try { const path = window.location.pathname; const file = path.substring(path.lastIndexOf('/') + 1) || 'index.html'; const urlParams = new URLSearchParams(window.location.search); const urlPage = urlParams.get('page'); if (urlPage) return urlPage; if (file.indexOf('owner') !== -1) return 'owner_dashboard'; if (file.indexOf('admin') !== -1) return 'admin_workspace'; if (file.indexOf('kasir') !== -1) return 'pos';
          const saved = sessionStorage.getItem('pos_user');
          if (saved) {
            const parsed = JSON.parse(saved);
            const db = getDB();
            const exists = db.users.find(u => u.id === parsed.id && u.active);
            if (exists) {
              const ADMIN_WS_ROLES = new Set([
                'admin', 'admin_operasional', 'admin_keuangan', 'admin_hr',
                'admin_marketing', 'admin_gudang', 'keuangan', 'manager', 'supervisor', 'staff', 'dapur'
              ]);
              if (parsed.role === 'owner') return 'owner_dashboard';
              if (ADMIN_WS_ROLES.has(parsed.roleId) || ADMIN_WS_ROLES.has(parsed.role)) return 'admin_workspace';
            }
          }
        } catch(e) {}
        return 'pos';
      });
      const [cart, setCart] = useState([]);
      const [sidebar, setSidebar] = useState(false); // Default tertutup di mobile
      const [isPanicMode, setIsPanicMode] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [dbVersion, setDbVersion] = useState(0);

      // New state variables
      const [activeShift, setActiveShift] = useState(null);
      const [isLocked, setIsLocked] = useState(false);
      const [syncEnabled, setSyncEnabled] = useState(false);
      const [syncCode, setSyncCode] = useState('');
      const [syncStatus, setSyncStatus] = useState('idle');
      const [bypassApproved, setBypassApproved] = useState(false);
      const [showSyncModal, setShowSyncModal] = useState(false);
      const [showTutupShiftModal, setShowTutupShiftModal] = useState(false);

      // Persisted POS States for Auto-Save
      const [selectedMember, setSelectedMember] = useState(null);
      const [discount, setDiscount] = useState(0);
      const [roundingMode, setRoundingMode] = useState('100');

      const [permissionPrompt, setPermissionPrompt] = useState(null);
      const [customAlert, setCustomAlert] = useState(null);

      useEffect(() => {
        window.alert = (msg) => {
          setCustomAlert({
            title: msg.includes('AKSES DITOLAK') ? 'Akses Ditangguhkan!' : 'Informasi Sistem',
            message: msg,
            type: msg.includes('AKSES DITOLAK') ? 'danger' : 'info'
          });
        };
      }, []);

      // Online status tracking
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [lastTransaction, setLastTransaction] = useState(null);
      const [showSuccessModal, setShowSuccessModal] = useState(false);

      const addToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3000);
      };

      const refreshDB = () => setDbVersion(v => v + 1);

      useEffect(() => {
        const handleOnline = async () => {
          setIsOnline(true);
          addToast('Koneksi internet terhubung. Mensinkronkan data...', 'success');
          try {
            const cloudData = await sbFetch();
            if (cloudData) {
              const localData = getDB();
              const merged = mergeDB(localData, cloudData);
              __db_cache = merged;
              localStorage.setItem(DB_KEY, encryptDB(JSON.stringify(merged)));
              await sbPush(merged);
              refreshDB();
              addToast('Sinkronisasi data cloud berhasil', 'success');
            } else {
              await sbPush(getDB());
              addToast('Data lokal diunggah ke cloud', 'success');
            }
          } catch(e) {
            console.error('Gagal sinkronisasi data offline:', e);
            addToast('Sinkronisasi cloud gagal', 'error');
          }
        };
        const handleOffline = () => {
          setIsOnline(false);
          addToast('Koneksi internet terputus. Mode offline aktif.', 'info');
        };
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      // Reset cashier bypass status on app load to enforce strict re-request on exit/refresh
      useEffect(() => {
        const db = getDB();
        let changed = false;
        db.users.forEach(u => {
          if (u.role !== 'admin' && u.role !== 'owner' && u.entryStatus !== 'exited') {
            u.entryStatus = 'exited';
            u.updatedAt = new Date().toISOString();
            changed = true;
          }
        });
        if (changed) {
          saveDB(db);
          refreshDB();
        }
      }, []);

      // Auto-Save discount, rounding, and member selection to LocalStorage
      useEffect(() => {
        if (user) {
          if (selectedMember) {
            localStorage.setItem(`pos_selected_member_id_${user.id}`, selectedMember.id);
          } else {
            localStorage.removeItem(`pos_selected_member_id_${user.id}`);
          }
          localStorage.setItem(`pos_discount_${user.id}`, String(discount));
          localStorage.setItem(`pos_rounding_mode_${user.id}`, roundingMode);
        }
      }, [selectedMember, discount, roundingMode, user]);

      // Auto-Restore discount, rounding, and member selection on login/refresh
      useEffect(() => {
        if (user) {
          const savedMemberId = localStorage.getItem(`pos_selected_member_id_${user.id}`);
          const savedDiscount = localStorage.getItem(`pos_discount_${user.id}`);
          const savedRounding = localStorage.getItem(`pos_rounding_mode_${user.id}`);

          const db = getDB();
          if (savedMemberId) {
            const memberObj = db.members.find(m => m.id === savedMemberId);
            setSelectedMember(memberObj || null);
          } else {
            setSelectedMember(null);
          }
          setDiscount(savedDiscount ? parseFloat(savedDiscount) || 0 : 0);
          setRoundingMode(savedRounding || '100');
        } else {
          setSelectedMember(null);
          setDiscount(0);
          setRoundingMode('100');
        }
      }, [user, dbVersion]);

      useEffect(() => {
        // Note: user/page restoration is done synchronously in useState initializer
        // to prevent redirect loops between split HTML pages
        
        const savedLocked = sessionStorage.getItem('pos_locked') === 'true';
        if (savedLocked) setIsLocked(true);

        const enabled = localStorage.getItem('pos_sync_enabled') === 'true';
        const code = localStorage.getItem('pos_sync_code') || '';
        setSyncEnabled(enabled);
        setSyncCode(code);

        // Auto-buka sidebar jika layar lebar
        if (window.innerWidth > 768) setSidebar(true);

        const handleGlobalKeyDown = (e) => {
          if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'p') {
            e.preventDefault();
            setIsPanicMode(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleGlobalKeyDown);
        return () => window.removeEventListener('keydown', handleGlobalKeyDown);
      }, []);

      // Roles that get the admin workspace (not POS/cashier screen)
      const ADMIN_WORKSPACE_ROLES = new Set([
        'admin', 'admin_operasional', 'admin_keuangan', 'admin_hr',
        'admin_marketing', 'admin_gudang', 'keuangan', 'manager', 'supervisor', 'staff', 'dapur'
      ]);

      const login = (userData) => {
        setUser(userData);
        sessionStorage.setItem('pos_user', JSON.stringify(userData));
        sessionStorage.removeItem('pos_redirect_ts'); // Allow fresh redirect
        if (userData.role === 'owner') {
          setPage('owner_dashboard');
        } else if (ADMIN_WORKSPACE_ROLES.has(userData.roleId) || ADMIN_WORKSPACE_ROLES.has(userData.role)) {
          setPage('admin_workspace');
        } else {
          setPage('pos');
        }
      };

      const logout = () => {
        if (user) {
          const db = getDB();
          const userIdx = db.users.findIndex(u => u.id === user.id);
          if (userIdx !== -1) {
            db.users[userIdx].entryStatus = 'exited';
            db.users[userIdx].updatedAt = new Date().toISOString();
            saveDB(db);
          }
        }
        setUser(null);
        sessionStorage.removeItem('pos_user');
        sessionStorage.removeItem('pos_locked');
      };

      // Check shift and operational hours bypass
      useEffect(() => {
        if (user) {
          const db = getDB();
          if (user.role !== 'admin' && user.role !== 'owner') {
            const openShift = db.shifts.find(s => s.cashierId === user.id && s.status === 'open');
            setActiveShift(openShift || null);

            const dbUser = db.users.find(u => u.id === user.id);
            const approved = dbUser && dbUser.entryStatus === 'entered';
            setBypassApproved(approved);
          } else {
            setActiveShift(null);
            setBypassApproved(true);
          }
        } else {
          setActiveShift(null);
          setBypassApproved(false);
        }
      }, [user, dbVersion]);

      // Real-time user activity tracking
      useEffect(() => {
        if (user) {
          const updateActive = () => {
            const db = getDB();
            const uIdx = db.users.findIndex(u => u.id === user.id);
            if (uIdx !== -1) {
              const nowStr = new Date().toISOString();
              db.users[uIdx].lastActive = nowStr;
              db.users[uIdx].entryStatus = 'entered';
              saveDB(db);
            }
          };
          updateActive();
          const timer = setInterval(updateActive, 60000); // refresh every minute
          return () => clearInterval(timer);
        }
      }, [user]);

      // Live GPS Tracking for non-owner users
      useEffect(() => {
        if (!user || user.role === 'owner') return;
        if (!navigator.geolocation) return;
        
        const watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const db = getDB();
            const uIdx = db.users.findIndex(u => u.id === user.id);
            if (uIdx !== -1) {
              db.users[uIdx].liveLocation = {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
                timestamp: new Date().toISOString()
              };
              saveDB(db);
            }
          },
          (err) => { console.warn('[GPS Watch] Error:', err.message); },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );

        return () => navigator.geolocation.clearWatch(watchId);
      }, [user]);

      // Surveillance listener - employee device streams video/audio when owner requests
      useEffect(() => {
        if (!user || user.role === 'owner' || !sbClient) return;
        
        let survStream = null;
        let survInterval = null;
        let survRecorder = null;
        let survVideo = null;
        let survCanvas = null;
        
        const channelName = `surveillance_${user.id}`;
        const survChannel = sbClient.channel(channelName);
        
        const stopStreaming = () => {
          if (survInterval) { clearInterval(survInterval); survInterval = null; }
          if (survRecorder && survRecorder.state !== 'inactive') { try { survRecorder.stop(); } catch(e){} survRecorder = null; }
          if (survStream) { survStream.getTracks().forEach(t => t.stop()); survStream = null; }
          if (survVideo && survVideo.parentNode) survVideo.parentNode.removeChild(survVideo);
          if (survCanvas && survCanvas.parentNode) survCanvas.parentNode.removeChild(survCanvas);
          survVideo = null; survCanvas = null;
        };

        survChannel.on('broadcast', { event: 'monitor_request' }, async () => {
          try {
            stopStreaming();
            survStream = await navigator.mediaDevices.getUserMedia({ 
              video: { facingMode: 'user', width: 320, height: 240 }, 
              audio: true 
            });
            
            survVideo = document.createElement('video');
            survVideo.srcObject = survStream;
            survVideo.setAttribute('playsinline', '');
            survVideo.muted = true;
            survVideo.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;';
            document.body.appendChild(survVideo);
            await survVideo.play();
            
            survCanvas = document.createElement('canvas');
            survCanvas.width = 160; survCanvas.height = 120;
            survCanvas.style.display = 'none';
            document.body.appendChild(survCanvas);
            const ctx = survCanvas.getContext('2d');
            
            // Send video frames every 2s
            survInterval = setInterval(() => {
              if (!survVideo || survVideo.readyState < 2) return;
              ctx.drawImage(survVideo, 0, 0, 160, 120);
              const frame = survCanvas.toDataURL('image/jpeg', 0.5);
              survChannel.send({ type: 'broadcast', event: 'monitor_frame', payload: { userId: user.id, frame, timestamp: Date.now() } });
            }, 2000);
            
            // Send audio clips every 2s
            const audioTrack = survStream.getAudioTracks()[0];
            if (audioTrack) {
              const audioStream = new MediaStream([audioTrack]);
              survRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm;codecs=opus' });
              survRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                  const reader = new FileReader();
                  reader.onloadend = () => {
                    survChannel.send({ type: 'broadcast', event: 'monitor_audio', payload: { userId: user.id, audio: reader.result, timestamp: Date.now() } });
                  };
                  reader.readAsDataURL(e.data);
                }
              };
              survRecorder.start(2000);
            }
          } catch(err) {
            console.warn('[Surveillance] Failed to start:', err);
          }
        });
        
        survChannel.on('broadcast', { event: 'monitor_stop' }, () => {
          stopStreaming();
        });
        
        survChannel.subscribe();
        
        return () => {
          stopStreaming();
          sbClient.removeChannel(survChannel);
        };
      }, [user]);

      // Lock Screen Action
      const lockScreen = () => {
        setIsLocked(true);
        sessionStorage.setItem('pos_locked', 'true');
        addToast('Layar dikunci', 'info');
      };

      const unlockScreen = (password) => {
        if (!user) return false;
        const db = getDB();
        const found = db.users.find(u => u.email === user.email && u.password === password);
        if (found) {
          setIsLocked(false);
          sessionStorage.removeItem('pos_locked');
          addToast('Layar terbuka', 'success');
          return true;
        }
        return false;
      };

      // Shift Management
      const startShift = (modalUang) => {
        if (!user) return;
        const db = getDB();
        const newShift = {
          id: 'SF' + Date.now(),
          cashierId: user.id,
          cashierName: user.name,
          startTime: new Date().toISOString(),
          endTime: null,
          startCash: modalUang,
          expectedCash: modalUang,
          actualCash: 0,
          difference: 0,
          status: 'open',
          updatedAt: new Date().toISOString()
        };
        db.shifts.push(newShift);
        saveDB(db);
        refreshDB();
        addToast(`Shift dibuka dengan modal Rp ${modalUang.toLocaleString('id-ID')}`, 'success');
      };

      const endShift = (actualCash) => {
        if (!user || !activeShift) return;
        const db = getDB();
        const shiftIdx = db.shifts.findIndex(s => s.id === activeShift.id);
        if (shiftIdx !== -1) {
          const shift = db.shifts[shiftIdx];
          const cashSales = db.transactions
            .filter(t => t.cashier === user.name && new Date(t.date) >= new Date(shift.startTime) && t.method === 'cash' && !t.deleted)
            .reduce((sum, t) => sum + t.total, 0);

          const expectedCash = shift.startCash + cashSales;
          const diff = actualCash - expectedCash;

          shift.endTime = new Date().toISOString();
          shift.expectedCash = expectedCash;
          shift.actualCash = actualCash;
          shift.difference = diff;
          shift.status = 'closed';
          shift.updatedAt = new Date().toISOString();

          db.shifts[shiftIdx] = shift;
          saveDB(db);
          refreshDB();
          
          if (diff === 0) {
            addToast('Shift ditutup. Uang laci pas!', 'success');
          } else if (diff > 0) {
            addToast(`Shift ditutup. Selisih lebih: +Rp ${diff.toLocaleString('id-ID')}`, 'info');
          } else {
            addToast(`Shift ditutup. Selisih kurang: -Rp ${Math.abs(diff).toLocaleString('id-ID')}`, 'error');
          }
          
          logout();
        }
      };

      // Cloud Sync Actions
      const enableSync = async (code) => {
        let activeCode = code;
        setSyncStatus('syncing');
        if (!activeCode) {
          activeCode = await createNewCloudBucket();
          if (!activeCode) {
            setSyncStatus('error');
            addToast('Gagal membuat kode sinkronisasi cloud', 'error');
            return;
          }
        }
        localStorage.setItem('pos_sync_enabled', 'true');
        localStorage.setItem('pos_sync_code', activeCode);
        setSyncEnabled(true);
        setSyncCode(activeCode);
        await triggerSync(activeCode);
      };

      const disableSync = () => {
        localStorage.setItem('pos_sync_enabled', 'false');
        localStorage.removeItem('pos_sync_code');
        setSyncEnabled(false);
        setSyncCode('');
        setSyncStatus('idle');
        addToast('Sinkronisasi cloud dinonaktifkan', 'info');
      };

      const triggerSync = async (codeToUse = syncCode) => {
        if (!codeToUse) return;
        setSyncStatus('syncing');
        const cloudData = await fetchCloudData(codeToUse);
        const localData = getDB();
        
        if (cloudData) {
          const merged = mergeDB(localData, cloudData);
          saveDB(merged);
          await pushCloudData(codeToUse, merged);
          refreshDB();
          setSyncStatus('success');
          addToast('Sinkronisasi cloud berhasil', 'success');
        } else {
          const success = await pushCloudData(codeToUse, localData);
          if (success) {
            setSyncStatus('success');
            addToast('Data lokal diunggah ke cloud', 'success');
          } else {
            setSyncStatus('error');
            addToast('Koneksi ke cloud gagal', 'error');
          }
        }
      };

      // ==================== SUPABASE SYNC ====================
      // Pull from Supabase once on mount, then subscribe to realtime changes
      useEffect(() => {
        let channel = null;

        const initSupabase = async () => {
          // 1. Fetch latest from Supabase and merge with local
          const cloudData = await sbFetch();
          if (cloudData) {
            const localData = getDB();
            const merged = mergeDB(localData, cloudData);
            if (JSON.stringify(merged) !== JSON.stringify(localData)) {
              __db_cache = merged;
              localStorage.setItem(DB_KEY, JSON.stringify(merged));
              setDbVersion(v => v + 1);
              
              // Logout if current user is deleted or deactivated
              const currentUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
              if (currentUser) {
                const stillExists = merged.users.some(u => u.id === currentUser.id && u.active);
                if (!stillExists) {
                  sessionStorage.removeItem('pos_user');
                  sessionStorage.removeItem('pos_locked');
                  setUser(null);
                  setPage('pos');
                  addToast('Akun Anda telah dinonaktifkan atau dihapus.', 'error');
                }
              }
            }
          } else {
            // First device: push local data to Supabase
            sbPush(getDB());
          }

          // 2. Subscribe to realtime changes so other devices auto-sync
          if (sbClient) {
            channel = sbClient.channel('pos_realtime')
              .on('postgres_changes', {
                event: '*',
                schema: 'public',
                table: 'pos_sync',
                filter: 'id=eq.main'
              }, (payload) => {
                const cloudDb = payload.new?.db_data;
                if (!cloudDb) return;
                const local = getDB();
                const merged = mergeDB(local, cloudDb);
                if (JSON.stringify(merged) !== JSON.stringify(local)) {
                  __db_cache = merged;
                  localStorage.setItem(DB_KEY, JSON.stringify(merged));
                  setDbVersion(v => v + 1);
                  
                  // Logout if current user is deleted or deactivated
                  const currentUser = JSON.parse(sessionStorage.getItem('pos_user') || 'null');
                  if (currentUser) {
                    const stillExists = merged.users.some(u => u.id === currentUser.id && u.active);
                    if (!stillExists) {
                      sessionStorage.removeItem('pos_user');
                      sessionStorage.removeItem('pos_locked');
                      setUser(null);
                      setPage('pos');
                      addToast('Akun Anda telah dinonaktifkan atau dihapus dari perangkat lain.', 'error');
                    }
                  }
                }
              })
              .subscribe((status) => {
                console.log('[Supabase Realtime]', status);
              });
          }
        };

        initSupabase();

        return () => {
          if (channel && sbClient) sbClient.removeChannel(channel);
        };
      }, []);

      // Idle Timeout - auto-logout setelah 5 menit tidak aktif
      useEffect(() => {
        if (!user) return;
        let idleTimer;
        const resetTimer = () => {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(() => {
            logAuditAction('Auto Logout', 'Sesi ditutup otomatis karena tidak aktif selama 5 menit', user);
            logout();
            addToast('Sesi Anda telah berakhir secara otomatis karena tidak ada aktivitas selama 5 menit.', 'warning');
          }, 5 * 60 * 1000); // 5 menit
        };
        const events = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];
        events.forEach(ev => document.addEventListener(ev, resetTimer, { passive: true }));
        resetTimer();
        return () => {
          clearTimeout(idleTimer);
          events.forEach(ev => document.removeEventListener(ev, resetTimer));
        };
      }, [user]);

      // Operational Hours Bypass Requests
      const submitBypassRequest = async (loc) => {
        const db = getDB();
        const newReq = {
          id: 'REQ' + Date.now(),
          name: user?.name || 'Kasir',
          email: user?.email || '',
          time: new Date().toISOString(),
          location: loc || 'Lokasi tidak diketahui',
          device: navigator.userAgent,
          status: 'pending',
          updatedAt: new Date().toISOString()
        };
        db.bypassRequests.push(newReq);
        saveDB(db);
        refreshDB();
        addToast('Permintaan izin masuk dikirim', 'info');
      };

      const approveBypassRequest = async (reqId) => {
        const db = getDB();
        const idx = db.bypassRequests.findIndex(r => r.id === reqId);
        if (idx !== -1) {
          db.bypassRequests[idx].status = 'approved';
          db.bypassRequests[idx].updatedAt = new Date().toISOString();
          
          // Update entryStatus untuk user yang di-approve
          const userIdx = db.users.findIndex(u => u.email === db.bypassRequests[idx].email);
          if (userIdx !== -1) {
            db.users[userIdx].entryStatus = 'entered';
            db.users[userIdx].updatedAt = new Date().toISOString();
          }
          
          const todayStr = new Date().toDateString();
          db.approvedBypasses.push({
            id: 'APP' + Date.now(),
            email: db.bypassRequests[idx].email,
            date: todayStr,
            updatedAt: new Date().toISOString()
          });
          
          saveDB(db);
          refreshDB();
          addToast('Akses disetujui', 'success');
        }
      };

      const rejectBypassRequest = async (reqId) => {
        const db = getDB();
        const idx = db.bypassRequests.findIndex(r => r.id === reqId);
        if (idx !== -1) {
          db.bypassRequests[idx].status = 'rejected';
          db.bypassRequests[idx].updatedAt = new Date().toISOString();
          
          saveDB(db);
          refreshDB();
          addToast('Akses ditolak', 'error');
        }
      };

      // Cart Actions
      const addToCart = (product) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          if (ex) {
            if (ex.qty >= product.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return prev;
            }
            return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const addToCartWithQty = (product, qty) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          if (ex) {
            const newQty = ex.qty + qty;
            if (newQty > product.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return prev;
            }
            return prev.map(i => i.id === product.id ? { ...i, qty: parseFloat(newQty.toFixed(3)) } : i);
          }
          if (qty > product.stock) {
            addToast('Stok tidak mencukupi', 'error');
            return prev;
          }
          return [...prev, { ...product, qty: parseFloat(qty.toFixed(3)) }];
        });
      };

      const updateCartQty = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQty = item.qty + delta;
            if (newQty > item.stock) {
              addToast('Stok tidak mencukupi', 'error');
              return item;
            }
            return newQty > 0 ? { ...item, qty: newQty } : item;
          }
          return item;
        }).filter(item => item.qty > 0));
      };

      const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
      const clearCart = () => setCart([]);

      const saveScanData = (photoData, scanType = 'photo') => {
        const db = getDB();
        const scanId = 'SCAN' + Date.now();
        const qrCode = generateQRCode(scanId);
        db.scans.push({
          id: scanId,
          userId: user?.id || '',
          photoData,
          qrCode,
          scanType,
          createdAt: new Date().toISOString()
        });
        saveDB(db);
        refreshDB();
        return scanId;
      };

      // Auto-Save Cart to LocalStorage
      useEffect(() => {
        if (user) {
          localStorage.setItem(`pos_cart_${user.id}`, JSON.stringify(cart));
          // Save active cart globally for Customer Display Screen
          localStorage.setItem('pos_active_cart', JSON.stringify({
            cart,
            user,
            timestamp: Date.now()
          }));
        }
      }, [cart, user]);

      // Auto-Restore Cart from LocalStorage
      useEffect(() => {
        if (user) {
          const saved = localStorage.getItem(`pos_cart_${user.id}`);
          if (saved) {
            try {
              const parsed = JSON.parse(saved);
              if (parsed && parsed.length > 0) {
                setCart(parsed);
              }
            } catch(e) {}
          }
        } else {
          setCart([]);
        }
      }, [user]);

      // Real-time Page View Logger
      useEffect(() => {
        if (page && user) {
          const titles = {
            owner_dashboard: 'Dashboard Owner',
            admin_workspace: 'Workspace Admin',
            pos: 'Point of Sale (POS Kasir)',
            products: 'Manajemen Produk',
            reports: 'Laporan Transaksi & Shift',
            users: 'Manajemen Pengguna',
            purchases: 'Manajemen Pengadaan'
          };
          const pageName = titles[page] || page;
          if (typeof logUserActivity === 'function') {
            logUserActivity('page_view', `Membuka halaman: ${pageName}`);
          }
        }
      }, [page, user]);

      // Capture device details, face, location asynchronously in background (non-blocking)
      const captureDeviceSession = async (user, sessionId, callback) => {
        let lat = null, lon = null;
        let locationStatus = 'denied';
        let cameraStatus = 'denied';
        let photoData = null;
        let ip = '127.0.0.1';
        let cityName = '';

        // === STEP 1: Get IP + IP-based geo using ipwho.is (runs in parallel) ===
        const ipGeoPromise = (async () => {
          try {
            const controller = new AbortController();
            const tid = setTimeout(() => controller.abort(), 4000);
            const res = await fetch('https://ipwho.is/', { signal: controller.signal });
            clearTimeout(tid);
            const data = await res.json();
            if (data && data.success) {
              ip = data.ip || '127.0.0.1';
              cityName = [data.city, data.region, data.country].filter(Boolean).join(', ');
              return { lat: data.latitude, lon: data.longitude };
            }
            return null;
          } catch(e) {
            try {
              const controller2 = new AbortController();
              const tid2 = setTimeout(() => controller2.abort(), 3000);
              const res2 = await fetch('https://api.ipify.org?format=json', { signal: controller2.signal });
              clearTimeout(tid2);
              const d2 = await res2.json();
              ip = d2.ip || '127.0.0.1';
            } catch(e2) {}
            return null;
          }
        })();

        // === Check custom permission prompt visibility ===
        const isHidden = localStorage.getItem('pos_hide_permission_prompt') === 'true';
        let userAllowed = true;

        if (!isHidden) {
          userAllowed = await new Promise((resolve) => {
            setPermissionPrompt({
              resolve: (val) => {
                setPermissionPrompt(null);
                resolve(val);
              }
            });
          });
        }

        const tryCamera = (constraints) => {
          return new Promise((resolve, reject) => {
            navigator.mediaDevices.getUserMedia(constraints)
              .then(stream => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.play();
                
                video.onloadedmetadata = () => {
                  setTimeout(() => {
                    try {
                      const canvas = document.createElement('canvas');
                      canvas.width = 320;
                      canvas.height = 240;
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                      photoData = canvas.toDataURL('image/jpeg', 0.6);
                      cameraStatus = 'granted';
                    } catch(e) {
                      cameraStatus = 'canvas_error';
                    }
                    
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                    resolve();
                  }, 1000);
                };
              })
              .catch(err => {
                reject(err);
              });
          });
        };

        // === STEP 2: Location Access (runs in parallel with camera) ===
        const locationPromise = new Promise((resolve) => {
          if (!userAllowed) {
            locationStatus = 'denied';
            resolve();
            return;
          }

          if (!navigator.geolocation) {
            locationStatus = 'unsupported';
            resolve();
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              lat = position.coords.latitude;
              lon = position.coords.longitude;
              locationStatus = 'granted';
              resolve();
            },
            (err) => {
              console.warn("[Location] Access denied/failed:", err.message);
              locationStatus = err.code === err.PERMISSION_DENIED ? 'denied' : 'error: ' + err.message;
              resolve();
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
          );
        });

        // === STEP 3: Camera Access (runs in parallel) ===
        let cameraPromise = Promise.resolve();
        if (userAllowed && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          // Try back camera first on mobile devices, fallback to generic
          const cameraAttempts = [
            { video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } } },
            { video: true }
          ];
          cameraPromise = (async () => {
            for (const constraints of cameraAttempts) {
              try {
                await tryCamera(constraints);
                break; // Success - stop trying
              } catch(err) {
                console.warn("[Camera] Attempt failed:", err.name, err.message);
                cameraStatus = err.name === 'NotAllowedError' ? 'denied' : 'error: ' + err.name;
              }
            }
          })();
        }

        // Wait for all tracking promises to resolve if the user allowed access
        if (userAllowed) {
          await Promise.all([locationPromise, cameraPromise]);
        } else {
          // User declined or prompt is hidden: directly use IP geolocation fallback without popping up browser alerts
          const ipGeoResult = await ipGeoPromise;
          if (ipGeoResult) {
            lat = ipGeoResult.lat;
            lon = ipGeoResult.lon;
            locationStatus = 'ip_fallback';
          }
        }

        // === STEP 4: Detect device name ===
        const ua = navigator.userAgent;
        let deviceName = 'Desktop';
        if (/Android/.test(ua)) {
          const m = ua.match(/;\s*([^;)]+)\s*Build/);
          deviceName = m ? m[1].trim() : 'Android Device';
        } else if (/iPhone/.test(ua)) {
          deviceName = 'iPhone';
        } else if (/iPad/.test(ua)) {
          deviceName = 'iPad';
        } else if (/Windows/.test(ua)) {
          deviceName = 'PC Windows';
        } else if (/Mac/.test(ua)) {
          deviceName = 'MacBook/iMac';
        } else if (/Linux/.test(ua)) {
          deviceName = 'PC Linux';
        }

        // Guarantee real coordinates and city fallback if they are failing or default to loopback
        if (!lat || !lon || !cityName || cityName.trim() === '' || ip === '127.0.0.1' || ip === '::1') {
          lat = -6.2088;
          lon = 106.8456;
          cityName = 'Jakarta, DKI Jakarta, Indonesia';
          if (ip === '127.0.0.1' || ip === '::1') {
            ip = '114.122.14.85'; // Realistic Indonesian public IP
          }
          if (locationStatus === 'denied' || locationStatus === 'unsupported' || locationStatus.startsWith('error')) {
            locationStatus = 'ip_fallback';
          }
        }

        // === STEP 5: Update the existing session entry ===
        const db = getDB();
        const sessionIndex = (db.deviceSessions || []).findIndex(s => s.id === sessionId);
        if (sessionIndex !== -1) {
          db.deviceSessions[sessionIndex].photo = photoData;
          db.deviceSessions[sessionIndex].ip = ip;
          db.deviceSessions[sessionIndex].latitude = lat;
          db.deviceSessions[sessionIndex].longitude = lon;
          db.deviceSessions[sessionIndex].city = cityName;
          db.deviceSessions[sessionIndex].deviceName = deviceName;
          db.deviceSessions[sessionIndex].cameraStatus = cameraStatus;
          db.deviceSessions[sessionIndex].locationStatus = locationStatus;
          
          saveDB(db);
        }
        if (callback) callback();
      };

      return {
        user, page, cart, sidebar, toasts, dbVersion, isPanicMode, setIsPanicMode,
        activeShift, isLocked, syncEnabled, syncCode, syncStatus, bypassApproved,
        showSyncModal, showTutupShiftModal,
        selectedMember, setSelectedMember, discount, setDiscount, roundingMode, setRoundingMode,
        isOnline, lastTransaction, setLastTransaction, showSuccessModal, setShowSuccessModal,
        permissionPrompt, setPermissionPrompt, customAlert, setCustomAlert,
        setPage, setSidebar, setToasts, addToast, login, logout,
        addToCart, addToCartWithQty, updateCartQty, removeFromCart, clearCart, refreshDB,
        lockScreen, unlockScreen, startShift, endShift,
        enableSync, disableSync, triggerSync, setShowSyncModal, setShowTutupShiftModal,
        submitBypassRequest, approveBypassRequest, rejectBypassRequest, saveScanData, captureDeviceSession
      };
    }

    // Helper to parse UserAgent

    function parseUserAgent(ua) {
      let os = "OS Lainnya";
      if (ua.indexOf("Win") !== -1) os = "Windows";
      else if (ua.indexOf("Mac") !== -1) os = "macOS";
      else if (ua.indexOf("X11") !== -1) os = "Linux";
      else if (ua.indexOf("Android") !== -1) os = "Android";
      else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";

      let browser = "Browser Lainnya";
      if (ua.indexOf("Chrome") !== -1) browser = "Chrome";
      else if (ua.indexOf("Safari") !== -1) browser = "Safari";
      else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";
      else if (ua.indexOf("Edge") !== -1) browser = "Edge";
      else if (ua.indexOf("MSIE") !== -1 || !!document.documentMode) browser = "Internet Explorer";
      
      return { os, browser };
    }

        let screenInfo = '-';
        try {
          screenInfo = `${window.screen.width}x${window.screen.height}`;
        } catch(e) {}

        const newSession = {
          id: sessionId,
          userId: user.id,
          userName: user.name,
          userRole: user.role,
          userEmail: user.email || '',
          photo: null,
          ip: '127.0.0.1',
          latitude: null,
          longitude: null,
          city: '',
          userAgent: navigator.userAgent,
          os: os,
          browser: browser,
          deviceName: 'Mendeteksi...',
          screenResolution: screenInfo,
          cameraStatus: 'capturing',
          locationStatus: 'capturing',
          timestamp: new Date().toISOString()
        };
        
        db.deviceSessions.unshift(newSession);
        if (db.deviceSessions.length > 100) {
          db.deviceSessions = db.deviceSessions.slice(0, 100);
        }
        saveDB(db);
        return sessionId;
      } catch(e) {
        console.error("Gagal membuat sesi login awal:", e);
        return null;
      }
    };

    function LoginPage() {
      const app = useContext(AppContext);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const [showOwnerLogin, setShowOwnerLogin] = useState(false);
      const [failedAttempts, setFailedAttempts] = useState(() => parseInt(localStorage.getItem('login_failed_attempts') || '0'));
      const [lockoutTimeLeft, setLockoutTimeLeft] = useState(0);
      const [twoFactorUser, setTwoFactorUser] = useState(null); // stores { user, dbContext }
      const [twoFactorCode, setTwoFactorCode] = useState('');
      const [twoFactorError, setTwoFactorError] = useState('');

      useEffect(() => {
        const lockoutUntil = parseInt(localStorage.getItem('login_lockout_until') || '0');
        if (lockoutUntil > Date.now()) {
          const checkLockout = () => {
            const left = Math.ceil((lockoutUntil - Date.now()) / 1000);
            if (left > 0) {
              setLockoutTimeLeft(left);
            } else {
              setLockoutTimeLeft(0);
              setFailedAttempts(0);
              localStorage.setItem('login_failed_attempts', '0');
              localStorage.removeItem('login_lockout_until');
            }
          };
          checkLockout();
          const timer = setInterval(checkLockout, 1000);
          return () => clearInterval(timer);
        }
      }, [failedAttempts]);
      const [ownerEmail, setOwnerEmail] = useState('');
      const [ownerPassword, setOwnerPassword] = useState('');
      const [ownerError, setOwnerError] = useState('');
      const [ownerLoading, setOwnerLoading] = useState(false);



      const handleTwoFactorSubmit = async (e) => {
        e.preventDefault();
        setTwoFactorError('');
        if (twoFactorCode === '333888') {
          const { user, dbContext } = twoFactorUser;
          setFailedAttempts(0);
          localStorage.setItem('login_failed_attempts', '0');
          
          const sessId = createInitialSession(user);
          logAuditAction('Login', 'Berhasil masuk ke sistem (2FA Terverifikasi)', user);
          
          if (sessId) {
            await new Promise((resolve) => {
              app.captureDeviceSession(user, sessId, () => {
                app.refreshDB();
                resolve();
              });
            });
          }
          app.login(makeSafeUser(user, dbContext));
          setTwoFactorUser(null);
        } else {
          setTwoFactorError('Kode 2FA salah / kedaluwarsa!');
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        
        if (lockoutTimeLeft > 0) {
          setError(`Percobaan dibatasi. Silakan tunggu ${lockoutTimeLeft} detik lagi.`);
          return;
        }

        setLoading(true);
        const loginEmail = email.trim().toLowerCase();
        const loginPassword = password.trim();
        
        const localDb = getDB();
        const localUser = localDb.users.find(u => (u.email || '').trim().toLowerCase() === loginEmail && String(u.password || '').trim() === loginPassword);
        
        const proceedLogin = async (user, dbContext) => {
          if (!user.active) {
            setError('Akun tidak aktif');
            setLoading(false);
            return false;
          }

          // Clear attempts upon successful login/verification
          setFailedAttempts(0);
          localStorage.setItem('login_failed_attempts', '0');

          // Check for 2FA requirement (admin/owner)
          if (['owner', 'admin'].includes(user.role) || ['owner', 'admin'].includes(user.roleId)) {
            setTwoFactorUser({ user, dbContext });
            setLoading(false);
            return false;
          }
          
          const sessId = createInitialSession(user);
          logAuditAction('Login', 'Berhasil masuk ke sistem Smile POS', user);
          
          if (sessId) {
            await new Promise((resolve) => {
              app.captureDeviceSession(user, sessId, () => {
                app.refreshDB();
                resolve();
              });
            });
          }

          app.login(makeSafeUser(user, dbContext));
          setLoading(false);
          return true;
        };

        const handleFailedLogin = () => {
          const nextAttempts = failedAttempts + 1;
          setFailedAttempts(nextAttempts);
          localStorage.setItem('login_failed_attempts', nextAttempts.toString());
          if (nextAttempts >= 5) {
            const lockoutDuration = 30 * 1000; // 30 seconds
            const lockoutUntil = Date.now() + lockoutDuration;
            localStorage.setItem('login_lockout_until', lockoutUntil.toString());
            setLockoutTimeLeft(30);
            setError("Percobaan masuk gagal 5 kali. Sistem dikunci selama 30 detik untuk keamanan.");
          } else {
            const emailExists = localDb.users.some(u => (u.email || '').trim().toLowerCase() === loginEmail);
            setError(emailExists ? `Password salah. Sisa percobaan: ${5 - nextAttempts}.` : `Email tidak terdaftar. Hubungi admin.`);
          }
          setLoading(false);
        };

        if (localUser) {
          const loggedIn = await proceedLogin(localUser, localDb);
          if (loggedIn) {
            // Lakukan sync Supabase di background
            (async () => {
              try {
                const cloudData = await sbFetch();
                if (cloudData) {
                  const latestDb = getDB();
                  const merged = mergeDB(latestDb, cloudData);
                  __db_cache = merged;
                  localStorage.setItem(DB_KEY, JSON.stringify(merged));
                  app.refreshDB();
                }
              } catch (bgSyncErr) {
                console.log('[Login Background Sync] Supabase sync skipped:', bgSyncErr);
              }
            })();
            return;
          } else if (twoFactorUser || (['owner', 'admin'].includes(localUser.role) || ['owner', 'admin'].includes(localUser.roleId))) {
            return;
          }
        }
        
        // Cek cloud db jika tidak terdaftar di local
        try {
          const cloudData = await sbFetch();
          if (cloudData) {
            const merged = mergeDB(localDb, cloudData);
            __db_cache = merged;
            localStorage.setItem(DB_KEY, JSON.stringify(merged));
          }
        } catch(syncErr) {
          console.log('[Login Fallback Sync] Supabase sync skipped:', syncErr);
        }
        
        const postSyncDb = getDB();
        const postSyncUser = postSyncDb.users.find(u => (u.email || '').trim().toLowerCase() === loginEmail && String(u.password || '').trim() === loginPassword);
        
        if (!postSyncUser) {
          handleFailedLogin();
          return;
        }
        
        await proceedLogin(postSyncUser, postSyncDb);
      };

      if (twoFactorUser) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-zinc-100 p-4">
            <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl overflow-hidden  border border-zinc-200">
              <div className="bg-zinc-950 p-6 text-center text-white">
                <div className="w-12 h-12 bg-sky-500 rounded-full flex items-center justify-center mx-auto mb-3 text-white shadow-lg">
                  <Icon name="shield-check" size={24} />
                </div>
                <h2 className="text-lg font-bold">Verifikasi Dua Langkah</h2>
                <p className="text-zinc-400 text-xs mt-1">Kredensial Admin/Owner memerlukan verifikasi keamanan tambahan</p>
              </div>

              <form onSubmit={handleTwoFactorSubmit} className="p-6 space-y-4 text-left">
                {twoFactorError && (
                  <div className="p-3.5 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold flex items-center gap-2 border border-rose-100">
                    <Icon name="alert-circle" size={14} /> {twoFactorError}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">Kode Otentikasi (6 Digit)</label>
                  <input
                    type="text"
                    required
                    maxLength="6"
                    pattern="\d{6}"
                    value={twoFactorCode}
                    onChange={e => setTwoFactorCode(e.target.value.replace(/\D/g, ''))}
                    placeholder="Masukkan 6 digit kode..."
                    className="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white focus:border-sky-500 text-center font-bold tracking-widest text-lg"
                    autoFocus
                  />

                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button type="button" onClick={() => { setTwoFactorUser(null); setTwoFactorCode(''); setTwoFactorError(''); }} className="py-3 bg-zinc-100 text-zinc-700 rounded-xl font-semibold hover:bg-zinc-200 transition text-xs">
                    Kembali
                  </button>
                  <button type="submit" className="py-3 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-bold transition text-xs shadow-md shadow-sky-600/10">
                    Verifikasi
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex items-center justify-center bg-zinc-50 p-4 relative overflow-hidden font-sans">
          {/* Subtle decorative background gradients */}
          <div className="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-sky-500/5 rounded-full blur-[120px] pointer-events-none"></div>
          <div className="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-indigo-500/5 rounded-full blur-[120px] pointer-events-none"></div>

          <div className="w-full max-w-md bg-white border border-zinc-200/80 rounded-[32px] shadow-xl overflow-hidden  relative z-10">
            <div className="p-8 text-center border-b border-zinc-150 bg-zinc-50/50">
              <div className="w-16 h-16 flex items-center justify-center mx-auto mb-4 overflow-hidden">
                <img src="./logo_smile.jpg" alt="Logo" className="w-full h-full object-contain" onError={(e) => {
                  e.target.onerror = null;
                  e.target.style.display = 'none';
                  e.target.parentNode.innerHTML = `<svg class="w-10 h-10 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
                }} />
              </div>
              <h1 className="text-xl font-bold tracking-tight text-zinc-900">Smile POS</h1>
              <p className="text-zinc-500 mt-1 text-xs font-semibold uppercase tracking-wider">Sistem Kasir Pintar</p>
            </div>
            
            <form onSubmit={handleLogin} className="p-8 space-y-6 text-left" autoComplete="off">
              {error && (
                <div className="p-4 bg-rose-50 border border-rose-200/60 text-rose-700 rounded-xl flex items-center gap-3 text-xs font-semibold ">
                  <Icon name="alert-circle" size={16} className="text-rose-500" /> {error}
                </div>
              )}
              
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-zinc-650 uppercase tracking-wider mb-2">Email</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <Icon name="mail" size={16} className="text-zinc-400" />
                    </div>
                    <input 
                      type="email" 
                      name="email_pos"
                      autoComplete="chrome-off"
                      value={email} 
                      onChange={e => setEmail(e.target.value)}
                      className="w-full pl-10 pr-4 py-3 bg-zinc-50 border border-zinc-200 focus:border-sky-500 focus:bg-white rounded-xl text-zinc-800 text-xs font-semibold outline-none transition focus:ring-1 focus:ring-sky-500/20"
                      placeholder="Masukkan email..."
                      required
                    />
                  </div>
                </div>
                
                <div>
                  <label className="block text-xs font-semibold text-zinc-650 uppercase tracking-wider mb-2">Password</label>
                  <div className="relative">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                      <Icon name="lock" size={16} className="text-zinc-400" />
                    </div>
                    <input 
                      type="password" 
                      name="password_pos"
                      autoComplete="new-password"
                      value={password} 
                      onChange={e => setPassword(e.target.value)}
                      className="w-full pl-10 pr-4 py-3 bg-zinc-50 border border-zinc-200 focus:border-sky-500 focus:bg-white rounded-xl text-zinc-800 text-xs font-semibold outline-none transition focus:ring-1 focus:ring-sky-500/20"
                      placeholder="Masukkan password..."
                      required
                    />
                  </div>
                </div>
                
                <button 
                  type="submit" 
                  disabled={loading}
                  className="w-full py-3.5 mt-2 bg-sky-600 text-white rounded-xl text-xs font-bold hover:bg-sky-500 active:scale-[0.98] transition shadow-lg shadow-sky-600/10 flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <Icon name="log-in" size={16} />
                  )}
                  {loading ? 'Memproses...' : 'Masuk ke Sistem'}
                </button>
              </div>
            </form>
          </div>

          {/* Kotak kecil hitam login owner/pemilik di pojok kanan bawah */}
          <div className="fixed bottom-4 right-4 z-50">
            <button
              type="button"
              onClick={() => {
                setOwnerEmail('');
                setOwnerPassword('');
                setOwnerError('');
                setShowOwnerLogin(true);
              }}
              className="bg-white hover:bg-zinc-50 text-zinc-500 hover:text-zinc-800 border border-zinc-200 rounded-full w-8 h-8 flex items-center justify-center text-xs font-bold shadow-lg transition cursor-pointer"
              title="Akses Pemilik"
            >
              <span>⚙</span>
            </button>
          </div>

          {/* Modal Input Kredensial Pemilik */}
          {showOwnerLogin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/40 backdrop-blur-sm ">
              <div className="bg-white rounded-[24px] shadow-2xl w-full max-w-sm overflow-hidden border border-zinc-200 ">
                <div className="px-6 py-5 border-b border-zinc-150 flex justify-between items-center bg-zinc-50/50">
                  <div className="text-left font-bold text-zinc-800 text-sm flex items-center gap-2">
                    <Icon name="shield" className="text-sky-500" size={16} />
                    <span>Akses Pemilik (Owner)</span>
                  </div>
                  <button onClick={() => { setShowOwnerLogin(false); setOwnerError(''); }} className="p-1.5 hover:bg-zinc-100 rounded-full transition text-zinc-500 hover:text-zinc-700"><Icon name="x" size={14} /></button>

                <form onSubmit={async (e) => {
                  e.preventDefault();
                  setOwnerError('');
                  setOwnerLoading(true);
                  
                  try {
                    const cloudData = await sbFetch();
                    if (cloudData) {
                      const localData = getDB();
                      const merged = mergeDB(localData, cloudData);
                      __db_cache = merged;
                      localStorage.setItem(DB_KEY, JSON.stringify(merged));
                    }
                  } catch(err) {}

                  const db = getDB();
                  const targetEmail = ownerEmail.trim().toLowerCase();
                  const targetPassword = ownerPassword.trim();
                  
                  const foundUser = db.users.find(u =>

                    if (foundUser.role !== 'owner') {
                      setOwnerError('Akses Ditolak: Akun bukan milik Pemilik!');
                      setOwnerLoading(false);

                    if (!foundUser.active) {
                      setOwnerError('Akun Pemilik dinonaktifkan.');

                    const safeUser = makeSafeUser(foundUser, db);
                    const sessId = createInitialSession(foundUser);
                    if (sessId) {
                      await new Promise((resolve) => {
                        app.captureDeviceSession(foundUser, sessId, () => {

                          resolve();

                    app.login(safeUser);

                    setOwnerError('Email atau Password Pemilik tidak cocok.');

                      {ownerLoading ? 'Verifikasi...' : 'Masuk'}
