                </form>
              </div>
            </div>
          )}


        </div>
      );
    }


    function EmergencyCalculator({ onDeactivate }) {
      const [display, setDisplay] = useState('0');
      const [equation, setEquation] = useState('');
      const [isReset, setIsReset] = useState(true);

      const handleDigit = (digit) => {
        if (display === '0' || isReset) {
          setDisplay(digit);
          setIsReset(false);
        } else {
          setDisplay(prev => prev + digit);
        }
      };

      const handleOperator = (op) => {
        setEquation(display + ' ' + op + ' ');
        setIsReset(true);
      };

      const handleClear = () => {
        setDisplay('0');
        setEquation('');
        setIsReset(true);
      };

      const handleBackspace = () => {
        if (display.length > 1) {
          setDisplay(prev => prev.slice(0, -1));
        } else {
          setDisplay('0');
        }
      };

      const handleEquals = () => {
        if (display === '911' || equation.trim() === '911') {
          onDeactivate();
          return;
        }

        try {
          const expr = equation + display;
          const sanitized = expr.replace(/[^-()\d/*+.]/g, '');
          const result = new Function('return (' + sanitized + ')')();
          setDisplay(String(result));
          setEquation('');
          setIsReset(true);
        } catch (err) {
          setDisplay('Error');
          setIsReset(true);
        }
      };

      return (
        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-zinc-100 font-sans text-zinc-800">
          <div className="w-full max-w-sm p-6 bg-white rounded-3xl shadow-2xl border border-zinc-200">
            <div className="flex justify-between items-center mb-6">
              <span className="text-xs font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Standard Calculator
              </span>
              <span className="text-[10px] font-mono text-zinc-400">v1.2.0</span>
            </div>
            
            <div className="bg-zinc-50 px-4 py-6 rounded-2xl mb-6 text-right border border-zinc-100 shadow-inner">
              <div className="text-xs text-zinc-400 h-5 font-mono">{equation}</div>
              <div className="text-3xl font-bold font-mono tracking-tight text-zinc-800 truncate">{display}</div>
            </div>

            <div className="grid grid-cols-4 gap-3">
              <button onClick={handleClear} className="p-4 bg-rose-50 text-rose-600 rounded-xl font-bold text-lg hover:bg-rose-100 active:scale-95 transition">C</button>
              <button onClick={handleBackspace} className="p-4 bg-zinc-100 text-zinc-600 rounded-xl font-bold text-lg hover:bg-zinc-200 active:scale-95 transition">⌫</button>
              <button onClick={() => handleOperator('/')} className="p-4 bg-sky-50 text-sky-600 rounded-xl font-bold text-lg hover:bg-sky-100 active:scale-95 transition">÷</button>
              <button onClick={() => handleOperator('*')} className="p-4 bg-sky-50 text-sky-600 rounded-xl font-bold text-lg hover:bg-sky-100 active:scale-95 transition">×</button>

              <button onClick={() => handleDigit('7')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">7</button>
              <button onClick={() => handleDigit('8')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">8</button>
              <button onClick={() => handleDigit('9')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">9</button>
              <button onClick={() => handleOperator('-')} className="p-4 bg-sky-50 text-sky-600 rounded-xl font-bold text-lg hover:bg-sky-100 active:scale-95 transition">-</button>

              <button onClick={() => handleDigit('4')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">4</button>
              <button onClick={() => handleDigit('5')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">5</button>
              <button onClick={() => handleDigit('6')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">6</button>
              <button onClick={() => handleOperator('+')} className="p-4 bg-sky-50 text-sky-600 rounded-xl font-bold text-lg hover:bg-sky-100 active:scale-95 transition">+</button>

              <button onClick={() => handleDigit('1')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">1</button>
              <button onClick={() => handleDigit('2')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">2</button>
              <button onClick={() => handleDigit('3')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">3</button>
              <button onClick={handleEquals} className="row-span-2 p-4 bg-sky-600 text-white rounded-xl font-bold text-lg hover:bg-sky-700 active:scale-95 transition flex items-center justify-center">=</button>

              <button onClick={() => handleDigit('0')} className="col-span-2 p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">0</button>
              <button onClick={() => handleDigit('.')} className="p-4 bg-zinc-50 text-zinc-700 rounded-xl font-bold text-lg hover:bg-zinc-100 active:scale-95 transition">.</button>
            </div>
          </div>
        </div>
      );
    }


        function AIChatbot({ appState }) {
      const [isOpen, setIsOpen] = useState(false);
      const [expandedThoughts, setExpandedThoughts] = useState({});
      const [showHistory, setShowHistory] = useState(false);
      const [editingMsgId, setEditingMsgId] = useState(null);
      const [editText, setEditText] = useState('');
      const [activeSessionId, setActiveSessionId] = useState(null);
      const [contextMenuMsgId, setContextMenuMsgId] = useState(null);
      
      const welcomeMsg = { id: 1, sender: 'bot', text: 'Halo! Saya AI Asisten Operasional Smile POS. Ada yang bisa saya bantu hari ini seputar penggunaan sistem, troubleshoot printer, atau analitik laporan keuangan?', timestamp: new Date() };
      const [messages, setMessages] = useState([welcomeMsg]);
      const [inputValue, setInputValue] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);
      const [sessions, setSessions] = useState([]);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, isTyping]);

      // Close context menu on outside click
      useEffect(() => {
        if (!contextMenuMsgId) return;
        const handler = () => setContextMenuMsgId(null);
        document.addEventListener('click', handler);
        return () => document.removeEventListener('click', handler);
      }, [contextMenuMsgId]);

      // Load sessions list
      const getChatSessions = () => {
        const db = getDB();
        return (db.chatHistory || []).sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      };

      const loadSessions = useCallback(() => {
        setSessions(getChatSessions());
      }, []);

      // Load sessions when chatbot window is active or switches to history tab
      useEffect(() => {
        if (isOpen || showHistory) {
          loadSessions();
        }
      }, [isOpen, showHistory, loadSessions, appState.dbVersion]);

      // Restore active session on mount
      useEffect(() => {
        if (appState.user) {
          const savedSessionId = localStorage.getItem(`pos_active_chat_session_id_${appState.user.id}`);
          if (savedSessionId) {
            const db = getDB();
            const session = (db.chatHistory || []).find(s => s.id === savedSessionId);
            if (session) {
              const restored = session.messages.map(m => ({ ...m, timestamp: new Date(m.timestamp) }));
              setMessages(restored);
              setActiveSessionId(savedSessionId);
            }
          }
        }
      }, [appState.user]);

      // Sync active session ID to localStorage
      useEffect(() => {
        if (appState.user) {
          if (activeSessionId) {
            localStorage.setItem(`pos_active_chat_session_id_${appState.user.id}`, activeSessionId);
          } else {
            localStorage.removeItem(`pos_active_chat_session_id_${appState.user.id}`);
          }
        }
      }, [activeSessionId, appState.user]);

      const saveCurrentSession = (msgs) => {
        if (!msgs || msgs.length <= 1) return;
        const db = getDB();
        db.chatHistory = db.chatHistory || [];
        const sessionId = activeSessionId || ('chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6));
        const userMsgs = msgs.filter(m => m.sender === 'user');
        const title = userMsgs.length > 0 ? userMsgs[0].text.slice(0, 40) + '...' : 'Sesi Chat Baru';
        const existingIdx = db.chatHistory.findIndex(s => s.id === sessionId);
        const sessionData = {
          id: sessionId,
          title: title,
          messages: msgs.map(m => ({ ...m, timestamp: m.timestamp instanceof Date ? m.timestamp.toISOString() : m.timestamp })),

        const text = inputValue.trim();
        if (!text) return;

        const userMsg = { id: Date.now(), sender: 'user', text: text, timestamp: new Date() };
        const newMsgs = [...messages, userMsg];
        setMessages(newMsgs);
        setInputValue('');
        setIsTyping(true);

        setTimeout(() => {
          const replyText = getAIResponse(text);
          const botMsg = { id: Date.now() + 1, sender: 'bot', text: replyText, timestamp: new Date() };
          setIsTyping(false);
          setMessages(prev => {
            const updated = [...prev, botMsg];
            setTimeout(() => saveCurrentSession(updated), 50);
            return updated;
          });
        }, 550);
      };

      const renderMessageContent = (msg) => {
        const text = msg.text || '';
        const thoughtMatch = text.match(/<thought>([\s\S]*?)<\/thought>/);
        let cleanText = text;
        let thought = '';

        if (thoughtMatch) {
          thought = thoughtMatch[1].trim();
          cleanText = text.replace(/<thought>[\s\S]*?<\/thought>/, '').trim();
        }

        const msgId = msg.id;
        const isThoughtExpanded = !!expandedThoughts[msgId];

        return (
          <div className="space-y-2 max-w-full">
            {thought && (
              <div className="bg-zinc-50 border border-zinc-200/60 rounded-2xl p-3 text-[10px] text-zinc-500 font-medium mb-2">
                <button 
                  type="button"
                  onClick={() => setExpandedThoughts(p => ({ ...p, [msgId]: !isThoughtExpanded }))}
                  className="flex items-center gap-1.5 font-bold text-zinc-600 hover:text-zinc-850 transition uppercase tracking-wider"
                >
                  <Icon name="brain" size={12} className="text-indigo-500" />
                  <span>Proses Berpikir AI ({isThoughtExpanded ? "Sembunyikan" : "Tampilkan"})</span>
                </button>
                {isThoughtExpanded && (
                  <div className="mt-2.5 pl-3 border-l-2 border-indigo-500/30 whitespace-pre-line text-left leading-relaxed font-mono text-zinc-500">
                    {thought}
                  </div>
                )}
              </div>
            )}
            
            {editingMsgId === msgId ? (
              <div className="flex gap-1.5 mt-1">
                <input 
                  type="text" 
                  value={editText} 
                  onChange={e => setEditText(e.target.value)}
                  className="flex-1 px-3 py-1.5 bg-white border border-zinc-200 rounded-lg text-xs outline-none text-zinc-850"
                  onKeyDown={e => { if (e.key === 'Enter') confirmEditMessage(); }}
                />
                <button onClick={confirmEditMessage} className="px-2.5 py-1 bg-zinc-900 text-white rounded-lg text-xs font-bold">Simpan</button>
                <button onClick={() => setEditingMsgId(null)} className="px-2.5 py-1 bg-zinc-100 text-zinc-500 rounded-lg text-xs font-semibold">Batal</button>
              </div>
            ) : (
              <p className="whitespace-pre-line leading-relaxed text-xs">{cleanText}</p>
            )}
          </div>
        );
      };

      const BotAvatar = () => (
        <div className="w-9 h-9 rounded-xl bg-zinc-50 border border-zinc-200 flex items-center justify-center flex-shrink-0 relative shadow-sm">
          <svg className="w-5.5 h-5.5 text-zinc-650" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M16 10h.01"></path>
          </svg>
          <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
      );

      const UserAvatar = () => (
        <div className="w-8 h-8 rounded-full bg-zinc-200 border border-zinc-300 flex items-center justify-center font-bold text-xs text-zinc-650 flex-shrink-0">
          {(appState.user?.name || 'US').substring(0, 2).toUpperCase()}
        </div>
      );

      return (
        <div className="fixed bottom-6 right-6 z-[9999] flex flex-col items-end">
          {/* Chat Window Container */}
          <div 
            style={{ display: isOpen ? 'flex' : 'none' }}
            className="mb-4 w-[calc(100vw-2rem)] max-w-[380px] h-[500px] md:h-[550px] bg-white rounded-[24px] shadow-[0_16px_48px_rgba(0,0,0,0.12)] border border-zinc-200 overflow-hidden flex flex-col text-left font-sans"
          >
            {/* Header */}
            <div className="px-6 py-4 bg-zinc-900 text-white flex items-center justify-between border-b border-zinc-800 flex-shrink-0">
              <div className="flex items-center gap-3">
                <BotAvatar />
                <div>
                  <h4 className="text-xs font-bold tracking-wide text-zinc-100">AI SMILE POS ASSISTANT</h4>
                  <p className="text-[10px] text-zinc-400 font-medium">Asisten Operasional Toko &bull; Online</p>
                </div>
              </div>
              
              <div className="flex items-center gap-1.5">
                <button 
                  onClick={() => {
                    if (showHistory) {
                      setShowHistory(false);
                    } else {
                      if (messages.length > 1) saveCurrentSession(messages);
                      setShowHistory(true);
                    }
                  }} 
                  title="Riwayat Percakapan"
                  className={`p-1.5 rounded-full transition ${showHistory ? 'bg-zinc-800 text-white' : 'hover:bg-zinc-800 text-zinc-400 hover:text-white'}`}
                >
                  <Icon name="clock" size={16} />
                </button>
                <button 
                  onClick={startNewChat}
                  title="Chat Baru"
                  className="p-1.5 hover:bg-zinc-800 rounded-full transition text-zinc-400 hover:text-white"
                >
                  <Icon name="plus" size={16} />
                </button>
                <button 
                  onClick={() => setIsOpen(false)} 
                  title="Tutup"
                  className="p-1.5 hover:bg-zinc-800 rounded-full transition text-zinc-400 hover:text-white"
                >
                  <Icon name="x" size={16} />
                </button>
              </div>
            </div>

            {/* Body */}
            {showHistory ? (
              <div className="flex-1 p-5 overflow-y-auto bg-zinc-50 flex flex-col space-y-3 custom-scroll">
                <div className="flex items-center justify-between mb-2 border-b border-zinc-150 pb-2">
                  <h5 className="text-xs font-bold text-zinc-550 uppercase tracking-wider">Riwayat Percakapan</h5>
                  <button 
                    onClick={() => setShowHistory(false)}
                    className="text-xs text-indigo-600 font-bold hover:underline"
                  >
                    Kembali ke Chat
                  </button>
                </div>
                {sessions.length === 0 ? (
                  <div className="flex-1 flex flex-col items-center justify-center py-20 text-center text-zinc-400">
                    <Icon name="message-square-dashed" size={32} className="text-zinc-300 mb-2" />
                    <p className="text-xs font-semibold">Belum Ada Riwayat Chat</p>
                    <p className="text-[10px] mt-0.5">Sesi chat aktif Anda akan tersimpan di sini</p>
                  </div>
                ) : (
                  sessions.map(s => (
                    <div key={s.id} className="group flex justify-between items-center bg-white border border-zinc-200 rounded-2xl p-4 hover:border-zinc-300 hover:shadow-xs transition text-xs font-medium cursor-pointer" onClick={() => loadSession(s.id)}>
                      <div className="min-w-0 pr-4 flex-1">
                        <p className="font-bold text-zinc-800 truncate" title={s.title}>{s.title}</p>
                        <p className="text-[10px] text-zinc-400 mt-1 flex items-center gap-1">
                          <Icon name="message-circle" size={10} /> {s.messageCount} pesan &bull; {new Date(s.updatedAt).toLocaleDateString('id-ID', {day:'numeric',month:'short'})}
                        </p>
                      </div>
                      <button 
                        onClick={(e) => { e.stopPropagation(); deleteSession(s.id); }}
                        className="p-2 bg-rose-50 border border-rose-100 text-rose-500 rounded-xl hover:bg-rose-100 transition opacity-100 md:opacity-0 group-hover:opacity-100"
                        title="Hapus Sesi"
                      >
                        <Icon name="trash-2" size={12} />
                      </button>
                    </div>
                  ))
                )}
              </div>
            ) : (
              <>
                <div className="flex-1 p-5 overflow-y-auto bg-zinc-50 flex flex-col space-y-4 custom-scroll text-xs">
                  {messages.map((msg) => {
                    const isBot = msg.sender === 'bot';
                    const msgId = msg.id;
                    return (
                      <div 
                        key={msgId} 
                        className={`flex gap-3 max-w-full ${isBot ? 'items-start' : 'items-start flex-row-reverse'}`}
                      >
                        {isBot ? <BotAvatar /> : <UserAvatar />}
                        <div 
                          className={`relative group flex flex-col ${isBot ? 'items-start' : 'items-end'}`}
                        >
                          <div 
                            className={`p-3.5 rounded-2xl ${
                              isBot 
                                ? 'bg-white border border-zinc-200 text-zinc-850 rounded-2xl rounded-tl-none shadow-2xs' 
                                : 'bg-indigo-650 text-white rounded-2xl rounded-tr-none'
                            }`}
                          >
                            {renderMessageContent(msg)}
                          </div>
                          
                          {/* Message Context Action Trigger */}
                          <div className={`absolute top-2.5 ${isBot ? '-right-14' : '-left-14'} flex gap-1 bg-white border border-zinc-200 rounded-lg shadow-sm p-1 opacity-0 group-hover:opacity-100 transition duration-200 z-10`}>
                            <button 
                              onClick={() => startEditMessage(msg)}
                              className="p-1 hover:bg-zinc-50 text-zinc-400 hover:text-zinc-750 rounded"
                              title="Edit"
                            >
                              <Icon name="pencil" size={10} />
                            </button>
                            <button 
                              onClick={() => deleteMessage(msgId)}
                              className="p-1 hover:bg-rose-50 text-zinc-400 hover:text-rose-600 rounded"
                              title="Hapus"
                            >
                              <Icon name="trash-2" size={10} />
                            </button>
                          </div>
                          
                          <span className="text-[9px] text-zinc-400 mt-1 font-semibold block px-1">
                            {new Date(msg.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}
                            {msg.edited && ' (diedit)'}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                  {isTyping && (
                    <div className="flex gap-3 items-start">
                      <BotAvatar />
                      <div className="bg-white border border-zinc-150 p-4 rounded-2xl rounded-tl-sm shadow-xs flex items-center gap-1">
                        <span className="w-1.5 h-1.5 bg-zinc-450 rounded-full animate-bounce"></span>
                        <span className="w-1.5 h-1.5 bg-zinc-450 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span className="w-1.5 h-1.5 bg-zinc-450 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                      </div>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {/* Quick Questions Helper */}
                {messages.length === 1 && (
                  <div className="px-5 py-3.5 bg-zinc-50 border-t border-zinc-150 flex flex-wrap gap-1.5 max-h-36 overflow-y-auto custom-scroll text-left">
                    {quickQuestions.map((q, idx) => (
                      <button 
                        key={idx}
                        onClick={() => {
                          setInputValue(q);
                          setTimeout(() => handleSendMessage(), 50);
                        }}
                        className="px-3 py-1.5 bg-white border border-zinc-200 hover:border-zinc-300 text-zinc-650 hover:text-zinc-800 rounded-xl text-[10px] font-bold shadow-2xs transition"
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                )}

                {/* Footer Input Bar */}
                <form onSubmit={handleSendMessage} className="p-4 bg-white border-t border-zinc-150 flex gap-2 items-center flex-shrink-0">
                  <input 
                    type="text" 
                    value={inputValue}
                    onChange={e => setInputValue(e.target.value)}
                    placeholder="Tulis pesan Anda..."
                    className="flex-1 px-4 py-2.5 bg-zinc-50 border border-zinc-200 rounded-xl outline-none focus:bg-white focus:border-indigo-500 text-xs font-semibold text-zinc-850 focus:ring-1 focus:ring-indigo-100 transition-all"
                  />
                  <button 
                    type="submit"
                    disabled={!inputValue.trim()}
                    className="w-8 h-8 rounded-full bg-indigo-600 disabled:bg-zinc-200 text-white flex items-center justify-center shadow-md shadow-indigo-600/10 hover:bg-indigo-700 active:scale-95 disabled:scale-100 disabled:shadow-none transition"
                  >
                    <svg className="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                    </svg>
                  </button>
                </form>
              </>
            )}
          </div>

          {/* Chat Float Toggle Trigger */}
          <button 
            onClick={() => setIsOpen(!isOpen)} 
            className="w-12 h-12 bg-white border border-zinc-200 text-zinc-700 rounded-full flex items-center justify-center shadow-xl hover:bg-zinc-50 active:scale-95 transition-all relative group"
            title="Chat Asisten"
          >
            <div className={`transition-all duration-300 ${isOpen ? 'rotate-90 scale-90' : 'rotate-0 scale-100'}`}>
              {isOpen ? <Icon name="x" size={20} className="text-zinc-500" /> : (
                <svg className="w-5.5 h-5.5 text-zinc-650" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                  <path d="M8 10h.01"></path>
                  <path d="M12 10h.01"></path>
                  <path d="M16 10h.01"></path>
                </svg>
              )}
            </div>
            {!isOpen && (
              <span className="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></span>
            )}
            {!isOpen && (
              <span className="absolute right-16 px-3 py-1.5 bg-zinc-900 text-white text-[10px] font-bold rounded-lg shadow-xl opacity-0 group-hover:opacity-100 transition duration-300 pointer-events-none whitespace-nowrap border border-zinc-800">
                AI Asisten Smile POS
              </span>
            )}
          </button>
        </div>
      );
    }

    function App() {
      const appState = useAppState();

      // Redirect logged-in user to correct page — no intermediate delay
      useEffect(() => {
        if (appState.user) {
          const lastRedirect = parseInt(sessionStorage.getItem('pos_redirect_ts') || '0');
          if (Date.now() - lastRedirect < 400) return;
          sessionStorage.setItem('pos_redirect_ts', Date.now().toString());

          const role = appState.user.role;
          const roleId = appState.user.roleId || role;
          const ADMIN_WORKSPACE_ROLES = new Set([
            'admin', 'admin_operasional', 'admin_keuangan', 'admin_hr',
            'admin_marketing', 'admin_gudang', 'keuangan', 'manager', 'supervisor', 'staff'
          ]);

          if (role === 'owner') {
            window.location.replace('owner.html');
          } else if (role === 'dapur' || roleId === 'dapur') {
            window.location.replace('dapur.html');
          } else if (ADMIN_WORKSPACE_ROLES.has(roleId) || ADMIN_WORKSPACE_ROLES.has(role)) {
            window.location.replace('admin.html');
          } else {
            window.location.replace('kasir.html');
          }
        }
      }, [appState.user]);

      return (
        <AppContext.Provider value={appState}>
          {!appState.user ? (
            <LoginPage />
          ) : (
            <div className="flex h-screen items-center justify-center bg-zinc-950">
              <div className="flex flex-col items-center gap-3">
                <div className="w-8 h-8 border-2 border-zinc-700 border-t-sky-400 rounded-full animate-spin"></div>
                <p className="text-xs font-semibold text-zinc-400 tracking-wider uppercase">Mengarahkan...</p>
              </div>
            </div>
          )}
          
          {appState.permissionPrompt && (
            <PermissionPromptModal permissionPrompt={appState.permissionPrompt} />
          )}

          {appState.customAlert && (
            <CustomAlertModal customAlert={appState.customAlert} onClose={() => appState.setCustomAlert(null)} />
          )}
                  {appState.user && (
            <AIChatbot appState={appState} />
          )}
        </AppContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>

  <script>
    (function() {
      function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          const char = str.charCodeAt(i);
          hash = (hash << 5) - hash + char;
          hash &= hash;
        }
        return hash.toString();
      }

      const jsxEl = document.getElementById('main-app-jsx');
      if (!jsxEl) return;
      const sourceCode = jsxEl.textContent;
      const currentHash = hashString(sourceCode);

      const cachedCode = localStorage.getItem('index_compiled_js');
      const cachedHash = localStorage.getItem('index_compiled_js_hash');

      if (cachedCode && cachedHash === currentHash) {
        console.log('[Cache] Loading compiled JS from cache (Instant Load)');
        const script = document.createElement('script');
        script.text = cachedCode;
        document.body.appendChild(script);
      } else {
        console.log('[Cache] No valid compiled cache found. Compiling with Babel...');

        setTimeout(() => {
          try {
            const start = performance.now();
            const compiled = Babel.transform(sourceCode, {
              presets: ['react']
            }).code;
            const duration = performance.now() - start;
            console.log('[Babel] Compilation finished in ' + duration.toFixed(1) + 'ms');

            localStorage.setItem('index_compiled_js', compiled);
            localStorage.setItem('index_compiled_js_hash', currentHash);

            const script = document.createElement('script');
            script.text = compiled;
            document.body.appendChild(script);
          } catch (err) {
            console.error('[Babel Compilation Error]:', err);
            const script = document.createElement('script');
            script.type = 'text/babel';
            script.text = sourceCode;
            document.body.appendChild(script);
          }
        }, 1);
      }
    })();
  </script>
</body>
</html>
